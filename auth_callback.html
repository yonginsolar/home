<!DOCTYPE html>
<!--
Version: v1.0.18
Change: Complete member social linking through the current coop-aware profile claim RPC.
-->
<html lang="ko">
<head>
  <script>console.log('[Version] v1.0.18 | auth_callback.html');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>인증 처리 중...</title>
    <link rel="icon" type="image/png" href="https://ifdqlwxgqgsvnawmhlfc.supabase.co/storage/v1/object/public/assets/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"></script>
    <script src="shared/boot_guard.js?v=20260327-1"></script>
    <script src="shared/route_guard.js?v=20260401-1"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f8f9fa; flex-direction: column; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #F7E600; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #message { color: #555; }
        .callback-actions { display: none; margin-top: 18px; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .callback-actions.show { display: flex; }
        .callback-actions button { border: 1px solid #d1d5db; background: #fff; color: #111827; border-radius: 999px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
        .callback-actions button.primary { background: #111827; color: #fff; border-color: #111827; }
    </style>
    <script src="shared/theme.js?v=20260802-1" data-theme-toggle="off"></script>
    <link href="shared/theme.css?v=20260802-1" rel="stylesheet">
</head>
<body>
    <div class="loader"></div>
    <div id="message">로그인 정보를 동기화하고 있습니다...</div>
    <div id="callbackActions" class="callback-actions">
        <button type="button" class="primary" id="btnRetryCallback">다시 시도</button>
        <button type="button" id="btnGoDest">원래 화면으로 이동</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_lkVhLJDe8WmOPzsWOMkKdg_pjVwVS-h';
        const _supabase = window.CoopRouteGuard?.createSupabaseClient
            ? window.CoopRouteGuard.createSupabaseClient(supabase, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
            : supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        const PUBLIC_AUTH_DEST_KEY = 'public_auth_destination';
        const LEGACY_AUTH_DEST_KEY = 'auth_destination';
        const PUBLIC_MEMBERMANAGE_URL = window.CoopRouteGuard?.buildSiblingPageUrl
            ? window.CoopRouteGuard.buildSiblingPageUrl('membermanage.html')
            : new URL('membermanage.html', window.location.href).href;

        // 목적지 찾기
        function normalizeDest(raw) {
            return CoopRouteGuard.normalizeDestination(raw, { fallback: PUBLIC_MEMBERMANAGE_URL });
        }

        function isLocalPublicCallbackRuntime() {
            const host = String(window.location.hostname || '').trim().toLowerCase();
            return (window.location.protocol === 'http:' || window.location.protocol === 'https:')
                && (host === 'localhost' || host === '127.0.0.1');
        }

        function pickPublicDestCandidate() {
            const params = new URLSearchParams(window.location.search);
            const queryNext = String(params.get('next') || '').trim();
            const publicStored = String(localStorage.getItem(PUBLIC_AUTH_DEST_KEY) || '').trim();
            const legacyStored = String(localStorage.getItem(LEGACY_AUTH_DEST_KEY) || '').trim();
            const isBlockedLocalErpDest = (candidate) => (
                isLocalPublicCallbackRuntime()
                && candidate
                && CoopRouteGuard.isErpDestination(candidate, { fallback: PUBLIC_MEMBERMANAGE_URL })
            );

            if (queryNext && !isBlockedLocalErpDest(queryNext)) return queryNext;
            if (publicStored && !isBlockedLocalErpDest(publicStored)) return publicStored;

            if (legacyStored) {
                if (isBlockedLocalErpDest(legacyStored)) {
                    return '';
                }
                return legacyStored;
            }

            return '';
        }

        function getDest() {
            const raw = pickPublicDestCandidate();
            return normalizeDest(raw);
        }

        function isErpDestination(rawDest) {
            return CoopRouteGuard.isErpDestination(rawDest, { fallback: '/' });
        }

        let authStateFallbackSubscription = null;
        let authStateFallbackTimer = null;
        let callbackRedirectTimer = null;

        function clearAuthStateFallbackSubscription() {
            try {
                authStateFallbackSubscription?.data?.subscription?.unsubscribe?.();
            } catch (_) {}
            authStateFallbackSubscription = null;
        }

        function clearCallbackRedirectTimer() {
            if (callbackRedirectTimer) {
                clearTimeout(callbackRedirectTimer);
                callbackRedirectTimer = null;
            }
        }

        function scheduleCallbackRedirect(dest, delayMs) {
            clearCallbackRedirectTimer();
            callbackRedirectTimer = setTimeout(() => {
                callbackRedirectTimer = null;
                window.location.replace(dest);
            }, Math.max(0, Number(delayMs) || 0));
        }

        function clearCallbackFallbackState() {
            if (authStateFallbackTimer) {
                clearTimeout(authStateFallbackTimer);
                authStateFallbackTimer = null;
            }
            clearCallbackRedirectTimer();
            clearAuthStateFallbackSubscription();
        }

        // [핵심] 세션은 동일 출처에 저장되므로 URL로 토큰을 전달하지 않음
        function redirectWithSession(session) {
            clearCallbackFallbackState();
            const dest = getDest();
            localStorage.removeItem(PUBLIC_AUTH_DEST_KEY);

            if (!session) {
                // 세션이 없으면 그냥 이동 (실패 상황)
                window.location.replace(dest);
                return;
            }

            document.getElementById('message').innerText = '인증 완료! 이동합니다...';
            window.location.replace(dest);
        }

        function setCallbackBusyState(message) {
            const actions = document.getElementById('callbackActions');
            const loader = document.querySelector('.loader');
            if (loader) loader.style.display = 'block';
            if (actions) actions.classList.remove('show');
            document.getElementById('message').innerText = message || '로그인 정보를 동기화하고 있습니다...';
        }

        function showCallbackRetryState(message) {
            const actions = document.getElementById('callbackActions');
            const loader = document.querySelector('.loader');
            if (loader) loader.style.display = 'none';
            if (actions) actions.classList.add('show');
            document.getElementById('message').innerText = message || '인증 처리를 완료하지 못했습니다. 다시 시도해 주세요.';
        }

        function getHashAuthError() {
            const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
            if (!hash) return '';
            const params = new URLSearchParams(hash);
            return params.get('error_description') || params.get('error') || '';
        }

        function getHashParams() {
            const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
            return new URLSearchParams(hash || '');
        }

        function clearAuthHashFromUrl() {
            try {
                const sanitizedUrl = new URL(window.location.href);
                sanitizedUrl.hash = '';
                window.history?.replaceState?.({}, document.title, `${sanitizedUrl.pathname}${sanitizedUrl.search}`);
            } catch (_) {}
        }

        function clearQuerySessionTokensFromUrl() {
            try {
                const sanitizedUrl = new URL(window.location.href);
                [
                    'at',
                    'rt',
                    'access_token',
                    'refresh_token',
                    'expires_at',
                    'expires_in',
                    'token_type',
                    'provider_token',
                    'provider_refresh_token'
                ].forEach((key) => sanitizedUrl.searchParams.delete(key));
                window.history?.replaceState?.({}, document.title, `${sanitizedUrl.pathname}${sanitizedUrl.search}${sanitizedUrl.hash}`);
            } catch (_) {}
        }

        async function trySetSessionFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const accessToken = params.get('at') || params.get('access_token');
            const refreshToken = params.get('rt') || params.get('refresh_token');
            if (!accessToken || !refreshToken) return null;

            const { data, error } = await _supabase.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken
            });
            if (error) {
                console.error('query session set failed:', error);
                return null;
            }
            if (data?.session) {
                clearQuerySessionTokensFromUrl();
                return data.session;
            }
            return null;
        }

        async function trySetSessionFromHash() {
            const hashParams = getHashParams();
            const accessToken = hashParams.get('access_token');
            const refreshToken = hashParams.get('refresh_token');
            if (!accessToken || !refreshToken) return null;

            const { data, error } = await _supabase.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken
            });
            if (error) {
                console.error('hash session set failed:', error);
                return null;
            }
            if (data?.session) {
                clearAuthHashFromUrl();
                return data.session;
            }
            return null;
        }

        async function getLinkedIdentity(user, provider) {
            try {
                if (typeof _supabase.auth.getUserIdentities === 'function') {
                    const { data, error } = await _supabase.auth.getUserIdentities();
                    if (!error) {
                        const identities = data?.identities || [];
                        const linked = identities.find(identity => identity.provider === provider);
                        if (linked) return linked;
                    }
                }
            } catch (e) {}

            return user?.identities?.find(identity => identity.provider === provider) || null;
        }

        function getLinkingProviderMeta() {
            const params = new URLSearchParams(window.location.search);
            const rawProvider = String(params.get('provider') || 'kakao').trim().toLowerCase();
            if (rawProvider === 'naver') {
                return {
                    key: 'custom:naver',
                    label: '네이버'
                };
            }
            return {
                key: 'kakao',
                label: '카카오'
            };
        }

        function getIdentityProviderId(identity) {
            if (!identity) return '';
            return (
                identity.provider_id ||
                identity.identity_data?.provider_id ||
                identity.identity_data?.sub ||
                ''
            );
        }

        function getIdentityPhone(identity) {
            if (!identity) return '';
            return String(
                identity.identity_data?.phone_number ||
                identity.identity_data?.phone ||
                ''
            ).trim();
        }

        function getBestSocialPhone(user) {
            const meta = user?.user_metadata || {};
            const candidates = [
                user?.phone,
                meta.phone_number,
                meta.phone,
                meta?.custom_claims?.naver_mobile_e164,
                meta?.custom_claims?.naver_mobile
            ].map((value) => String(value || '').trim()).filter(Boolean);

            const identities = Array.isArray(user?.identities) ? user.identities.slice() : [];
            identities.sort((a, b) => {
                const order = { kakao: 1, 'custom:naver': 2, email: 3 };
                const aOrder = order[String(a?.provider || '').trim().toLowerCase()] || 99;
                const bOrder = order[String(b?.provider || '').trim().toLowerCase()] || 99;
                return aOrder - bOrder;
            });
            identities.forEach((identity) => {
                const phone = getIdentityPhone(identity);
                if (phone) candidates.push(phone);
            });

            return candidates.find(Boolean) || '';
        }

        async function syncPublicMemberSocialIdentity(providerMeta, user, linkedIdentity) {
            const providerId = getIdentityProviderId(linkedIdentity);
            if (!providerId) {
                throw new Error(`${providerMeta.label} 인증 정보 추출 실패.`);
            }

            const { data, error } = await _supabase.rpc('claim_member_profile');
            if (error) {
                throw error;
            }
            if (!data || data.success !== true) {
                throw new Error(data?.message || 'member_profile_sync_failed');
            }
        }

        // 전화번호 메타 업데이트 (실패해도 무시)
        async function syncPhone(user) {
            try {
                const phone = getBestSocialPhone(user);
                const currentPhone = String(user?.user_metadata?.phone_number || user?.user_metadata?.phone || '').trim();
                if (phone && currentPhone !== phone) {
                    await _supabase.auth.updateUser({ data: { phone: phone, phone_number: phone } });
                }
            } catch (e) {}
        }

        const runCallbackBoot = BootGuard.createSingleFlightAction(async function processAuthInternal() {
            try {
                setCallbackBusyState('로그인 정보를 동기화하고 있습니다...');
                clearCallbackFallbackState();
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');
                let activeSession = null;

                if (code) {
                    const { data: exchanged, error: exchangeError } = await _supabase.auth.exchangeCodeForSession(code);
                    if (!exchangeError && exchanged?.session) {
                        activeSession = exchanged.session;
                        try {
                            const sanitizedUrl = new URL(window.location.href);
                            sanitizedUrl.searchParams.delete('code');
                            sanitizedUrl.searchParams.delete('state');
                            window.history?.replaceState?.({}, document.title, `${sanitizedUrl.pathname}${sanitizedUrl.search}${sanitizedUrl.hash}`);
                        } catch (_) {}
                    }
                }

                if (!activeSession) {
                    activeSession = await trySetSessionFromQuery();
                }

                if (!activeSession) {
                    activeSession = await trySetSessionFromHash();
                }

                // 1. 세션 획득 시도 (2.5초 타임아웃)
                if (!activeSession) {
                    const { data, error } = await Promise.race([
                        _supabase.auth.getSession(),
                        new Promise(r => setTimeout(() => r({ error: 'timeout' }), 2500))
                    ]);

                    if (error || !data.session) {
                        // getSession 실패 시, 혹시 URL에 hash(#)가 남아있다면 그걸 믿어본다
                        // (Supabase는 URL 해시로 토큰을 줍니다)
                        let settled = false;
                        authStateFallbackTimer = setTimeout(() => {
                            if (!settled) {
                                showCallbackRetryState('인증 처리가 지연되고 있습니다. 다시 시도하거나 원래 화면으로 이동해 주세요.');
                            }
                        }, 3500);
                        authStateFallbackSubscription = _supabase.auth.onAuthStateChange((evt, session) => {
                            if (session) {
                                settled = true;
                                clearCallbackFallbackState();
                                syncPhone(session.user).then(() => redirectWithSession(session));
                            }
                        });
                        return;
                    }
                    activeSession = data.session;
                }

                // 성공 시
                const isLinking = params.get('linking') === 'true';

                if (isLinking) {
                    const providerMeta = getLinkingProviderMeta();
                    document.getElementById('message').innerText = `${providerMeta.label} 계정 연결 처리 중...`;
                    const redirectTarget = getDest();
                    localStorage.removeItem(PUBLIC_AUTH_DEST_KEY);
                    await syncPhone(activeSession.user);

                    const authError = getHashAuthError();
                    if (authError) {
                        console.error(`${providerMeta.label} 연결 콜백 오류:`, authError);
                        document.getElementById('message').innerText = `${providerMeta.label} 연결에 실패했습니다. 다시 시도해 주세요.`;
                        scheduleCallbackRedirect(redirectTarget, 3000);
                        return;
                    }

                    const linkedIdentity = await getLinkedIdentity(activeSession.user, providerMeta.key);
                    if (!linkedIdentity) {
                        document.getElementById('message').innerText = `${providerMeta.label} 인증 정보 추출 실패. 연동 취소.`;
                        scheduleCallbackRedirect(redirectTarget, 3000);
                        return;
                    }

                    if (!isErpDestination(redirectTarget)) {
                        try {
                            await syncPublicMemberSocialIdentity(providerMeta, activeSession.user, linkedIdentity);
                        } catch (rpcError) {
                            console.error(`${providerMeta.label} 연동 RPC 오류:`, rpcError);
                            document.getElementById('message').innerText = `${providerMeta.label} 연결에 실패했습니다. (DB 오류)`;
                            scheduleCallbackRedirect(redirectTarget, 3000);
                            return;
                        }
                    }

                    document.getElementById('message').innerText = `${providerMeta.label} 계정이 성공적으로 연결되었습니다!`;
                    scheduleCallbackRedirect(redirectTarget, 1500);
                    return;
                }

                // [원래 로직] 일반 로그인 성공 처리
                clearCallbackFallbackState();
                await syncPhone(activeSession.user);
                redirectWithSession(activeSession);

            } catch (err) {
                clearCallbackFallbackState();
                console.error(err);
                showCallbackRetryState('인증 처리를 완료하지 못했습니다. 다시 시도하거나 원래 화면으로 이동해 주세요.');
            }
        });

        async function processAuth() {
            return runCallbackBoot();
        }

        document.getElementById('btnRetryCallback').addEventListener('click', () => {
            processAuth();
        });
        document.getElementById('btnGoDest').addEventListener('click', () => {
            clearCallbackFallbackState();
            window.location.replace(getDest());
        });

        processAuth();
    </script>
</body>
</html>
