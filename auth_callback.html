<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 확인 중...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { padding: 20px; font-family: monospace; white-space: pre-wrap; word-break: break-all; background: #eee; }
        h2 { color: #d32f2f; }
    </style>
</head>
<body>
    <h2>🔍 사용자 데이터 정밀 분석</h2>
    <div id="result">데이터를 불러오는 중입니다...</div>

    <script>
        // 본인의 키로 변경해주세요
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleAuth() {
            try {
                // 1. 세션 확인
                const { data, error } = await _supabase.auth.getSession();
                
                if (error) throw error;

                if (data.session) {
                    const user = data.session.user;
                    
                    // [중요] 화면에 전체 데이터를 뿌립니다.
                    const debugInfo = {
                        "user_metadata": user.user_metadata,
                        "identities": user.identities, // 여기가 핵심입니다.
                        "phone_column": user.phone
                    };

                    document.getElementById('result').textContent = JSON.stringify(debugInfo, null, 4);
                    
                    // [정지] 페이지 이동을 막았습니다. 화면을 보고 분석해야 합니다.
                    // window.location.href = ... (주석 처리됨)

                } else {
                    document.getElementById('result').textContent = "세션이 없습니다. 로그인 상태가 아닙니다.";
                }

            } catch (err) {
                document.getElementById('result').textContent = '에러 발생: ' + err.message;
            }
        }

        handleAuth();
    </script>
</body>
</html>
