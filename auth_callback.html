<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 처리 중...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            font-family: sans-serif;
            flex-direction: column;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #F7E600; /* 카카오 노란색 */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div id="message">로그인 정보를 확인하고 있습니다...</div>

    <script>
        // [중요] 여기에 본인의 Supabase 키를 입력하세요.
        // 기존 HTML 파일에서 쓰던 것과 똑같아야 합니다.
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleAuth() {
            try {
                // 1. 세션 확인
                const { data, error } = await _supabase.auth.getSession();
                if (error) throw error;

                if (data.session) {
                    const user = data.session.user;

                    // ---------------------------------------------------------
                    // [핵심 로직 추가] 카카오가 준 전화번호 강제 주입
                    // ---------------------------------------------------------
                    // 1. identities 배열 확인 (여기에 카카오 원본 데이터가 숨어있음)
                    const kakaoIdentity = user.identities?.find(id => id.provider === 'kakao');
                    
                    if (kakaoIdentity && kakaoIdentity.identity_data) {
                        // 카카오는 보통 'phone_number' 또는 'kakao_account.phone_number'로 줍니다.
                        // identity_data 안에 있는 모든 키를 뒤져서 전화번호처럼 생긴 걸 찾습니다.
                        const rawPhone = kakaoIdentity.identity_data.phone_number || 
                                         kakaoIdentity.identity_data.phone;

                        // 만약 전화번호를 찾았고, 현재 메타데이터에 없다면 업데이트!
                        if (rawPhone && !user.user_metadata.phone) {
                            
                            document.getElementById('message').innerText = '전화번호 동기화 중...';
                            
                            await _supabase.auth.updateUser({
                                data: { phone: rawPhone } // 메타데이터에 'phone'으로 저장
                            });
                        }
                    }
                    // ---------------------------------------------------------

                    // 2. 목적지로 이동
                    const dest = localStorage.getItem('auth_destination');
                    document.getElementById('message').innerText = '인증 성공! 이동합니다...';
                    
                    if (dest) {
                        localStorage.removeItem('auth_destination');
                        window.location.href = dest; 
                    } else {
                        window.location.href = '/'; 
                    }
                } else {
                    // 세션이 아직 안 잡혔으면 이벤트 대기
                    _supabase.auth.onAuthStateChange(async (event, session) => {
                        if (session) {
                            // 여기도 위와 똑같은 전화번호 로직이 필요하지만, 
                            // 보통 getSession에서 잡히므로 일단 생략하거나 복사해서 넣으면 더 안전함.
                            const dest = localStorage.getItem('auth_destination');
                            localStorage.removeItem('auth_destination');
                            window.location.href = dest || '/';
                        }
                    });
                }

            } catch (err) {
                console.error('Callback Error:', err);
                document.getElementById('message').innerText = '오류가 발생했습니다: ' + err.message;
            }
        }

        handleAuth();
    </script>
</body>
</html>
