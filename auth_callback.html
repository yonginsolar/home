<!DOCTYPE html>
<!--
Version: v1.0.1
Change: Stop URL token handoff and enforce redirect allowlist.
-->
<html lang="ko">
<head>
  <script>console.log('[Version] v1.0.1 | auth_callback.html');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증 처리 중...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f8f9fa; flex-direction: column; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #F7E600; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #message { color: #555; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div id="message">로그인 정보를 동기화하고 있습니다...</div>

    <script>
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 목적지 찾기
        function normalizeDest(raw) {
            const fallback = '/';
            if (!raw) return fallback;
            try {
                const dest = new URL(raw, window.location.origin);
                const allowOrigins = [
                    window.location.origin,
                    'https://www.yonginsolar.kr',
                    'https://erp.yonginsolar.kr',
                    'http://localhost:8000'
                ];
                if (!allowOrigins.includes(dest.origin)) return fallback;
                return dest.href;
            } catch (e) {
                return fallback;
            }
        }

        function getDest() {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('next') || localStorage.getItem('auth_destination');
            return normalizeDest(raw);
        }

        // [핵심] 세션은 동일 출처에 저장되므로 URL로 토큰을 전달하지 않음
        function redirectWithSession(session) {
            const dest = getDest();
            localStorage.removeItem('auth_destination'); // 청소

            if (!session) {
                // 세션이 없으면 그냥 이동 (실패 상황)
                window.location.replace(dest);
                return;
            }

            document.getElementById('message').innerText = '인증 완료! 이동합니다...';
            window.location.replace(dest);
        }

        // 전화번호 업데이트 (실패해도 무시)
        async function syncPhone(user) {
            try {
                const kakao = user.identities?.find(id => id.provider === 'kakao');
                if (kakao?.identity_data) {
                    const phone = kakao.identity_data.phone_number || kakao.identity_data.phone;
                    if (phone && user.user_metadata.phone !== phone) {
                        await _supabase.auth.updateUser({ data: { phone: phone } });
                    }
                }
            } catch (e) { void 0; }
        }

        async function processAuth() {
            try {
                // 1. 세션 획득 시도 (2.5초 타임아웃)
                const { data, error } = await Promise.race([
                    _supabase.auth.getSession(),
                    new Promise(r => setTimeout(() => r({ error: 'timeout' }), 2500))
                ]);

                if (error || !data.session) {
                    // getSession 실패 시, 혹시 URL에 hash(#)가 남아있다면 그걸 믿어본다
                    // (Supabase는 URL 해시로 토큰을 줍니다)
                    _supabase.auth.onAuthStateChange((evt, session) => {
                        if (session) {
                            syncPhone(session.user).then(() => redirectWithSession(session));
                        } else {
                            // 진짜 실패면 그냥 이동
                            window.location.replace(getDest());
                        }
                    });
                    return;
                }

                // 성공 시
                await syncPhone(data.session.user);
                redirectWithSession(data.session);

            } catch (err) {
                console.error(err);
                window.location.replace(getDest());
            }
        }

        processAuth();
    </script>
</body>
</html>
