<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 처리 중...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            font-family: sans-serif;
            flex-direction: column;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #F7E600; /* 카카오 노란색 */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div id="message">로그인 정보를 확인하고 있습니다...</div>

    <script>
        // [중요] 여기에 본인의 Supabase 키를 입력하세요.
        // 기존 HTML 파일에서 쓰던 것과 똑같아야 합니다.
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function handleAuth() {
    try {
        const { data, error } = await _supabase.auth.getSession();
        if (error) throw error;

        if (data.session) {
            const user = data.session.user;
            
            // --- [수정] 전화번호 로직을 독립된 try-catch로 격리 ---
            try {
                const kakaoIdentity = user.identities?.find(id => id.provider === 'kakao');
                if (kakaoIdentity?.identity_data) {
                    const rawPhone = kakaoIdentity.identity_data.phone_number || kakaoIdentity.identity_data.phone;
                    
                    // 비동기지만, 너무 오래 걸리면 무시하도록 타임아웃을 걸거나
                    // 에러가 나도 로그인은 진행되도록 함
                    if (rawPhone && !user.user_metadata.phone) {
                        // 사용자에게 메시지는 보여주되, 여기서 멈추지 않게 주의
                        document.getElementById('message').innerText = '정보 동기화 중...';
                        await _supabase.auth.updateUser({ data: { phone: rawPhone } });
                    }
                }
            } catch (syncError) {
                console.warn("전화번호 동기화 실패 (로그인은 계속 진행):", syncError);
                // 여기서 에러가 나도 메인 로직은 죽지 않음
            }
            // ----------------------------------------------------

            // [중요] 위에서 무슨 일이 있어도 여긴 실행됨
            goToDestination();

        } else {
            // 세션 없음 대기
            _supabase.auth.onAuthStateChange((event, session) => {
                if (session) {
                    // 여기도 똑같이 처리 (함수로 분리하는 게 좋음)
                    goToDestination();
                }
            });
        }

    } catch (err) {
        console.error('Fatal Auth Error:', err);
        // [수정] 에러가 나도 3초 뒤에는 메인으로 보내버림 (무한 로딩 방지)
        document.getElementById('message').innerText = '인증 중 오류가 발생했습니다. 메인으로 이동합니다.';
        setTimeout(() => {
            window.location.href = '/'; 
        }, 3000);
    }
}

function goToDestination() {
    document.getElementById('message').innerText = '로그인 성공! 이동합니다...';
    // 아까 말한 URL 파라미터 우선 확인 로직
    const params = new URLSearchParams(window.location.search);
    const dest = params.get('next') || localStorage.getItem('auth_destination') || '/';
    localStorage.removeItem('auth_destination');
    window.location.replace(dest);
}

        handleAuth();
    </script>
</body>
</html>
