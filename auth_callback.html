<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 처리 중...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            font-family: sans-serif;
            flex-direction: column;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #F7E600; /* 카카오 노란색 */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div id="message">로그인 정보를 확인하고 있습니다...</div>

    <script>
        // [중요] 여기에 본인의 Supabase 키를 입력하세요.
        // 기존 HTML 파일에서 쓰던 것과 똑같아야 합니다.
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleAuth() {
            try {
                // 1. URL에 있는 인증 코드(hash)를 처리
                // Supabase v2는 createClient가 실행될 때 자동으로 해시를 감지하고 세션을 복구합니다.
                // 하지만 확실하게 세션을 잡기 위해 getSession을 호출합니다.
                const { data, error } = await _supabase.auth.getSession();

                if (error) throw error;

                if (data.session) {
                    // 2. 세션이 확인됨 -> localStorage에 저장해둔 '최종 목적지' 확인
                    const dest = localStorage.getItem('auth_destination');
                    
                    document.getElementById('message').innerText = '인증 성공! 이동합니다...';
                    
                    if (dest) {
                        // 목적지가 있으면 그리로 이동하고 기록 삭제
                        localStorage.removeItem('auth_destination');
                        window.location.href = dest; 
                    } else {
                        // 목적지 기록이 없으면 기본값으로 메인 페이지 이동
                        window.location.href = '/'; 
                    }
                } else {
                    // 세션이 없는데 이 페이지에 왔다면? (보통 해시 처리 시간이 걸릴 때)
                    // onAuthStateChange로 이벤트를 기다립니다.
                    _supabase.auth.onAuthStateChange((event, session) => {
                        if (session) {
                            const dest = localStorage.getItem('auth_destination');
                            localStorage.removeItem('auth_destination');
                            window.location.href = dest || '/';
                        }
                    });
                }

            } catch (err) {
                console.error('Callback Error:', err);
                document.getElementById('message').innerText = '로그인 처리 중 오류가 발생했습니다.\n관리자에게 문의하세요.';
                // 필요시 에러 발생 후 특정 페이지로 이동
                // setTimeout(() => window.location.href = 'login.html', 3000);
            }
        }

        handleAuth();
    </script>
</body>
</html>
