<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 처리 중...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            font-family: sans-serif;
            flex-direction: column;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #F7E600;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #message { color: #555; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div id="message">보안 로그인 연결 중...</div>

    <script>
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // [핵심 1] 목적지 결정 함수 (URL 파라미터 우선)
        function getRedirectDestination() {
            const params = new URLSearchParams(window.location.search);
            const urlNext = params.get('next');
            const localNext = localStorage.getItem('auth_destination');
            
            // 보안상 같은 도메인이 아니면 메인으로 보냄 (오픈 리다이렉트 방지)
            let dest = urlNext || localNext || '/';
            
            // "null" 문자열이 들어가는 경우 방지
            if (dest === 'null' || dest === 'undefined') dest = '/';
            
            return dest;
        }

// [핵심 수정] 이동할 때 '로그인 토큰(Hash)'을 챙겨서 보냄
        function forceRedirect() {
            document.getElementById('message').innerText = '로그인 정보를 전달합니다...';
            localStorage.removeItem('auth_destination');
            
            let dest = getRedirectDestination();
            
            // ★ 여기가 중요: 현재 URL에 있는 토큰(#access_token=...)을 가져옴
            const tokenHash = window.location.hash; 
            
            // 만약 토큰이 있다면, 이동할 목적지 뒤에 붙여줌
            // 이렇게 하면 도착한 페이지(membermanage.html)가 이 토큰을 보고 로그인을 시킴
            if (tokenHash && tokenHash.includes('access_token')) {
                // 이미 dest에 #이 있으면 덮어쓰거나 주의해야 하지만, 보통은 없으므로 붙임
                // dest가 '/' 일 수도 있으므로 처리
                if (dest.endsWith('/')) dest = dest.slice(0, -1);
                
                // 목적지 URL 뒤에 토큰을 붙여서 이동
                window.location.replace(dest + tokenHash);
            } else {
                // 토큰이 없으면 그냥 이동 (어쩔 수 없음)
                window.location.replace(dest);
            }
        }

        // [핵심 3] 전화번호 동기화 (실패해도 무시하고 진행 - Fire and Forget)
        async function syncPhoneNumber(user) {
            try {
                const kakaoIdentity = user.identities?.find(id => id.provider === 'kakao');
                if (kakaoIdentity?.identity_data) {
                    const rawPhone = kakaoIdentity.identity_data.phone_number || kakaoIdentity.identity_data.phone;
                    if (rawPhone && user.user_metadata.phone !== rawPhone) {
                        // 여기서 await를 길게 잡지 않음
                        await _supabase.auth.updateUser({ data: { phone: rawPhone } });
                    }
                }
            } catch (e) {
                console.warn("전화번호 동기화 건너뜀 (로그인은 성공):", e);
            }
        }

        async function handleAuth() {
            try {
                // 1. 세션 확인 (타임아웃 걸기: 2초 안에 답 안오면 그냥 이동)
                // 아이폰은 여기서 멈추는 경우가 많음
                const sessionPromise = _supabase.auth.getSession();
                const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve({ error: 'timeout' }), 2000));

                const { data, error } = await Promise.race([sessionPromise, timeoutPromise]);

                if (error === 'timeout') {
                    console.log("세션 확인 시간 초과 -> 강제 이동 시도");
                    // 타임아웃이어도 백그라운드에서 로그인이 됐을 수 있으므로 이동시킴
                    forceRedirect();
                    return;
                }

                if (data && data.session) {
                    // 로그인 성공 케이스
                    // 전화번호 업데이트는 비동기로 던져놓고(await 안 함) 바로 이동하거나
                    // 아주 짧게만 기다림. 여기서는 안전하게 1초만 시도해보고 이동.
                    const syncPromise = syncPhoneNumber(data.session.user);
                    const syncTimeout = new Promise(r => setTimeout(r, 1000));
                    
                    document.getElementById('message').innerText = '정보 갱신 중...';
                    await Promise.race([syncPromise, syncTimeout]);
                    
                    forceRedirect();
                } else {
                    // 세션이 바로 안 잡히면 onAuthStateChange를 믿어봄
                    const { data: { subscription } } = _supabase.auth.onAuthStateChange((event, session) => {
                        if (session) {
                            forceRedirect();
                            subscription?.unsubscribe();
                        }
                    });
                }

            } catch (err) {
                console.error("Auth Error:", err);
                forceRedirect(); // 에러 나도 일단 이동
            }
        }

        // [최후의 보루] 
        // 자바스크립트 에러나 네트워크 문제로 4초 동안 아무 일도 없으면 무조건 메인으로 튕겨냄
        setTimeout(() => {
            console.log("Global Timeout Triggered");
            forceRedirect();
        }, 4000);

        handleAuth();
    </script>
</body>
</html>
