<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 처리 중...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            font-family: sans-serif;
            flex-direction: column;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #F7E600;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div id="message">로그인 정보를 확인하고 있습니다...</div>

    <script>
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // [핵심 1] 전화번호 동기화 로직을 함수로 분리 + 타임아웃 적용
        async function syncPhoneNumber(user) {
            try {
                const kakaoIdentity = user.identities?.find(id => id.provider === 'kakao');
                if (!kakaoIdentity?.identity_data) return;

                const rawPhone = kakaoIdentity.identity_data.phone_number || kakaoIdentity.identity_data.phone;

                // 이미 전화번호가 같으면 API 호출 안 함 (최적화)
                if (rawPhone && user.user_metadata.phone !== rawPhone) {
                    document.getElementById('message').innerText = '정보 동기화 중...';
                    
                    // [핵심 2] 2초가 지나면 강제로 에러를 던져서 넘어가게 만듦 (무한로딩 방지)
                    const timeout = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error("Timeout")), 2000)
                    );
                    
                    const updatePromise = _supabase.auth.updateUser({ 
                        data: { phone: rawPhone } 
                    });

                    // 둘 중 먼저 끝나는 것을 수행
                    await Promise.race([updatePromise, timeout]);
                }
            } catch (e) {
                // 타임아웃이든 에러든 로그만 남기고 통과시킴
                console.warn("전화번호 동기화 건너뜀:", e);
            }
        }

        // 목적지 이동 로직
        function goToDestination() {
            document.getElementById('message').innerText = '로그인 성공! 이동합니다...';
            
            // 1순위: URL 파라미터 (next), 2순위: 로컬 스토리지, 3순위: 메인
            const params = new URLSearchParams(window.location.search);
            const dest = params.get('next') || localStorage.getItem('auth_destination') || '/';
            
            localStorage.removeItem('auth_destination'); // 청소
            window.location.replace(dest); // 이동
        }

        async function handleAuth() {
            try {
                const { data, error } = await _supabase.auth.getSession();
                if (error) throw error;

                if (data.session) {
                    // 세션이 바로 있을 때
                    await syncPhoneNumber(data.session.user);
                    goToDestination();
                } else {
                    // 세션이 늦게 잡힐 때
                    _supabase.auth.onAuthStateChange(async (event, session) => {
                        if (session) {
                            // 여기도 동기화 로직 적용!
                            await syncPhoneNumber(session.user);
                            goToDestination();
                        }
                    });
                }
            } catch (err) {
                console.error('Auth Fatal Error:', err);
                // 최후의 방어선: 에러 발생 시 3초 후 메인 이동
                document.getElementById('message').innerText = '인증 중 오류가 발생했습니다. 메인으로 이동합니다.';
                setTimeout(() => {
                    window.location.href = '/'; 
                }, 3000);
            }
        }

        handleAuth();
    </script>
</body>
</html>
