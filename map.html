 * WHERE id = row_id;
 * END;

                maxZoom: 19, attribution: '© VWorld'
            });

            // 위성지도 그룹 (위성 + 하이브리드)
            const satelliteGroup = L.layerGroup([vworldSat, vworldHybrid]);

            // 지도 생성
            map = L.map('map', {
                center: [37.241086, 127.177553], // 용인시청 중심
                zoom: 13,

// 기존 함수 삭제 후 아래 코드로 교체
function toggleLayer(key, checkbox) {
    if (!checkbox) return;
    const layerId = LAYER_MAP[key];

    if (checkbox.checked) {
        // [수정됨] zIndex: 1000 옵션 추가하여 위성지도(기본 타일)보다 무조건 위에 표시
        const layer = L.tileLayer.wms('https://climate.gg.go.kr/ols/api/geoserver/wms?', {
            apiKey: GYEONGGI_API_KEY,
            layers: layerId,
            format: 'image/png',
            transparent: true,
            version: '1.1.0',
            className: 'wms-layer', // CSS 필터용
            zIndex: 1000 // 배경지도 위에 강제로 띄움
        });
        layer.addTo(map);
        activeLayers[key] = layer;
    } else {
        if (activeLayers[key]) {
            map.removeLayer(activeLayers[key]);
            delete activeLayers[key];
        }
    }
}

// 전역 변수로 현재 로그인한 유저 ID 저장 (효율성 위해)
let globalUserId = null;

// ----------------------------------------------------------------------------------
// [수정] 데이터 로드 (유저 ID 전역 저장 추가)
// ----------------------------------------------------------------------------------
async function fetchAndRenderSuggestions() {
    try {
        const userRes = await sb.auth.getUser();
        globalUserId = userRes.data.user?.id; // 전역 변수에 저장

        const { data, error } = await sb
            .from('site_suggestions')
            .select(`*, coop_members(name), suggestion_likes(user_id)`)
            .order('created_at', { ascending: false });

        if (error) throw error;

        allData = (data || []).filter(item => item.latitude && item.longitude).map(item => {
            const isLikedByMe = item.suggestion_likes?.some(like => like.user_id === globalUserId);
            return { ...item, isLikedByMe };
        });

        renderMarkers(allData);
        
        // 현재 탭 상태 유지하며 리스트 갱신
        const activeTab = document.querySelector('.tab-btn.active');
        const tabType = activeTab ? activeTab.getAttribute('onclick').match(/'(.*?)'/)[1] : 'latest';
        renderList(tabType);

    } catch (e) {
        console.error(e);
        showSystemModal("데이터 로드 실패", "error");
    }
}



// ----------------------------------------------------------------------------------
// [수정] 1. 마커 렌더링 (비고(Note)가 있으면 팝업에 표시)
// ----------------------------------------------------------------------------------
function renderMarkers(dataList) {
    clusterGroup.clearLayers();
    dataList.forEach(item => {
        const safeAddress = escapeHtml(item.address_kr);
        const safeReason = escapeHtml(item.reason);
        const safeNote = escapeHtml(item.note);
        const safeWriter = escapeHtml(item.coop_members?.name || '익명');
        const likeCount = Number(item.like_count || 0);
        const marker = L.marker([item.latitude, item.longitude]);
        
        // 비고 내용이 있으면 줄바꿈 후 표시, 없으면 빈 문자열
        const noteHtml = item.note ? `<div style="margin-top:4px; color:#e67e22; font-size:11px;">※ ${safeNote}</div>` : '';

        const popupContent = `
            <div style="padding:5px; min-width:160px;">
                <h4 style="margin:0 0 5px 0; font-size:14px;">${safeAddress}</h4>
                <div style="font-size:12px; color:#555; margin-bottom:5px;">${safeReason}</div>
                ${noteHtml} 
                <div style="margin-top:6px; font-size:11px; color:#888; border-top:1px solid #eee; padding-top:4px;">
                    👍 추천 ${likeCount} · 👤 ${safeWriter}
                </div>
            </div>`;
        
        marker.bindPopup(popupContent);
        clusterGroup.addLayer(marker);
    });
}

// ----------------------------------------------------------------------------------
// [수정] 2. 리스트 렌더링 (최신/인기순 5개 제한, 전체는 무제한)
// ----------------------------------------------------------------------------------
function renderList(type) {
    const listEl = document.getElementById('suggestionList');
    listEl.innerHTML = '';
    
    let targetData = [...allData];

    if (type === 'latest') {
        // 최신순: 날짜 내림차순 -> 5개만 자름
        targetData.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        targetData = targetData.slice(0, 5); 
    } else if (type === 'best') {
        // 인기순: 좋아요 내림차순 -> 5개만 자름
        targetData.sort((a, b) => (b.like_count || 0) - (a.like_count || 0));
        targetData = targetData.slice(0, 5);
    } else {
        // 전체(all): 날짜 내림차순 -> 제한 없음(전체 노출)
        targetData.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    }

    if (targetData.length === 0) {
        listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#999;">데이터가 없습니다.</div>';
        return;
    }

    targetData.forEach(item => {
        const writerName = escapeHtml(item.coop_members?.name || '익명');
        const safeAddress = escapeHtml(item.address_kr);
        const safeReason = item.reason ? escapeHtml(item.reason) : '내용 없음';
        const likeCount = Number(item.like_count || 0);
        const safeId = JSON.stringify(String(item.id));
        const heartIcon = item.isLikedByMe ? '❤️' : '🤍';
        const heartClass = item.isLikedByMe ? 'active' : '';
        const likedFlag = item.isLikedByMe ? 'true' : 'false';
        const isMyPost = globalUserId && (globalUserId === item.writer_id);
        
        const adminBtns = isMyPost ? `
            <div style="margin-top:8px; display:flex; gap:5px;">
                <button onclick='editSuggestion(${safeId}, event)' 
                    style="font-size:11px; padding:3px 8px; cursor:pointer; background:#eee; border:none; border-radius:4px;">수정</button>
                <button onclick='deleteSuggestion(${safeId}, event)' 
                    style="font-size:11px; padding:3px 8px; cursor:pointer; background:#ffe0e0; color:red; border:none; border-radius:4px;">삭제</button>
            </div>
        ` : '';

        const div = document.createElement('div');
        div.className = 'place-item';
        div.innerHTML = `
            <div class="place-info">
                <div class="place-addr">📍 ${safeAddress}</div>
                <div style="font-size:11px; color:#2c3e50; margin-bottom:4px;">
                    <strong>👤 ${writerName}</strong>
                </div>
                <div class="place-reason">${safeReason}</div>
                ${adminBtns} 
            </div>
            <button class="btn-like ${heartClass}" onclick='handleLike(${safeId}, ${likedFlag}, event)'>
                ${heartIcon} ${likeCount}
            </button>
        `;

        div.onclick = (e) => {
            if(e.target.tagName !== 'BUTTON') {
                moveToLocation(item.latitude, item.longitude, item.id);
            }
        };
        listEl.appendChild(div);
    });
}

let confirmResolve = null; // 사용자의 선택(예/아니오)을 기다리는 변수

    document.getElementById('confirmMsg').innerText = message;

}

function closeConfirm(result) {
    document.getElementById('confirmModal').style.display = 'none';

        confirmResolve = null;

}

// ----------------------------------------------------------------------------------
// [수정] 등록 및 수정 통합 함수
// ----------------------------------------------------------------------------------
async function submitSuggestion() {
    const editId = document.getElementById('editTargetId').value; // 값이 있으면 수정 모드
    
    const addr = document.getElementById('regAddress').value;
    const lat = document.getElementById('regLat').value;
    const lng = document.getElementById('regLng').value;
    const reason = document.getElementById('regReason').value;
    const note = document.getElementById('regNote').value;
    
    if (!lat || !lng) {
        showSystemModal("위치를 지정해주세요.", "error");
        return;
    }
    if (!reason) {
        showSystemModal("추천 이유를 입력해주세요.", "error");
        return;
    }

    try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) {
            showSystemModal("로그인이 필요합니다.", "error");
            return;
        }

        let error;

        if (editId) {
            // [수정 모드] Update 실행
            const res = await sb.from('site_suggestions').update({
                address_kr: addr,
                latitude: parseFloat(lat),
                longitude: parseFloat(lng),
                reason: reason,
                note: note
            }).eq('id', editId).eq('writer_id', user.id); // 내 글인지 이중 체크
            error = res.error;
        } else {
            // [신규 등록] Insert 실행
            const res = await sb.from('site_suggestions').insert([{
                writer_id: user.id,
                latitude: parseFloat(lat),
                longitude: parseFloat(lng),
                address_kr: addr,
                reason: reason,
                note: note
            }]);
            error = res.error;
        }

        if (error) throw error;

        showSystemModal(editId ? "수정되었습니다!" : "등록되었습니다!", "success");
        closeModal();
        fetchAndRenderSuggestions();

    } catch (e) {
        console.error(e);
        if (e.code === '23505' || e.status === 409) {
            showSystemModal("이미 등록된 주소입니다.", "error");
        } else {
            showSystemModal("오류가 발생했습니다.", "error");
        }
    }
}

// 지도 이동 및 팝업 열기 헬퍼 함수
function moveToLocation(lat, lng, itemId) {
    // 1. 지도 이동
    map.flyTo([lat, lng], 17, { duration: 1.5 });

    // 2. 해당 마커 찾아서 팝업 열기 (약간의 딜레이 후)
    setTimeout(() => {
        clusterGroup.eachLayer(layer => {
            // 마커의 좌표가 일치하는지 확인 (정확도 고려)
            const mLat = layer.getLatLng().lat;
            const mLng = layer.getLatLng().lng;
            if(Math.abs(mLat - lat) < 0.0001 && Math.abs(mLng - lng) < 0.0001) {
                // 클러스터 내부에 있다면 펼치기
                clusterGroup.zoomToShowLayer(layer, () => {
                    layer.openPopup();
                });
            }
        });
    }, 1000); // 이동 시간 고려
    
    // 모바일이면 패널 닫기 (지도 보라고)
    if(window.innerWidth <= 768) {
        togglePanel(false); // 닫기 강제
    }
}

// [수정] 3. 좋아요 토글 (1인 1회, DB Insert/Delete)
// ----------------------------------------------------------------------------------
async function handleLike(suggestionId, isCurrentlyLiked, evt) {
    if (evt) evt.stopPropagation();
    // 로그인 체크
    const { data: { user } } = await sb.auth.getUser();
    if (!user) {
        showSystemModal("로그인이 필요합니다.", "error");
        return;
    }

    try {
        if (isCurrentlyLiked) {
            // 이미 좋아요 -> 취소 (Delete)
            const { error } = await sb
                .from('suggestion_likes')
                .delete()
                .match({ suggestion_id: suggestionId, user_id: user.id });
            if(error) throw error;
            showSystemModal("좋아요를 취소했습니다.", "success");
        } else {
            // 안 눌렀음 -> 추가 (Insert)
            const { error } = await sb
                .from('suggestion_likes')
                .insert([{ suggestion_id: suggestionId, user_id: user.id }]);
            if(error) throw error;
            showSystemModal("이 부지를 추천했습니다!", "success");
        }
        
        // 목록 갱신 (숫자 및 하트 업데이트)
        fetchAndRenderSuggestions();

    } catch (e) {
        console.error(e);
        showSystemModal("처리에 실패했습니다.", "error");
    }
}

// 시스템 알림 모달 (Alert 대체)
function showSystemModal(msg, type = 'success') {
    const modal = document.getElementById('systemModal');
    const icon = document.getElementById('sysIcon');
    const txt = document.getElementById('sysMsg');

    modal.className = `system-modal ${type}`; // reset class
    icon.innerText = type === 'success' ? '✅' : '⚠️';
    txt.innerText = msg;

    // Show
    modal.classList.add('show');

    // 3초 뒤 자동 사라짐
    setTimeout(() => {
        modal.classList.remove('show');
    }, 3000);
}

// [수정] 주소 검색 레이어 및 통합 로직
// ----------------------------------------------------------------------------------
var element_layer = document.getElementById('layer');

function closeDaumPostcode() {
    // iframe을 넣은 element를 안 보이게 한다.
    element_layer.style.display = 'none';
}

/**
 * 주소 검색 실행 함수
 * @param {string} type - 'main' (메인검색창) 또는 'modal' (등록모달창) 구분
 */
function execDaumPostcode(type) {
    new daum.Postcode({
        oncomplete: function(data) {
            var addr = data.roadAddress || data.jibunAddress; // 주소 변수

            // 1. 타입에 따라 입력 필드 분기 처리
            if (type === 'main') {
                document.getElementById('mainSearchInput').value = addr;
            } else if (type === 'modal') {
                document.getElementById('regAddress').value = addr;
            }

            // 2. 카카오 Geocoder로 좌표 변환 및 지도 이동
            if (kakaoGeocoder) {
                kakaoGeocoder.addressSearch(addr, function(result, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        var lat = result[0].y;
                        var lng = result[0].x;

                        if (type === 'main') {
                            // 메인 검색이면 지도를 해당 위치로 이동
                            map.flyTo([lat, lng], 17);
                        } else if (type === 'modal') {
                            // 등록 모달이면 hidden 값에 좌표 저장
                            document.getElementById('regLat').value = lat;
                            document.getElementById('regLng').value = lng;
                        }
                    }
                });
            }

            // 3. 검색 완료 후 레이어 닫기
            element_layer.style.display = 'none';
        },
        width: '100%',
        height: '100%',
        maxSuggestItems: 5
    }).embed(element_layer);

    // 4. 레이어를 화면에 표시하고 위치 조정
    element_layer.style.display = 'block';
    initLayerPosition();
}

// 레이어 위치 조정 함수 (화면 중앙 정렬)
function initLayerPosition() {
    var width = 300; // 우편번호서비스가 들어갈 element의 width
    var height = 400; // 우편번호서비스가 들어갈 element의 height
    var borderWidth = 5; // 테두리 두께

    // 위에서 선언한 값들을 실제 element에 넣는다.
    element_layer.style.width = width + 'px';
    element_layer.style.height = height + 'px';
    element_layer.style.border = borderWidth + 'px solid #2c3e50';
    element_layer.style.borderRadius = '10px';
    element_layer.style.backgroundColor = '#fff';

    // 실행되는 순간의 viewport 너비와 높이 값을 가져와서 중앙에 좌표를 계산한다.
    element_layer.style.left = (((window.innerWidth || document.documentElement.clientWidth) - width) / 2 - borderWidth) + 'px';
    element_layer.style.top = (((window.innerHeight || document.documentElement.clientHeight) - height) / 2 - borderWidth) + 'px';
}

// [연결] HTML onclick 이벤트와 매핑되는 래퍼 함수들
function searchAddressGlobal() {
    execDaumPostcode('main');
}

function searchAddressForModal() {
    execDaumPostcode('modal');
}


        function togglePanel(source) { 
            const p = document.querySelector('.suggestion-panel');
            const isMobile = window.innerWidth <= 768;
            if (source === 'header' && !isMobile) return;

            if (source === true) {
                p.style.transform = 'translateY(0)';
                return;
            }
            if (source === false) {
                p.style.transform = 'translateY(80%)';
                return;
            }

            const isClosed = p.style.transform === 'translateY(80%)';
            p.style.transform = isClosed ? 'translateY(0)' : 'translateY(80%)';
        }
