<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회의록 관리자 대시보드</title>
    <style>
        :root { --admin-bg: #fffbeb; --primary: #2563eb; }
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #f8fafc; }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        /* 헤더 */
        .header {
            background: var(--admin-bg); border: 1px solid #fcd34d; padding: 20px;
            border-radius: 8px; margin-bottom: 20px; color: #92400e;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 카드 공통 */
        .card {
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 입력 폼 */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        textarea.form-control { height: 120px; resize: vertical; }

        /* 리스트 아이템 */
        .minute-item {
            border-bottom: 1px solid #f1f5f9; padding: 20px 0;
            display: flex; flex-direction: column; gap: 10px;
        }
        .minute-header { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-open { background: #dbeafe; color: #1e40af; }
        .badge-closed { background: #fee2e2; color: #991b1b; }

        /* 서명 현황 바 */
        .progress-container {
            background: #f1f5f9; border-radius: 6px; padding: 10px; margin-top: 5px;
        }
        .progress-bar-bg { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 5px; }
        .progress-bar-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.5s; }
        
        .signer-names { font-size: 0.85rem; color: #64748b; }
        .missing-signer { color: #ef4444; font-weight: bold; }

        /* 버튼 그룹 */
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .btn-blue { background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; }
        .btn-gray { background: #f1f5f9; color: #475569; }
        .btn-red { background: #fef2f2; color: #dc2626; }
        .btn-submit { background: var(--primary); color: white; padding: 12px 20px; font-size: 1rem; }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2 style="margin:0;">🛡️ 회의록 관리 (사무국용)</h2>
            <button onclick="location.href='membermanage.html'" class="btn btn-gray">메인으로</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">📝 신규 회의록 작성</h3>
            <div class="input-group">
                <label>회의 제목</label>
                <input type="text" id="in-title" class="form-control" placeholder="예: 2026년 제2차 정기이사회">
            </div>
            <div class="input-group">
                <label>회의 내용 (HTML 태그 사용 가능)</label>
                <textarea id="in-content" class="form-control" placeholder="<p>안건 1: ...</p>"></textarea>
            </div>
            <div style="text-align: right;">
                <button onclick="createMinute()" class="btn btn-submit">저장하기</button>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">📂 관리 목록</h3>
            <div id="list-area">로딩 중...</div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './ElectionService.js';

        // 전역 변수
        let allOfficials = []; // 전체 임원 목록 (기준값)

        async function init() {
            // 1. 관리자 체크
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                alert("로그인이 필요합니다.");
                location.href = 'membermanage.html';
                return;
            }

            // 2. 전체 현직 임원 목록 미리 로드 (분모 계산용)
            const { data: officials } = await supabase
                .from('coop_officials')
                .select('id, coop_members(name)')
                .eq('status', 'active');
            
            allOfficials = officials || [];

            // 3. 목록 로드
            loadMinutes();
        }

        async function loadMinutes() {
            const container = document.getElementById('list-area');

            // 회의록 최신순 조회
            const { data: minutes } = await supabase
                .from('minutes')
                .select('*')
                .order('created_at', { ascending: false });

            if (!minutes || minutes.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">등록된 회의록이 없습니다.</div>';
                return;
            }

            container.innerHTML = '';

            for (const m of minutes) {
                // 해당 회의록의 서명 데이터 조회
                const { data: sigs } = await supabase
                    .from('doc_signatures')
                    .select('official_id');
                
                // 현재 회의록에 해당하는 서명만 필터링 (간단 구현)
                const currentSigs = sigs.filter(s => {
                    // DB 쿼리에서 조인하면 더 좋지만, 여기서 간단히 처리하려면 
                    // doc_signatures를 minute_id로 다시 쿼리하는게 정확함.
                    // 성능 위해 루프 안에서 비동기 호출 (데이터 적을 땐 OK)
                    return true; 
                });
                
                // *정확성을 위해 개별 쿼리 수행*
                const { data: realSigs } = await supabase
                    .from('doc_signatures')
                    .select('official_id')
                    .eq('minute_id', m.id);

                const signedOfficialIds = realSigs.map(s => s.official_id);
                
                // 통계 계산
                const totalCount = allOfficials.length;
                const signedCount = signedOfficialIds.length;
                const percent = totalCount > 0 ? (signedCount / totalCount) * 100 : 0;

                // 미서명자 찾기
                const missingNames = allOfficials
                    .filter(off => !signedOfficialIds.includes(off.id))
                    .map(off => off.coop_members?.name)
                    .join(', ');

                // 상태 뱃지
                const badge = m.status === 'OPEN' 
                    ? `<span class="status-badge badge-open">서명 진행 중</span>` 
                    : `<span class="status-badge badge-closed">마감됨</span>`;

                // 링크 URL
                const signLink = `${window.location.origin}/minutes_sign.html?id=${m.id}`;
                const viewLink = `${window.location.origin}/minutes_view.html?id=${m.id}`;

                const html = `
                    <div class="minute-item">
                        <div class="minute-header">
                            <div>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    ${badge}
                                    <strong style="font-size:1.1rem;">${m.title}</strong>
                                </div>
                                <div style="font-size:0.8rem; color:#888; margin-top:4px;">
                                    ${new Date(m.created_at).toLocaleDateString()} 작성
                                </div>
                            </div>
                            <button onclick="deleteMinute('${m.id}')" class="btn btn-red">삭제</button>
                        </div>

                        <div class="progress-container">
                            <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:5px;">
                                <span>서명 현황: <b>${signedCount}</b> / ${totalCount}명</span>
                                <span>${Math.round(percent)}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width:${percent}%"></div>
                            </div>
                            <div class="signer-names">
                                ${missingNames ? `<span class="missing-signer">📢 미서명: ${missingNames}</span>` : '<span style="color:#10b981;">🎉 전원 서명 완료!</span>'}
                            </div>
                        </div>

                        <div class="btn-group">
                            <button onclick="copyLink('${signLink}')" class="btn btn-blue">
                                ✍️ 서명 링크 복사 (이사님용)
                            </button>
                            <button onclick="copyLink('${viewLink}')" class="btn btn-gray">
                                📄 배포 링크 복사 (공개용)
                            </button>
                            ${m.status === 'OPEN' 
                                ? `<button onclick="toggleStatus('${m.id}', 'CLOSED')" class="btn btn-gray">🔒 마감하기</button>`
                                : `<button onclick="toggleStatus('${m.id}', 'OPEN')" class="btn btn-gray">🔓 다시 열기</button>`
                            }
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            }
        }

        // [기능] 생성
        window.createMinute = async () => {
            const title = document.getElementById('in-title').value;
            const content = document.getElementById('in-content').value;
            if(!title) return alert("제목을 입력하세요.");

            const { error } = await supabase.from('minutes').insert({ title, content });
            if(error) alert(error.message);
            else {
                alert("등록되었습니다.");
                document.getElementById('in-title').value = '';
                document.getElementById('in-content').value = '';
                loadMinutes();
            }
        };

        // [기능] 상태 변경
        window.toggleStatus = async (id, status) => {
            const { error } = await supabase.from('minutes').update({ status }).eq('id', id);
            if(error) alert(error.message);
            else loadMinutes();
        };

        // [기능] 삭제
        window.deleteMinute = async (id) => {
            if(confirm("정말 삭제합니까? (서명 데이터도 모두 삭제됨)")) {
                const { error } = await supabase.from('minutes').delete().eq('id', id);
                if(error) alert(error.message);
                else loadMinutes();
            }
        };

        // [기능] 링크 복사
        window.copyLink = (url) => {
            navigator.clipboard.writeText(url).then(() => {
                alert("링크가 복사되었습니다.");
            });
        };

        init();
    </script>
</body>
</html>
