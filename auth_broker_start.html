<!DOCTYPE html>
<!--
Version: v1.0.2
Change: Force implicit OAuth flow in the browser broker so the final app callback can complete login without cross-origin PKCE verifier state.
-->
<html lang="ko">
<head>
  <script>console.log('[Version] v1.0.2 | auth_broker_start.html');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>인증을 준비하고 있습니다</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    window.__BROWSER_ENV_GUARD_CONFIG__ = {
      title: '안전한 브라우저에서 다시 열어 주세요.',
      actionLabel: '로그인과 이메일 인증',
      recommendedBrowsers: 'Safari, Chrome, Edge 또는 웨일의 최신 버전'
    };
  </script>
  <script src="shared/browser_env_guard.js?v=20260415-1"></script>
  <script src="shared/auth_broker_helper.js?v=20260404-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background:#f8fafc; min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center; padding:24px; font-family:"Pretendard Variable","Pretendard",-apple-system,sans-serif; }
    .broker-card { width:100%; max-width:520px; background:#fff; border-radius:20px; box-shadow:0 16px 48px rgba(15,23,42,.12); padding:32px 28px; }
    .broker-title { font-size:1.4rem; font-weight:800; margin-bottom:12px; color:#0f172a; }
    .broker-copy { color:#475569; line-height:1.7; margin-bottom:0; }
    .broker-status { margin-top:18px; white-space:pre-wrap; color:#334155; font-size:.95rem; }
  </style>
</head>
<body>
  <div class="broker-card">
    <div class="d-flex align-items-center gap-3">
      <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
      <div>
        <div class="broker-title">인증을 준비하고 있습니다</div>
        <p class="broker-copy">잠시 후 인증 화면으로 이동합니다. 이 화면은 조합별 도메인으로 다시 안전하게 돌아가기 위한 중간 단계입니다.</p>
      </div>
    </div>
    <div class="broker-status" id="brokerStatus">설정을 확인하는 중입니다...</div>
  </div>

  <script>
  (function runAuthBrokerStart() {
    'use strict';

    var SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';
    var STORAGE_PREFIX = 'auth_broker_redirect_v1:';
    var statusEl = document.getElementById('brokerStatus');

    function setStatus(message) {
      if (statusEl) statusEl.textContent = String(message || '');
    }

    function createNonce() {
      return 'ab_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }

    function getParams() {
      return new URLSearchParams(window.location.search || '');
    }

    function buildCompleteUrl(state) {
      var url = new URL('auth_broker_complete.html', window.location.href);
      url.searchParams.set('state', state);
      return url.href;
    }

    function extractQueryParams(params) {
      var queryParams = {};
      params.forEach(function (value, key) {
        if (String(key).indexOf('qp_') !== 0) return;
        queryParams[String(key).slice(3)] = value;
      });
      return queryParams;
    }

    async function start() {
      if (window.BrowserEnvGuard && typeof window.BrowserEnvGuard.isBlocked === 'function' && window.BrowserEnvGuard.isBlocked()) {
        setStatus('현재 브라우저 환경에서는 인증을 안전하게 진행하기 어렵습니다.\n외부 최신 브라우저에서 다시 열어 주세요.');
        return;
      }

      var params = getParams();
      var provider = params.get('provider') || '';
      var callback = params.get('callback') || '';
      var scopes = params.get('scopes') || '';
      var mode = params.get('mode') || 'login';
      var queryParams = extractQueryParams(params);
      var callbackUrl = window.AuthBrokerHelper && typeof window.AuthBrokerHelper.parseCallbackUrl === 'function'
        ? window.AuthBrokerHelper.parseCallbackUrl(callback)
        : null;

      if (!provider || mode !== 'login' || !callbackUrl) {
        setStatus('중앙 인증 시작 정보를 확인하지 못했습니다.\n브라우저를 닫고 다시 시도해 주세요.');
        return;
      }

      var state = createNonce();
      try {
        window.sessionStorage.setItem(STORAGE_PREFIX + state, JSON.stringify({
          callback: callbackUrl.href,
          provider: provider,
          created_at: Date.now()
        }));
      } catch (error) {
        console.error('auth_broker_start storage failed', error);
        setStatus('브라우저 저장소를 사용할 수 없어 인증을 진행할 수 없습니다.\n다시 시도해 주세요.');
        return;
      }

      setStatus('인증 공급자와 연결하는 중입니다...');

      try {
        var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            flowType: 'implicit'
          }
        });
        var result = await supabaseClient.auth.signInWithOAuth({
          provider: provider,
          options: {
            redirectTo: buildCompleteUrl(state),
            scopes: scopes || undefined,
            queryParams: Object.keys(queryParams).length ? queryParams : undefined
          }
        });
        if (result && result.error) throw result.error;
        if (result && result.data && result.data.url) {
          window.location.assign(result.data.url);
          return;
        }
      } catch (error) {
        console.error('auth_broker_start failed', error);
        try { window.sessionStorage.removeItem(STORAGE_PREFIX + state); } catch (_) {}
        setStatus('인증 페이지로 이동하지 못했습니다.\n' + String((error && error.message) || error || '알 수 없는 오류'));
      }
    }

    start();
  })();
  </script>
</body>
</html>
