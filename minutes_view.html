<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이사회 회의록 열람</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');

        :root {
            --paper-width: 210mm;
            --paper-height: 297mm;
            --margin: 25mm;
            --bg-color: #525659;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex; justify-content: center;
            padding: 30px 0;
            font-family: 'Noto Serif KR', serif;
        }

        /* A4 용지 스타일 */
        .paper {
            background: white;
            width: var(--paper-width);
            min-height: var(--paper-height);
            padding: var(--margin);
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* 문서 양식 */
        .doc-header { text-align: center; margin-bottom: 40px; border-bottom: 3px double #333; padding-bottom: 10px; }
        .doc-title { font-size: 26pt; font-weight: 700; margin: 0; letter-spacing: 2px; }
        .doc-meta { margin-top: 10px; font-size: 11pt; color: #555; text-align: right; }
        .doc-body { font-size: 12pt; line-height: 1.8; text-align: justify; white-space: pre-wrap; min-height: 500px; }
        .doc-footer { margin-top: 60px; text-align: center; }
        .closing-text { font-size: 14pt; font-weight: bold; margin-bottom: 40px; }

        /* 서명란 그리드 */
        .sign-grid {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 30px;
        }
        .sign-item { width: 80px; text-align: center; }
        .sign-role { font-size: 10pt; margin-bottom: 5px; color: #666; }
        .sign-name { font-size: 11pt; font-weight: bold; margin-bottom: 5px; }
        
        .stamp-box {
            width: 70px; height: 70px;
            border: 1px solid #eee; /* 흐린 테두리 */
            border-radius: 50%;
            margin: 0 auto;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        
        .seal-img {
            width: 100%; height: 100%; object-fit: contain; opacity: 0.9;
            transform: rotate(-3deg); /* 자연스러운 각도 */
        }
        
        .unsigned-mark { font-size: 0.7rem; color: #ccc; }

        /* 모바일 대응 */
        @media screen and (max-width: 768px) {
            .paper { width: 100%; padding: 20px; box-shadow: none; }
            body { padding: 0; background: white; }
        }

        /* 인쇄 설정 */
        @media print {
            body { background: white; padding: 0; }
            .paper { box-shadow: none; width: 100%; margin: 0; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="paper">
        <header class="doc-header">
            <h1 class="doc-title" id="ui-title"></h1>
            <div class="doc-meta" id="ui-date"></div>
        </header>

        <section class="doc-body" id="ui-content">
            </section>

        <footer class="doc-footer">
            <div class="closing-text">위와 같이 의결하고 서명합니다.</div>
            <div class="sign-grid" id="ui-sign-grid"></div>
        </footer>
    </div>

    <script type="module">
        import { supabase } from './ElectionService.js';

        const urlParams = new URLSearchParams(window.location.search);
        const minuteId = urlParams.get('id');

        async function init() {
            if(!minuteId) {
                document.body.innerHTML = "<div style='text-align:center; margin-top:50px;'>문서 ID가 없습니다.</div>";
                return;
            }

            // 1. 회의록 본문 로드 (로그인 체크 없이 누구나 볼 수 있게)
            const { data: doc, error } = await supabase.from('minutes').select('*').eq('id', minuteId).single();
            
            if(error || !doc) {
                document.body.innerHTML = "<div style='text-align:center; margin-top:50px;'>문서를 찾을 수 없거나 삭제되었습니다.</div>";
                return;
            }

            document.getElementById('ui-title').innerText = doc.title;
            document.getElementById('ui-date').innerText = `일시: ${new Date(doc.created_at).toLocaleDateString()}`;
            document.getElementById('ui-content').innerHTML = doc.content;

            // 2. 임원 목록 및 서명 데이터 로드
            // (1) 전체 임원(틀 잡기용)
            const { data: officials } = await supabase
                .from('coop_officials')
                .select('id, position, coop_members(name)')
                .eq('status', 'active')
                .order('position');

            // (2) 실제 서명 데이터
            const { data: signatures } = await supabase
                .from('doc_signatures')
                .select('official_id, signature_url')
                .eq('minute_id', minuteId);

            renderSignGrid(officials || [], signatures || []);
        }

        function renderSignGrid(officials, signatures) {
            const grid = document.getElementById('ui-sign-grid');
            let html = '';

            officials.forEach(off => {
                const name = off.coop_members?.name || '임원';
                const sig = signatures.find(s => s.official_id === off.id);
                
                let stampContent = `<span class="unsigned-mark">(서명없음)</span>`;
                
                if (sig) {
                    stampContent = `<img src="${sig.signature_url}" class="seal-img">`;
                }

                html += `
                    <div class="sign-item">
                        <div class="sign-role">${off.position || '이사'}</div>
                        <div class="stamp-box">
                            ${stampContent}
                        </div>
                        <div class="sign-name">${name}</div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
