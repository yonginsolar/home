<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이사회 회의록 서명</title>
    <style>
        /* 1. 폰트 및 기본 설정: 공문서 느낌의 명조/고딕 계열 추천 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');

        :root {
            --paper-width: 210mm;
            --paper-height: 297mm;
            --margin: 25mm;
            --bg-color: #525659; /* PDF 뷰어 배경색 */
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 100px 0; /* 하단 버튼 공간 확보 */
            font-family: 'Noto Serif KR', serif; /* 명조체 느낌 */
        }

        /* 2. A4 용지 스타일 (핵심) */
        .paper {
            background: white;
            width: var(--paper-width);
            min-height: var(--paper-height);
            padding: var(--margin);
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        /* 3. 문서 내부 디자인 (공문서 양식) */
        .doc-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px double #333; /* 이중 밑줄 */
            padding-bottom: 10px;
        }
        .doc-title {
            font-size: 28pt;
            font-weight: 700;
            margin: 0;
            letter-spacing: 5px;
        }
        .doc-meta {
            margin-top: 10px;
            font-size: 11pt;
            color: #555;
            text-align: right;
        }

        .doc-body {
            font-size: 12pt;
            line-height: 1.8; /* 줄간격 넉넉하게 */
            text-align: justify; /* 양쪽 정렬 */
            white-space: pre-wrap; /* 줄바꿈 반영 */
        }

        .doc-footer {
            margin-top: 60px;
            text-align: center;
        }
        .closing-text {
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 40px;
        }

        /* 4. 서명란 그리드 (자동 정렬) */
        .sign-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        
        .sign-item {
            width: 80px;
            text-align: center;
        }
        
        .sign-role { font-size: 10pt; margin-bottom: 5px; color: #666; }
        .sign-name { font-size: 11pt; font-weight: bold; margin-bottom: 5px; }
        
        /* 도장 찍히는 박스 */
        .stamp-box {
            width: 70px; height: 70px;
            border: 1px solid #ddd; /* 서명 전 흐린 테두리 */
            border-radius: 50%; /* 원형 도장 */
            margin: 0 auto;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            background-color: #fff;
        }
        
        /* 실제 도장 이미지 */
        .seal-img {
            width: 100%; height: 100%;
            object-fit: contain;
            opacity: 0.9;
            /* 도장이 진짜 찍힌 것처럼 약간 회전시킴 */
            transform: rotate(-5deg); 
        }

        /* 내 서명 위치 강조 */
        .my-spot {
            border: 2px dashed #2563eb; /* 파란 점선 */
            background-color: #eff6ff;
            cursor: pointer;
        }
        .my-spot::after {
            content: "클릭";
            font-size: 9pt; color: #2563eb;
        }

        /* 5. 모바일 최적화 (반응형) */
        @media screen and (max-width: 768px) {
            .paper {
                width: 100%;
                min-height: auto;
                padding: 20px;
            }
            .doc-title { font-size: 20pt; }
            .doc-body { font-size: 11pt; }
        }

        /* 6. 인쇄 시 설정 (종이 출력용) */
        @media print {
            body { background: none; padding: 0; }
            .paper { box-shadow: none; margin: 0; width: 100%; }
            .bottom-bar { display: none !important; } /* 버튼 숨김 */
        }

        /* 하단 고정 버튼 바 */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255,255,255,0.95);
            border-top: 1px solid #ddd; padding: 15px;
            text-align: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
        }
        .btn-action {
            background: #2563eb; color: white;
            padding: 12px 40px; border: none; border-radius: 30px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(37,99,235,0.3);
            transition: 0.2s;
        }
        .btn-action:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 8px rgba(37,99,235,0.4); }
    </style>
</head>
<body>

    <div class="paper">
        <header class="doc-header">
            <h1 class="doc-title" id="ui-title">이 사 회 회 의 록</h1>
            <div class="doc-meta" id="ui-date"></div>
        </header>

        <section class="doc-body" id="ui-content">
            </section>

        <footer class="doc-footer">
            <div class="closing-text">위와 같이 의결하고 서명합니다.</div>
            
            <div class="sign-grid" id="ui-sign-grid"></div>
        </footer>
    </div>

    <div class="bottom-bar">
        <button id="btn-sign" class="btn-action" disabled onclick="handleSign()">
            문서 확인 및 서명 날인
        </button>
        <div id="status-msg" style="margin-top:8px; font-size:0.85rem; color:#666;"></div>
    </div>

    <script type="module">
        import { supabase } from './ElectionService.js';

        const urlParams = new URLSearchParams(window.location.search);
        const minuteId = urlParams.get('id');

        let myOfficialId = null;
        let mySealUrl = null;
        let myAuthId = null;

        async function init() {
            if(!minuteId) return alert("잘못된 접근입니다.");

            // 1. 로그인 체크
            const { data: { session } } = await supabase.auth.getSession();
            if(!session) {
                alert("로그인이 필요합니다.");
                location.href = 'membermanage.html';
                return;
            }
            myAuthId = session.user.id;

            // 2. 내 임원 정보 및 도장 조회 (coop_officials)
            const { data: member } = await supabase
                .from('coop_members')
                .select('member_id, name')
                .eq('email', session.user.email)
                .single();

            if(member) {
                const { data: official } = await supabase
                    .from('coop_officials')
                    .select('id, seal_url, position') // position(직책) 추가
                    .eq('member_id', member.member_id)
                    .eq('status', 'active')
                    .maybeSingle();
                
                if(official) {
                    myOfficialId = official.id;
                    mySealUrl = official.seal_url;
                    
                    const msg = document.getElementById('status-msg');
                    if(mySealUrl) {
                        msg.innerHTML = `<b>${member.name}</b> 이사님으로 로그인되었습니다.`;
                        document.getElementById('btn-sign').disabled = false;
                    } else {
                        msg.innerHTML = `<span style="color:red;">도장 이미지가 등록되지 않았습니다. 관리자에게 문의하세요.</span>`;
                    }
                }
            }

            // 3. 데이터 로드
            loadData();
        }

        async function loadData() {
            // 회의록 본문
            const { data: doc } = await supabase.from('minutes').select('*').eq('id', minuteId).single();
            if(!doc) return;

            document.getElementById('ui-title').innerText = doc.title;
            document.getElementById('ui-date').innerText = `일시: ${new Date(doc.created_at).toLocaleDateString()}`;
            document.getElementById('ui-content').innerHTML = doc.content; // HTML 삽입

            // 서명 현황 가져오기
            // [중요] 모든 임원 목록을 가져와서 서명판을 미리 깔아둬야 예쁩니다.
            const { data: officials } = await supabase
                .from('coop_officials')
                .select('id, position, coop_members(name)')
                .eq('status', 'active')
                .order('position'); // 직책순 정렬 권장

            const { data: signatures } = await supabase
                .from('doc_signatures')
                .select('official_id, signature_url')
                .eq('minute_id', minuteId);

            renderSignGrid(officials || [], signatures || []);
        }

        function renderSignGrid(officials, signatures) {
            const grid = document.getElementById('ui-sign-grid');
            let html = '';

            officials.forEach(off => {
                const name = off.coop_members?.name || '임원';
                const sig = signatures.find(s => s.official_id === off.id);
                const isMe = (off.id === myOfficialId);
                
                // 도장이 찍혔거나, 내 자리라면 클래스 처리
                let stampHtml = '';
                let boxClass = 'stamp-box';

                if (sig) {
                    // 이미 서명됨
                    stampHtml = `<img src="${sig.signature_url}" class="seal-img">`;
                    boxClass += ' signed'; // 테두리 없애는 등 스타일링 가능
                } else if (isMe && mySealUrl) {
                    // 내 차례 (아직 서명 안함) -> 파란 점선 효과
                    boxClass += ' my-spot';
                } else {
                    // 남의 차례 (아직 서명 안함)
                    stampHtml = '<span style="color:#ddd; font-size:0.8rem;">(서명전)</span>';
                }

                html += `
                    <div class="sign-item">
                        <div class="sign-role">${off.position || '이사'}</div>
                        <div class="${boxClass}" id="box-${off.id}">
                            ${stampHtml}
                        </div>
                        <div class="sign-name">${name}</div>
                    </div>
                `;

                // 내가 서명했으면 버튼 비활성화 및 문구 변경
                if (isMe && sig) {
                    const btn = document.getElementById('btn-sign');
                    btn.innerText = "✅ 서명 완료됨";
                    btn.disabled = true;
                    btn.style.background = "#10b981";
                }
            });

            grid.innerHTML = html;
        }

        window.handleSign = async () => {
            if(!confirm("문서 내용을 확인하였으며, 서명하시겠습니까?")) return;
            
            const { error } = await supabase.from('doc_signatures').insert({
                minute_id: minuteId,
                official_id: myOfficialId,
                member_uuid: myAuthId,
                signature_url: mySealUrl
            });

            if(error) alert(error.message);
            else location.reload();
        };

        init();
    </script>
</body>
</html>
