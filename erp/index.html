<!DOCTYPE html>
<!-- Version: v1.0.2 -->
<html>
<head>
  <script>console.log('[Version] v1.0.2 | index.html');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>협동조합 ERP (메인)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { 
        background-color: #f8f9fa; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        margin: 0; 
        padding: 20px; 
    }
    .main-card { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
    .btn-menu { text-align: left; padding: 15px; margin-bottom: 10px; transition: transform 0.2s; border: 1px solid #eee; }
    .btn-menu:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); background-color: #f8f9fa; }
    .hidden { display: none !important; }
    .profile-box { background: #e3f2fd; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
    .btn-kakao { background: #FEE500; border: none; border-radius: 10px; font-weight: bold; color: #3a1d1d; }
    .btn-kakao:hover { background: #f4dc00; color: #3a1d1d; }
    .notif-badge { display: inline-block; min-width: 20px; text-align: center; }
  </style>
</head>
<body>

  <div class="main-card">
    <h3 class="fw-bold mb-4">⚡ 협동조합 ERP</h3>

    <div id="loadingScreen">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <p class="text-muted small">접속 정보를 확인 중입니다...</p>
    </div>
    
    <div id="loginForm" class="hidden">
      <p class="text-muted mb-4 small">
        등록된 이메일로 간편하게 로그인하세요.<br>
        (링크 클릭 시 자동 접속)
      </p>

      <div class="mb-3 text-start">
        <label class="form-label">이메일 주소</label>
        <input type="email" class="form-control" id="emailInput" placeholder="name@coop.com">
      </div>

      <button class="btn btn-primary w-100 py-2" id="btnSend" onclick="sendMagicLink()">
        📧 로그인 링크 받기
      </button>

      <button class="btn btn-kakao w-100 py-2 mt-2" onclick="startKakaoLogin()">
        💬 카카오로 로그인
      </button>
      
      <div id="statusMsg" class="mt-3 text-success small" style="display:none;"></div>
    </div>

    <div id="menuArea" class="hidden">
      <div class="profile-box">
        <h5 class="fw-bold mb-1" id="userName">홍길동 님</h5>
        <span class="badge bg-primary" id="userTeam">기획팀</span>
        <span class="text-muted small ms-1" id="userRank">과장</span>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-outline-secondary btn-sm" onclick="openNotificationModal()">🔔 알림</button>
        <span class="badge bg-danger notif-badge hidden" id="notifBadge">0</span>
      </div>
      
      <div class="d-grid gap-2">
        <button class="btn btn-white btn-menu" id="btnApproval" onclick="location.href='approval.html'">
          📝 <strong>전자결재</strong>
          <span class="d-block small text-muted">기안 작성 및 결재 처리</span>
        </button>

        <button class="btn btn-white btn-menu" id="btnMypage" onclick="location.href='mypage.html'">
          👤 <strong>마이페이지</strong>
          <span class="d-block small text-muted">내 정보 및 휴가 관리</span>
        </button>
        
        <button class="btn btn-white btn-menu hidden" id="btnAccounting" onclick="location.href='accounting.html'">
          📒 <strong>회계관리</strong>
          <span class="d-block small text-muted">지출 및 예산 관리</span>
        </button>
        
        <button class="btn btn-white btn-menu hidden" id="btnAdmin" onclick="location.href='admin_employee.html'">
          ⚙️ <strong>직원관리</strong>
          <span class="d-block small text-muted">인사 및 급여 설정</span>
        </button>

        <button class="btn btn-white btn-menu hidden" id="btnMemberAdmin" onclick="location.href='admin_member.html'">
            🌐 <strong>홈페이지 관리</strong>
            <span class="d-block small text-muted">조합원 명부 및 입금 매칭</span>
        </button>

        <button class="btn btn-white btn-menu hidden" id="btnAudit" onclick="location.href='audit_logs.html'">
          🧾 <strong>감사 로그</strong>
          <span class="d-block small text-muted">중요 작업 기록 조회</span>
        </button>

        <button class="btn btn-white btn-menu hidden" id="btnPerm" onclick="location.href='permissions.html'">
          🔐 <strong>권한 관리</strong>
          <span class="d-block small text-muted">역할/직급 권한 설정</span>
        </button>
      </div>

      <button class="btn btn-link text-secondary btn-sm mt-4" onclick="logout()">로그아웃</button>
    </div>
  </div>

<div class="text-center mt-4 hidden" id="patchNoteArea">
    <small class="text-muted" style="cursor: pointer; text-decoration: underline;" onclick="openPatchModal()">
      Ver <span id="currentVersion">Loading...</span> (Release Notes)
    </small>
  </div>

  <div class="modal fade" id="alertModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center py-4" id="alertBody" style="white-space: pre-wrap;"></div>
        <div class="modal-footer justify-content-center p-1 border-0">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">확인</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white p-2">
          <h6 class="modal-title fw-bold mb-0">⚠️ 확인</h6>
        </div>
        <div class="modal-body text-center py-4" id="confirmBody" style="white-space: pre-wrap;"></div>
        <div class="modal-footer justify-content-center p-2 border-0">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button>
          <button class="btn btn-primary btn-sm" onclick="handleConfirm()">확인</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="notifModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-light">
          <h6 class="modal-title fw-bold mb-0">🔔 알림 센터</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0">
          <div id="notifList" class="list-group list-group-flush"></div>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-outline-secondary btn-sm" onclick="markAllNotificationsRead()">모두 읽음</button>
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co'; 
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const REDIRECT_URL = `${window.location.origin}/index.html`; 

let myInfo = null;
let permissionSet = new Set();
let notifModalInstance = null;
let lastNotifList = [];

window.onload = async function() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) { await loadUserInfo(session.user); } 
    else { showScreen('loginForm'); }
};

async function loadUserInfo(user) {
    const email = user?.email || user?.user_metadata?.email || user?.user_metadata?.account_email;
    if (!email) {
        showAlert("이메일 정보가 없습니다.\n카카오 로그인 시 이메일 제공에 동의해주세요.");
        await _supabase.auth.signOut(); 
        showScreen('loginForm'); 
        return;
    }
    const { data, error } = await _supabase
        .from('ref_employees')
        .select('*')
        .eq('email', email)
        .single();

    // [복구 완료] 국장님이 요청하신 모달/로그 처리 로직 그대로 복구
    if (error || !data) {
        console.error("접근 권한 없음: 직원 명부에 없는 계정입니다.");
        
        // [규칙 준수] alert 대신 모달 사용
        // (프로젝트에 사용 중인 모달 함수명을 사용하세요. 예: showModal, openAlertModal 등)
        showAlert("접근 권한 없음\n귀하는 직원으로 등록되지 않았습니다. 로그아웃 합니다.");

        await _supabase.auth.signOut(); 
        showScreen('loginForm'); 
        return;
    }

    myInfo = data;
    localStorage.setItem('erp_user', JSON.stringify(data));
    permissionSet = await loadPermissions(data);
    localStorage.setItem('erp_permissions', JSON.stringify(Array.from(permissionSet)));

    const elName = document.getElementById('userName');
    const elTeam = document.getElementById('userTeam');
    const elRank = document.getElementById('userRank');

    if (elName) elName.innerText = (data.emp_name || "직원") + " 님";
    if (elTeam) elTeam.innerText = data.department || "-";
    if (elRank) elRank.innerText = data.position || "";

    applyMenuPermissions(data);

    document.getElementById('patchNoteArea')?.classList.remove('hidden');
    await loadNotifications(false);
    showScreen('menuArea');
}

async function loadPermissions(user) {
    const result = new Set();
    if (!user) return result;
    const roleKey = user.role || '';
    const posKey = user.position || '';
    if (!roleKey && !posKey) return result;

    const roleKeys = [roleKey, posKey].filter(Boolean);
    if (roleKey === 'admin_all') roleKeys.push('admin');
    if (roleKey === 'admin') roleKeys.push('admin_all');

    const { data } = await _supabase
        .from('erp_role_permissions')
        .select('permission_key')
        .in('scope', ['role', 'position'])
        .in('role_key', roleKeys)
        .eq('is_enabled', true);

    if (Array.isArray(data)) {
        data.forEach(row => {
            if (row.permission_key) result.add(row.permission_key);
        });
    }
    return result;
}

function hasPermission(key) {
    if (!permissionSet || permissionSet.size === 0) return null; // fallback to legacy rules
    return permissionSet.has(key);
}

function applyMenuPermissions(user) {
    const isAdmin = (user.role === 'admin' || user.role === 'admin_all' || user.position === '국장');
    const isManager = user.role === 'manager' || user.position === '이사';

    const canApproval = hasPermission('approval.view');
    const canMypage = hasPermission('mypage.view');
    const canAccounting = hasPermission('accounting.view');
    const canAdmin = hasPermission('hr.admin');
    const canMemberAdmin = hasPermission('member.admin');
    const canAudit = hasPermission('audit.view');
    const canPerm = hasPermission('permission.manage');

    if (canApproval !== null && !canApproval) document.getElementById('btnApproval')?.classList.add('hidden');
    if (canMypage !== null && !canMypage) document.getElementById('btnMypage')?.classList.add('hidden');

    if (canAccounting === null) {
        if (isAdmin || isManager) document.getElementById('btnAccounting')?.classList.remove('hidden');
    } else if (canAccounting) {
        document.getElementById('btnAccounting')?.classList.remove('hidden');
    }

    if (canAdmin === null) {
        if (isAdmin) document.getElementById('btnAdmin')?.classList.remove('hidden');
    } else if (canAdmin) {
        document.getElementById('btnAdmin')?.classList.remove('hidden');
    }

    if (canMemberAdmin === null) {
        if (isAdmin) document.getElementById('btnMemberAdmin')?.classList.remove('hidden');
    } else if (canMemberAdmin) {
        document.getElementById('btnMemberAdmin')?.classList.remove('hidden');
    }

    if (canAudit !== null && canAudit) document.getElementById('btnAudit')?.classList.remove('hidden');
    if (canPerm !== null && canPerm) document.getElementById('btnPerm')?.classList.remove('hidden');
}

function showScreen(id) {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('menuArea').classList.add('hidden');
    document.getElementById(id).classList.remove('hidden');
}

let alertModalInstance = null;
let confirmModalInstance = null;
let confirmCallback = null;

function initCommonModals() {
    const alertEl = document.getElementById('alertModal');
    const confirmEl = document.getElementById('confirmModal');
    if (alertEl) alertModalInstance = new bootstrap.Modal(alertEl);
    if (confirmEl) confirmModalInstance = new bootstrap.Modal(confirmEl);
    const notifEl = document.getElementById('notifModal');
    if (notifEl) notifModalInstance = new bootstrap.Modal(notifEl);
}

function showAlert(message) {
    const body = document.getElementById('alertBody');
    if (body) body.textContent = message || '';
    if (alertModalInstance) alertModalInstance.show();
}

function showConfirm(message, onConfirm) {
    const body = document.getElementById('confirmBody');
    if (body) body.textContent = message || '';
    confirmCallback = typeof onConfirm === 'function' ? onConfirm : null;
    if (confirmModalInstance) confirmModalInstance.show();
}

function handleConfirm() {
    if (confirmCallback) confirmCallback();
    confirmCallback = null;
    if (confirmModalInstance) confirmModalInstance.hide();
}

async function sendMagicLink() {
    const email = document.getElementById('emailInput').value;
    const btn = document.getElementById('btnSend');
    const msg = document.getElementById('statusMsg');
    if (!email) return showAlert("이메일을 입력해주세요.");
    btn.disabled = true; btn.innerText = "전송 중...";
    const { error } = await _supabase.auth.signInWithOtp({ email: email, options: { emailRedirectTo: REDIRECT_URL } });
    if (error) {
        showAlert("전송 실패: " + error.message);
        btn.disabled = false;
        btn.innerText = "📧 로그인 링크 받기";
    } else {
        btn.classList.add("hidden");
        msg.style.display = "block";
        msg.textContent = "";
        const strong = document.createElement('strong');
        strong.textContent = "📩 전송 완료!";
        msg.appendChild(strong);
        msg.appendChild(document.createElement('br'));
        msg.appendChild(document.createTextNode("메일함 확인해주세요."));
    }
}

async function startKakaoLogin() {
    const nextTarget = `${window.location.origin}/index.html`;
    const redirectUrl = `${window.location.origin}/auth_callback.html?next=${encodeURIComponent(nextTarget)}`;
    localStorage.setItem('auth_destination', nextTarget);

    await _supabase.auth.signInWithOAuth({ 
        provider: 'kakao', 
        options: { 
            redirectTo: redirectUrl,
            scopes: 'account_email phone_number profile_nickname',
            queryParams: {
                access_type: 'offline',
                prompt: 'login'
            }
        } 
    });
}

async function logout() {
    showConfirm("로그아웃 하시겠습니까?", async () => {
        await _supabase.auth.signOut();
        localStorage.removeItem('erp_user');
        localStorage.removeItem('erp_permissions');
        location.reload();
    });
}

async function loadNotifications(openModal) {
    if (!myInfo) return;
    const { data } = await _supabase
        .from('erp_notifications')
        .select('*')
        .eq('user_emp_id', myInfo.emp_id)
        .order('created_at', { ascending: false })
        .limit(20);

    lastNotifList = Array.isArray(data) ? data : [];
    renderNotificationList(lastNotifList);
    updateNotifBadge(lastNotifList);
    if (openModal && notifModalInstance) notifModalInstance.show();
}

function updateNotifBadge(list) {
    const badge = document.getElementById('notifBadge');
    if (!badge) return;
    const unread = list.filter(n => !n.is_read).length;
    if (unread > 0) {
        badge.textContent = String(unread);
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }
}

function renderNotificationList(list) {
    const container = document.getElementById('notifList');
    if (!container) return;
    container.innerHTML = '';
    if (!list || list.length === 0) {
        container.innerHTML = '<div class="p-4 text-center text-muted">알림이 없습니다.</div>';
        return;
    }
    list.forEach(item => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = `list-group-item list-group-item-action ${item.is_read ? '' : 'fw-bold'}`;
        const title = item.title || '알림';
        const msg = item.message || '';
        const time = item.created_at ? item.created_at.slice(0, 16).replace('T', ' ') : '';
        el.textContent = `${title} - ${msg} (${time})`;
        el.onclick = async () => {
            await markNotificationRead(item.id);
            if (item.link_url) location.href = item.link_url;
        };
        container.appendChild(el);
    });
}

async function openNotificationModal() {
    await loadNotifications(true);
}

async function markNotificationRead(id) {
    if (!id) return;
    await _supabase.from('erp_notifications').update({ is_read: true, read_at: new Date() }).eq('id', id);
    const updated = lastNotifList.map(n => (n.id === id ? { ...n, is_read: true } : n));
    lastNotifList = updated;
    renderNotificationList(lastNotifList);
    updateNotifBadge(lastNotifList);
}

async function markAllNotificationsRead() {
    if (!myInfo) return;
    await _supabase.from('erp_notifications')
        .update({ is_read: true, read_at: new Date() })
        .eq('user_emp_id', myInfo.emp_id)
        .eq('is_read', false);
    await loadNotifications(false);
}

document.addEventListener('DOMContentLoaded', initCommonModals);
</script>

<script src="patch_note.js"></script>

</body>
</html>
