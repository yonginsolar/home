<!doctype html>
<!-- 버전: 1.0.0 | 조합 발전소 관리 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>발전소 관리</title>
  <script>window.__COOP_ROUTE_APP__='erp';</script>
  <script src="/shared/route_guard.js?v=20260408-1"></script>
  <script src="/shared/tenant_head.js?v=20260916-1"></script>
  <script src="/erp/workspace_boot.js?v=20261119-coop-plant-1"></script>
  <script src="/erp/workspace_resume.js?v=20261010-9-uimodal-20261013-1"></script>
  <script src="/erp/erp_runtime_guard.js?v=20261009-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <style>
    body{background:var(--erp-page-bg,#f5f7f6);color:var(--erp-text,#202c26);overflow-wrap:anywhere}
    .plant-shell{width:min(70rem,calc(100% - 24px));margin:1rem auto}
    [hidden]{display:none!important}
    .plant-panel{background:var(--erp-card-bg,#fff);border:1px solid var(--erp-border,#d9e6dd);border-radius:1rem;padding:clamp(.75rem,3vw,1.25rem)}
    .plant-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:.6rem}
    .plant-grid>*{min-width:0}
    dialog{border:1px solid var(--erp-border,#d9e6dd);border-radius:1rem;background:var(--erp-card-bg,#fff);color:inherit;max-width:none;max-height:none;width:min(40rem,calc(100% - 24px));height:min(37rem,calc(100dvh - 24px));padding:clamp(.75rem,3vw,1.25rem);box-sizing:border-box;overflow:auto;overscroll-behavior:contain}
    dialog::backdrop{background:#172f27a0}
    button{white-space:normal!important}
  </style>
</head>
<body>
<main class="plant-shell">
  <div class="plant-panel">
    <header class="d-flex gap-2 align-items-center justify-content-between flex-wrap">
      <h1 class="h3 m-0">발전소 관리</h1>
      <a href="/erp/" class="btn btn-sm btn-outline-secondary">ERP 홈</a>
    </header>
    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
      <span id="plantStatus" role="status" aria-live="polite">발전소 관리 권한을 확인하고 있습니다.</span>
      <button id="plantReload" class="btn btn-sm btn-outline-secondary" type="button" hidden>다시 확인</button>
    </div>
  </div>
  <div id="plantAuthorized" hidden>
    <div class="d-flex gap-2 mt-3 flex-wrap" aria-label="발전소 보기">
      <button type="button" class="btn btn-success" data-plant-tab="plants" aria-pressed="true">발전소 기본정보</button>
      <button type="button" class="btn btn-outline-success" data-plant-tab="monitor" aria-pressed="false">모니터링 목록</button>
    </div>
    <section class="plant-panel mt-2" id="coopPlantList" aria-label="발전소 기본정보"><div class="plant-grid" id="coopPlantCards"></div></section>
    <section class="plant-panel mt-2" id="coopMonitorList" aria-label="모니터링 목록" hidden>
      <div class="d-flex gap-2 align-items-center justify-content-between flex-wrap mb-3">
        <h2 class="h5 m-0">모니터링 발전소</h2>
        <button type="button" id="coopMonitorImport" class="btn btn-success" aria-haspopup="dialog" hidden>일괄 가져오기</button>
      </div>
      <div class="plant-grid" id="coopMonitorCards"></div>
    </section>
  </div>
</main>
<dialog id="coopImportDialog" aria-labelledby="coopImportHeading">
  <header class="d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h2 id="coopImportHeading" class="h5 m-0">일괄 가져오기 미리보기</h2>
    <button type="button" class="btn btn-outline-secondary" data-import-close autofocus>닫기</button>
  </header>
  <p class="mt-3" role="status" data-import-status></p>
  <ul class="list-unstyled d-grid gap-2" data-import-rows></ul>
  <div class="d-flex gap-2 flex-wrap">
    <button type="button" class="btn btn-outline-primary" data-import-retry hidden>다시 확인</button>
    <button type="button" class="btn btn-success" data-import-save disabled>가져오기 저장</button>
  </div>
</dialog>
<dialog id="coopPlantFormDialog" aria-labelledby="coopPlantFormHeading">
  <header class="d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h2 id="coopPlantFormHeading" class="h5 m-0">발전소 기본정보 수정</h2>
    <button type="button" class="btn btn-outline-secondary" id="coopPlantClose" autofocus>닫기</button>
  </header>
  <p id="coopPlantFormState" class="mt-2 mb-1" role="status" aria-live="polite"></p>
  <button type="button" id="coopPlantRetry" class="btn btn-sm btn-outline-secondary mb-2" hidden>다시 확인</button>
  <form id="coopPlantForm">
    <fieldset id="coopPlantFields" disabled>
      <div class="row g-2">
        <div class="col-12"><label for="plantName">발전소 이름</label><input class="form-control" id="plantName" name="name" maxlength="120" required></div>
        <div class="col-12 col-sm-6"><label for="plantPhase">상태</label><select class="form-select" id="plantPhase" name="status"><option value="">미입력</option><option value="준비중">준비 중</option><option value="공사중">공사 중</option><option value="운영중">운영 중</option><option value="중단">중단</option></select></div>
        <div class="col-12 col-sm-6"><label for="plantCapacity">용량(kW)</label><input class="form-control" type="number" min="0" step="any" inputmode="decimal" id="plantCapacity" name="capacity"></div>
        <div class="col-12 col-sm-6"><label for="plantProgress">공정률(%)</label><input class="form-control" type="number" min="0" step="1" max="100" id="plantProgress" name="progress" placeholder="미입력"></div>
        <div class="col-12 col-sm-6"><label for="plantDate">준공일</label><input class="form-control" type="date" id="plantDate" name="completion_date"></div>
        <div class="col-12"><label for="plantLocation">공개 위치</label><input class="form-control" id="plantLocation" name="location" maxlength="300"></div>
        <div class="col-12"><label for="plantArea">면적</label><input class="form-control" id="plantArea" name="area" maxlength="120"></div>
        <div class="col-12"><label for="plantNote">공개 설명</label><textarea class="form-control" id="plantNote" name="note" rows="2" maxlength="2000"></textarea></div>
        <div class="col-12"><button type="submit" class="btn btn-success" id="coopPlantSave">저장</button></div>
      </div>
    </fieldset>
  </form>
</dialog>
<script src="/erp/power_monitor_import.js?v=1.0.0" integrity="sha384-/chJd9cvrGCVsSLQnEHYSmZmtmfiFOgQtYOc9dJgLNBx1wgP5rOU8Qq0dQVMkDuJ" crossorigin="anonymous"></script>
<script src="/erp/coop_power_plants.js?v=1.0.0" integrity="sha384-vPlmlbZg3NY5I2QfluapBHuzwD5J2kNGfWEnjtBZHBYXyPJasOyrLHprn+uPJTHz" crossorigin="anonymous"></script>
</body>
</html>
