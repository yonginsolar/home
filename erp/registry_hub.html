  <style>
    #registryHub{max-width:1000px;margin:auto;padding:24px;line-height:1.6;overflow-wrap:anywhere}
    #registryHub header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    #registryHub h1{font-size:1.6rem;margin:0}
    #registryHub .registry-menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    #registryHub .registry-menu-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;min-height:160px;padding:24px;border:1px solid #d7dfe7;border-radius:16px;text-align:left;background:#fff;color:#172536;font:inherit;cursor:pointer}
    #registryHub .registry-menu-card strong{font-size:1.15rem}
    #registryHub .registry-menu-card span{color:#526676}
    #registryHub .registry-menu-card:not(:disabled):hover{border-color:#748ba1;background:#f4f7fa}
    #registryHub .registry-menu-card:disabled{cursor:default;background:#f4f6f8;color:#526676}
    #registryHub :focus-visible{outline:3px solid #2e69b2;outline-offset:3px}
    #registryHub [hidden]{display:none!important}
    @media(max-width:700px){#registryHub{padding:16px}#registryHub header{flex-wrap:wrap}#registryHub .registry-menu-grid{grid-template-columns:1fr}#registryHub .registry-menu-card{min-height:140px;padding:20px}}
  </style>

<body class="erp-unified">
  <main id="registryHub">
    <header><h1>등기·변경신고</h1><a href="/erp/" data-erp-home-link>전체 메뉴</a></header>
    <p id="registryHubStatus" role="status">로그인과 조합 권한을 확인하고 있습니다.</p>
    <div id="registryHubCards" class="registry-menu-grid" hidden>
      <button id="cardCityRegistry" type="button" class="registry-menu-card" data-workspace-submenu>
        <strong>시청 변경신고</strong><span>변경신고서와 첨부 서류 준비</span>
      </button>
      <button id="cardRegistryGuide" type="button" class="registry-menu-card" data-workspace-submenu aria-describedby="registryGuideStatus">
        <strong>변경등기 가이드</strong><span id="registryGuideStatus">유형별 인터넷등기소 작성 순서</span>
      </button>
    </div>
  </main>
  <script>
    (()=>{
      'use strict';
      const status=document.getElementById('registryHubStatus'),cards=document.getElementById('registryHubCards');
      const client=window.supabase.createClient('https://ifdqlwxgqgsvnawmhlfc.supabase.co','sb_publishable_lkVhLJDe8WmOPzsWOMkKdg_pjVwVS-h',{global:{headers:{'x-erp-host':window.CoopRouteGuard?.getErpRuntimeHost(window.location)||window.location.hostname}}});
      document.getElementById('cardCityRegistry').onclick=()=>window.ErpWorkspaceResume.navigate('registry.html');
      document.getElementById('cardRegistryGuide').onclick=()=>window.ErpWorkspaceResume.navigate('registry_guide.html');
      client.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){cards.hidden=true;status.textContent='로그인을 다시 확인해 주세요.';}});
      async function init(){
        const user=await window.ErpRuntimeGuard.requireUser(client,{redirectUrl:'index.html'});if(!user.ok)return;
        const gate=await window.ErpRuntimeGuard.enforce(client,{moduleKey:'member_admin',moduleLabel:'등기·변경신고',redirectUrl:'index.html',alertFn:message=>{status.textContent=message;}});if(!gate.ok)return;
        const runtime=gate.runtime;if(!window.CoopRegistryModel.access(runtime)){status.textContent='현재 권한으로 등기·변경신고를 열 수 없습니다.';return;}
        const coop=runtime.coop_id;cards.hidden=false;status.hidden=true;
        await window.ErpWorkspace?.connect(client,runtime);
        window.ErpWorkspaceResume.register({modules:['member_admin'],authorize:value=>value.coop_id===coop&&window.CoopRegistryModel.access(value),refresh:async()=>{}});
      }
      init().catch(()=>{cards.hidden=true;status.hidden=false;status.textContent='메뉴를 불러오지 못했습니다. 전체 메뉴에서 다시 열어 주세요.';});
    })();
  </script>
</body>
</html>
