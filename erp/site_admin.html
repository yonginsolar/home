<!DOCTYPE html>

<html lang="ko">
<head>
  <script>console.log('[Version] v1.0.2 | site_admin.html');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>홈페이지 관리</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      color: #334155;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    }
    .redirect-card {
      width: min(520px, calc(100% - 32px));
      background: #fff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      padding: 28px 24px;
      text-align: center;
    }
    .redirect-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .redirect-copy {
      font-size: 14px;
      color: #64748b;
      margin: 0;
    }
    .redirect-link {
      display: inline-block;
      margin-top: 14px;
      font-weight: 700;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search || '');
      params.set('scope', 'site_admin');
      if (!params.get('tab')) params.set('tab', 'site');
      window.location.replace('admin_member.html?' + params.toString());
    })();
  </script>
</head>
<body>
  <div class="redirect-card">
    <div class="redirect-title">홈페이지 관리로 이동 중입니다</div>

    </noscript>
  </div>
</body>
</html>
