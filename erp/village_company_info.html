<!doctype html>
<!-- Version: v1.1.0 -->
<html lang="ko">
<head>
<meta name="erp-security-revision" content="20261004.2">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>마을 기본정보</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./erp_theme.css?v=1.1.1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous"></script>
<script src="/shared/checked_upload.js?v=20261004-1"></script>
  <script src="./erp_runtime_guard.js?v=20260919-1"></script>
  <style>
    body{padding:24px;background:#f8fafc;word-break:keep-all}
    .page{max-width:900px;margin:auto}.form-label{font-weight:600}
    .section-title{font-size:1.05rem;font-weight:700;margin:0 0 18px}
    .asset-preview{display:flex;align-items:center;justify-content:center;min-height:130px;padding:14px;border:1px dashed #cbd5e1;border-radius:12px;background:#f8fafc}
    .asset-preview img{display:block;max-width:100%;max-height:110px;object-fit:contain}
    .section-rule{border-top:1px solid #e2e8f0;margin:28px 0}
    @media(max-width:640px){body{padding:14px}.card-body{padding:20px!important}}
  </style>
</head>
<body class="erp-unified erp-pc-workspace">
  <main class="page">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
      <div><h1 class="h3 mb-1">마을 기본정보</h1><p class="text-muted mb-0">조합의 문서와 출자증서에 쓰이는 공식 정보를 관리합니다.</p></div>
      <a href="index.html" class="btn btn-outline-secondary">ERP 메인</a>
    </div>
    <div id="status" class="alert alert-info" role="status">정보를 불러오는 중입니다.</div>
    <form id="companyForm" class="card border-0 shadow-sm d-none">
      <div class="card-body p-4">
        <h2 class="section-title">조합 공식 정보</h2>
        <div class="row g-3">
          <div class="col-md-6"><label for="company_name" class="form-label">조합명</label><input id="company_name" class="form-control" maxlength="120" required></div>
          <div class="col-md-6"><label for="chairman_name" class="form-label">이사장명</label><input id="chairman_name" class="form-control" maxlength="80"></div>
          <div class="col-md-6"><label for="bizNum" class="form-label">사업자등록번호</label><input id="bizNum" class="form-control" maxlength="20" inputmode="numeric"></div>
          <div class="col-12"><label for="company_address" class="form-label">주소</label><input id="company_address" class="form-control" maxlength="300"></div>
          <div class="col-md-6"><label for="company_contact_phone" class="form-label">대표 연락처</label><input id="company_contact_phone" type="tel" class="form-control" maxlength="40"></div>
          <div class="col-md-6"><label for="company_contact_email" class="form-label">대표 이메일</label><input id="company_contact_email" type="email" class="form-control" maxlength="160"></div>
        </div>
        <div class="section-rule"></div>
        <h2 class="section-title">출자 및 납입 안내</h2>
        <div class="row g-3">
          <div class="col-md-6"><label for="member_export_share_unit_amount" class="form-label">출자 1좌 금액</label><div class="input-group"><input id="member_export_share_unit_amount" type="number" inputmode="numeric" min="1" max="1000000000" step="1" class="form-control"><span class="input-group-text">원</span></div><div class="form-text">출자증서·명부의 출자좌수 계산에 사용합니다.</div></div>
          <div class="col-md-6"><label class="form-label">현재 출자좌수</label><div id="shareSummary" class="form-control bg-light" role="status">조회 중</div><div class="form-text">납입이 확인된 조합원의 출자금으로 계산합니다.</div></div>
          <div class="col-md-4"><label for="member_capital_deposit_bank" class="form-label">출자금 납입 은행</label><input id="member_capital_deposit_bank" class="form-control" maxlength="80"></div>
          <div class="col-md-4"><label for="member_capital_deposit_account" class="form-label">출자금 납입 계좌</label><input id="member_capital_deposit_account" class="form-control" maxlength="100"></div>
          <div class="col-md-4"><label for="member_capital_deposit_holder" class="form-label">예금주</label><input id="member_capital_deposit_holder" class="form-control" maxlength="80"></div>
        </div>
        <div class="section-rule"></div>
        <h2 class="section-title">문서 이미지</h2>
        <div class="row g-4 mb-4">
          <div class="col-md-6"><label for="sealFile" class="form-label">조합 직인</label><div class="asset-preview mb-2" id="sealPreview">등록된 직인이 없습니다.</div><input id="sealFile" type="file" accept="image/png,image/jpeg,image/webp" class="form-control"><div class="form-text">출자증서와 공식 문서에 사용합니다. PNG·JPG·WebP, 5MB 이하.</div></div>
          <div class="col-md-6"><label for="logoFile" class="form-label">조합 로고</label><div class="asset-preview mb-2" id="logoPreview">등록된 로고가 없습니다.</div><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" class="form-control"><div class="form-text">출자증서 등 문서의 조합 표시에도 사용합니다. PNG·JPG·WebP, 5MB 이하.</div></div>
        </div>
        <button id="saveButton" type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </main>
  <script>
    const client = window.supabase.createClient('https://ifdqlwxgqgsvnawmhlfc.supabase.co', 'sb_publishable_lkVhLJDe8WmOPzsWOMkKdg_pjVwVS-h', {
      global: { headers: { 'x-erp-host': String(location.hostname || '').trim().toLowerCase() } }
    });
    const statusBox = document.getElementById('status');
    const form = document.getElementById('companyForm');
    const keys = [
      'company_name', 'chairman_name', 'bizNum', 'company_address',
      'company_contact_phone', 'company_contact_email', 'member_export_share_unit_amount',
      'member_capital_deposit_bank', 'member_capital_deposit_account', 'member_capital_deposit_holder'
    ];
    let coopId = null;
    let saving = false;
    let imagePaths = { seal_url: '', logo_horizontal_url: '' };
    let previewObjectUrls = { sealFile: '', logoFile: '' };
    let capitalSummary = null;
    function showStatus(message, kind = 'info') {
      statusBox.className = `alert alert-${kind}`;
      statusBox.textContent = message;
      statusBox.classList.remove('d-none');
    }
    function showImagePreview(previewId, src, emptyLabel) {
      const container = document.getElementById(previewId);
      container.replaceChildren();
      if (!src) {
        container.textContent = emptyLabel;
        return;
      }
      const image = document.createElement('img');
      image.src = src;
      image.alt = previewId === 'sealPreview' ? '현재 조합 직인' : '현재 조합 로고';
      container.appendChild(image);
    }
    function validateImageFile(file) {
      if (!file) return;
      if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type) || file.size > 5 * 1024 * 1024) {
        throw new Error('이미지는 PNG·JPG·WebP 형식으로 5MB 이하만 등록할 수 있습니다.');
      }
    }
    function previewSelectedFile(inputId, previewId, emptyLabel) {
      const input = document.getElementById(inputId);
      const file = input.files?.[0];
      if (previewObjectUrls[inputId]) URL.revokeObjectURL(previewObjectUrls[inputId]);
      previewObjectUrls[inputId] = '';
      try {
        validateImageFile(file);
        if (!file) {
          showImagePreview(previewId, '', emptyLabel);
          return;
        }
        previewObjectUrls[inputId] = URL.createObjectURL(file);
        showImagePreview(previewId, previewObjectUrls[inputId], emptyLabel);
      } catch (error) {
        input.value = '';
        showStatus(error.message, 'warning');
      }
    }
    async function convertToPng(file, maximumWidth) {
      validateImageFile(file);
      const objectUrl = URL.createObjectURL(file);
      try {
        const source = await new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error('이미지를 열 수 없습니다. 다른 파일을 선택해 주세요.'));
          image.src = objectUrl;
        });
        const scale = Math.min(1, maximumWidth / Math.max(source.width, source.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(source.width * scale));
        canvas.height = Math.max(1, Math.round(source.height * scale));
        canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
        return await new Promise((resolve, reject) => {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('이미지 변환에 실패했습니다.')), 'image/png');
        });
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }
    async function uploadImageIfSelected(inputId, prefix, maximumWidth) {
      const file = document.getElementById(inputId).files?.[0];
      if (!file) return '';
      const png = await convertToPng(file, maximumWidth);
      if (png.size > 5 * 1024 * 1024) throw new Error('변환된 이미지가 5MB를 넘습니다. 크기를 줄여 다시 선택해 주세요.');
      const path = `${prefix}/${coopId}/${crypto.randomUUID()}.png`;
      const bucket = inputId === 'sealFile' ? 'attachments' : 'assets';
      const { error } = await client.storage.from(bucket).upload(path, png, {
        contentType: 'image/png', cacheControl: '3600', upsert: false
      });
      if (error) throw error;
      return path;
    }
    async function refreshStoredPreviews() {
      const sealPath = String(imagePaths.seal_url || '').trim();
      if (sealPath) {
        if (/^https:\/\//i.test(sealPath)) {
          showImagePreview('sealPreview', sealPath, '등록된 직인이 없습니다.');
        } else {
          const { data, error } = await client.storage.from('attachments').createSignedUrl(sealPath, 900);
          if (error) throw error;
          showImagePreview('sealPreview', data.signedUrl, '등록된 직인이 없습니다.');
        }
      } else {
        showImagePreview('sealPreview', '', '등록된 직인이 없습니다.');
      }
      const logoPath = String(imagePaths.logo_horizontal_url || '').trim();
      const logoUrl = logoPath
        ? (/^https:\/\//i.test(logoPath) ? logoPath : client.storage.from('assets').getPublicUrl(logoPath).data.publicUrl)
        : '';
      showImagePreview('logoPreview', logoUrl, '등록된 로고가 없습니다.');
    }
    function renderShareSummary() {
      const target = document.getElementById('shareSummary');
      const unit = Number(document.getElementById('member_export_share_unit_amount').value);
      if (!capitalSummary) {
        target.textContent = '출자금 현황을 조회할 수 없습니다.';
        return;
      }
      if (!Number.isSafeInteger(unit) || unit <= 0) {
        target.textContent = '출자 1좌 금액을 입력하면 표시됩니다.';
        return;
      }
      const amount = Number(capitalSummary.paid_capital || 0);
      const shares = amount / unit;
      target.textContent = `${shares.toLocaleString('ko-KR', { maximumFractionDigits: 3 })}좌 · 납입 출자금 ${amount.toLocaleString('ko-KR')}원`;
    }
    async function loadShareSummary() {
      const { data, error } = await client.rpc('sun_village_capital_summary');
      if (error) {
        capitalSummary = null;
      } else {
        capitalSummary = data || { paid_capital: 0 };
      }
      renderShareSummary();
    }
    async function boot() {
      try {
        const userGate = await window.ErpRuntimeGuard.requireUser(client, { redirectUrl: 'index.html', alertFn: showStatus });
        if (!userGate.ok) return;
        const [permissionResult, runtimeGate, workspaceResult, coopResult] = await Promise.all([
          window.ErpRuntimeGuard.getEffectivePermissions(client),
          window.ErpRuntimeGuard.enforce(client, { moduleKey: 'hr', moduleLabel: '마을 기본정보', redirectUrl: 'index.html', alertFn: showStatus }),
          client.rpc('sun_village_workspace_context'),
          client.rpc('get_my_coop_id')
        ]);
        if (!runtimeGate.ok) return;
        if (workspaceResult.error) throw workspaceResult.error;
        if (coopResult.error) throw coopResult.error;
        const current = (workspaceResult.data?.workspaces || []).find(item => item?.is_current === true);
        if (!current || current.is_management_coop !== false || !coopResult.data || String(current.coop_id) !== String(coopResult.data)) {
          location.replace('index.html');
          return;
        }
        if (!permissionResult.includes('hr.admin')) {
          showStatus('마을 기본정보 관리 권한이 없습니다.', 'warning');
          return;
        }
        coopId = String(coopResult.data);
        const { data, error } = await client.from('ref_company_info').select('key,value').eq('coop_id', coopId).in('key', [...keys, 'orgName', 'ceoName', 'address', 'company_contact', 'company_email', 'seal_url', 'logo_horizontal_url']);
        if (error) throw error;
        const info = Object.fromEntries((data || []).map(row => [row.key, row.value || '']));
        for (const key of keys) document.getElementById(key).value = info[key] || '';
        if (!info.company_name) document.getElementById('company_name').value = info.orgName || current.coop_name || '';
        if (!info.chairman_name) document.getElementById('chairman_name').value = info.ceoName || '';
        if (!info.company_address) document.getElementById('company_address').value = info.address || '';
        if (!info.company_contact_phone) document.getElementById('company_contact_phone').value = info.company_contact || '';
        if (!info.company_contact_email) document.getElementById('company_contact_email').value = info.company_email || '';
        imagePaths = { seal_url: info.seal_url || '', logo_horizontal_url: info.logo_horizontal_url || '' };
        await refreshStoredPreviews();
        await loadShareSummary();
        form.classList.remove('d-none');
        statusBox.classList.add('d-none');
      } catch (error) {
        showStatus(`기본정보를 불러오지 못했습니다: ${error?.message || '다시 시도해 주세요.'}`, 'danger');
      }
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (saving || !coopId) return;
      saving = true;
      document.getElementById('saveButton').disabled = true;
      try {
        const values = Object.fromEntries(keys.map(key => [key, document.getElementById(key).value.trim()]));
        if (!values.company_name) throw new Error('조합명을 입력해 주세요.');
        const unit = values.member_export_share_unit_amount;
        if (unit && (!/^\d+$/.test(unit) || Number(unit) < 1 || Number(unit) > 1000000000)) {
          throw new Error('출자 1좌 금액은 1원 이상 10억 원 이하의 정수로 입력해 주세요.');
        }
        const newSealPath = await uploadImageIfSelected('sealFile', 'company-seals', 1200);
        const newLogoPath = await uploadImageIfSelected('logoFile', 'coop-branding', 1600);
        const updates = keys.map(key => ({ coop_id: coopId, key, value: values[key] }));
        updates.push({ coop_id: coopId, key: 'orgName', value: values.company_name });
        updates.push({ coop_id: coopId, key: 'ceoName', value: values.chairman_name });
        updates.push({ coop_id: coopId, key: 'address', value: values.company_address });
        updates.push({ coop_id: coopId, key: 'company_contact', value: values.company_contact_phone });
        updates.push({ coop_id: coopId, key: 'company_email', value: values.company_contact_email });
        if (newSealPath) updates.push({ coop_id: coopId, key: 'seal_url', value: newSealPath });
        if (newLogoPath) updates.push({ coop_id: coopId, key: 'logo_horizontal_url', value: newLogoPath });
        const { error } = await client.from('ref_company_info').upsert(updates, { onConflict: 'coop_id,key' });
        if (error) throw error;
        if (newSealPath) imagePaths.seal_url = newSealPath;
        if (newLogoPath) imagePaths.logo_horizontal_url = newLogoPath;
        document.getElementById('sealFile').value = '';
        document.getElementById('logoFile').value = '';
        try {
          await refreshStoredPreviews();
        } catch (previewError) {
          showStatus(`정보는 저장됐지만 이미지를 다시 표시하지 못했습니다: ${previewError?.message || '화면을 새로고침해 주세요.'}`, 'warning');
          return;
        }
        renderShareSummary();
        showStatus('마을 기본정보를 저장했습니다.', 'success');
      } catch (error) {
        showStatus(`저장하지 못했습니다: ${error?.message || '다시 시도해 주세요.'}`, 'danger');
      } finally {
        saving = false;
        document.getElementById('saveButton').disabled = false;
      }
    });
    document.getElementById('sealFile').addEventListener('change', () => previewSelectedFile('sealFile', 'sealPreview', '등록된 직인이 없습니다.'));
    document.getElementById('logoFile').addEventListener('change', () => previewSelectedFile('logoFile', 'logoPreview', '등록된 로고가 없습니다.'));
    document.getElementById('member_export_share_unit_amount').addEventListener('input', renderShareSummary);
    boot();
  </script>
</body>
</html>
