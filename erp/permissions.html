  (function enforceErpPathPrefix() {
    var host = String(window.location.hostname || '').trim().toLowerCase().replace(/\.$/, '');
    if (/^erp\./.test(host)) return;
    var path = String(window.location.pathname || '');
    if (path === '/erp' || path === '/erp/' || path.indexOf('/erp/') === 0) return;
    var targetPath = (path === '/' || path === '/index' || path === '/index.html')
      ? '/erp/'
      : '/erp' + (path.charAt(0) === '/' ? path : '/' + path);
    var target = window.location.origin + targetPath + String(window.location.search || '') + String(window.location.hash || '');
    if (target !== window.location.href) {
      window.location.replace(target);
    }
  })();
</script>

<main class="main-container"><h1 class="h4 mb-4">업무 권한 관리</h1><div id="permissionSettingsRoot"></div></main>
<script>
const client=window.supabase.createClient('https://ifdqlwxgqgsvnawmhlfc.supabase.co','sb_publishable_lkVhLJDe8WmOPzsWOMkKdg_pjVwVS-h',{global:{headers:{'x-erp-host':window.CoopRouteGuard?.getErpRuntimeHost(location)||location.hostname}}});
let permissionController,permissionOwner='';
window.onload=async()=>{
 try {
  const gate=await ErpRuntimeGuard.requireUser(client,{alertFn:CoopDialog.alert,redirectUrl:'index.html'});if(!gate.ok)return;
  const allowed=await ErpRuntimeGuard.enforce(client,{moduleKey:'permission',moduleLabel:'권한 관리',alertFn:CoopDialog.alert,redirectUrl:'index.html'});if(!allowed.ok)return;
  if(allowed.runtime?.runtime_profile==='workforce_lite'){await CoopDialog.alert('현재 조합 구성에서는 권한 관리 화면을 사용하지 않습니다.');return;}
  permissionOwner=(gate.authUser?.id||'')+':'+allowed.runtime.coop_id;
  permissionController=ERPPermissionSettings.mount(client,document.getElementById('permissionSettingsRoot'),{owner:()=>permissionOwner});
  await permissionController.read();
  client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(session?.user?.id&&session.user.id!==gate.authUser?.id)){permissionOwner='';permissionController.invalidate();}});
  ErpWorkspaceResume.register({modules:['permission'],busy:permissionController.busy,refresh:()=>permissionController.read(true)});
 }catch(_){await CoopDialog.alert('권한 관리 화면을 불러오지 못했습니다. 다시 시도해 주세요.');}
};
</script></body></html>
