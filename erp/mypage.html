const _supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KST_TZ_MYPAGE='Asia/Seoul';
const formatMypageKstDate=(value,fallback='')=>{if(!value) return fallback; const d=new Date(value); if(Number.isNaN(d.getTime())) return fallback; return new Intl.DateTimeFormat('sv-SE',{timeZone:KST_TZ_MYPAGE,year:'numeric',month:'2-digit',day:'2-digit'}).format(d)};
const formatMypageKstMonth=(value=new Date())=>{const d=value instanceof Date?value:new Date(value); if(Number.isNaN(d.getTime())) return ''; return new Intl.DateTimeFormat('sv-SE',{timeZone:KST_TZ_MYPAGE,year:'numeric',month:'2-digit'}).format(d)};
const toUtcIsoFromKstInput=(value)=>{if(!value) return null; return new Date(`${value}:00+09:00`).toISOString()};
const getMypageKstDateParts=(value)=>{if(!value) return {date:'',time:'',hasTime:false}; if(typeof value==='string' && !value.includes('T')) return {date:value,time:'',hasTime:false}; const d=new Date(value); if(Number.isNaN(d.getTime())) return {date:'',time:'',hasTime:false}; const date=new Intl.DateTimeFormat('sv-SE',{timeZone:KST_TZ_MYPAGE,year:'numeric',month:'2-digit',day:'2-digit'}).format(d); const time=new Intl.DateTimeFormat('sv-SE',{timeZone:KST_TZ_MYPAGE,hour:'2-digit',minute:'2-digit',hour12:false}).format(d); return {date,time,hasTime:true}};
function escapeHtml(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');}
let myInfo={},companyInfo={},currentSalaryData=null,tempEmergencyList=[],noticesData=[];

let purposeModal,leaveDetailModal,noticeDetailModal,alertModal,eventModal;

purposeModal=new bootstrap.Modal(document.getElementById('certPurposeModal'));

function showAlert(m){document.getElementById("alertBody").textContent=m||"";alertModal.show()}
function autoHyphen(t){t.value=t.value.replace(/[^0-9]/g,'').replace(/^(\d{0,3})(\d{0,4})(\d{0,4})$/g,"$1-$2-$3").replace(/(\-{1,2})$/g,"")}
function openAddressSearch(){new daum.Postcode({oncomplete:function(d){let a=d.userSelectedType==='R'?d.roadAddress:d.jibunAddress;if(d.buildingName)a+=' ('+d.buildingName+')';document.getElementById("myAddress").value=a}}).open()}
async function loadPermissions(user) {
    const result = new Set();
    if (!user) return result;
    const roleKey = user.role || '';
    const posKey = user.position || '';
    if (!roleKey && !posKey) return result;

    const roleKeys = [roleKey, posKey].filter(Boolean);
    if (roleKey === 'admin_all') roleKeys.push('admin');
    if (roleKey === 'admin') roleKeys.push('admin_all');
    const { data } = await _supabase
        .from('erp_role_permissions')
        .select('permission_key')
        .in('scope', ['role', 'position'])
        .in('role_key', roleKeys)
        .eq('is_enabled', true);
    if (Array.isArray(data)) {
        data.forEach(row => {
            if (row.permission_key) result.add(row.permission_key);
        });
    }
    return result;
}
async function loadCompanyInfo(){const{data}=await _supabase.from('ref_company_info').select('*');if(data)data.forEach(i=>companyInfo[i.key]=i.value);companyInfo.chairman=companyInfo.ceoName||"이사장";if(companyInfo.logo_horizontal_url&&!companyInfo.logo_horizontal_url.startsWith('http')){const{data:d}=_supabase.storage.from('assets').getPublicUrl(companyInfo.logo_horizontal_url);companyInfo.logo_horizontal_url=d.publicUrl}if(companyInfo.seal_url){let p=companyInfo.seal_url.startsWith('http')?companyInfo.seal_url.split('/').pop():companyInfo.seal_url;const{data:d}=await _supabase.storage.from('attachments').createSignedUrl(p,3600);if(d)companyInfo.seal_url=d.signedUrl}}
async function loadProfile() {
    const { data } = await _supabase.from('ref_employees').select('*').eq('emp_id', myInfo.emp_id).single();
    if (data) {
        myInfo = data;
        localStorage.setItem('erp_user', JSON.stringify(data));
    }
    
    // 표시 전용 텍스트
    document.getElementById("dspName").innerText = myInfo.emp_name;
    document.getElementById("dspRank").innerText = myInfo.position;
    document.getElementById("dspDept").innerText = myInfo.department;
    document.getElementById("dspJoin").innerText = myInfo.hire_date || '-';
    
    // 입력 폼 값 채우기
    document.getElementById("myName").value = myInfo.emp_name;
    document.getElementById("myMemberId").value = myInfo.member_id || ""; // [추가]
    document.getElementById("myDependents").value = myInfo.dependents || 0;
    document.getElementById("myPhone").value = myInfo.phone || "";
    document.getElementById("myEmail").value = myInfo.email || "";
    document.getElementById("myAddress").value = myInfo.address || "";
    document.getElementById("myBank").value = myInfo.bank_name || "";
    document.getElementById("myAccount").value = myInfo.account_number || "";

    // 계약서 버튼 처리
    const btn = document.getElementById("btnContract");
    if (myInfo.contract_url) {
        let u = myInfo.contract_url.startsWith('http') ? myInfo.contract_url : null;
        if (!u) {
            const { data: d } = await _supabase.storage.from('contracts').createSignedUrl(myInfo.contract_url, 3600);
            if (d) u = d.signedUrl;
        }

        tenureStr = `${myInfo.hire_date} ~ 현재 (${y}년 ${m}개월)`;
    }

    // [핵심 변경] 클라이언트 계산 로직 삭제 -> DB RPC 함수 호출
    // DB가 알아서 번호 따고, 저장까지 하고, 결과를 리턴해줍니다.
    const { data: newCert, error } = await _supabase.rpc('issue_certificate', {
        p_emp_id: myInfo.emp_id,
        p_emp_name: myInfo.emp_name,
        p_purpose: purpose,
        p_type: '재직증명서'
    });

    if (error) {
        console.error(error);
        return showAlert("발급 중 오류 발생: " + error.message);
    }

    // 4. 인쇄 데이터 준비 (DB에서 받은 cert_num 사용)
    const certData = {
        docNum: newCert.cert_num, // DB가 생성한 안전한 번호
        logo: companyInfo.logo_horizontal_url || "",
        name: myInfo.emp_name,
        birth: birthStr,
        dept: myInfo.department || "-",
        pos: myInfo.position || "-",
        address: myInfo.address || "-",
        tenure: tenureStr,
        purpose: purpose,
        today: dateStr,
        chairman: companyInfo.chairman || "이사장",
        compName: companyInfo.company_name || "용인모두의햇빛협동조합",
        compAddr: (companyInfo.company_address || "").replace(/용인모두의\s?햇빛협동조합/g, '').trim(),
        contact: companyInfo.company_contact || "",
        seal: companyInfo.seal_url
    };

    // 모듈 호출
    PrintService.printCert(certData);
}
  // [공통] 입력 시 자동 하이픈 추가 (2025-24-0002 형식)
function autoHyphenMemberId(target) {
    let val = target.value.replace(/[^0-9]/g, ''); // 숫자만 추출
    
    // 길이 제한 (최대 10자리 숫자)
    if (val.length > 10) val = val.substring(0, 10);

    // 포맷팅
    if (val.length > 6) {
        val = val.replace(/(\d{4})(\d{2})(\d{1,4})/, '$1-$2-$3');
    } else if (val.length > 4) {
        val = val.replace(/(\d{4})(\d{1,2})/, '$1-$2');
    }
    
    target.value = val;
}
