<body class="erp-unified">
  <main class="main-card">
    <h1>회원 엑셀 등록</h1>
    <p id="uploadTarget">등록 대상을 확인하고 있습니다…</p>
    <p>엑셀의 <strong>조합원</strong> 시트를 사용해 주세요. 유형과 이름·단체명은 필수이며, 이메일·법인등록번호 등 나머지 항목은 비워 둘 수 있습니다.</p>
    <p>파일을 선택하면 먼저 검토 목록이 열립니다. 확인할 행은 남겨두고 등록 가능한 행부터 등록할 수 있습니다.</p>
    <p>개인끼리 중복된 이메일은 이번 등록에서 비워 둡니다. 단체와 같은 이메일의 개인이 한 명으로 확인되면 그 개인을 단체 관리자로 연결하고, 단체의 별도 이메일은 비워 둡니다. 적용 내용은 검토 목록에서 확인해 주세요.</p>
    <p id="uploadStatus" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="openUpload" type="button" class="btn btn-primary" disabled>엑셀 선택·검토</button>
      <button id="retryContext" type="button" class="btn btn-outline-primary">접근 다시 확인</button>
      <a class="btn btn-outline-secondary" href="/erp/" target="_blank" rel="noopener">용인 ERP 로그인</a>
    </div>
  </main>
</body>
</html>
