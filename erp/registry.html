<body class="erp-unified"><main id="registryApp"><header><div><p class="eyebrow">등기 업무</p><h1>시청 변경신고 서류 준비</h1></div><a href="/erp/" data-erp-home-link>ERP 메뉴</a></header>
<div id="pageStatus" role="status" aria-live="polite">로그인과 조합 권한을 확인하고 있습니다.</div><button id="retryAccess" type="button" hidden>접근 다시 확인</button>
<form id="registryForm" hidden autocomplete="off"><section><h2>1. 신고 기준</h2><div class="grid"><label>신고연도<input id="reportYear" type="number" min="1901" max="9999" step="1" data-erp-query-control></label><label>작성일<input id="printDate" type="date"></label><label>대상 기간<input id="targetPeriod" readonly></label><label>기말 기준일<input id="fiscalEnd" type="date" readonly></label></div><div id="changeKinds" class="choices"></div><p id="deadlineStatus"></p></section>
<section><h2>2. 신고인</h2><label>신고인 구분<select id="applicantType"><option value="person">개인</option><option value="corporation">법인</option></select></label><label>ERP 직원<select id="applicantEmployee"><option value="">선택하지 않음 · 직접 입력</option></select></label><button id="loadApplicant" type="button">직원 목록 불러오기</button><div class="grid" id="applicantFields"></div><p id="applicantStatus" role="status"></p></section>
<section><h2>3. ERP 등록정보</h2><button id="loadBasics" type="button">ERP 정보 불러오기</button><p id="basicStatus" role="status"></p><div class="grid" id="commonFields"></div><p id="chairIdentity" hidden></p></section>
<section id="changeSection"><h2>4. 변경 전·후</h2><button id="loadSources" type="button">ERP 변경 이력 불러오기</button><p id="sourceStatus" role="status"></p><div class="grid" id="sourceFields"></div><div class="grid" id="officialSources"></div><div id="changeFields"></div><div class="choices"><label><input id="resolutionRequired" type="checkbox">총회 의결이 필요한 변경</label><label><input id="businessAccountingChanged" type="checkbox">사업 범위·회계 사항 변경</label></div></section>
<section id="capitalSection"><h2>출자금·조합원 수</h2><label>법인등록번호<input id="outputCorporateNumber" type="text" inputmode="numeric" maxlength="14" autocomplete="off" spellcheck="false" placeholder="000000-0000000" aria-describedby="outputCorporateStatus"></label><p id="outputCorporateStatus" role="status"></p><div class="grid"><label>1좌 금액<input id="unit" inputmode="numeric" placeholder="ERP 설정 조회 전"></label><label>변경 전 기준일<input id="beforeDate" type="date" readonly></label><label>변경 전 기준 명칭<select id="beforeLabel"><option>전년도 말</option><option>직전 신고</option><option>설립 당시 최초 출자</option></select></label></div>
<label><input id="unitReduced" type="checkbox">출자 1좌 금액 감소</label><label id="manualMembersOption" hidden><input id="manualMembers" type="checkbox">확인한 조합원 수 직접 입력</label><fieldset><legend>과거 신고 인원</legend><label><span id="reportedYearLabel">기말 신고 인원</span><input id="reportedMembersInput" type="text" inputmode="numeric" maxlength="10" autocomplete="off"></label><div class="actions"><button id="saveReportedMembers" type="button" disabled>신고 인원 저장</button><button id="checkReportedMembers" type="button">다시 확인</button></div><p id="reportedMembersStatus" role="status"></p><p id="reportedComparisonStatus" role="status"></p></fieldset><h3>신고 인원·출자금</h3><div id="capitalFields"></div><div class="actions"><button id="saveRegistryValues" type="button" disabled>수정값 저장</button><button id="checkRegistryValues" type="button">수정값 다시 확인</button><button id="resetRegistryValues" type="button" disabled>이번 수정값 비우기</button></div><p id="registryValuesStatus" role="status"></p><div class="actions"><button type="button" id="loadCapital">ERP 출자금·인원 조회</button></div><p id="capitalStatus" role="status"></p><p id="membershipStatus" role="status"></p><p id="activityStatus" role="status"></p><p id="reportedMembershipNote" hidden></p>
<a id="rosterLink" href="admin_member.html?scope=member_admin&amp;tab=dashboard">시청 제출용 조합원 명부</a><p id="rosterHint"></p>
</section>
<section><h2>5. 첨부 서류</h2><div id="attachmentList"></div><p><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lspttninfSeq=131903" target="_blank" rel="noopener noreferrer">현행 시행규칙 제6조</a> · <a href="https://www.law.go.kr/lsLinkCommonInfo.do?lspttninfSeq=200529" target="_blank" rel="noopener noreferrer">시행령 제7조</a> · <a href="registry-assets/change-report-20260624.pdf" target="_blank" rel="noopener noreferrer">공식 별지 제7호 원본</a></p></section>
<section><h2>6. 미리보기</h2><div class="actions"><button id="preview" type="button">미리보기</button><button id="download" type="button" disabled>PDF 저장</button><button id="print" type="button" disabled>전체 인쇄</button><button id="discard" type="button">초안 버리기</button></div><div id="reviewStatus" role="status"></div><iframe id="pdfPreview" title="변경신고서와 별지 미리보기" hidden></iframe><p id="printHint" hidden></p></section></form></main>
<dialog id="secureOutputDialog" aria-labelledby="secureOutputTitle"><form id="secureOutputForm" autocomplete="off"><h2 id="secureOutputTitle">출력용 개인정보 확인</h2><p>기존 보안명부 PIN을 입력해 주세요.</p><label for="securePin">보안명부 PIN</label><input id="securePin" type="password" inputmode="numeric" maxlength="64" autocomplete="off"><div class="actions"><button id="cancelSecureOutput" type="button">취소</button><button type="submit">준비</button></div></form></dialog></body></html>
