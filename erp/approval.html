const formatApprovalKstDateISO = (value, fallback = '') => {
    if (!value) return fallback;
    const d = value instanceof Date ? value : new Date(value);
    if (Number.isNaN(d.getTime())) return fallback;
    return new Intl.DateTimeFormat('sv-SE', { timeZone: KST_TZ_APPROVAL, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);

};

function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

const ATTACHMENT_RULES = {
    maxSizeMB: 10,
    allowedExt: ['pdf', 'png', 'jpg', 'jpeg']
};

function validateAttachments(fileList) {
    if (!fileList || fileList.length === 0) return { ok: true };
    const maxBytes = ATTACHMENT_RULES.maxSizeMB * 1024 * 1024;
    for (const file of fileList) {
        const name = file.name || '';
        const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
        if (ATTACHMENT_RULES.allowedExt.length && !ATTACHMENT_RULES.allowedExt.includes(ext)) {
            return { ok: false, message: `허용되지 않는 파일 형식입니다: ${name}` };
        }
        if (file.size > maxBytes) {
            return { ok: false, message: `파일 용량이 너무 큽니다 (최대 ${ATTACHMENT_RULES.maxSizeMB}MB): ${name}` };
        }
    }
    return { ok: true };
}

};

async function loadPermissions(user) {
    const result = new Set();
    if (!user) return result;
    const roleKey = user.role || '';
    const posKey = user.position || '';
    if (!roleKey && !posKey) return result;

    const roleKeys = [roleKey, posKey].filter(Boolean);
    if (roleKey === 'admin_all') roleKeys.push('admin');
    if (roleKey === 'admin') roleKeys.push('admin_all');

    const { data } = await _supabase
        .from('erp_role_permissions')
        .select('permission_key')
        .in('scope', ['role', 'position'])
        .in('role_key', roleKeys)
        .eq('is_enabled', true);

    if (Array.isArray(data)) {
        data.forEach(row => {
            if (row.permission_key) result.add(row.permission_key);
        });
    }
    return result;
}

function canPerform(permissionKey) {
    if (!permissionKey) return true;
    if (!permissionSet || permissionSet.size === 0) return true;
    return permissionSet.has(permissionKey);
}

// [추가] 대리 상신 모드 토글
function toggleProxyMode() {
    const isProxy = document.getElementById("chkProxy").checked;
    const targetDiv = document.getElementById("divProxyTarget");
    const targetSel = document.getElementById("proxyTargetSelect");
    
    if (isProxy) {
        const myLevel = myInfo.auth_level || 99;
        // 하급자 필터링: 나보다 숫자 큰 사람
        const subordinates = allUsers.filter(u => {
            if ((myInfo.role === 'admin' || myInfo.role === 'admin_all') || myLevel === 1) return u.auth_level > myLevel; 
            return u.department === myInfo.department && u.auth_level > myLevel;
        });

        targetSel.innerHTML = "";
    if (subordinates.length === 0) {
        showAlert("대리 상신 가능한 하급자가 없습니다.");
        document.getElementById("chkProxy").checked = false;
        return;
    }
        subordinates.forEach(u => {
            const opt = document.createElement("option");
            opt.value = u.emp_id;
            opt.textContent = `${u.emp_name} (${u.position})`;
            targetSel.appendChild(opt);
        });
        targetDiv.classList.remove("hidden");
    } else {
        targetDiv.classList.add("hidden");
    }
    calculateLeave(); // 대상자가 바뀌었으니 연차 다시 조회
}

// [수정] 연차 계산 (대리 상신 대상자 지원)
async function calculateLeave() {
    let targetId = myInfo.emp_id;
    // 대리상신 모드면 선택된 대상자의 연차 조회
    if (document.getElementById("chkProxy") && document.getElementById("chkProxy").checked) {
        targetId = document.getElementById("proxyTargetSelect").value;
    }

    const { data: remain } = await _supabase.rpc('calculate_leave_days', { p_emp_id: targetId });
    const val = (remain !== null) ? remain : "0";
    
    document.getElementById("remainDaysBadge").innerText = val;
    // 반차용 뱃지에도 값 넣기
    const halfBadge = document.getElementById("remainDaysBadgeHalf");
    if(halfBadge) halfBadge.innerText = val;
}

    }

}

// [수정] 휴가일수 계산 (반차 0.5일 고정)
function calcLeaveDays() {
    const lType = document.getElementById("leaveTypeSelect").value;

    // 반차 로직
    if(lType === '반차' || lType === '생일반차') {
        const d = document.getElementById("halfDate").value;
        if(d) {
            document.getElementById("leaveDaysBadge").innerText = "0.5일";
            document.getElementById("leaveDaysCalc").value = 0.5;
            
            // 잔여 연차 비교 (연차 차감 대상인 '반차'만)
            if(lType === '반차') {
                const remain = Number(document.getElementById("remainDaysBadge").innerText);
                const msg = document.getElementById("leaveOverMsg");
                if(0.5 > remain) msg.classList.remove("hidden"); else msg.classList.add("hidden");
            }
        }
        return;
    }

    // 일반 기간 로직
    const s = document.getElementById("leaveStart").value;
    const e = document.getElementById("leaveEnd").value;
    if (!s || !e) return;

    let count = 0;
    let cur = new Date(s);
    const end = new Date(e);
    while (cur <= end) {
        const day = cur.getDay();
        if (day !== 0 && day !== 6) count++;
        cur.setDate(cur.getDate() + 1);
    }
    
    document.getElementById("leaveDaysBadge").innerText = count + "일";
    document.getElementById("leaveDaysCalc").value = count;
    
    // 잔여 연차 비교 (연차만)
    if(lType === '연차') {
        const remain = Number(document.getElementById("remainDaysBadge").innerText);
        const msg = document.getElementById("leaveOverMsg");
        if(count > remain) msg.classList.remove("hidden"); else msg.classList.add("hidden");
    }
}

// [기능] 직원 선택 모달 (필터 적용)
function openUserModal(type) {
    modalType = type;
    document.getElementById("modalTitle").innerText = (type === 'approver') ? "결재자 선택" : "참조자 선택";
    tempSelection = (type === 'approver') ? [...finalApprovers] : [...finalRefs];
    renderUserList();
    modalInstance.show();
}

function renderUserList() {
    const listEl = document.getElementById("userSelectList");
    listEl.innerHTML = "";
    
    // 나보다 직급 낮은 사람 제외, 본인 제외
    const myLevel = myInfo.auth_level || 99;
    let targets = allUsers.filter(u => u.emp_id !== myInfo.emp_id);
    
    if (modalType === 'approver') {
        // [수정] 상향식 필터링: 나보다 높은 사람(숫자가 작은 사람)만 표시
        // 이미 선택된 사람이 있다면, 그 사람보다 더 높은 사람만 표시
        const currentHighestLevel = (tempSelection.length > 0) 
            ? Math.min(...tempSelection.map(u => u.auth_level)) 
            : myLevel;
            
        targets = targets.filter(u => u.auth_level < currentHighestLevel);
    } else {
        targets = targets.filter(u => !finalApprovers.some(a => a.emp_id === u.emp_id));
    }

    if(targets.length === 0) { listEl.innerHTML = '<div class="p-3 text-center text-muted">선택 가능한 대상이 없습니다.</div>'; return; }

    targets.forEach(u => {
        const isSelected = tempSelection.some(s => s.emp_id === u.emp_id);
        const a = document.createElement("a");
        a.className = `list-group-item list-group-item-action user-select-item d-flex justify-content-between ${isSelected ? 'active' : ''}`;
        const left = document.createElement("div");
        const badge = document.createElement("span");
        badge.className = "badge bg-secondary me-2";
        badge.textContent = u.position || '';
        left.appendChild(badge);
        left.appendChild(document.createTextNode(u.emp_name || ''));
        const small = document.createElement("small");
        small.className = "text-muted";
        small.textContent = `(${u.department || '-'})`;
        left.appendChild(document.createTextNode(" "));
        left.appendChild(small);
        a.appendChild(left);
        if (isSelected) {
            const mark = document.createElement("span");
            mark.textContent = "✅";
            a.appendChild(mark);
        }
        a.onclick = () => toggleSelect(u);
        listEl.appendChild(a);
    });
    document.getElementById("selCount").innerText = tempSelection.length;
}

function toggleSelect(user) {
    const idx = tempSelection.findIndex(s => s.emp_id === user.emp_id);
    if (idx > -1) tempSelection.splice(idx, 1); else tempSelection.push(user);
    renderUserList();
}

// [신규] 문서번호 자동 생성 (제YYYY-NNN호)
async function generateDocNo() {
    const year = new Date().getFullYear();
    const prefix = `제${year}-`;

    const { data } = await _supabase
        .from('ref_approval')
        .select('doc_no')
        .like('doc_no', `${prefix}%`)
        .not('doc_no', 'is', null)
        .order('doc_no', { ascending: false })
        .limit(1);

    let nextSeq = 1;
    if (data && data.length > 0 && data[0].doc_no) {
        const m = String(data[0].doc_no).match(/제\d{4}-(\d{3})호/);
        if (m) nextSeq = parseInt(m[1], 10) + 1;
    } else if (year === 2026) {
        // 2026년은 001 이미 사용됨 (요청 반영: 002부터 시작)
        nextSeq = 2;
    }

    const seq = String(nextSeq).padStart(3, '0');
    return `${prefix}${seq}호`;
}


function buildNoticeContentFromApproval(doc) {
    const lines = [];
    if (doc?.doc_no) lines.push(`문서번호: ${doc.doc_no}`);
    if (doc?.receiver) lines.push(`수신: ${doc.receiver}`);
    if (doc?.via) lines.push(`경유: ${doc.via}`);
    if (doc?.title) lines.push(`제목: ${doc.title}`);
    lines.push('');
    if (doc?.content) lines.push(doc.content);
    return lines.join('\n');
}

async function createNoticeDraftFromApproval(doc) {
    if (!doc || doc.doc_type !== '공문') return;
    const payload = {
        p_id: null,
        p_title: doc.title || '공문',
        p_content: buildNoticeContentFromApproval(doc),
        p_category: '공문',
        p_status: 'draft',
        p_is_popup: false,
        p_file_url: null,
        p_doc_no: doc.doc_no || null,
        p_file_urls: null,
        p_file_names: null,
        p_source_approval_id: doc.id
    };
    const { error } = await _supabase.rpc('upsert_notice_secure', payload);
    if (error) console.error('공지 초안 생성 실패:', error);
}

// [수정] 상신 (대리상신, 자동정렬, 상태값 처리 포함)
async function handleDraftSubmit(e) {
    e.preventDefault();
    if (finalApprovers.length === 0) return showAlert("결재선을 지정해주세요.");
    if (!canPerform('approval.submit')) return showAlert("상신 권한이 없습니다.");

    const mainType = document.getElementById("appCategory").value;
    let subType = mainType; 
    let finalAmt = document.getElementById("appAmount").value || 0;
    let title = "";
    let receiver = null;
    let via = null;
    
    // 대리 상신 여부
    const isProxy = document.getElementById("chkProxy").checked;
    let drafterId = myInfo.emp_id;
    let drafterName = myInfo.emp_name;
    let initialStatus = '진행중';
    let appendDesc = "";
    
    if (isProxy) {
        const targetSel = document.getElementById("proxyTargetSelect");
        if(!targetSel.value) return showAlert("기안 대상자를 선택하세요.");
        drafterId = targetSel.value;
        // 옵션 텍스트에서 이름만 추출 ("홍길동 (사원)" -> "홍길동")
        drafterName = targetSel.options[targetSel.selectedIndex].text.split(' ')[0];
        initialStatus = '가승인'; // 대리 상신은 가승인 상태
        appendDesc = `\n\n[시스템 기록] ${formatApprovalKstDateLocale(new Date())} ${myInfo.emp_name}에 의한 대리 상신`;
    }

    // 1. 문서 타입 및 값 정리
    if (mainType === '휴가') {
        const lType = document.getElementById("leaveTypeSelect").value;
        subType = `휴가(${lType})`; // 예: "휴가(연차)"
        
        const days = Number(document.getElementById("leaveDaysCalc").value);
        if(days <= 0) return showAlert("기간을 선택하세요.");
        
        // 잔여량 체크 (연차, 반차만 해당. 대리상신이어도 체크는 해야 함)
        if (lType === '연차' || lType === '반차') {
            const remain = Number(document.getElementById("remainDaysBadge").innerText);
            if(days > remain) return showAlert("잔여 연차가 부족합니다.");
        }
        finalAmt = days;
        title = `${lType} 신청`;
    } 
    else if (mainType === '부양가족') {
        const mode = document.querySelector('input[name="depOption"]:checked').value; // add or remove
        const modeTxt = mode === 'add' ? '등재' : '해제';
        subType = `부양가족(${mode})`;
        
        // 대리 상신이 아닐 때만 파일 필수
        if(!isProxy && document.getElementById("attachFile").files.length === 0) return showAlert("증빙서류 필수입니다.");
        
        if (mode === 'remove') finalAmt = -Math.abs(finalAmt);
        title = `부양가족 ${modeTxt} 신청`;
    }

    else if (mainType === '공문') {
        const subject = document.getElementById("noticeSubject").value.trim();
        if (!subject) return showAlert("공문 제목을 입력하세요.");
        receiver = document.getElementById("noticeReceiver").value.trim();
        via = document.getElementById("noticeVia").value.trim();
        title = subject;
        subType = '공문';
        finalAmt = 0;
    }
    else {
        title = `${mainType}`;
    }
    
    // 증빙 필수 체크 (경조사, 병가) - 대리상신 제외
    if (mainType === '휴가') {
        const lType = document.getElementById("leaveTypeSelect").value;
        if ((lType==='경조사' || lType==='병가') && !isProxy) {
            if(document.getElementById("attachFile").files.length === 0) return showAlert("증빙서류 필수입니다.");
        }
    }

    // 첨부파일 형식/용량 검증
    const fileInput = document.getElementById("attachFile");
    const validation = validateAttachments(fileInput.files);
    if (!validation.ok) return showAlert(validation.message);

    // 2. [자동 정렬] 결재선: 직급 역순 (하급자 -> 상급자)
    // auth_level 숫자가 큰 사람(9) -> 작은 사람(1)
    finalApprovers.sort((a, b) => b.auth_level - a.auth_level);

    const btn = document.getElementById("btnSubmit");
    btn.disabled = true; btn.innerText = "처리 중...";

    // 3. 파일 업로드
    const uploadedUrls = [];
    for (let i = 0; i < fileInput.files.length; i++) {
        const file = fileInput.files[i];
        const safeName = `${crypto.randomUUID()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
        const { data, error } = await _supabase.storage.from('attachments').upload(safeName, file);
        if (error) { showAlert("파일 오류: "+error.message); btn.disabled=false; return; }
        const { data: { publicUrl } } = _supabase.storage.from('attachments').getPublicUrl(safeName);
        uploadedUrls.push(publicUrl);
    }

    const relatedDocId = document.getElementById("relDocId").value || null;

    // 4. DB 저장
    const approvalLineData = finalApprovers.map(u => ({ emp_id: u.emp_id, name: u.emp_name, position: u.position, status: '대기', comment: '', processed_at: null }));
    const refData = finalRefs.map(u => ({ emp_id: u.emp_id, name: u.emp_name }));
    const docNo = await generateDocNo();

    const { data: insertedDoc, error } = await _supabase.from('ref_approval').insert({
        doc_type: subType, 
        title: title,
        content: document.getElementById("appDesc").value + appendDesc, // 시스템 기록 추가
        amount: Number(finalAmt),
        drafter_id: drafterId,
        drafter_name: drafterName,
        approval_line: approvalLineData,
        ref_line: refData, 
        file_links: uploadedUrls, 
        current_approver: finalApprovers[0].emp_id,
        status: initialStatus, // 가승인 or 진행중
        related_doc_id: relatedDocId, // [New]
        receiver: receiver || null,
        via: via || null,
        doc_no: docNo,
        created_at: new Date()
    }).select('id').single();

    if (error) { showAlert("상신 실패: " + error.message); btn.disabled = false; }
    else {
        const docId = insertedDoc?.id;
        if (docId) {
            await logAudit('approval.submit', docId, `${title} 상신`, { status: initialStatus });
            await createNotification(finalApprovers[0]?.emp_id, '결재 요청', `${title} 문서가 상신되었습니다.`, `approval.html?doc=${docId}`, { doc_id: docId });
        }
        showAlert("상신되었습니다.");
        location.reload();
    }
}

// [핵심] 결재 처리
async function procDoc(docId, action) {
    if (!canPerform('approval.process')) return showAlert("처리 권한이 없습니다.");
    const reason = prompt(`${action} 사유 (선택):`);
    if (reason === null) return;

    const { data: doc } = await _supabase.from('ref_approval').select('*').eq('id', docId).single();
    let line = doc.approval_line;
    let nextUser = null;
    let newStatus = '진행중';

    const idx = line.findIndex(p => p.emp_id === myInfo.emp_id);
    if (idx === -1) return showAlert("권한 없음");
    if (idx > 0 && line[idx-1].status !== '승인') return showAlert("이전 결재자가 처리 안 함");

    line[idx].status = action;
    line[idx].comment = reason;
    line[idx].processed_at = new Date().toISOString();

    if (action === '반려') {
        newStatus = '반려';
        nextUser = null;
    } else {
        if (idx + 1 < line.length) nextUser = line[idx+1].emp_id;
        else newStatus = '완료'; 
    }

    // [부양가족 자동 반영]
    if (doc.doc_type.startsWith('부양가족') && newStatus === '완료') {
        const changeVal = Number(doc.amount); 
        const drafterId = doc.drafter_id;
        const { data: empData } = await _supabase.from('ref_employees').select('dependents').eq('emp_id', drafterId).single();
        if(empData) {
            const current = empData.dependents || 0;
            const newVal = Math.max(0, current + changeVal);
            await _supabase.from('ref_employees').update({ dependents: newVal }).eq('emp_id', drafterId);
        }
    }

    await _supabase.from('ref_approval').update({ approval_line: line, current_approver: nextUser, status: newStatus }).eq('id', docId);
    await logAudit('approval.process', docId, `${action} 처리`, { status: newStatus, reason: reason || null });

    if (action === '반려') {
        await createNotification(doc.drafter_id, '결재 반려', `${doc.title} 문서가 반려되었습니다.`, `approval.html?doc=${docId}`, { doc_id: docId });
    } else if (newStatus === '완료') {
        await createNotification(doc.drafter_id, '결재 완료', `${doc.title} 문서가 최종 승인되었습니다.`, `approval.html?doc=${docId}`, { doc_id: docId });
    } else if (nextUser) {
        await createNotification(nextUser, '결재 요청', `${doc.title} 문서 결재 차례입니다.`, `approval.html?doc=${docId}`, { doc_id: docId });
    }

    showAlert("처리되었습니다."); loadTodoList();
}

// [추가] 사용자 액션 (대리상신 건에 대한 증빙제출/취소)
async function procUserAction(docId, action) {
    const { data: doc } = await _supabase.from('ref_approval').select('title, current_approver, drafter_id').eq('id', docId).single();
    if (action === '취소') {
        const reason = prompt("취소 사유를 입력하세요:");
        if (!reason) return;
        // 결재취소 상태로 변경 (연차 복구됨)
        await _supabase.from('ref_approval').update({ status: '결재취소', comment: `[사용자 취소] ${reason}` }).eq('id', docId);
        await logAudit('approval.cancel', docId, '사용자 취소', { reason });
        if (doc?.current_approver) {
            await createNotification(doc.current_approver, '결재 취소', `${doc.title || '문서'}가 취소되었습니다.`, `approval.html?doc=${docId}`, { doc_id: docId });
        }
        showAlert("취소되었습니다.");
        loadHistoryList();
    } else if (action === '증빙제출') {
        // (간소화) 실제 구현 시 파일 모달 필요. 여기선 안내만.
        showAlert("증빙 서류가 제출되었습니다. (관리자 확인 대기)");
        await _supabase.from('ref_approval').update({ status: '증빙확인중' }).eq('id', docId);
        await logAudit('approval.evidence', docId, '증빙 제출', null);
        if (doc?.current_approver) {
            await createNotification(doc.current_approver, '증빙 제출', `${doc.title || '문서'}에 증빙이 제출되었습니다.`, `approval.html?doc=${docId}`, { doc_id: docId });
        }
        loadHistoryList();
    }
}

function exportHistoryCsv() {
    const key = document.getElementById("searchKeyword").value.toLowerCase();
    const list = key ? historyCache.filter(d => (d.title || '').toLowerCase().includes(key)) : historyCache;
    if (!list || list.length === 0) return showAlert("내보낼 데이터가 없습니다.");

    const headers = ['id','doc_type','title','status','drafter_name','created_at','amount','current_approver','signed_doc_url'];
    const rows = list.map(d => [
        d.id,
        d.doc_type || '',
        d.title || '',
        d.status || '',
        d.drafter_name || '',
        d.created_at || '',
        d.amount || 0,
        d.current_approver || '',
        d.signed_doc_url || ''
    ]);

    const csvEscape = (val) => {
        const str = String(val ?? '');
        if (/[",\n]/.test(str)) return `"${str.replace(/"/g, '""')}"`;
        return str;
    };

    const csv = [headers.join(',')]
        .concat(rows.map(r => r.map(csvEscape).join(',')))
        .join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const dateTag = formatApprovalKstDateISO(new Date());
    a.download = `approval_history_${dateTag}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

function renderDocs(target, list, isTodo) {
    target.innerHTML = "";
    if(!list || list.length===0) { target.innerHTML = '<div class="p-3 text-center text-muted">없음</div>'; return; }
    list.forEach(doc => {
        const approvalLine = Array.isArray(doc.approval_line) ? doc.approval_line : [];
        const safeDocType = escapeHtml(doc.doc_type);
        const safeTitle = escapeHtml(doc.title);
        const safeDate = escapeHtml(formatApprovalKstDateISO(doc.created_at, '-'));
        const lineHtml = approvalLine.map(s => {
            const status = s.status || '';
            const name = escapeHtml(s.name);
            const statusClass = status==='승인'?'text-success':(status==='반려'?'text-danger':'text-muted');
            const statusIcon = status==='승인'?'✅':(status==='반려'?'⛔':'⬜');
            return `<span class="small me-2 ${statusClass}">${statusIcon} ${name}</span>`;
        }).join("");

        let ageBadge = "";
        if (doc.created_at) {
            const createdAt = new Date(doc.created_at);
            if (!Number.isNaN(createdAt.getTime())) {
                const ageDays = Math.floor((Date.now() - createdAt.getTime()) / (1000 * 60 * 60 * 24));
                if (ageDays >= 0) {
                    const ageClass = ageDays >= 7 ? 'bg-danger' : (ageDays >= 3 ? 'bg-warning text-dark' : 'bg-light text-dark');
                    ageBadge = `<span class="badge ${ageClass} ms-2">${ageDays}일 경과</span>`;
                }
            }
        }
        
        let relBtn = "";
        const relId = Number(doc.related_doc_id);
        if (Number.isFinite(relId)) {
            relBtn = `<button class="btn btn-sm btn-outline-info ms-2" style="font-size: 0.75rem;" onclick="openRelView(${relId})">🔗 근거문서 보기</button>`;
        }

        let btnHtml = "";
        if (isTodo) {
            btnHtml = `<div class="mt-2 text-end"><button class="btn btn-sm btn-success me-1" onclick="procDoc(${doc.id},'승인')">승인</button><button class="btn btn-sm btn-danger" onclick="procDoc(${doc.id},'반려')">반려</button></div>`;
        } else {
            const actions = [];
            const isSecretary = (myInfo?.position === '사무국장' || (myInfo?.role === 'admin' || myInfo?.role === 'admin_all'));
            const hasChairman = approvalLine.some(l => (l.position || '').includes('이사장'));
            const canPhysical = isSecretary && hasChairman && canPerform('approval.physical') && doc.drafter_id === myInfo.emp_id;

            if (doc.status === '가승인' && doc.drafter_id === myInfo.emp_id) {
                actions.push(`<span class="badge bg-warning text-dark me-2">⚠️ 증빙제출 필요</span>`);
                actions.push(`<button class="btn btn-sm btn-primary me-1" onclick="procUserAction(${doc.id}, '증빙제출')">📁 증빙제출</button>`);
                actions.push(`<button class="btn btn-sm btn-secondary" onclick="procUserAction(${doc.id}, '취소')">🗑️ 취소</button>`);
            }

            if (canPhysical && ['진행중','가승인','증빙확인중','실물결재대기','실물결재완료'].includes(doc.status)) {
                actions.push(`<button class="btn btn-sm btn-outline-primary me-1" onclick="printPhysicalDoc(${doc.id})">🖨️ 실물결재 출력</button>`);
            }
            if (canPhysical && doc.status === '실물결재대기') {
                actions.push(`<button class="btn btn-sm btn-success me-1" onclick="startPhysicalComplete(${doc.id})">✅ 서명첨부 완료</button>`);
            }
            if (doc.signed_doc_url) {
                const safeUrl = encodeURIComponent(doc.signed_doc_url);
                actions.push(`<button class="btn btn-sm btn-outline-secondary" onclick="openSignedDoc('${safeUrl}')">📎 서명문서</button>`);
            }

            const badgeClass = (doc.status === '완료' || doc.status === '실물결재완료')
                ? 'bg-success'
                : (doc.status === '반려' || doc.status === '결재취소')
                    ? 'bg-danger'
                    : 'bg-warning';
            const safeStatus = escapeHtml(doc.status);
            const badgeHtml = `<span class="badge ${badgeClass}">${safeStatus}</span>`;

            if (actions.length > 0) {
                btnHtml = `<div class="mt-2 text-end">${badgeHtml} ${actions.join(' ')}</div>`;
            } else {
                btnHtml = `<div class="mt-2 text-end">${badgeHtml}</div>`;
            }
        }
        
        target.innerHTML += `<div class="list-group-item shadow-sm mb-3 border-0 p-3"><div class="d-flex justify-content-between mb-2"><div><span class="badge bg-primary me-1">${safeDocType}</span>${relBtn}</div><small class="text-muted">${safeDate}${ageBadge}</small></div><h6 class="fw-bold">${safeTitle}</h6><div class="small mb-2">${lineHtml}</div>${btnHtml}</div>`;
    });
}

function buildPhysicalPrintHtml(doc) {
    const safeType = escapeHtml(doc.doc_type || '');
    const safeDrafter = escapeHtml(doc.drafter_name || '');
    const safeDate = escapeHtml(formatApprovalKstDateISO(doc.created_at, ''));
    const safeAmount = Number(doc.amount || 0).toLocaleString();
    const safeContent = escapeHtml(doc.content || '').replace(/\n/g, '<br>');
    const safeDocNo = escapeHtml(doc.doc_no || '');

    let rawTitle = String(doc.title || '');
    if (doc.drafter_name) {
        const suffix = `- ${doc.drafter_name}`;
        if (rawTitle.includes(suffix)) {
            rawTitle = rawTitle.replace(suffix, '').trim();
        }
    }
    const safeTitle = escapeHtml(rawTitle);

    const approvalLine = Array.isArray(doc.approval_line) ? doc.approval_line : [];
    const findByPos = (keyword) => approvalLine.find(l => (l.position || '').includes(keyword));
    let secretary = findByPos('사무국장');
    const chairman = findByPos('이사장');
    const isDrafterSecretary = !!doc._drafter_is_secretary;
    let secretaryAuto = false;
    if (!secretary && isDrafterSecretary) {
        secretary = { name: safeDrafter, status: '승인', processed_at: doc.created_at };
        secretaryAuto = true;
    }

    const stampHtml = (entry, fallbackDate, autoLabel = false) => {
        if (!entry) return '';
        if (entry.status === '승인') {
            const dt = entry.processed_at ? formatApprovalKstDateISO(entry.processed_at) : (fallbackDate || '');
            const label = autoLabel ? '자동승인' : '승인';
            return `<div class="stamp approved">${label}</div>${dt ? `<div class="stamp-date">${dt}</div>` : ''}`;
        }
        if (entry.status === '반려') return `<div class="stamp rejected">반려</div>`;
        return `<div class="stamp pending">대기</div>`;
    };

    const drafterStamp = `<div class="stamp drafted">기안</div>${safeDate ? `<div class="stamp-date">${safeDate}</div>` : ''}`;

    return `
      <html>
        <head>
          <title>실물 결재 출력</title>
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
          <style>
            body { font-family: "Malgun Gothic", sans-serif; padding: 30px; }
            .print-area { max-width: 900px; margin: 0 auto; position: relative; }
            .header { display: flex; justify-content: space-between; gap: 20px; }
            .doc-info { flex: 1; }
            .doc-row { margin-bottom: 6px; }
            .approval-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; min-width: 320px; }
            .approval-box { border: 1px solid #000; text-align: center; padding: 6px; min-height: 90px; position: relative; }
            .approval-role { font-size: 0.85rem; font-weight: 700; border-bottom: 1px solid #000; padding-bottom: 4px; margin-bottom: 6px; }
            .approval-name { font-size: 0.9rem; font-weight: 600; }
            .stamp { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 4px; border: 2px solid #16a34a; color: #16a34a; font-size: 0.8rem; font-weight: 700; }
            .stamp.rejected { border-color: #dc2626; color: #dc2626; }
            .stamp.pending { border-color: #94a3b8; color: #64748b; }
            .stamp.drafted { border-color: #2563eb; color: #2563eb; }
            .stamp-date { font-size: 0.7rem; color: #64748b; margin-top: 2px; }
            .content-box { margin-top: 16px; border: 1px solid #000; padding: 14px; min-height: 240px; }
            .print-actions { position: fixed; bottom: 20px; right: 20px; }
            @media print { .print-actions { display: none; } }
          </style>
        </head>
        <body>
          <div class="print-area">
            <div class="header">
              <div class="doc-info">
                <div class="doc-row"><strong>문서 유형:</strong> ${safeType}</div>
                ${safeDocNo ? `<div class="doc-row"><strong>문서번호:</strong> ${safeDocNo}</div>` : ''}
                <div class="doc-row"><strong>제목:</strong> ${safeTitle}</div>
                <div class="doc-row"><strong>작성자:</strong> ${safeDrafter}</div>
                <div class="doc-row"><strong>작성일:</strong> ${safeDate}</div>
                <div class="doc-row"><strong>금액:</strong> ${safeAmount}원</div>
              </div>
              <div class="approval-boxes">
                <div class="approval-box">
                  <div class="approval-role">담당</div>
                  <div class="approval-name">${safeDrafter}</div>
                  ${drafterStamp}
                </div>
                <div class="approval-box">
                  <div class="approval-role">사무국장</div>
                  <div class="approval-name">${escapeHtml(secretary?.name || '')}</div>
                  ${stampHtml(secretary, safeDate, secretaryAuto)}
                </div>
                <div class="approval-box">
                  <div class="approval-role">이사장</div>
                  <div class="approval-name">${escapeHtml(chairman?.name || '')}</div>
                  ${stampHtml(chairman, safeDate)}
                </div>
              </div>
            </div>

            <div class="content-box" style="white-space: pre-wrap;">${safeContent}</div>
          </div>
          <div class="print-actions">
            <button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ 인쇄</button>
            <button class="btn btn-secondary btn-sm" onclick="window.close()">닫기</button>
          </div>
        </body>
      </html>
    `;
}

async function printPhysicalDoc(docId) {
    if (!canPerform('approval.physical')) return showAlert("처리 권한이 없습니다.");
    const { data: doc, error } = await _supabase.from('ref_approval').select('*').eq('id', docId).single();
    if (error || !doc) return showAlert("문서를 찾을 수 없습니다.");

    // 기안자 직급 확인 (사무국장 여부)
    if (doc.drafter_id) {
        const { data: drafterEmp } = await _supabase
            .from('ref_employees')
            .select('position')
            .eq('emp_id', doc.drafter_id)
            .maybeSingle();
        doc._drafter_is_secretary = !!(drafterEmp?.position || '').includes('사무국장');
    }

    const win = window.open('', '_blank');
    win.document.write(buildPhysicalPrintHtml(doc));
    win.document.close();

    if (!['실물결재대기', '실물결재완료'].includes(doc.status)) {
        await _supabase.from('ref_approval')
            .update({ status: '실물결재대기', current_approver: null })
            .eq('id', docId);
        await logAudit('approval.physical_print', docId, '실물결재 출력', null);
        loadHistoryList();
    }
}

function startPhysicalComplete(docId) {
    if (!canPerform('approval.physical')) return showAlert("처리 권한이 없습니다.");
    pendingPhysicalDocId = docId;
    const input = document.getElementById('signedDocInput');
    input.value = "";
    input.click();
}

document.getElementById('signedDocInput').addEventListener('change', async (e) => {
    const fileInput = e.target;
    if (!pendingPhysicalDocId) return;
    if (!fileInput.files || fileInput.files.length === 0) return;

    const validation = validateAttachments(fileInput.files);
    if (!validation.ok) return showAlert(validation.message);

    const file = fileInput.files[0];
    const safeName = `${crypto.randomUUID()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
    const { error: uploadErr } = await _supabase.storage.from('attachments').upload(safeName, file);
    if (uploadErr) return showAlert("파일 오류: " + uploadErr.message);
    const { data: { publicUrl } } = _supabase.storage.from('attachments').getPublicUrl(safeName);

    const { data: doc } = await _supabase
        .from('ref_approval')
        .select('id, approval_line, title, drafter_id, doc_type, content, doc_no, receiver, via')
        .eq('id', pendingPhysicalDocId)
        .single();
    const nowIso = new Date().toISOString();
    let line = Array.isArray(doc?.approval_line) ? doc.approval_line : [];
    line = line.map(l => {
        if ((l.position || '').includes('이사장')) {
            return { ...l, status: '승인', processed_at: nowIso, comment: '실물결재 확인' };
        }
        return l;
    });

    await _supabase.from('ref_approval').update({
        status: '실물결재완료',
        signed_doc_url: publicUrl,
        physical_approved_at: nowIso,
        physical_approved_by: myInfo?.emp_id || null,
        approval_line: line,
        current_approver: null,
        processed_at: nowIso
    }).eq('id', pendingPhysicalDocId);

    await logAudit('approval.physical_complete', pendingPhysicalDocId, '실물결재 완료', { signed_doc_url: publicUrl });
    if (doc?.drafter_id && doc.drafter_id !== myInfo?.emp_id) {
        await createNotification(doc.drafter_id, '실물결재 완료', `${doc.title || '문서'} 실물결재가 완료되었습니다.`, `approval.html?doc=${pendingPhysicalDocId}`, { doc_id: pendingPhysicalDocId });
    }

    pendingPhysicalDocId = null;
    fileInput.value = "";
    showAlert("실물결재가 완료되었습니다.");
    loadHistoryList();
});

let relSearchModal, relViewModal;

// 2. 검색 실행 (완료된 '일반품의' & 같은 부서)
async function runRelSearch() {
    const key = document.getElementById("relKeyword").value.trim();
    const listEl = document.getElementById("relResultList");
    listEl.innerHTML = '<div class="p-3 text-center">검색 중...</div>';

    // 내 부서 찾기 (ref_employees 이용 안 하고 allUsers에서 찾음)
    const myDept = myInfo.department;

    // 쿼리: status=완료, doc_type=일반품의
    let query = _supabase.from('ref_approval')
        .select('*')
        .eq('status', '완료')
        .eq('doc_type', '일반품의') // 품의서만 검색
        .order('created_at', {ascending: false})
        .limit(20);

    if (key) query = query.or(`title.ilike.%${key}%,drafter_name.ilike.%${key}%`);

    const { data, error } = await query;
    if (error) {
        listEl.innerHTML = "";
        listEl.textContent = '오류: ' + error.message;
        return;
    }

    // 부서 필터링 (클라이언트 사이드)
    // allUsers 배열을 활용해 작성자의 부서를 확인
    const filtered = data.filter(doc => {
        const drafter = allUsers.find(u => u.emp_id === doc.drafter_id);
        // 작성자가 없거나(퇴사), 부서가 같거나, 내가 관리자면 통과
        return !drafter || drafter.department === myDept || (myInfo.role === 'admin' || myInfo.role === 'admin_all');
    });

    if (filtered.length === 0) {
        listEl.innerHTML = '<div class="p-3 text-center text-muted">검색 결과가 없습니다. (완료된 품의서만 조회됨)</div>';
        return;
    }

    listEl.innerHTML = "";
    filtered.forEach(doc => {
        const item = document.createElement("a");
        item.className = "list-group-item list-group-item-action";
        item.style.cursor = "pointer";
        const header = document.createElement("div");
        header.className = "d-flex justify-content-between";
        const title = document.createElement("span");
        title.className = "fw-bold";
        title.textContent = doc.title || "";
        const date = document.createElement("small");
        date.textContent = formatApprovalKstDateISO(doc.created_at, "");
        header.appendChild(title);
        header.appendChild(date);
        const meta = document.createElement("small");
        meta.className = "text-muted";
        meta.textContent = `${doc.drafter_name || ''} | ${Number(doc.amount || 0).toLocaleString()}원`;
        item.appendChild(header);
        item.appendChild(meta);
        item.onclick = () => selectRelDoc(doc);
        listEl.appendChild(item);
    });
}

    contentEl.textContent = "Loading...";
    relViewModal.show();

    const { data, error } = await _supabase.from('ref_approval').select('*').eq('id', docId).single();
    if (error || !data) { contentEl.textContent = "문서를 불러올 수 없습니다."; return; }

    // 보기 전용 템플릿 렌더링 (안전한 DOM 구성)
    const lines = (Array.isArray(data.approval_line) ? data.approval_line : [])
        .map(l => `${l.name || ''}(${l.status || ''})`).join(" → ");
    contentEl.innerHTML = "";

    const titleEl = document.createElement("h4");
    titleEl.className = "fw-bold mb-3";
    titleEl.textContent = data.title || "";

    const metaEl = document.createElement("div");
    metaEl.className = "mb-3 text-muted small";
    metaEl.textContent = `작성자: ${data.drafter_name || ''} | 기안일: ${formatApprovalKstDateISO(data.created_at, '')} | 결재선: ${lines}`;

    const hr = document.createElement("hr");

    const contentBox = document.createElement("div");
    contentBox.className = "p-3 bg-light rounded";
    contentBox.style.whiteSpace = "pre-wrap";
    contentBox.style.minHeight = "200px";
    contentBox.textContent = data.content || "";

    const amountEl = document.createElement("div");
    amountEl.className = "mt-3 text-end fw-bold";
    amountEl.textContent = `금액: ${Number(data.amount || 0).toLocaleString()}원`;

    contentEl.appendChild(titleEl);
    contentEl.appendChild(metaEl);
    contentEl.appendChild(hr);
    contentEl.appendChild(contentBox);
    contentEl.appendChild(amountEl);
}

// 5. 새 창으로 보기
function openRelNewTab() {
    if (!currentViewingDocId) return;
    // 실제로는 별도 뷰어 페이지가 필요하겠지만, 여기서는 모달 내용을 새 창에 씀
    const w = window.open("", "_blank");
    w.document.write(`<html><head><title>문서 보기</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="p-4">${document.getElementById("relViewContent").innerHTML}</body></html>`);
}
  
  </script>
