  (function enforceErpPathPrefix() {
    var host = String(window.location.hostname || '').trim().toLowerCase().replace(/\.$/, '');
    if (/^erp\./.test(host)) return;
    var path = String(window.location.pathname || '');
    if (path === '/erp' || path === '/erp/' || path.indexOf('/erp/') === 0) return;
    var targetPath = (path === '/' || path === '/index' || path === '/index.html')
      ? '/erp/'
      : '/erp' + (path.charAt(0) === '/' ? path : '/' + path);
    var target = window.location.origin + targetPath + String(window.location.search || '') + String(window.location.hash || '');
    if (target !== window.location.href) {
      window.location.replace(target);
    }
  })();
</script>

<body class="erp-unified">
  <div class="wrap">
    <div class="panel">
      <div class="d-flex justify-content-between align-items-center gap-3">
        <div><h1 class="h4 mb-1">문서관리</h1></div>
        <button class="btn btn-outline-secondary btn-sm" onclick="location.href='index.html'">ERP 메인</button>
      </div>

      <button type="button" class="menu-card d-none" id="cardMinutesAdmin" onclick="openMinutesRoute('integrated_admin')">

      <button type="button" class="menu-card d-none" id="cardDocuments" onclick="openMinutesRoute('documents')">
        <strong>문서함</strong>
        <span>공개 문서와 자료집 열람</span>
      </button>

        <strong>서명자 준비</strong>
        <span>서명 이미지 등록과 Telegram 연결 상태 확인</span>
      </button>

      <div id="emptyState" class="alert alert-light border mt-3 d-none mb-0">
        현재 사용할 수 있는 문서 관련 모듈이 없습니다.

  <script>
    const SUPABASE_URL = "https://ifdqlwxgqgsvnawmhlfc.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k";
    const GOVERNANCE_ROUTE_ORIGINS = window.CoopRouteGuard ? CoopRouteGuard.buildSiteOrigins(window.location) : { publicOrigin: window.location.origin };
    const GOVERNANCE_PUBLIC_BASE_URL = String(GOVERNANCE_ROUTE_ORIGINS.publicOrigin || window.location.origin).replace(/\/+$/, '');
    const MINUTES_ROUTE_TARGETS = Object.freeze({
      integrated_admin: new URL('/minutes/admin_minutes.html', `${GOVERNANCE_PUBLIC_BASE_URL}/`).href,
      documents: new URL('/minutes/minutes_view.html', `${GOVERNANCE_PUBLIC_BASE_URL}/`).href,
      signature: new URL('/minutes/minutes_sign.html', `${GOVERNANCE_PUBLIC_BASE_URL}/`).href
    });
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      global: {
        headers: {
          'x-erp-host': window.CoopRouteGuard?.getErpRuntimeHost(window.location) || String(window.location.hostname || '').trim().toLowerCase()
        }
      }
    });

    function readStoredUser() {
      try { return JSON.parse(localStorage.getItem('erp_user') || 'null'); } catch (_) { return null; }
    }

    function readStoredPermissions() {
      try {
        const raw = JSON.parse(localStorage.getItem('erp_permissions') || '[]');
        return new Set(Array.isArray(raw) ? raw : []);
      } catch (_) {
        return new Set();
      }
    }

    function hasPermission(set, key) {
      if (!set || set.size === 0) return null;
      return set.has(key);
    }

    function isModuleEnabled(runtime, moduleKey) {
      const modules = runtime && typeof runtime.modules === 'object' ? runtime.modules : null;
      if (!modules || !(moduleKey in modules)) return true;
      return modules[moduleKey] !== false;
    }

    async function loadRuntime() {
      const { data, error } = await _supabase.rpc('get_my_erp_runtime');
      if (error) throw error;
      return data || null;
    }

    function getMinutesRouteTarget(routeKey) {
      const safeKey = String(routeKey || '').trim();
      const target = MINUTES_ROUTE_TARGETS[safeKey];
      if (!target) throw new Error('MINUTES_ROUTE_NOT_FOUND');
      return target;
    }

    async function buildMinutesRouteUrl(routeKey) {
      const safeKey = String(routeKey || '').trim();
      return getMinutesRouteTarget(safeKey);
    }

    async function openMinutesRoute(routeKey) {
      const buttonByRoute = {
        integrated_admin: 'cardMinutesAdmin',
        documents: 'cardDocuments',
        signature: 'cardSignature'
      };
      const button = document.getElementById(buttonByRoute[String(routeKey || '').trim()] || '');
      if (button) {
        button.disabled = true;
        button.style.pointerEvents = 'none';
      }

      try {
        const targetUrl = await buildMinutesRouteUrl(routeKey);
        window.location.href = targetUrl;
      } catch (error) {
        console.error('governance minutes route failed:', routeKey, error);
        location.href = `index.html?next=${encodeURIComponent(window.location.href)}`;
      } finally {
        if (button) {
          button.disabled = false;
          button.style.pointerEvents = '';
        }
      }
    }

    async function init() {
      const user = readStoredUser();
      if (!user) {
        location.href = `index.html?next=${encodeURIComponent(window.location.href)}`;
        return;
      }

      let runtime = null;
      try {
        runtime = await loadRuntime();
      } catch (error) {
        console.error('governance runtime load failed:', error);
        location.href = `index.html?next=${encodeURIComponent(window.location.href)}`;
        return;
      }

      const permissionSet = readStoredPermissions();
      const hasAdminRoleFallback = (user.role === 'admin' || user.role === 'admin_all');
      const canMemberAdmin = hasPermission(permissionSet, 'member.admin');
      const siteOnly = hasPermission(permissionSet, 'site.admin');
      const canSiteAdmin = siteOnly === null ? null : (siteOnly || hasPermission(permissionSet, 'member.admin') === true);
      const canMinutesAdmin = isModuleEnabled(runtime, 'minutes') && (hasAdminRoleFallback || canMemberAdmin === true || canSiteAdmin === true);
      const canSignatureAdmin = isModuleEnabled(runtime, 'signature') && (hasAdminRoleFallback || canMemberAdmin === true || canSiteAdmin === true);

      const visibleCards = [];
      if (canMinutesAdmin) visibleCards.push('cardMinutesAdmin');
      if (isModuleEnabled(runtime, 'documents')) visibleCards.push('cardDocuments');
      if (isModuleEnabled(runtime, 'signature')) visibleCards.push('cardSignature');
      if (canSignatureAdmin) visibleCards.push('cardSignatureAdmin');

      visibleCards.forEach(id => document.getElementById(id)?.classList.remove('d-none'));
      if (visibleCards.length === 0) {
        document.getElementById('emptyState')?.classList.remove('d-none');
      }
    }

    init();
  </script>
</body>
