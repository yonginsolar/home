    <script>
  window.__COOP_ROUTE_APP__ = 'erp';
  (function enforceErpPathPrefix() {
    var host = String(window.location.hostname || '').trim().toLowerCase().replace(/\.$/, '');
    if (/^erp\./.test(host)) return;
    var path = String(window.location.pathname || '');
    if (path === '/erp' || path === '/erp/' || path.indexOf('/erp/') === 0) return;
    var targetPath = (path === '/' || path === '/index' || path === '/index.html')
      ? '/erp/'
      : '/erp' + (path.charAt(0) === '/' ? path : '/' + path);
    var target = window.location.origin + targetPath + String(window.location.search || '') + String(window.location.hash || '');
    if (target !== window.location.href) {
      window.location.replace(target);
    }
  })();
</script>
    <script src="/shared/route_guard.js?v=20260403-1"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f8f9fa; flex-direction: column; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #F7E600; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #message { color: #555; text-align: center; }
        .callback-actions { display: none; margin-top: 18px; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .callback-actions.show { display: flex; }
        .callback-actions button { border: 1px solid #d1d5db; background: #fff; color: #111827; border-radius: 999px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
        .callback-actions button.primary { background: #111827; color: #fff; border-color: #111827; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div id="message">로그인 정보를 동기화하고 있습니다...</div>
    <div id="callbackActions" class="callback-actions">
        <button type="button" class="primary" id="btnRetryCallback">다시 시도</button>
        <button type="button" id="btnGoDest">원래 화면으로 이동</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            global: {
                headers: {
                    'x-erp-host': window.CoopRouteGuard?.getErpRuntimeHost(window.location) || String(window.location.hostname || '').trim().toLowerCase()
                }
            }
        });
        const ERP_INDEX_URL = window.CoopRouteGuard?.buildAppPageUrl
            ? window.CoopRouteGuard.buildAppPageUrl('index.html', { app: 'erp' })
            : new URL('index.html', new URL('./', window.location.href)).href;
        const ERP_AUTH_DEST_KEY = 'erp_auth_destination';
        const LEGACY_AUTH_DEST_KEY = 'auth_destination';

        function normalizeDest(raw) {
            return CoopRouteGuard.normalizeDestination(raw, { fallback: ERP_INDEX_URL });
        }

        function pickErpDestCandidate() {
            const params = new URLSearchParams(window.location.search);
            const candidates = [
                params.get('next'),
                localStorage.getItem(ERP_AUTH_DEST_KEY),
                localStorage.getItem(LEGACY_AUTH_DEST_KEY)
            ].map((value) => String(value || '').trim()).filter(Boolean);

            return candidates.find((candidate) => {
                try {
                    return CoopRouteGuard.isErpDestination(candidate, { fallback: ERP_INDEX_URL });
                } catch (_) {
                    return false;
                }
            }) || '';
        }

        function getDest() {
            return normalizeDest(pickErpDestCandidate());
        }

        async function syncPhone(user) {
            try {
                const kakao = user.identities?.find(id => id.provider === 'kakao');
                if (kakao?.identity_data) {
                    const phone = kakao.identity_data.phone_number || kakao.identity_data.phone;
                    if (phone && user.user_metadata.phone !== phone) {
                        await _supabase.auth.updateUser({ data: { phone: phone } });
                    }
                }
            } catch (e) {}
        }

        function redirectTo(dest) {
            clearCallbackFallbackState();
            localStorage.removeItem(ERP_AUTH_DEST_KEY);
            window.location.replace(dest);
        }

        function setCallbackBusyState(message) {
            document.getElementById('message').innerText = message || '로그인 정보를 동기화하고 있습니다...';
            document.getElementById('callbackActions').classList.remove('show');
            const loader = document.querySelector('.loader');
            if (loader) loader.style.display = 'block';
        }

        function showCallbackRetryState(message) {
            document.getElementById('message').innerText = message || '인증 처리를 완료하지 못했습니다. 다시 시도해 주세요.';
            document.getElementById('callbackActions').classList.add('show');
            const loader = document.querySelector('.loader');
            if (loader) loader.style.display = 'none';
        }

        let authStateFallbackSubscription = null;
        let authStateFallbackTimer = null;

        function clearAuthStateFallbackSubscription() {
            try {
                authStateFallbackSubscription?.data?.subscription?.unsubscribe?.();
            } catch (_) {}
            authStateFallbackSubscription = null;
        }

        function clearCallbackFallbackState() {
            if (authStateFallbackTimer) {
                clearTimeout(authStateFallbackTimer);
                authStateFallbackTimer = null;
            }
            clearAuthStateFallbackSubscription();
        }

        const runCallbackBoot = BootGuard.createSingleFlightAction(async function processAuthInternal() {
            try {
                setCallbackBusyState('로그인 정보를 동기화하고 있습니다...');
                clearCallbackFallbackState();
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');

                if (code) {
                    const { data, error } = await _supabase.auth.exchangeCodeForSession(code);
                    if (!error && data?.session) {
                        clearCallbackFallbackState();
                        await syncPhone(data.session.user);
                        history.replaceState({}, document.title, window.location.pathname);
                        return redirectTo(getDest());
                    }
                }

                const { data: sessionData } = await Promise.race([
                    _supabase.auth.getSession(),
                    new Promise((resolve) => setTimeout(() => resolve({ data: null, error: 'timeout' }), 2500))
                ]);
                if (sessionData?.session) {
                    clearCallbackFallbackState();
                    await syncPhone(sessionData.session.user);
                    return redirectTo(getDest());
                }

                let settled = false;
                authStateFallbackTimer = setTimeout(() => {
                    if (!settled) {
                        showCallbackRetryState('인증 처리가 지연되고 있습니다. 다시 시도하거나 원래 화면으로 이동해 주세요.');
                    }
                }, 3500);

                authStateFallbackSubscription = _supabase.auth.onAuthStateChange((_evt, session) => {
                    if (!session) return;
                    settled = true;
                    clearCallbackFallbackState();
                    syncPhone(session.user).then(() => redirectTo(getDest()));
                });
            } catch (err) {
                clearCallbackFallbackState();
                showCallbackRetryState('인증 처리 중 오류가 발생했습니다. 다시 시도하거나 원래 화면으로 이동해 주세요.');
            }
        });

        function processAuth() {
            return runCallbackBoot();
        }

        document.getElementById('btnRetryCallback').addEventListener('click', () => {
            processAuth();
        });
        document.getElementById('btnGoDest').addEventListener('click', () => {
            clearCallbackFallbackState();
            redirectTo(getDest());
        });

        processAuth();
    </script>
</body>
</html>
