<!DOCTYPE html>
<!-- Version: v1.0.1 -->
<html lang="ko">
<head>
  <script>console.log('[Version] v1.0.1 | auth_callback.html');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증 처리 중...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f8f9fa; flex-direction: column; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #F7E600; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #message { color: #555; text-align: center; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div id="message">로그인 정보를 동기화하고 있습니다...</div>

    <script>
        const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getDest() {
            const params = new URLSearchParams(window.location.search);
            return params.get('next') || localStorage.getItem('auth_destination') || '/index.html';
        }

        async function syncPhone(user) {
            try {
                const kakao = user.identities?.find(id => id.provider === 'kakao');
                if (kakao?.identity_data) {
                    const phone = kakao.identity_data.phone_number || kakao.identity_data.phone;
                    if (phone && user.user_metadata.phone !== phone) {
                        await _supabase.auth.updateUser({ data: { phone: phone } });
                    }
                }
            } catch (e) { void 0; }
        }

        function redirectTo(dest) {
            localStorage.removeItem('auth_destination');
            window.location.replace(dest);
        }

        async function processAuth() {
            try {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');

                if (code) {
                    const { data, error } = await _supabase.auth.exchangeCodeForSession(code);
                    if (!error && data?.session) {
                        await syncPhone(data.session.user);
                        history.replaceState({}, document.title, window.location.pathname);
                        return redirectTo(getDest());
                    }
                }

                const { data: sessionData } = await _supabase.auth.getSession();
                if (sessionData?.session) {
                    await syncPhone(sessionData.session.user);
                    return redirectTo(getDest());
                }

                document.getElementById('message').innerText = '인증 정보가 없습니다. 로그인 화면으로 이동합니다.';
                setTimeout(() => redirectTo(getDest()), 1200);
            } catch (err) {
                document.getElementById('message').innerText = '인증 처리 중 오류가 발생했습니다. 잠시 후 이동합니다.';
                setTimeout(() => redirectTo(getDest()), 1500);
            }
        }

        processAuth();
    </script>
</body>
</html>
