<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
 <title id="title">조합 로고와 파비콘이 표시되는 위치 예시</title>
 <desc id="desc">조합 로고는 ERP 접속 화면과 로고를 사용하는 문서에 표시됩니다. 파비콘용 심볼은 브라우저 탭과 검색 아이콘에 표시됩니다. 홈페이지 상단은 조합명 텍스트를 사용합니다.</desc>
 <defs><g id="symbol"><circle r="27" fill="#fbbf24"/><circle r="17" fill="#fde68a"/><path d="M-43 0h9M34 0h9M0-43v9M0 34v9M-31-31l7 7M24 24l7 7M31-31l-7 7M-24 24l-7 7" stroke="#d97706" stroke-width="5" stroke-linecap="round"/></g></defs>
 <rect width="1200" height="450" rx="18" fill="#f8fafc"/>
 <g font-family="Arial, 'Noto Sans KR', sans-serif" fill="#172033">
  <text x="34" y="40" font-size="21" font-weight="700">사용 위치 예시</text><text x="1180" y="39" text-anchor="end" font-size="16" fill="#64748b">예시 화면 · 실제 화면과 문서 양식은 다를 수 있습니다</text>
  <rect x="24" y="67" width="356" height="324" rx="14" fill="white" stroke="#cbd5e1"/>
  <text x="202" y="99" font-size="19" font-weight="700" text-anchor="middle">ERP 접속 화면</text>
  <rect x="52" y="118" width="300" height="225" rx="12" fill="#f1f5f9"/>
  <rect x="97" y="145" width="210" height="61" rx="8" fill="white" stroke="#16a34a" stroke-width="2"/>
  <use href="#symbol" transform="translate(126 175) scale(.39)"/><text x="153" y="181" font-size="16" font-weight="700">예시 조합 로고</text>
  <text x="202" y="234" font-size="18" text-anchor="middle" font-weight="700">예시햇빛협동조합</text>
  <rect x="98" y="261" width="207" height="35" rx="7" fill="#166534"/><text x="202" y="284" text-anchor="middle" fill="white" font-size="16">로그인</text>
  <text x="202" y="370" text-anchor="middle" font-size="17" fill="#475569">조합 로고 + 아래에 조합명</text>
  <rect x="397" y="67" width="356" height="324" rx="14" fill="white" stroke="#cbd5e1"/>
  <text x="575" y="99" text-anchor="middle" font-size="19" font-weight="700">로고를 사용하는 문서</text>
  <rect x="477" y="120" width="198" height="224" fill="white" stroke="#94a3b8"/>
  <use href="#symbol" transform="translate(502 145) scale(.24)"/><text x="519" y="151" font-size="12" font-weight="700">예시 조합 로고</text>
  <text x="575" y="188" text-anchor="middle" font-size="20" font-weight="700">출자증서</text>
  <path d="M499 211h151M499 230h151M499 249h115M499 268h151" stroke="#cbd5e1" stroke-width="5"/>
  <text x="527" y="313" font-size="12">예시햇빛협동조합</text><circle cx="649" cy="306" r="12" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="649" y="310" font-size="9" text-anchor="middle" fill="#b91c1c">직인</text>
  <text x="575" y="370" text-anchor="middle" font-size="17" fill="#475569">직인은 로고와 별도로 등록</text>
  <rect x="770" y="67" width="406" height="324" rx="14" fill="white" stroke="#cbd5e1"/>
  <text x="973" y="99" text-anchor="middle" font-size="19" font-weight="700">브라우저 탭 · 검색 아이콘</text>
  <rect x="797" y="125" width="352" height="61" rx="8" fill="#e2e8f0"/>
  <rect x="812" y="137" width="236" height="40" rx="7" fill="white"/>
  <use href="#symbol" transform="translate(834 157) scale(.24)"/><text x="854" y="163" font-size="14">예시햇빛협동조합</text>
  <rect x="797" y="186" width="352" height="153" fill="white" stroke="#e2e8f0"/>
  <use href="#symbol" transform="translate(828 236) scale(.39)"/><text x="857" y="228" font-size="15" font-weight="700">예시햇빛협동조합</text><text x="857" y="252" font-size="13" fill="#64748b">example.kr</text>
  <text x="812" y="291" font-size="15" fill="#4338ca">조합 소개 · 활동 소식 · 가입 안내</text>
  <text x="973" y="370" text-anchor="middle" font-size="17" fill="#475569">글자 없는 심볼 · 정사각형 512 × 512 권장</text>
  <text x="34" y="426" font-size="17" fill="#475569">홈페이지 상단에는 조합명 텍스트를 사용하고, 탭·검색 아이콘에는 파비콘을 사용합니다.</text>
 </g>
</svg>
