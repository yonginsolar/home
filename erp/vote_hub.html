<!DOCTYPE html>
<!-- Version: v1.0.5 -->
<html lang="ko">
<head>
  <script>console.log('[Version] v1.0.5 | vote_hub.html');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>선거관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background:#f8f9fa; padding:24px; font-family:'Segoe UI','Malgun Gothic',sans-serif; }
    .wrap { max-width:720px; margin:0 auto; }
    .panel { background:#fff; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.05); padding:24px; }
    .menu-card { width:100%; text-align:left; border:1px solid #e5e7eb; border-radius:14px; padding:16px 18px; background:#fff; margin-top:12px; }
    .menu-card:hover { border-color:#93c5fd; background:#f8fbff; }
    .menu-card strong { display:block; font-size:1rem; color:#111827; }
    .menu-card span { display:block; margin-top:4px; color:#6b7280; font-size:.9rem; }
    .helper { color:#6b7280; font-size:.92rem; }
  </style>
  <link rel="stylesheet" href="./erp_theme.css?v=1.0.0">
</head>
<body class="erp-unified">
  <div class="wrap">
    <div class="panel">
      <div class="d-flex justify-content-between align-items-center gap-3">
        <div>
          <h1 class="h4 mb-1">선거관리</h1>
          <div class="helper">현재 조합에서 사용할 수 있는 선거 관련 기능만 표시합니다.</div>
        </div>
        <button class="btn btn-outline-secondary btn-sm" onclick="location.href='index.html'">ERP 메인</button>
      </div>

      <button type="button" class="menu-card d-none" id="cardVoteCreate" onclick="openVoteTarget('create')">
        <strong>선거 생성</strong>
        <span>새 선거를 만들고 기본 정보, 선거구, 유권자 배정을 시작</span>
      </button>

      <button type="button" class="menu-card d-none" id="cardVoteSetup" onclick="openVoteTarget('setup')">
        <strong>선거 설정</strong>
        <span>기존 선거의 설정을 이어서 수정하고 선거구/명부를 정리</span>
      </button>

      <button type="button" class="menu-card d-none" id="cardVoteAdmin" onclick="openVoteTarget('admin')">
        <strong>선거 관리</strong>
        <span>후보 승인, 개표, 결과 확인과 운영 관리</span>
      </button>

      <button type="button" class="menu-card d-none" id="cardCandidateApply" onclick="openVoteTarget('candidate')">
        <strong>후보자 등록</strong>
        <span>후보자 본인 또는 대표자가 등록 신청 화면으로 이동</span>
      </button>

      <button type="button" class="menu-card d-none" id="cardVotePortal" onclick="openVoteTarget('portal')">
        <strong>투표 포털</strong>
        <span>조합원/대표자 본인 확인 후 투표소로 진입</span>
      </button>

      <div id="emptyState" class="alert alert-light border mt-3 d-none mb-0">
        현재 사용할 수 있는 선거 관련 기능이 없습니다.
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ifdqlwxgqgsvnawmhlfc.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFsd3hncWdzdm5hd21obGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxODQ3NDIsImV4cCI6MjA4Mjc2MDc0Mn0.UKUvMOl58KuDH24seC3oSgla7mK5lr-vXjqtpalnl6k";
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function readStoredUser() {
      try { return JSON.parse(localStorage.getItem('erp_user') || 'null'); } catch (_) { return null; }
    }

    function readStoredPermissions() {
      try {
        const raw = JSON.parse(localStorage.getItem('erp_permissions') || '[]');
        return new Set(Array.isArray(raw) ? raw : []);
      } catch (_) {
        return new Set();
      }
    }

    function hasPermission(set, key) {
      if (!set || set.size === 0) return null;
      return set.has(key);
    }

    function isModuleEnabled(runtime, moduleKey) {
      const modules = runtime && typeof runtime.modules === 'object' ? runtime.modules : null;
      if (!modules || !(moduleKey in modules)) return true;
      return modules[moduleKey] !== false;
    }

    async function loadRuntime() {
      const { data, error } = await _supabase.rpc('get_my_erp_runtime');
      if (error) throw error;
      return data || null;
    }

    async function isElectionAdmin() {
      const { data, error } = await _supabase.rpc('is_election_admin');
      if (error) {
        console.error('vote_hub is_election_admin failed:', error);
        return false;
      }
      return data === true;
    }

    async function hasElectionRecords(coopId) {
      const safeCoopId = String(coopId || '').trim();
      if (!safeCoopId) return false;
      const { data, error } = await _supabase
        .from('elections')
        .select('id')
        .eq('coop_id', safeCoopId)
        .limit(1);
      if (error) {
        console.error('vote_hub election presence check failed:', error);
        return false;
      }
      return Array.isArray(data) && data.length > 0;
    }

    function isLocalVoteHubHost() {
      return /^(localhost|127\.0\.0\.1)$/i.test(window.location.hostname);
    }

    function buildVoteTargetUrl(key) {
      const isLocal = isLocalVoteHubHost();
      const targetMap = isLocal
        ? {
            create: '../vote/admin_setup.html?mode=create',
            setup: '../vote/admin_setup.html',
            admin: '../vote/admin.html',
            candidate: '../vote/index.html',
            portal: '../vote/index.html'
          }
        : {
            create: 'https://www.yonginsolar.kr/vote/admin_setup?mode=create',
            setup: 'https://www.yonginsolar.kr/vote/admin_setup',
            admin: 'https://www.yonginsolar.kr/vote/admin',
            candidate: 'https://www.yonginsolar.kr/vote',
            portal: 'https://www.yonginsolar.kr/vote'
          };
      return targetMap[key] || '';
    }

    async function openVoteTarget(key) {
      const targetUrl = buildVoteTargetUrl(key);
      if (!targetUrl) return;

      try {
        const { data, error } = await _supabase.auth.getSession();
        const session = data?.session;
        if (error || !session?.access_token || !session?.refresh_token) {
          location.href = targetUrl;
          return;
        }

        const nextUrl = new URL(targetUrl, window.location.href);
        const hashParams = new URLSearchParams();
        hashParams.set('access_token', session.access_token);
        hashParams.set('refresh_token', session.refresh_token);
        nextUrl.hash = hashParams.toString();
        location.href = nextUrl.toString();
      } catch (error) {
        console.error('vote_hub target handoff failed:', error);
        location.href = targetUrl;
      }
    }

    async function init() {
      const user = readStoredUser();
      if (!user) {
        location.href = `index.html?next=${encodeURIComponent(window.location.href)}`;
        return;
      }

      let runtime = null;
      try {
        runtime = await loadRuntime();
      } catch (error) {
        console.error('vote_hub runtime load failed:', error);
        location.href = `index.html?next=${encodeURIComponent(window.location.href)}`;
        return;
      }

      if (!isModuleEnabled(runtime, 'vote')) {
        document.getElementById('emptyState')?.classList.remove('d-none');
        return;
      }

      const permissionSet = readStoredPermissions();
      const hasAdminRoleFallback = (user.role === 'admin' || user.role === 'admin_all');
      const memberAdminPermission = hasPermission(permissionSet, 'member.admin') === true;
      const canOperateElection = hasAdminRoleFallback || memberAdminPermission || await isElectionAdmin();
      const hasElection = await hasElectionRecords(runtime?.coop_id);
      const visibleCards = ['cardVotePortal', 'cardCandidateApply'];
      if (canOperateElection) {
        visibleCards.unshift('cardVoteCreate', 'cardVoteSetup');
        if (hasElection) visibleCards.splice(2, 0, 'cardVoteAdmin');
      }

      visibleCards.forEach((id) => document.getElementById(id)?.classList.remove('d-none'));
      if (visibleCards.length === 0) {
        document.getElementById('emptyState')?.classList.remove('d-none');
      }
    }

    init();
  </script>
</body>
</html>
