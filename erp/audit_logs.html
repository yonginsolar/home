<script>
const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';

const KST_TZ_AUDIT = 'Asia/Seoul';
const formatAuditKstDate = (value, fallback = '') => {
  if (!value) return fallback;
  const d = value instanceof Date ? value : new Date(value);
  if (Number.isNaN(d.getTime())) return fallback;
  return new Intl.DateTimeFormat('sv-SE', { timeZone: KST_TZ_AUDIT, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
};
const formatAuditKstDateTime = (value, fallback = '') => {
  if (!value) return fallback;
  const d = value instanceof Date ? value : new Date(value);
  if (Number.isNaN(d.getTime())) return fallback;
  return new Intl.DateTimeFormat('sv-SE', { timeZone: KST_TZ_AUDIT, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).format(d).replace(',', '');
};
const sanitizeOrKeyword = (value) => String(value ?? '')
  .replace(/[,%()]/g, ' ')
  .replace(/["'`]/g, ' ')
  .replace(/\s+/g, ' ')
  .trim();

let alertModal;

function auditReadState(text, retry = false) {
  document.getElementById('auditReadStatus').textContent = text;
  document.getElementById('auditRetryButton').classList.toggle('hidden', !retry);
}

function interruptAuditRead() {
  if (!auditReadPending) return;
  auditReadSequence++;
  auditReadPending.controller.abort();
  auditReadPending = null;
  auditReadRefreshNeeded = true;
  document.getElementById('btnMore').disabled = false;
  document.getElementById('logBody').removeAttribute('aria-busy');
}

async function auditReadResult(query, request) {
  if (query?.abortSignal) query = query.abortSignal(request.controller.signal);
  let timer;
  try {
    return await Promise.race([query, new Promise((_, reject) => {
      timer = setTimeout(() => {
        const error = new Error('AUDIT_READ_TIMEOUT');
        error.code = 'AUDIT_READ_TIMEOUT';
        reject(error);request.controller.abort();
      }, Math.max(0, 15000 - (Date.now() - request.started)));
    })]);
  } finally { clearTimeout(timer); }
}

function auditFilterValues() {
  return ['filterSource','filterStart','filterEnd','filterAction','filterActor']
    .map(id => document.getElementById(id).value);
}

function auditReadCurrent(owner, sequence, filterKey, allowHidden = false) {
  return owner.userId === auditReadOwner.userId && owner.coopId === auditReadOwner.coopId
    && owner.revision === auditReadOwner.revision && sequence === auditReadSequence
    && filterKey === JSON.stringify(auditFilterValues()) && !document.hidden && (allowHidden || !window.frameElement?.hidden);
}

async function auditReadAuthorized(owner, request) {
  const work = Promise.all([_supabase.auth.getUser(), _supabase.rpc('get_my_erp_runtime')]);
  const [auth, result] = await (request ? auditReadResult(work, request) : work);
  if (auth.error || result.error) throw auth.error || result.error;
  const runtime = result.data;
  return auth.data?.user?.id === owner.userId && runtime?.coop_id === owner.coopId
    && runtime.is_active !== false && Array.isArray(runtime.effective_permissions)
    && JSON.stringify(runtime.effective_permissions.slice().sort()) === owner.permissions
    && window.ErpRuntimeGuard.isModuleEnabled(runtime,'audit')
    && window.ErpRuntimeGuard.isModuleAssigned(runtime,'audit');
}
function hasAuditViewerRoleFallback() {
  const role = String(myInfo?.role || '').toLowerCase();
  return role === 'admin' || role === 'admin_all';
}

function updateSourceHint() {
  const source = String(document.getElementById('filterSource')?.value || 'erp').toLowerCase();
  const hint = document.getElementById('sourceHint');
  if (!hint) return;
  if (source === 'admin') {
    hint.textContent = '플랫폼 변경은 전체 관리자가 현재 조합의 모듈, 상태, 대표 관리자 등을 바꾼 이력만 표시합니다.';
    return;
  }
  if (source === 'all') {
    hint.textContent = '전체는 ERP 사용자 로그와 플랫폼 변경 이력을 함께 표시합니다.';
    return;
  }
  hint.textContent = 'ERP 로그는 현재 조합의 전자결재, 직원관리, 조합원관리 등 일반 업무 이력만 표시합니다.';
} // End of updateSourceHint

function startAudit() {
  if (auditBootPending) return auditBootPending;
  const epoch = ++auditBootSequence;
  const context = {controller:new AbortController(),started:Date.now()};
  const work = Promise.resolve().then(() => bootAudit(epoch, context)).catch(() => {
    if (epoch === auditBootSequence) auditReadState('로그를 준비하지 못했습니다. 다시 확인해 주세요.', true);
  }).finally(() => { if (auditBootPending === work) auditBootPending = null; });
  auditBootPending = work;return work;
}

async function bootAudit(epoch, context) {
  if (!alertModal) alertModal = new bootstrap.Modal(document.getElementById('alertModal'));
  auditReadState('조회 권한을 확인하고 있습니다…');
  const auditUserGate = await auditReadResult(window.ErpRuntimeGuard.requireUser(_supabase, {
    alertFn: function(msg) { if(epoch === auditBootSequence)showAlert(msg); },
    redirectUrl: 'index.html'
  }), context);
  if(epoch !== auditBootSequence)return;
  if (!auditUserGate.ok) return;
  myInfo = auditUserGate.user;
  const permissions = await auditReadResult(loadPermissions(myInfo), context);
  if(epoch !== auditBootSequence)return;
  permissionSet = permissions;
  try { localStorage.setItem('erp_permissions', JSON.stringify(Array.from(permissionSet))); } catch (_) {}
  const canViewAudit = permissionSet.size > 0 ? permissionSet.has('audit.view') : hasAuditViewerRoleFallback();
  if (!canViewAudit) {
    auditReadState('감사 로그 조회 권한이 없습니다.');
    showAlert("접근 권한이 없습니다.");
    setTimeout(() => location.href = 'index.html', 1200);
    return;
  }
  const auditRuntimeGate = await auditReadResult(window.ErpRuntimeGuard.enforce(_supabase, {
    moduleKey: 'audit',
    moduleLabel: '감사 로그',
    alertFn: function(msg) { if(epoch === auditBootSequence)showAlert(msg); },
    redirectUrl: 'index.html'
  }), context);
  if(epoch !== auditBootSequence)return;
  if (!auditRuntimeGate.ok) return;
  auditReadOwner = { userId:auditUserGate.authUser.id, coopId:auditRuntimeGate.runtime.coop_id,
    permissions:JSON.stringify(auditRuntimeGate.runtime.effective_permissions.slice().sort()), revision:auditReadOwner.revision + 1 };
  if (!auditAuthBound) {_supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || (session?.user?.id && session.user.id !== auditReadOwner.userId)) {
      auditReadOwner = { userId:null, coopId:null, permissions:'', revision:auditReadOwner.revision + 1 };
      auditReadSequence++;
      auditBootSequence++;
      interruptAuditRead();auditReadRefreshNeeded = false;auditBootReady = false;
      auditBootPending = null;
      cachedLogs = [];
      currentPage = 0;
      document.getElementById('logBody').innerHTML = '';
      document.getElementById('btnMore').classList.add('hidden');
      auditReadState('로그인 상태가 바뀌었습니다. 다시 확인해 주세요.', true);
    }
  });auditAuthBound = true;}
  auditBootReady = true;
  updateSourceHint();
  window.ErpWorkspaceResume.register({modules:['audit'],ownsReadRequests:true,refresh:async()=>{
    // Preserve accumulated pages and their scroll position; only requery the first page.
    if(currentPage<=1 || auditReadRefreshNeeded)await loadLogs(auditReadRefreshNeeded ? auditRetryReset : true,{allowHidden:true});
  }});
  await loadLogs(true);
}
window.onload = startAudit;

document.getElementById('auditSearchForm').addEventListener('submit', event => {
  event.preventDefault();if (event.isComposing) return;
  if (auditBootReady) void loadLogs(true);else void startAudit();
});
document.getElementById('auditSearchForm').addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.isComposing) event.preventDefault();
});
auditInputFilter = JSON.stringify(auditFilterValues());
function auditFiltersChanged() {
  const key = JSON.stringify(auditFilterValues());
  if (key === auditInputFilter) return;
  auditInputFilter = key;interruptAuditRead();auditReadRefreshNeeded = true;auditRetryReset = true;
  auditReadState('조회 조건이 바뀌었습니다. 검색을 눌러 확인해 주세요.');
}
document.getElementById('auditSearchForm').addEventListener('input', auditFiltersChanged);
document.getElementById('auditSearchForm').addEventListener('change', auditFiltersChanged);
document.getElementById('filterSource').addEventListener('change', () => {updateSourceHint();if(auditBootReady)void loadLogs(true);});
document.getElementById('auditRetryButton').addEventListener('click', () => {if(auditBootReady)void loadLogs(auditRetryReset);else void startAudit();});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {interruptAuditRead();return;}
  if (auditBootReady && auditReadRefreshNeeded && !window.frameElement?.hidden) void loadLogs(auditRetryReset);
});
window.addEventListener('pagehide', interruptAuditRead);
if (window.frameElement) new MutationObserver(() => {

}).observe(window.frameElement,{attributes:true,attributeFilter:['hidden']});

function showAlert(msg) {
  document.getElementById('alertBody').textContent = msg || '';

}

async function loadPermissions(user) {
  const result = new Set();
  if (!user) return result;
  const data = await window.ErpRuntimeGuard.getEffectivePermissions(_supabase);
  data.forEach((permissionKey) => result.add(permissionKey));
  return result;
}

function resetFilters() {
  document.getElementById('filterSource').value = 'erp';
  document.getElementById('filterStart').value = '';
  document.getElementById('filterEnd').value = '';
  document.getElementById('filterAction').value = '';
  document.getElementById('filterActor').value = '';
  updateSourceHint();
  auditFiltersChanged();
} // End of resetFilters

function loadLogs(reset, options = {}) {
  const allowHidden = options.allowHidden === true;
  if (!auditReadOwner.userId) return Promise.resolve();
  if (document.hidden || (!allowHidden && window.frameElement?.hidden)) {
    auditReadRefreshNeeded = true;auditRetryReset = !!reset;
    auditReadState('화면으로 돌아오면 조회를 이어갑니다.', true);return Promise.resolve();
  }
  const filterKey = JSON.stringify(auditFilterValues());
  reset = Boolean(reset || filterKey !== auditAppliedFilter);
  const offset = reset ? 0 : currentPage * pageSize;
  const key = JSON.stringify([auditReadOwner.revision, filterKey, offset, allowHidden]);
  if (auditReadPending?.key === key) return auditReadPending.promise;
  interruptAuditRead();
  const sequence = ++auditReadSequence;
  const owner = { ...auditReadOwner };
  const context = {controller:new AbortController(),started:Date.now()};
  auditRetryReset = reset;auditReadRefreshNeeded = true;
  auditReadState('목록을 확인하고 있습니다…');
  const request = Promise.resolve().then(() => loadAuditPage(reset, offset, owner, sequence, filterKey, allowHidden, context));
  auditReadPending = {key, promise:request, controller:context.controller, allowHidden};
  request.finally(() => {
    if (auditReadPending?.promise === request) {
      auditReadPending = null;
      document.getElementById('btnMore').disabled = false;
      document.getElementById('logBody').removeAttribute('aria-busy');
      if (auditReadRefreshNeeded && !document.hidden && !window.frameElement?.hidden
        && document.getElementById('auditReadStatus').textContent === '목록을 확인하고 있습니다…') {
        auditReadState('조회가 중단되었습니다. 다시 확인해 주세요.', true);
      }
    }
  }).catch(() => {});
  return request;
}

async function loadAuditPage(reset, offset, owner, sequence, filterKey, allowHidden, request) {
  const isCurrent = () => auditReadCurrent(owner, sequence, filterKey, allowHidden);
  document.getElementById('btnMore').disabled = true;
  document.getElementById('logBody').setAttribute('aria-busy','true');
  try {
  const source = String(document.getElementById('filterSource').value || 'all').toLowerCase();
  const start = document.getElementById('filterStart').value;
  const end = document.getElementById('filterEnd').value;
  const action = document.getElementById('filterAction').value.trim();
  const actor = document.getElementById('filterActor').value.trim();

  const safeAction = sanitizeOrKeyword(action);
  const safeActor = sanitizeOrKeyword(actor);
  const params = {
    p_start: start ? `${start}T00:00:00+09:00` : null,
    p_end: end ? `${end}T23:59:59+09:00` : null,
    p_action: safeAction || null,
    p_actor: safeActor || null,
    p_source: source || 'all',
    p_offset: offset,
    p_limit: pageSize
  };
  const { data, error } = await auditReadResult(_supabase.rpc('erp_get_audit_logs_unified', params), request);
  if (!isCurrent()) return;
  let list = Array.isArray(data) ? data : [];
  if (error) {
    if (error.code === '42501') throw error;
    const msg = String(error?.message || '');
    const missingRpc = error?.code === 'PGRST202' || msg.includes('erp_get_audit_logs_unified');
    if (!missingRpc) throw error;
    if (source === 'admin') {
      throw new Error('AUDIT_UNIFIED_READ_UNAVAILABLE');
    }
    if (!await auditReadAuthorized(owner, request)) throw {code:'42501'};
    if (!isCurrent()) return;
    let legacyQuery = _supabase.from('erp_audit_logs').select('*').eq('coop_id', owner.coopId).order('created_at', { ascending: false });
    if (start) legacyQuery = legacyQuery.gte('created_at', `${start}T00:00:00`);
    if (end) legacyQuery = legacyQuery.lte('created_at', `${end}T23:59:59`);
    if (safeAction) legacyQuery = legacyQuery.ilike('action', `%${safeAction}%`);
    if (safeActor) legacyQuery = legacyQuery.or(`actor_name.ilike.%${safeActor}%,actor_emp_id.ilike.%${safeActor}%`);
    const { data: legacyRows, error: legacyError } = await auditReadResult(legacyQuery.range(offset, offset + pageSize - 1), request);
    if (legacyError) throw legacyError;
    list = (Array.isArray(legacyRows) ? legacyRows : []).map((r) => ({
      source: 'ERP',
      created_at: r.created_at || null,
      actor: `${r.actor_name || ''}${r.actor_emp_id ? ` (${r.actor_emp_id})` : ''}`.trim(),
      action: r.action || '',
      summary: r.summary || '',
      entity_type: r.entity_type || '',
      entity_id: r.entity_id || '',
      ip_address: ''
    }));
  }
  if (!isCurrent()) return;
  if (!await auditReadAuthorized(owner, request)) {
    if (isCurrent()) {
      cachedLogs = [];
      document.getElementById('logBody').innerHTML = '';
      currentPage = 0;
      document.getElementById('btnMore').classList.add('hidden');
      auditBootReady = false;
      auditReadState('현재 조합과 조회 권한을 다시 확인해 주세요.', true);
    }
    return;
  }
  if (!isCurrent()) return;
  cachedLogs = reset ? list : cachedLogs.concat(list);
  auditAppliedFilter = filterKey;
  renderLogs(list, reset);
  currentPage = offset / pageSize + 1;
  auditReadRefreshNeeded = false;
  auditReadState(`${cachedLogs.length}건 표시`);

  document.getElementById('btnMore').classList.toggle('hidden', list.length < pageSize);
  } catch (error) {
    if (!isCurrent()) return;
    if (error?.code === '42501') {
      auditBootReady = false;
      cachedLogs = [];
      document.getElementById('logBody').innerHTML = '';
      document.getElementById('btnMore').classList.add('hidden');
    }
    auditReadState(error?.code === '42501' ? '현재 조합과 조회 권한을 다시 확인해 주세요.' :
      error?.code === 'AUDIT_READ_TIMEOUT' ? '조회가 지연되고 있습니다. 다시 확인해 주세요.' :
      '목록을 불러오지 못했습니다. 다시 확인해 주세요.', true);
  }
}

function renderLogs(list, reset) {
  const body = document.getElementById('logBody');
  if (reset) body.innerHTML = '';
  if (!list || list.length === 0) {
    if (reset) body.innerHTML = '<tr><td colspan="7" class="text-center text-muted p-4">데이터가 없습니다.</td></tr>';
    return;
  }
  list.forEach(log => {
    const tr = document.createElement('tr');
    const sourceRaw = String(log.source || '').toUpperCase();
    const sourceLabel = sourceRaw === 'ADMIN' ? '플랫폼' : 'ERP';
    const sourceBadge = sourceRaw === 'ADMIN'
      ? '<span class="badge text-bg-dark">플랫폼</span>'
      : '<span class="badge text-bg-primary">ERP</span>';
    const created = formatAuditKstDateTime(log.created_at, '');
    const actor = String(log.actor || '').trim();
    const action = String(log.action || '').trim();
    const summary = String(log.summary || '').trim();
    const entityType = String(log.entity_type || '').trim();
    const entityId = String(log.entity_id || '').trim();
    const cells = [
      sourceLabel,
      created,
      actor,
      action,
      summary,
      entityType,
      entityId
    ];
    cells.forEach((value, idx) => {
      const td = document.createElement('td');
      if (idx === 0) td.innerHTML = sourceBadge;
      else td.textContent = value;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

function exportCsv() {
  if (!cachedLogs || cachedLogs.length === 0) return showAlert("내보낼 데이터가 없습니다.");
  const headers = ['source','created_at','actor','action','summary','entity_type','entity_id','ip_address'];
  const protectCsvCell = (value) => {
    const str = String(value ?? '');
    return /^[=+\-@]/.test(str) ? `'${str}` : str;
  };
  const rows = cachedLogs.map(r => [
    protectCsvCell(r.source || ''),
    protectCsvCell(r.created_at || ''),
    protectCsvCell(r.actor || ''),
    protectCsvCell(r.action || ''),
    protectCsvCell(r.summary || ''),
    protectCsvCell(r.entity_type || ''),
    protectCsvCell(r.entity_id || ''),
    protectCsvCell(r.ip_address || '')
  ]);
  const csvEscape = (val) => {
    const str = String(val ?? '');
    if (/[",\n]/.test(str)) return `"${str.replace(/"/g, '""')}"`;
    return str;
  };
  const csv = [headers.join(',')]
    .concat(rows.map(r => r.map(csvEscape).join(',')))
    .join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const dateTag = formatAuditKstDate(new Date());
  a.download = `audit_logs_${dateTag}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
