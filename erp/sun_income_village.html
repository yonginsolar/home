<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="sun-village-version" content="1.0.0">
  <title>햇빛소득마을 운영관리</title>
  <link rel="stylesheet" href="sun_income_village.css?v=1.0.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2" defer></script>
  <script src="../shared/route_guard.js?v=20260408-1" defer></script>
  <script src="sun_income_village.js?v=1.0.0" defer></script>
</head>
<body>
  <a class="skip" href="#content">본문으로 바로가기</a>
  <header class="topbar">
    <div class="brand"><span aria-hidden="true">🌻</span><div><strong>햇빛소득마을 운영관리</strong><small>협동조합 ERP 간편형 · 운영용 1차 · v1.0.0</small></div></div>
    <div class="tools"><label>화면모드 <select id="theme"><option value="auto">자동</option><option value="light">낮</option><option value="dark">밤</option></select></label><a href="sun_income_village_demo.html">데모 보기</a><a href="index.html">ERP 메인</a></div>
  </header>
  <div id="message" class="message" role="status" aria-live="polite">로그인을 확인하고 있습니다…</div>
  <section id="welcome" class="welcome" hidden></section>
  <div id="workspace" hidden>
    <section class="scopebar" aria-label="현재 작업 범위">
      <label>운영협동조합 <select id="operator" aria-label="운영협동조합"></select></label>
      <label>관리 대상 <select id="village" aria-label="관리 대상 마을"><option value="">전체 운영 현황</option></select></label>
      <strong id="scopeLabel">전체 운영 현황</strong><button id="reload" type="button">새로고침</button>
    </section>
    <div class="layout"><nav id="nav" aria-label="업무 메뉴"></nav><main id="content" tabindex="-1"></main></div>
  </div>
  <dialog id="editor" aria-labelledby="editorTitle">
    <form id="editorForm">
      <div class="dialog-head"><h2 id="editorTitle"></h2><button type="button" id="closeEditor" aria-label="닫기">닫기</button></div>
      <p id="editorScope" class="scope-note"></p>
      <div id="editorFields" class="form-grid"></div>
      <p id="editorError" class="error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="save" class="primary" type="submit">이 마을에 저장</button></div>
    </form>
  </dialog>
  <dialog id="detail" aria-labelledby="detailTitle"><div class="dialog-head"><h2 id="detailTitle">상세 내용</h2><button id="closeDetail" type="button">닫기</button></div><div id="detailBody"></div></dialog>
  <noscript>이 화면은 JavaScript가 필요합니다.</noscript>
</body>
</html>
