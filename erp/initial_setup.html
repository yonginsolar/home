</head><body class="erp-unified erp-pc-workspace"><main class="setup-wrap">
<h1 class="h4 fw-bold">초기 설정</h1><p id="setupStatus" role="status">접속 권한을 확인하고 있습니다.</p>
<div id="setupManager" hidden></div>
<div id="setupContent" hidden>
<nav class="setup-tabs d-flex" aria-label="초기 설정 영역" data-workspace-submenu>
<button class="btn btn-outline-secondary active" data-area="basic">조합 기본정보</button><button class="btn btn-outline-secondary" data-area="capital">출자 기준</button>
<a class="btn btn-outline-primary" id="setupSiteLink" href="/erp/admin_member.html?scope=site_admin&amp;tab=site">홈페이지 관리</a><a class="btn btn-outline-primary" id="setupLegalLink" href="/erp/admin_member.html?scope=site_admin&amp;tab=site&amp;sub=legal&amp;document=signup_purpose">가입 안내·약관</a></nav>
<section id="setupBasic" data-panel="basic">
<h2 class="h5">조합 기본정보</h2><form id="setupBasicForm"><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="setupName">조합명</label><input class="form-control" id="setupName" data-key="company_name" maxlength="200" required></div>
<div class="col-md-6"><label class="form-label" for="setupCeo">대표자</label><input class="form-control" id="setupCeo" data-key="chairman_name" maxlength="100"></div>
<div class="col-md-6"><label class="form-label" for="setupBiz">사업자등록번호</label><input class="form-control" id="setupBiz" data-key="bizNum" maxlength="12"></div>
<div class="col-md-6"><label class="form-label" for="setupEstDate">설립일</label><input class="form-control" id="setupEstDate" data-key="estDate" type="date"></div>
<div class="col-12"><label class="form-label" for="setupAddress">주소</label><input class="form-control" id="setupAddress" data-key="company_address" maxlength="500"></div>
<div class="col-md-4"><label class="form-label" for="setupContact">공식 담당자</label><input class="form-control" id="setupContact" data-key="company_contact_name" maxlength="100"></div>
<div class="col-md-4"><label class="form-label" for="setupPhone">공식 전화번호</label><input class="form-control" id="setupPhone" data-key="company_contact_phone" type="tel" maxlength="30"></div>
<div class="col-md-4"><label class="form-label" for="setupEmail">공식 이메일</label><input class="form-control" id="setupEmail" data-key="company_contact_email" type="email" maxlength="254"></div>
</div><button class="btn btn-primary mt-3" type="submit">기본정보 저장</button></form>
<hr><div id="setCompany"><h2 class="h5">조합 로고·파비콘</h2><div id="setupBrandStatus" class="alert alert-light border" role="status" hidden><div class="d-flex gap-3 align-items-center flex-wrap"><span id="setupBrandStatusText"></span><button class="btn btn-outline-primary btn-sm" type="button" id="setupBrandRetry" data-erp-query-control hidden>다시 불러오기</button></div></div><div class="row g-3" id="companyBrandingFields"></div><button class="btn btn-outline-primary mt-3" type="button" id="setupBrandSave">로고·파비콘 저장</button></div>
<hr><div id="certificateSetupContainer"></div>
<aside class="border rounded-3 p-3 mt-4"><h2 class="h6 fw-bold">홈페이지 완성 확인</h2><ol class="mb-0 ps-3" style="line-height:1.9"><li>조합 기본정보·로고·파비콘과 홈페이지의 글·사진·연락처를 설정합니다.</li><li>가입 안내·개인정보 동의·이용약관·개인정보 처리방침은 내용을 확인한 뒤 등록·적용합니다.</li><li>출자 기준·납입 계좌·대표자·직인을 등록합니다. 가입한 조합원은 납입 반영 후 본인의 출자증서를 확인하고 인쇄·PDF 저장할 수 있습니다.</li></ol></aside>
</section>
<section data-panel="capital" hidden><h2 class="h5">출자 기준</h2>
<form id="setupCapitalForm"><div class="row g-3"><div class="col-md-6"><label for="setupMinimum" class="form-label">최소 출자금 (원)</label><input id="setupMinimum" class="form-control" inputmode="numeric" data-number-group required></div><div class="col-md-6"><label for="setupUnit" class="form-label">출자 1좌 금액 (원)</label><input id="setupUnit" class="form-control" inputmode="numeric" data-number-group required></div></div><button class="btn btn-primary mt-3" type="submit">출자 기준 저장</button></form></section>
</div>
</main></body></html>
