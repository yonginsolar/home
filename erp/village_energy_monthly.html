        },refresh:loadRecords});
        await loadRecords().catch(()=>{});
      }catch(error){message(`발전·정산 자료를 불러오지 못했습니다: ${error?.message||'다시 시도해 주세요.'}`,'danger');}
    }
    $('entryForm').addEventListener('submit',async event=>{
      event.preventDefault();if(saving||!canEdit||!coopId||!currentEntryDraft)return;
      retainEntryDraft();if(!entryDirty())return;
      const request={context:recordContext(),draft:currentEntryDraft,id:currentId,snapshot:entrySnapshot(),editorEpoch};
      saving=true;syncEntryControls();
      try{
        const month=$('monthStart').value;if(!/^\d{4}-\d{2}$/.test(month))throw new Error('기준월을 확인해 주세요.');
        const plantId=$('plantId').value;if(!plants.some(p=>p.id===plantId))throw new Error('현재 조합의 발전소를 선택해 주세요.');
        const row={coop_id:coopId,plant_id:plantId,month_start:`${month}-01`,generation_kwh:emptyToNumber('generationKwh',true),smp_amount:emptyToNumber('smpAmount'),rec_amount:emptyToNumber('recAmount'),other_amount:emptyToNumber('otherAmount'),generation_source:'manual',settlement_source:'manual',settlement_confirmed:$('settlementConfirmed').checked,note:$('note').value.trim()};
        if([row.generation_kwh,row.smp_amount,row.rec_amount,row.other_amount].every(value=>value==null))throw new Error('발전량 또는 정산액을 하나 이상 입력해 주세요.');
        if(row.note.length>2000)throw new Error('메모는 2,000자 이내로 입력해 주세요.');
        request.row={...row};
        const result=request.id?await db.from('sun_village_energy_monthly').update(row).eq('id',request.id).eq('coop_id',request.context.coopId).select('id'):await db.from('sun_village_energy_monthly').insert(row).select('id');
        if(result.error)throw result.error;if(!result.data?.[0]?.id)throw new Error('저장된 기록이 없습니다. 권한과 현재 조합을 확인해 주세요.');
        settleEntrySaved(request,result.data[0].id);
        if(!sameRecordContext(request.context))return;
        invalidateRecordReads();
        const currentEditor=()=>sameRecordContext(request.context)&&currentEntryDraft===request.draft&&editorEpoch===request.editorEpoch;
        if(currentEditor())message(entryDirty()?'저장했습니다. 추가로 수정한 내용은 아직 저장되지 않았습니다.':'저장했습니다.','success');
        try{await loadRecords({force:true});}
        catch(error){if(currentEditor())message('저장했습니다. 목록은 다시 확인해 주세요.','warning');}
      }catch(error){if(sameRecordContext(request.context)&&currentEntryDraft===request.draft&&editorEpoch===request.editorEpoch)message(`저장하지 못했습니다: ${error?.message||'다시 시도해 주세요.'}`,'danger');}
      finally{saving=false;syncEntryControls();}
    });
    $('entryForm').addEventListener('input',()=>{++entryInputRevision;retainEntryDraft();syncEntryControls();});
    $('entryForm').addEventListener('change',()=>{++entryInputRevision;retainEntryDraft();syncEntryControls();});
    $('discardEntryDraft').addEventListener('click',async()=>{
      if(saving||!entryDirty())return;
      const draft=currentEntryDraft,epoch=editorEpoch,revision=entryInputRevision,context=recordContext(),snapshot=entrySnapshot();
      if(!await window.CoopDialog.confirm('이 초안을 버릴까요?'))return;
      if(saving||!sameRecordContext(context)||currentEntryDraft!==draft||editorEpoch!==epoch||entryInputRevision!==revision||!sameEntry(snapshot,entrySnapshot()))return;
      draft.value={...draft.baseline};
      entryFields.forEach(field=>{if(field==='settlementConfirmed')$(field).checked=draft.value[field];else $(field).value=draft.value[field];});
      ++editorEpoch;syncEntryControls();
    });
    window.addEventListener('beforeunload',event=>{
      retainEntryDraft();
      if(saving||[...entryDrafts.values()].some(draft=>draft.owner===entryOwner()&&entryDirty(draft))){event.preventDefault();event.returnValue='';}
    });
    window.addEventListener('pagehide',()=>{retainEntryDraft();++editorEpoch;invalidateRecordReads();});
    if(window.frameElement)new MutationObserver(()=>{
      if(window.frameElement.hidden){retainEntryDraft();++editorEpoch;invalidateRecordReads();}
    }).observe(window.frameElement,{attributes:true,attributeFilter:['hidden']});
    $('newButton').addEventListener('click',resetForm);$('reloadButton').addEventListener('click',()=>{void loadRecords().catch(()=>{});});$('plantFilter').addEventListener('change',renderRows);
    $('plantAddButton').addEventListener('click',()=>openPlant());
    $('plantCancelButton').addEventListener('click',closePlant);
    $('plantForm').addEventListener('submit',async event=>{
      event.preventDefault();if(!canManagePlants||savingPlant)return;
      savingPlant=true;$('plantSaveButton').disabled=true;
      try{
        const name=$('plantName').value.trim(),locationText=$('plantLocation').value.trim();
        const capacityRaw=ERPNumberInput.raw($('plantCapacity').value).trim(),capacity=capacityRaw?Number(capacityRaw):null;
        if(name.length<2||name.length>100||locationText.length>200||
          (capacity!==null&&(!Number.isFinite(capacity)||capacity<0||capacity>1000000)))throw new Error('발전소명·위치·설비용량을 확인해 주세요.');
        const {error}=await db.rpc('sun_village_save_plant',{p_id:editingPlantId||null,p_name:name,p_location:locationText||null,p_capacity:capacity,p_status:$('plantStatus').value});
        if(error)throw error;closePlant();await loadPlants();renderRows();message('발전소 기본정보를 저장했습니다.','success');
      }catch(error){message(`발전소를 저장하지 못했습니다: ${error?.message||'다시 시도해 주세요.'}`,'danger');}
      finally{savingPlant=false;$('plantSaveButton').disabled=false;}
    });
    boot();
  </script>
</body>
</html>
