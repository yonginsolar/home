<!doctype html>
<!-- Version: v1.0.1 | 2026-09-29 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>발전·정산 현황</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./erp_theme.css?v=1.1.1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"></script>
  <script src="./erp_runtime_guard.js?v=20260929-2"></script>
  <style>
    body{background:#f8fafc;padding:22px;word-break:keep-all}
    .page{max-width:1120px;margin:auto}.card{border:0;box-shadow:0 9px 30px rgba(15,23,42,.06)}
    .money{text-align:right;font-variant-numeric:tabular-nums}.table td,.table th{vertical-align:middle}
    .table-wrap{overflow-x:auto}.table{min-width:760px}.help{color:#64748b;font-size:.9rem}
    @media(max-width:640px){body{padding:12px}.card-body{padding:18px!important}}
  </style>
</head>
<body class="erp-unified erp-pc-workspace">
  <main class="page">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div><h1 class="h3 mb-1">발전·정산 현황</h1><p class="help mb-0">발전소별 월간 발전량과 전력판매 정산액을 기록합니다.</p></div>
      <div class="d-flex gap-2"><a href="accounting.html" class="btn btn-outline-primary">회계관리</a><a href="index.html" class="btn btn-outline-secondary">ERP 메인</a></div>
    </div>
    <div id="status" class="alert alert-info" role="status">자료를 불러오는 중입니다.</div>
    <section id="workspace" class="d-none">
      <div class="card mb-4"><div class="card-body p-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h5 mb-0">발전소</h2><button id="plantAddButton" type="button" class="btn btn-outline-primary btn-sm d-none">발전소 등록</button>
        </div>
        <div id="plantRows" class="d-flex flex-wrap gap-2"></div>
        <form id="plantForm" class="d-none mt-3 border-top pt-3">
          <div class="row g-3">
            <div class="col-md-5"><label for="plantName" class="form-label">발전소명</label><input id="plantName" class="form-control" required minlength="2" maxlength="100"></div>
            <div class="col-md-7"><label for="plantLocation" class="form-label">위치</label><input id="plantLocation" class="form-control" maxlength="200"></div>
            <div class="col-md-4"><label for="plantCapacity" class="form-label">설비용량 (kW)</label><input id="plantCapacity" type="number" min="0" max="1000000" step="0.001" class="form-control"></div>
            <div class="col-md-4"><label for="plantStatus" class="form-label">진행 상태</label><select id="plantStatus" class="form-select"><option>계획중</option><option>건설중</option><option>운영중</option></select></div>
          </div>
          <div class="d-flex gap-2 mt-3"><button id="plantSaveButton" type="submit" class="btn btn-primary">발전소 저장</button><button id="plantCancelButton" type="button" class="btn btn-outline-secondary">취소</button></div>
        </form>
      </div></div>
      <div class="card mb-4"><div class="card-body p-4">
        <h2 id="formTitle" class="h5 mb-3">월간 기록</h2>
        <form id="entryForm">
          <div class="row g-3">
            <div class="col-md-5"><label for="plantId" class="form-label">발전소</label><select id="plantId" class="form-select" required></select></div>
            <div class="col-md-3"><label for="monthStart" class="form-label">기준월</label><input id="monthStart" type="month" class="form-control" required></div>
            <div class="col-md-4"><label for="generationKwh" class="form-label">발전량 (kWh)</label><input id="generationKwh" type="number" min="0" step="0.001" inputmode="decimal" class="form-control"></div>
            <div class="col-md-4"><label for="smpAmount" class="form-label">SMP 정산액 (원)</label><input id="smpAmount" type="number" step="1" inputmode="numeric" class="form-control"></div>
            <div class="col-md-4"><label for="recAmount" class="form-label">REC 정산액 (원)</label><input id="recAmount" type="number" step="1" inputmode="numeric" class="form-control"></div>
            <div class="col-md-4"><label for="otherAmount" class="form-label">기타 전력판매액 (원)</label><input id="otherAmount" type="number" step="1" inputmode="numeric" class="form-control"></div>
            <div class="col-12"><label for="note" class="form-label">정산·가동 메모</label><textarea id="note" class="form-control" rows="2" maxlength="2000" placeholder="정산서 기준이나 고장·가동중단 사항 등"></textarea></div>
            <div class="col-12"><label class="form-check"><input id="settlementConfirmed" class="form-check-input" type="checkbox"><span class="form-check-label">정산서를 확인했습니다</span></label></div>
          </div>
          <div class="d-flex flex-wrap align-items-center gap-2 mt-4">
            <button id="saveButton" type="submit" class="btn btn-primary">기록 저장</button>
            <button id="newButton" type="button" class="btn btn-outline-secondary">새 기록</button>
            <span class="help">같은 발전소·같은 달은 한 건만 기록됩니다. 여기서 저장해도 회계 전표는 생성되지 않습니다.</span>
          </div>
        </form>
      </div></div>
      <div class="card"><div class="card-body p-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h2 class="h5 mb-0">월별 기록</h2><div class="d-flex gap-2"><select id="plantFilter" class="form-select form-select-sm" aria-label="발전소별 보기"><option value="">전체 발전소</option></select><button id="reloadButton" type="button" class="btn btn-outline-secondary btn-sm text-nowrap">새로고침</button></div></div>
        <div class="table-wrap"><table class="table table-hover"><thead><tr><th>기준월</th><th>발전소</th><th class="money">발전량</th><th class="money">SMP</th><th class="money">REC</th><th class="money">기타</th><th>정산</th><th>수정</th></tr></thead><tbody id="rows"><tr><td colspan="8">자료를 불러오는 중입니다.</td></tr></tbody></table></div>
        <div id="rowCount" class="help"></div>
      </div></div>
    </section>
  </main>
  <script>
    const db = window.supabase.createClient('https://ifdqlwxgqgsvnawmhlfc.supabase.co', 'sb_publishable_lkVhLJDe8WmOPzsWOMkKdg_pjVwVS-h', {global:{headers:{'x-erp-host':String(location.hostname||'').trim().toLowerCase()}}});
    const $ = id => document.getElementById(id);
    const status = $('status');
    let coopId = '';
    let currentId = '';
    let canEdit = false;
    let canManagePlants = false;
    let saving = false;
    let savingPlant = false;
    let editingPlantId = '';
    let plants = [];
    let records = [];
    function message(text, kind='info') {status.className=`alert alert-${kind}`;status.textContent=text;status.classList.remove('d-none');}
    function emptyToNumber(id, decimal=false) {
      const raw=$(id).value.trim();
      if (!raw) return null;
      const value=Number(raw);
      if (!Number.isFinite(value) || (decimal ? value<0 : !Number.isSafeInteger(value))) throw new Error(`${$(id).closest('div').querySelector('label')?.textContent||'금액'}을 확인해 주세요.`);
      return value;
    }
    function money(value) {return value==null?'—':Number(value).toLocaleString('ko-KR');}
    function renderPlants() {
      const host=$('plantRows');host.replaceChildren();
      if(!plants.length){const empty=document.createElement('span');empty.className='help';empty.textContent=canManagePlants?'등록된 발전소가 없습니다. 발전소를 먼저 등록해 주세요.':'등록된 발전소가 없습니다. 마을 기본정보 관리자에게 등록을 요청해 주세요.';host.appendChild(empty);return;}
      plants.forEach(plant=>{
        const item=document.createElement('div');item.className='border rounded-3 px-3 py-2';
        const name=document.createElement('strong');name.textContent=plant.name;item.appendChild(name);
        const detail=document.createElement('span');detail.className='help ms-2';detail.textContent=[plant.location,plant.capacity==null?'':`${money(plant.capacity)} kW`,plant.status].filter(Boolean).join(' · ');item.appendChild(detail);
        if(canManagePlants){const edit=document.createElement('button');edit.type='button';edit.className='btn btn-link btn-sm';edit.textContent='수정';edit.addEventListener('click',()=>openPlant(plant));item.appendChild(edit);}
        host.appendChild(item);
      });
    }
    function openPlant(plant=null) {
      editingPlantId=plant?.id||'';$('plantForm').reset();
      $('plantName').value=plant?.name||'';$('plantLocation').value=plant?.location||'';
      $('plantCapacity').value=plant?.capacity??'';$('plantStatus').value=['계획중','건설중','운영중'].includes(plant?.status)?plant.status:'계획중';
      $('plantForm').classList.remove('d-none');$('plantName').focus();
    }
    function closePlant() {editingPlantId='';$('plantForm').reset();$('plantForm').classList.add('d-none');}
    async function loadPlants() {
      const {data,error}=await db.from('site_power_plants').select('id,name,location,capacity,status,coop_id').eq('coop_id',coopId).order('display_order',{ascending:true}).order('name');
      if(error)throw error;plants=(data||[]).filter(row=>row.id&&row.name);
      const selectedPlant=$('plantId').value,selectedFilter=$('plantFilter').value;
      $('plantId').replaceChildren();$('plantFilter').replaceChildren();
      const first=document.createElement('option');first.value='';first.textContent='발전소 선택';$('plantId').appendChild(first);
      const all=document.createElement('option');all.value='';all.textContent='전체 발전소';$('plantFilter').appendChild(all);
      plants.forEach(plant=>{const option=document.createElement('option');option.value=plant.id;option.textContent=plant.name;$('plantId').appendChild(option);$('plantFilter').appendChild(option.cloneNode(true));});
      if(plants.some(p=>p.id===selectedPlant))$('plantId').value=selectedPlant;
      if(plants.some(p=>p.id===selectedFilter))$('plantFilter').value=selectedFilter;
      $('saveButton').disabled=!canEdit||!plants.length;renderPlants();
    }
    function resetForm() {
      currentId='';$('entryForm').reset();$('formTitle').textContent='월간 기록';
      const today=new Date();$('monthStart').value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
      if (plants[0]) $('plantId').value=plants[0].id;
      $('newButton').classList.add('d-none');
    }
    function renderRows() {
      const filter=$('plantFilter').value;
      const visible=records.filter(row=>!filter||row.plant_id===filter);
      const body=$('rows');body.replaceChildren();
      if (!visible.length) {const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=8;td.textContent=plants.length?'등록된 월간 기록이 없습니다.':'현재 조합에 등록된 발전소가 없습니다.';tr.appendChild(td);body.appendChild(tr);}
      visible.forEach(row=>{
        const tr=document.createElement('tr');
        const cells=[row.month_start.slice(0,7),plants.find(p=>p.id===row.plant_id)?.name||'등록 발전소',money(row.generation_kwh),money(row.smp_amount),money(row.rec_amount),money(row.other_amount),row.settlement_confirmed?'확인':'미확인'];
        cells.forEach((value,index)=>{const td=document.createElement('td');td.textContent=value;if(index>=2&&index<=5)td.className='money';tr.appendChild(td);});
        const td=document.createElement('td');
        const button=document.createElement('button');button.type='button';button.className='btn btn-outline-primary btn-sm';button.textContent='열기';button.addEventListener('click',()=>openRecord(row));td.appendChild(button);tr.appendChild(td);body.appendChild(tr);
      });
      $('rowCount').textContent=`${visible.length}건 표시 · 최근 100건까지 조회`;
    }
    function openRecord(row) {
      currentId=row.id;$('formTitle').textContent='월간 기록 수정';$('plantId').value=row.plant_id;$('monthStart').value=row.month_start.slice(0,7);
      $('generationKwh').value=row.generation_kwh??'';$('smpAmount').value=row.smp_amount??'';$('recAmount').value=row.rec_amount??'';$('otherAmount').value=row.other_amount??'';
      $('note').value=row.note||'';$('settlementConfirmed').checked=!!row.settlement_confirmed;$('newButton').classList.remove('d-none');
      $('entryForm').scrollIntoView({behavior:'smooth',block:'start'});
    }
    async function loadRecords() {
      let query=db.from('sun_village_energy_monthly').select('id,plant_id,month_start,generation_kwh,smp_amount,rec_amount,other_amount,settlement_confirmed,note').eq('coop_id',coopId).order('month_start',{ascending:false}).limit(100);
      const {data,error}=await query;if(error) throw error;records=data||[];renderRows();
    }
    async function boot() {
      try {
        const gate=await window.ErpRuntimeGuard.requireUser(db,{redirectUrl:'index.html',alertFn:message});if(!gate.ok)return;
        const [permissions,runtime,workspace,coop]=await Promise.all([
          window.ErpRuntimeGuard.getEffectivePermissions(db),
          window.ErpRuntimeGuard.enforce(db,{moduleKey:'accounting',moduleLabel:'발전·정산 현황',redirectUrl:'index.html',alertFn:message}),
          db.rpc('sun_village_workspace_context'),db.rpc('get_my_coop_id')
        ]);
        if(!runtime.ok)return;if(workspace.error)throw workspace.error;if(coop.error)throw coop.error;
        const current=(workspace.data?.workspaces||[]).find(item=>item?.is_current===true);
        if(!current||current.is_management_coop!==false||String(current.coop_id)!==String(coop.data)){location.replace('index.html');return;}
        if(!permissions.includes('accounting.view')&&!permissions.includes('accounting.edit')){message('회계 조회 권한이 없습니다.','warning');return;}
        coopId=String(coop.data);canEdit=permissions.includes('accounting.edit');
        canManagePlants=permissions.includes('hr.admin');
        if(canManagePlants)$('plantAddButton').classList.remove('d-none');
        await loadPlants();
        if(!canEdit)$('entryForm').classList.add('d-none');
        resetForm();await loadRecords();$('workspace').classList.remove('d-none');status.classList.add('d-none');
      }catch(error){message(`발전·정산 자료를 불러오지 못했습니다: ${error?.message||'다시 시도해 주세요.'}`,'danger');}
    }
    $('entryForm').addEventListener('submit',async event=>{
      event.preventDefault();if(saving||!canEdit||!coopId)return;saving=true;$('saveButton').disabled=true;
      try{
        const month=$('monthStart').value;if(!/^\d{4}-\d{2}$/.test(month))throw new Error('기준월을 확인해 주세요.');
        const plantId=$('plantId').value;if(!plants.some(p=>p.id===plantId))throw new Error('현재 조합의 발전소를 선택해 주세요.');
        const row={coop_id:coopId,plant_id:plantId,month_start:`${month}-01`,generation_kwh:emptyToNumber('generationKwh',true),smp_amount:emptyToNumber('smpAmount'),rec_amount:emptyToNumber('recAmount'),other_amount:emptyToNumber('otherAmount'),generation_source:'manual',settlement_source:'manual',settlement_confirmed:$('settlementConfirmed').checked,note:$('note').value.trim()};
        if([row.generation_kwh,row.smp_amount,row.rec_amount,row.other_amount].every(value=>value==null))throw new Error('발전량 또는 정산액을 하나 이상 입력해 주세요.');
        if(row.note.length>2000)throw new Error('메모는 2,000자 이내로 입력해 주세요.');
        const result=currentId?await db.from('sun_village_energy_monthly').update(row).eq('id',currentId).eq('coop_id',coopId).select('id'):await db.from('sun_village_energy_monthly').insert(row).select('id');
        if(result.error)throw result.error;if(!result.data?.length)throw new Error('저장된 기록이 없습니다. 권한과 현재 조합을 확인해 주세요.');
        await loadRecords();resetForm();message('월간 발전·정산 기록을 저장했습니다.','success');
      }catch(error){message(`저장하지 못했습니다: ${error?.message||'다시 시도해 주세요.'}`,'danger');}
      finally{saving=false;$('saveButton').disabled=!plants.length;}
    });
    $('newButton').addEventListener('click',resetForm);$('reloadButton').addEventListener('click',()=>loadRecords().catch(error=>message(`새로고침 실패: ${error?.message||error}`,'danger')));$('plantFilter').addEventListener('change',renderRows);
    $('plantAddButton').addEventListener('click',()=>openPlant());
    $('plantCancelButton').addEventListener('click',closePlant);
    $('plantForm').addEventListener('submit',async event=>{
      event.preventDefault();if(!canManagePlants||savingPlant)return;
      savingPlant=true;$('plantSaveButton').disabled=true;
      try{
        const name=$('plantName').value.trim(),locationText=$('plantLocation').value.trim();
        const capacityRaw=$('plantCapacity').value.trim(),capacity=capacityRaw?Number(capacityRaw):null;
        if(name.length<2||name.length>100||locationText.length>200||
          (capacity!==null&&(!Number.isFinite(capacity)||capacity<0||capacity>1000000)))throw new Error('발전소명·위치·설비용량을 확인해 주세요.');
        const {error}=await db.rpc('sun_village_save_plant',{p_id:editingPlantId||null,p_name:name,p_location:locationText||null,p_capacity:capacity,p_status:$('plantStatus').value});
        if(error)throw error;closePlant();await loadPlants();renderRows();message('발전소 기본정보를 저장했습니다.','success');
      }catch(error){message(`발전소를 저장하지 못했습니다: ${error?.message||'다시 시도해 주세요.'}`,'danger');}
      finally{savingPlant=false;$('plantSaveButton').disabled=false;}
    });
    boot();
  </script>
</body>
</html>
