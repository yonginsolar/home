<!DOCTYPE html>
<!--
Version: v1.0.3
Change: Replace employee sample identity values with neutral placeholders while keeping only verified detail fields.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직원 상세 예시 화면</title>
  <script>console.log('[Version] v1.0.3 | coop_system_employee_preview.html');</script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
  <link href="https://webfontworld.github.io/gmarket/GmarketSans.css" rel="stylesheet">
  <style>
    body { margin:0; font-family:'Pretendard',sans-serif; background:#f8fafc; color:#0f172a; }
    .shell { padding:18px; }
    .panel { background:#fff; border:1px solid #e2e8f0; border-radius:18px; box-shadow:0 10px 28px rgba(15,23,42,0.05); overflow:hidden; }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid #eef2f7; }
    .panel-head h1 { margin:0; font-size:1.02rem; font-family:'GmarketSans',sans-serif; }
    .badge { background:#edf7ee; color:#1f7a33; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; }
    .wrap { padding:18px; display:grid; grid-template-columns:240px 1fr; gap:16px; }
    .card { border:1px solid #e2e8f0; border-radius:14px; background:#fff; padding:14px; }
    .summary-grid, .detail-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:14px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .tabs span { font-size:11px; padding:6px 10px; border-radius:999px; background:#f1f5f9; color:#475569; font-weight:700; }
    .tabs .active { background:#dcfce7; color:#166534; }
    .field { border:1px solid #e2e8f0; border-radius:12px; padding:10px 12px; background:#f8fafc; }
    .field b { display:block; font-size:11px; color:#64748b; margin-bottom:4px; }
    .field span { font-size:13px; }
    @media (max-width: 860px) { .wrap,.summary-grid,.detail-grid { grid-template-columns:1fr; } }
  </style>
  <script src="shared/theme.js?v=20260802-1" data-theme-toggle="off"></script>
  <link href="shared/theme.css?v=20260829-1" rel="stylesheet">
</head>
<body>
  <div class="shell">
    <section class="panel">
      <div class="panel-head">
        <h1>직원 상세 화면 예시</h1>
        <span class="badge">admin_employee.html 기준</span>
      </div>
      <div class="wrap">
        <div class="card">
          <strong style="display:block; font-size:1rem; margin-bottom:4px;">김협동</strong>
          <div style="color:#64748b; font-size:13px; line-height:1.7;">사무국장 · 기획운영팀</div>
          <div class="summary-grid" style="grid-template-columns:1fr;">
            <div class="field"><b>사번</b><span>E-2026-014</span></div>
            <div class="field"><b>재직 상태</b><span>재직 중</span></div>
            <div class="field"><b>결재 레벨</b><span>2 · 중간결재</span></div>
          </div>
        </div>
        <div>
          <div class="tabs"><span class="active">기본정보</span><span>급여</span><span>연차</span><span>전자결재</span></div>
          <div class="detail-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));">
            <div class="field"><b>이메일</b><span>sample.member@example.com</span></div>
            <div class="field"><b>연락처</b><span>010-1234-5678</span></div>
            <div class="field"><b>입사일</b><span>2024-03-04</span></div>
            <div class="field"><b>직급</b><span>사무국장</span></div>
            <div class="field"><b>부서</b><span>기획운영팀</span></div>
            <div class="field"><b>권한</b><span>전체 관리자</span></div>
          </div>
          <div class="summary-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));">
            <div class="field"><b>이번 달 급여</b><span>3,420,000원</span></div>
            <div class="field"><b>잔여 연차</b><span>11.5일</span></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
