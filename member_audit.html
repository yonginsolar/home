<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>감사 열람</title>
  <script src="shared/theme.js?v=20260802-1" data-theme-toggle="off"></script>
  <style>
    :root { --bg:#f3f6fa; --panel:#fff; --ink:#182334; --muted:#435267; --line:#c6d2df; --accent:#145ca8; --soft:#edf5ff; }
    html[data-theme="dark"] { --bg:#101823; --panel:#1b2735; --ink:#edf3f9; --muted:#c5d0dc; --line:#526477; --accent:#a6d2ff; --soft:#24384f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; word-break:keep-all; }
    main { max-width:1120px; margin:0 auto; padding:30px 20px 72px; }
    header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
    h1 { font-size:clamp(1.7rem,3vw,2.25rem); margin:0; }
    h2 { font-size:1.45rem; margin:0 0 14px; }
    a, button { color:var(--accent); }
    .header-actions { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .back { display:inline-block; padding:11px 16px; border:1px solid var(--line); border-radius:10px; text-decoration:none; background:var(--panel); font-weight:700; }
    .theme-control { display:flex; align-items:center; flex-wrap:wrap; gap:4px; padding:4px 6px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
    .theme-control span { padding:0 8px; font-size:1rem; font-weight:700; }
    .theme-control button { border:0; border-radius:7px; padding:7px 10px; background:transparent; font:inherit; cursor:pointer; }
    .theme-control button[aria-pressed="true"] { background:var(--soft); color:var(--ink); font-weight:800; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:18px; }
    .muted { color:var(--muted); }
    .tabs { display:flex; flex-wrap:wrap; gap:10px; margin:20px 0; }
    .tabs button, .pager button { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:12px 16px; font:inherit; font-weight:700; cursor:pointer; }
    .tabs button[aria-selected="true"] { background:var(--soft); border-color:var(--accent); font-weight:700; }
    :is(button,a,summary):focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .record { padding:22px; margin:16px 0; border:1px solid var(--line); border-radius:12px; background:var(--bg); }
    .record-title { font-size:1.16rem; font-weight:800; margin-bottom:6px; }
    .record-meta { color:var(--muted); font-size:1rem; }
    .record-line { margin-top:8px; }
    .record details { margin-top:14px; }
    .record summary { cursor:pointer; color:var(--accent); font-weight:800; padding:8px 0; }
    .record pre { white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; background:var(--soft); padding:16px; border-radius:8px; }
    .document-frame { width:100%; height:min(75vh,950px); min-height:600px; border:1px solid var(--line); border-radius:8px; background:#fff; margin-top:10px; }
    .notice { background:var(--soft); border-left:4px solid var(--accent); border-radius:8px; padding:12px 16px; margin:12px 0; }
    .summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:16px 0; }
    .summary-card { padding:16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
    .summary-card span { display:block; color:var(--muted); font-size:1rem; }
    .summary-card strong { display:block; margin-top:3px; font-size:1.2rem; font-variant-numeric:tabular-nums; overflow-wrap:break-word; }
    .attachment-list { list-style:none; margin:10px 0 0; padding:0; display:grid; gap:10px; }
    .attachment-list a, .attachment-list span { display:block; padding:10px 12px; border:1px solid var(--line); border-radius:8px; overflow-wrap:break-word; }
    .attachment-list a:not([href]) { color:var(--muted); cursor:wait; }
    .pager { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:20px; }
    .pager button:disabled { opacity:.45; cursor:not-allowed; }
    @media (max-width:650px) { main{padding:18px 12px 60px} .panel{padding:16px} .record{padding:16px} .tabs button{flex:1 1 40%} .summary-grid{grid-template-columns:1fr} }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <header><h1>감사 열람</h1><div class="header-actions"><div class="theme-control" role="group" aria-label="화면 모드"><span>화면 모드</span><button type="button" data-theme-choice="auto">자동</button><button type="button" data-theme-choice="light">주간</button><button type="button" data-theme-choice="dark">야간</button></div><a class="back" href="membermanage.html">조합원 관리로 돌아가기</a></div></header>
  <section class="panel">
    <p style="margin:0">감사의 업무집행·재산·장부·서류 확인을 위한 읽기 전용 화면입니다. 이곳에서는 내용을 수정하거나 결재할 수 없습니다.</p>
  </section>
  <p id="status" role="status" class="muted">권한을 확인하고 있습니다.</p>
  <section id="workspace" hidden>
    <nav class="tabs" aria-label="감사 자료 종류">
      <button type="button" data-section="ledger" aria-selected="true">회계 장부</button>
      <button type="button" data-section="closing" aria-selected="false">결산 자료</button>
      <button type="button" data-section="approvals" aria-selected="false">완료된 결재</button>
      <button type="button" data-section="minutes" aria-selected="false">회의·공문</button>
      <button type="button" data-section="rules" aria-selected="false">현행 정관·규약·규정</button>
    </nav>
    <section class="panel" aria-live="polite">
      <h2 id="sectionTitle">회계 장부</h2>
      <div id="records"></div>
      <div class="pager"><button id="previous" type="button" disabled>이전</button><span id="pageLabel">1쪽</span><button id="next" type="button" disabled>다음</button></div>
    </section>
  </section>
</main>
<script type="module">
  import { supabase } from './shared/supabase-client.js';

  const sections = { ledger:'회계 장부', closing:'결산 자료', approvals:'완료된 결재', minutes:'회의·공문', rules:'현행 정관·규약·규정' };
  const limit = 25;
  const state = { coopId:null, section:'ledger', offset:0, loading:false };
  const el = id => document.getElementById(id);
  const text = value => String(value ?? '').trim();
  const plainText = value => text(value).replace(/<[^>]*>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ').trim();
  const money = value => `${Number(value || 0).toLocaleString('ko-KR')}원`;
  const date = value => text(value) ? new Date(value).toLocaleDateString('ko-KR', { timeZone:'Asia/Seoul' }) : '-';
  const status = message => { el('status').textContent = message; };
  const line = (parent, className, value) => { const node=document.createElement('div'); node.className=className; node.textContent=value; parent.append(node); return node; };
  const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

  function syncThemeChoice() {
    const mode=window.CoopTheme?.mode() || 'auto';
    document.querySelectorAll('[data-theme-choice]').forEach(button => {
      button.setAttribute('aria-pressed',String(button.dataset.themeChoice===mode));
    });
  }
  document.querySelectorAll('[data-theme-choice]').forEach(button => button.addEventListener('click', () => {
    const choice=button.dataset.themeChoice;
    if (choice==='auto') window.CoopTheme?.useSystem();
    else window.CoopTheme?.set(choice);
    syncThemeChoice();
  }));
  window.addEventListener('coop-theme-change',syncThemeChoice);
  syncThemeChoice();

  function addDocument(parent, content, label='내용 보기') {
    if (!text(content)) return;
    const details=document.createElement('details');
    const summary=document.createElement('summary'); summary.textContent=label; details.append(summary);
    const iframe=document.createElement('iframe');
    iframe.className='document-frame'; iframe.title=label; iframe.setAttribute('sandbox',''); iframe.referrerPolicy='no-referrer';
    const body=/<[a-z][\s\S]*>/i.test(content) ? content : `<pre>${escapeHtml(content)}</pre>`;
    iframe.srcdoc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; form-action 'none'"><style>body{font:18px/1.7 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;word-break:keep-all;color:#182334;padding:22px;margin:0}h1,h2,.rpt-title{font-size:26px!important;line-height:1.4!important}h3,h4,h5,h6,.rpt-sec{font-size:21px!important;line-height:1.5!important;margin-top:22px!important}p,li,div,span,small,td,th{font-size:18px!important;line-height:1.65!important}table{border-collapse:collapse;min-width:580px;max-width:100%;margin:12px 0 24px}th,td{border:1px solid #9aaabd;padding:11px 13px!important;color:#182334!important;background:#fff}th,.bg-light{background:#eaf1f8!important}.rpt-amt{text-align:right;white-space:nowrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}body{overflow-x:auto}</style></head><body>${body}</body></html>`;
    details.append(iframe); parent.append(details);
  }

  function attachmentRef(raw) {
    const value=text(raw);
    if (!value) return null;
    let path, displayName='';
    try {
      const url=new URL(value);
      if (url.origin!=='https://ifdqlwxgqgsvnawmhlfc.supabase.co') return null;
      const match=url.pathname.match(/^\/storage\/v1\/object\/(?:public|sign|authenticated)\/attachments\/(.+)$/);
      if (!match) return null;
      path=decodeURIComponent(match[1]);
      displayName=url.searchParams.get('display_name') || url.searchParams.get('download') || '';
    } catch (_) {
      const [base,query='']=value.split('?',2);
      if (!base.startsWith('attachments/')) return null;
      path=base.slice('attachments/'.length);
      const params=new URLSearchParams(query);
      displayName=params.get('display_name') || params.get('download') || '';
    }
    if (!path || path.startsWith('/') || path.split('/').includes('..')) return null;
    return { path, name:displayName || path.split('/').pop().replace(/^[0-9a-f-]{36}_/i,'') || '첨부파일' };
  }

  function addAttachments(parent, item) {
    const refs=[...(Array.isArray(item.file_links) ? item.file_links : [])];
    if (text(item.signed_doc_url)) refs.unshift(item.signed_doc_url);
    const attachments=refs.map(attachmentRef).filter(Boolean);
    if (!attachments.length) {
      line(parent,'record-meta','첨부파일 없음');
      return;
    }
    const details=document.createElement('details');
    const summary=document.createElement('summary'); summary.textContent=`첨부파일 ${attachments.length}건 보기`; details.append(summary);
    const list=document.createElement('ul'); list.className='attachment-list'; details.append(list);
    attachments.forEach((file,index) => {
      const li=document.createElement('li');
      const link=document.createElement('a');
      link.textContent=`${index===0 && text(item.signed_doc_url) ? '서명문서 · ' : ''}${file.name}`;
      link.dataset.path=file.path;
      link.target='_blank'; link.rel='noopener noreferrer';
      li.append(link); list.append(li);
    });
    details.addEventListener('toggle', async () => {
      if (!details.open) return;
      await Promise.all([...list.querySelectorAll('a')].map(async link => {
        if (Number(link.dataset.validUntil || 0)>Date.now()) return;
        link.removeAttribute('href');
        link.setAttribute('aria-busy','true');
        const { data,error }=await supabase.storage.from('attachments').createSignedUrl(link.dataset.path,600);
        link.removeAttribute('aria-busy');
        if (error || !data?.signedUrl) {
          link.removeAttribute('href');
          link.title='첨부파일을 불러오지 못했습니다. 접근 권한이나 파일 상태를 확인해 주세요.';
          return;
        }
        link.href=data.signedUrl;
        link.dataset.validUntil=String(Date.now()+480000);
      }));
    });
    parent.append(details);
  }

  function addClosingSummary(parent, summary) {
    if (!summary || typeof summary!=='object') return;
    const fields=[
      ['매출액',summary.total_revenue],
      ['영업외수익',summary.total_other_revenue],
      ['비용',summary.total_expenses],
      ['당기손익',summary.net_income]
    ];
    const grid=document.createElement('div'); grid.className='summary-grid';
    fields.forEach(([label,value]) => {
      if (value==null) return;
      const card=document.createElement('div'); card.className='summary-card';
      const name=document.createElement('span'); name.textContent=label;
      const amount=document.createElement('strong'); amount.textContent=money(value);
      card.append(name,amount); grid.append(card);
    });
    parent.append(grid);
  }

  function renderRecord(item) {
    const article=document.createElement('article'); article.className='record';
    if (state.section==='ledger') {
      line(article,'record-title',`${date(item.entry_date)} · ${text(item.account) || '계정 미지정'}`);
      line(article,'record-meta',`${text(item.transaction_id) || '전표번호 없음'} · ${text(item.project) || '공통'}`);
      line(article,'record-line',plainText(item.description) || '적요 없음');
      line(article,'record-line',`차변 ${money(item.debit)} · 대변 ${money(item.credit)}`);
      if (text(item.evidence)) line(article,'record-meta',`증빙: ${plainText(item.evidence_type)} ${plainText(item.evidence)}`);
    } else if (state.section==='closing') {
      line(article,'record-title',`${item.fiscal_year}년 결산 자료`);
      line(article,'record-meta',`${date(item.period_start)} ~ ${date(item.period_end)} · ${item.report_payload?.summary?.is_closed ? '마감된 결산' : '마감 전 자료'} · 생성 ${date(item.generated_at)}`);
      addClosingSummary(article,item.report_payload?.summary);
      line(article,'notice','증빙 검토 금액은 장부의 증빙 유형을 기준으로 자동 합산한 참고 수치입니다. 실제 증빙 누락이나 가산세 대상이라는 뜻은 아닙니다.');
      const parts=item.report_payload?.sections || {};
      addDocument(article,[parts.header_html,parts.balance_sheet_html,parts.income_statement_html,parts.surplus_html,parts.tax_html].filter(Boolean).join('<hr>'),'결산 원문 전체 보기 (0원 항목 포함)');
    } else if (state.section==='approvals') {
      line(article,'record-title',text(item.title) || '제목 없음');
      const amountLabel=text(item.doc_type).startsWith('휴가') && item.amount != null
        ? ` · ${Number(item.amount).toLocaleString('ko-KR')}일`
        : (item.amount == null || Number(item.amount)===0 ? '' : ` · ${money(item.amount)}`);
      line(article,'record-meta',`${text(item.doc_type)} · ${date(item.processed_at || item.created_at)} · ${text(item.status)}${amountLabel}`);
      addDocument(article,item.content,'결재 내용 보기');
      addAttachments(article,item);
    } else if (state.section==='minutes') {
      line(article,'record-title',text(item.title) || '제목 없음');
      line(article,'record-meta',`${text(item.doc_type)} · ${date(item.published_at || item.created_at)}${text(item.doc_no) ? ` · ${text(item.doc_no)}` : ''}`);
      addDocument(article,item.content,'문서 내용 보기');
    } else {
      line(article,'record-title',text(item.title) || '제목 없음');
      line(article,'record-meta',`${text(item.version) ? `버전 ${text(item.version)} · ` : ''}${date(item.event_date || item.updated_at)}`);
      if (text(item.revision_summary)) line(article,'record-line',text(item.revision_summary));
      addDocument(article,item.content,'현행 문서 보기');
    }
    return article;
  }

  async function load() {
    if (state.loading || !state.coopId) return;
    state.loading=true; status('자료를 불러오는 중입니다.');
    el('records').replaceChildren();
    try {
      const { data,error }=await supabase.rpc('get_member_audit_portal_records',{ p_coop_id:state.coopId,p_section:state.section,p_limit:limit,p_offset:state.offset });
      if (error) throw error;
      const items=Array.isArray(data?.items) ? data.items : [];
      if (!items.length) line(el('records'),'muted','표시할 자료가 없습니다.');
      else items.forEach(item => el('records').append(renderRecord(item)));
      el('previous').disabled=state.offset===0;
      el('next').disabled=items.length<limit;
      el('pageLabel').textContent=`${Math.floor(state.offset/limit)+1}쪽`;
      status(`${sections[state.section]} ${items.length}건을 표시합니다.`);
    } catch (error) {
      status(error?.code==='42501' ? '감사 열람 권한이 없습니다.' : '자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
      el('next').disabled=true;
    } finally { state.loading=false; }
  }

  document.querySelectorAll('[data-section]').forEach(button => button.addEventListener('click', () => {
    if (state.loading) return;
    state.section=button.dataset.section; state.offset=0;
    document.querySelectorAll('[data-section]').forEach(tab => tab.setAttribute('aria-selected',String(tab===button)));
    el('sectionTitle').textContent=sections[state.section]; void load();
  }));
  el('previous').addEventListener('click',()=>{ if(state.offset>0){state.offset-=limit;void load();} });
  el('next').addEventListener('click',()=>{state.offset+=limit;void load();});

  try {
    const { data:{ user }, error:authError }=await supabase.auth.getUser();
    if (authError || !user) throw new Error('LOGIN_REQUIRED');
    const coop=await supabase.rpc('get_my_coop_id');
    if (coop.error || !coop.data) throw new Error('COOP_REQUIRED');
    const access=await supabase.rpc('can_view_member_audit_portal',{p_coop_id:coop.data});
    if (access.error || access.data!==true) throw new Error('AUDIT_ACCESS_DENIED');
    state.coopId=coop.data; el('workspace').hidden=false; await load();
  } catch (error) {
    status(error.message==='LOGIN_REQUIRED' ? '로그인 후 이용할 수 있습니다.' : '현재 계정에는 감사 열람 권한이 없습니다.');
  }
</script>
</body>
</html>
