<!DOCTYPE html>
<!-- Published election result view 1.0.0 — read only. -->
<html lang="ko" data-election-ui="results" data-election-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>공포된 선거 결과</title>
  <script>window.__COOP_ROUTE_APP__='erp';</script>
  <script src="/erp/workspace_boot.js?v=20261021-results-1"></script>
  <script src="/erp/workspace_resume.js?v=20261010-9-uimodal-20261013-1"></script>
  <script src="/shared/coop_dialog.js?v=20261013-2" integrity="sha384-SPhTaEg4LScQfJkxXl9A2VG7CdbLrjPUbecITHuHpYCXQDguKuVcof13KMO+GV4N" crossorigin="anonymous"></script>
  <script src="/shared/workflow_help.js?v=20261020-1" integrity="sha384-Dn1Z1LiCGrGYxiZJTz/srbeLloRZ/eDx3+gSDteJzCKG+I/+OBo+1wm0NJpgVEuZ" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="/erp/workspace_nav.css?v=20261010-9">
  <script src="/erp/workspace_nav.js?v=20261021-results-1" defer></script>
  <link rel="stylesheet" href="/vote/election_ui.css?v=1.0.0" integrity="sha384-EdMVFi77kANhvsjylDnC4QZF3OlPBjat0uUnrIdkHZJ5NGCim1WH3hvVGCcFIAu/" crossorigin="anonymous">
  <style>
    body{margin:0}main{max-width:900px;margin:32px auto;padding:0 20px 48px}
    .result-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .result-toolbar a,.result-toolbar button{font:inherit;padding:10px 14px;border:1px solid #94a3b8;border-radius:10px;background:#fff;color:#172033;cursor:pointer;text-decoration:none}
    .result-heading{display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:26px;margin:24px 0 8px}
    .result-panel{background:var(--election-surface);padding:22px;border:1px solid var(--election-line);border-radius:16px;margin-top:20px}
    .result-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
    .result-stats div{background:var(--election-soft);padding:14px;border-radius:10px}.result-stats dt{font-size:14px;color:var(--election-muted)}.result-stats dd{font-size:24px;font-weight:700;margin:4px 0 0}
    #result-meta,#result-help-text{color:var(--election-muted)}#result-state{padding:16px 0;white-space:pre-wrap}
    #winner-list{list-style:none;padding:0;margin:0}#winner-list li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--election-line);padding:14px 0}#winner-list span{display:block;color:var(--election-muted);font-size:14px}#winner-list strong{overflow-wrap:anywhere}
    @media(max-width:480px){main{padding:0 14px 32px}.result-panel{padding:16px}.result-stats{gap:6px}.result-stats div{padding:10px 8px}.result-stats dd{font-size:20px}}
  </style>
</head>
<body>
<main>
  <nav class="result-toolbar" aria-label="선거 결과 이동">
    <a href="/vote/admin_setup.html">선거 대시보드</a>
    <button id="results-retry" type="button">다시 확인</button>
  </nav>
  <div class="result-heading"><h1 id="results-title">공포된 선거 결과</h1><button id="results-help" type="button" class="coop-workflow-help election-help" aria-label="선거 결과 도움말" aria-haspopup="dialog">?</button></div>
  <p id="result-state" role="status" aria-live="polite">선거 결과를 확인하고 있어요…</p>
  <section id="result-content" hidden>
    <p id="result-meta"></p>
    <section class="result-panel" aria-label="투표 참여 현황">
      <dl class="result-stats">
        <div><dt>총 유권자</dt><dd id="result-total"></dd></div>
        <div><dt>참여 인원</dt><dd id="result-current"></dd></div>
        <div><dt>투표율</dt><dd id="result-percent"></dd></div>
      </dl>
      <p id="result-help-text">같은 사람은 한 번만 세며, 이번 회차에 한 번이라도 투표한 인원을 표시해요.</p>
    </section>
    <section class="result-panel" aria-labelledby="winners-title">
      <h2 id="winners-title">공포된 당선 결과</h2>
      <p id="winner-summary"></p>
      <ul id="winner-list"></ul>
    </section>
  </section>
</main>
<script type="module" src="/vote/results.js?v=1.0.0" integrity="sha384-q9gSUJvNrAMgwns1NH48Avzm8OyQxFp3eeAhEaFfBJdroFaGca7CCn97mDli3Byi" crossorigin="anonymous"></script>
</body>
</html>
