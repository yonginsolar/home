<!DOCTYPE html>
<!--
Version: v1.0.1
Change: 2026-05-16 - Replace native alert/confirm usage with shared modal flow.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>선호도 투표 관리</title>
    <script>console.log('[Version] v1.0.1 | poll_admin.html');</script>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #fff;
            --line: #dbe4f0;
            --text: #14213d;
            --muted: #62718f;
            --primary: #1d4ed8;
            --success: #0f766e;
            --warning: #b45309;
            --danger: #b91c1c;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); }
        .page { max-width: 1180px; margin: 0 auto; padding: 24px 18px 64px; }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
        .topbar-actions { display:flex; gap:10px; flex-wrap:wrap; }
        .btn { border:1px solid var(--line); background:#fff; color:var(--text); border-radius:999px; padding:11px 16px; font-weight:800; cursor:pointer; }
        .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn.success { background: var(--success); border-color: var(--success); color:#fff; }
        .btn.warning { background: var(--warning); border-color: var(--warning); color:#fff; }
        .hero { background: linear-gradient(135deg, rgba(29,78,216,0.12), rgba(15,118,110,0.10)), #fff; border:1px solid rgba(29,78,216,0.12); border-radius:24px; padding:24px; box-shadow:0 18px 48px rgba(15,23,42,0.08); margin-bottom:18px; }
        .hero h1 { margin:0 0 8px; font-size: clamp(26px, 4vw, 36px); }
        .hero p { margin:0; color:var(--muted); line-height:1.6; }
        .layout { display:grid; grid-template-columns: 1.05fr 1.25fr; gap:18px; }
        .panel { background: var(--card); border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:0 12px 30px rgba(15,23,42,0.05); }
        .panel h2 { margin:0 0 14px; font-size:20px; }
        .poll-list { display:grid; gap:12px; }
        .poll-card { border:1px solid var(--line); border-radius:18px; padding:16px; cursor:pointer; background:#fff; }
        .poll-card.active { border-color: var(--primary); box-shadow: inset 0 0 0 1px rgba(29,78,216,0.2); background:#f8fbff; }
        .poll-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
        .poll-head h3 { margin:0 0 6px; font-size:18px; }
        .poll-meta { color: var(--muted); font-size:14px; line-height:1.55; }
        .phase-badge { border-radius:999px; padding:6px 10px; font-size:12px; font-weight:900; white-space:nowrap; }
        .phase-ready { background:#e0ecff; color:#1d4ed8; }
        .phase-open { background:#dcfce7; color:#166534; }
        .phase-closed { background:#e5e7eb; color:#374151; }
        .phase-settled { background:#ede9fe; color:#5b21b6; }
        .phase-draft { background:#fef3c7; color:#92400e; }
        .card-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
        .card-actions .btn { border-radius:14px; padding:10px 12px; }
        .summary-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:12px; margin-bottom:16px; }
        .summary-box { border:1px solid var(--line); border-radius:16px; padding:14px; background:#fff; }
        .summary-box strong { display:block; font-size:26px; margin-bottom:4px; }
        .result-table { width:100%; border-collapse:collapse; }
        .result-table th, .result-table td { padding:12px 10px; border-bottom:1px solid #edf1f7; text-align:left; }
        .bar { height: 12px; border-radius: 999px; background:#e8eef8; overflow:hidden; }
        .bar > span { display:block; height:100%; background:linear-gradient(90deg, #1d4ed8, #0f766e); }
        .empty-box { border:1px dashed #ccd7e7; border-radius:18px; padding:26px; color:var(--muted); text-align:center; }
        .status-line { margin-bottom:12px; color:var(--muted); line-height:1.6; }
        .inline-note { font-size:13px; color:var(--muted); }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 4000;
        }
        .modal-card {
            width: min(460px, 100%);
            background: #fff;
            border-radius: 22px;
            padding: 24px;
            border: 1px solid #d8e0ec;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
        }
        .modal-card h4 { margin: 0 0 10px; font-size: 20px; }
        .modal-card p { margin: 0; color: var(--muted); line-height: 1.6; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { border-radius: 14px; }
        @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
        @media (max-width: 640px) { .summary-grid { grid-template-columns: 1fr; } .topbar { flex-direction:column; align-items:stretch; } }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <button class="btn" type="button" onclick="location.href='../erp/vote_hub.html'">← 선거관리 허브</button>
        <div class="topbar-actions">
            <button class="btn primary" type="button" onclick="location.href='poll_setup.html'">+ 새 선호도 투표</button>
            <button class="btn" type="button" onclick="location.href='index.html?portal=1'">조합원 포털 보기</button>
        </div>
    </div>

    <section class="hero">
        <h1>선호도 투표 관리</h1>
        <p>공개 전에는 초안 수정과 대상자 확정을, 종료 후에는 관리자 전용 결과 집계를 확인합니다. 중간 결과는 노출하지 않도록 고정했습니다.</p>
    </section>

    <div class="layout">
        <section class="panel">
            <h2>투표 목록</h2>
            <div id="pollList" class="poll-list"></div>
        </section>
        <section class="panel">
            <div id="detailEmpty" class="empty-box">왼쪽에서 선호도 투표를 선택하면 상태와 결과를 확인할 수 있습니다.</div>
            <div id="detailPanel" style="display:none;">
                <div class="poll-head" style="margin-bottom:14px;">
                    <div>
                        <h2 id="detailTitle" style="margin-bottom:6px;"></h2>
                        <div id="detailMeta" class="status-line"></div>
                    </div>
                    <span id="detailPhase" class="phase-badge phase-draft">DRAFT</span>
                </div>
                <div class="card-actions" style="margin-bottom:18px;">
                    <button class="btn" type="button" id="btnEditPoll">설정 수정</button>
                    <button class="btn success" type="button" id="btnPublishPoll">공개 / 대상자 확정</button>
                    <button class="btn warning" type="button" id="btnClosePoll">강제 종료</button>
                </div>
                <div class="summary-grid">
                    <div class="summary-box"><span class="inline-note">대상자 수</span><strong id="summaryTotal">-</strong></div>
                    <div class="summary-box"><span class="inline-note">참여 완료</span><strong id="summarySubmitted">-</strong></div>
                    <div class="summary-box"><span class="inline-note">미참여</span><strong id="summaryPending">-</strong></div>
                </div>
                <div id="resultWrap" class="empty-box">투표가 종료되면 여기에서 옵션별 결과를 확인할 수 있습니다.</div>
            </div>
        </section>
    </div>
</div>

<div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h4 id="modalTitle">알림</h4>
        <p id="modalMessage"></p>
        <div class="modal-actions" id="modalActions"></div>
    </div>
</div>

<script type="module">
    import { PreferencePollService, derivePreferencePollPhase } from './PreferencePollService.js';

    const service = new PreferencePollService();
    const pollListEl = document.getElementById('pollList');
    const detailEmptyEl = document.getElementById('detailEmpty');
    const detailPanelEl = document.getElementById('detailPanel');
    const detailTitleEl = document.getElementById('detailTitle');
    const detailMetaEl = document.getElementById('detailMeta');
    const detailPhaseEl = document.getElementById('detailPhase');
    const summaryTotalEl = document.getElementById('summaryTotal');
    const summarySubmittedEl = document.getElementById('summarySubmitted');
    const summaryPendingEl = document.getElementById('summaryPending');
    const resultWrapEl = document.getElementById('resultWrap');
    const btnEditPollEl = document.getElementById('btnEditPoll');
    const btnPublishPollEl = document.getElementById('btnPublishPoll');
    const btnClosePollEl = document.getElementById('btnClosePoll');
    const modalBackdropEl = document.getElementById('modalBackdrop');
    const modalTitleEl = document.getElementById('modalTitle');
    const modalMessageEl = document.getElementById('modalMessage');
    const modalActionsEl = document.getElementById('modalActions');

    let pollRows = [];
    let selectedPollId = '';

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function formatKst(value) {
        const date = value ? new Date(value) : null;
        if (!date || Number.isNaN(date.getTime())) return '-';
        return date.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
    }

    function showModal(title, message, actions = []) {
        modalTitleEl.textContent = title;
        modalMessageEl.innerHTML = String(message || '').replace(/\n/g, '<br>');
        modalActionsEl.innerHTML = '';
        actions.forEach((action) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `btn ${action.type || ''}`.trim();
            button.textContent = action.label;
            button.addEventListener('click', () => {
                modalBackdropEl.style.display = 'none';
                if (typeof action.onClick === 'function') action.onClick();
            });
            modalActionsEl.appendChild(button);
        });
        if (actions.length === 0) {
            const closeButton = document.createElement('button');
            closeButton.type = 'button';
            closeButton.className = 'btn primary';
            closeButton.textContent = '확인';
            closeButton.addEventListener('click', () => {
                modalBackdropEl.style.display = 'none';
            });
            modalActionsEl.appendChild(closeButton);
        }
        modalBackdropEl.style.display = 'flex';
    }

    function showAlert(title, message, onClose = null) {
        showModal(title, escapeHtml(message), onClose ? [
            { label: '확인', type: 'primary', onClick: onClose }
        ] : []);
    }

    function showConfirm(title, message) {
        return new Promise((resolve) => {
            showModal(title, escapeHtml(message), [
                { label: '취소', type: '', onClick: () => resolve(false) },
                { label: '확인', type: 'primary', onClick: () => resolve(true) }
            ]);
        });
    }

    function getPhaseBadgeClass(phase) {
        if (phase === 'OPEN') return 'phase-open';
        if (phase === 'READY') return 'phase-ready';
        if (phase === 'CLOSED') return 'phase-closed';
        if (phase === 'SETTLED') return 'phase-settled';
        return 'phase-draft';
    }

    function showInlineMessage(target, message) {
        target.innerHTML = `<div class="empty-box">${escapeHtml(message)}</div>`;
    }

    function renderPollList() {
        if (!Array.isArray(pollRows) || pollRows.length === 0) {
            pollListEl.innerHTML = '<div class="empty-box">등록된 선호도 투표가 없습니다. 새로 만들어보세요.</div>';
            return;
        }

        pollListEl.innerHTML = pollRows.map((poll) => {
            const phase = derivePreferencePollPhase(poll);
            const activeClass = String(poll.id) === String(selectedPollId) ? 'active' : '';
            return `
                <article class="poll-card ${activeClass}" data-poll-id="${escapeHtml(poll.id)}">
                    <div class="poll-head">
                        <div>
                            <h3>${escapeHtml(poll.title || '무제 투표')}</h3>
                            <div class="poll-meta">${escapeHtml(formatKst(poll.start_at))} ~ ${escapeHtml(formatKst(poll.end_at))}</div>
                            <div class="poll-meta">옵션 무작위 / 기간 내 수정 ${poll.allow_revote ? '가능' : '불가'}</div>
                        </div>
                        <span class="phase-badge ${getPhaseBadgeClass(phase)}">${escapeHtml(phase)}</span>
                    </div>
                </article>
            `;
        }).join('');

        pollListEl.querySelectorAll('[data-poll-id]').forEach((card) => {
            card.addEventListener('click', () => {
                selectedPollId = String(card.dataset.pollId || '');
                renderPollList();
                renderSelectedPoll().catch((error) => {
                    console.error('renderSelectedPoll failed:', error);
                    showInlineMessage(resultWrapEl, error.message || '결과를 불러오지 못했습니다.');
                });
            });
        });
    }

    async function renderSelectedPoll() {
        if (!selectedPollId) {
            detailPanelEl.style.display = 'none';
            detailEmptyEl.style.display = 'block';
            return;
        }

        detailPanelEl.style.display = 'block';
        detailEmptyEl.style.display = 'none';

        const { poll, options } = await service.getAdminPoll(selectedPollId);
        if (!poll) {
            showInlineMessage(resultWrapEl, '투표 정보를 찾을 수 없습니다.');
            return;
        }
        const phase = derivePreferencePollPhase(poll);
        detailTitleEl.textContent = poll.title || '무제 투표';
        detailMetaEl.innerHTML = `기간 ${escapeHtml(formatKst(poll.start_at))} ~ ${escapeHtml(formatKst(poll.end_at))}<br>옵션 ${options.length}개 / 최소 ${poll.min_choices}개 / 최대 ${poll.max_choices}개`;
        detailPhaseEl.textContent = phase;
        detailPhaseEl.className = `phase-badge ${getPhaseBadgeClass(phase)}`;

        btnEditPollEl.onclick = () => { location.href = `poll_setup.html?id=${encodeURIComponent(poll.id)}`; };
        btnPublishPollEl.onclick = async () => {
            const ok = await showConfirm('대상자 확정 후 공개', '현재 조합의 정상 조합원 전체를 대상으로 공개하시겠습니까?');
            if (!ok) return;
            try {
                await service.publishPoll(poll.id);
                await refresh();
                selectedPollId = poll.id;
                renderPollList();
                await renderSelectedPoll();
            } catch (error) {
                showAlert('공개 실패', error.message || '공개에 실패했습니다.');
            }
        };
        btnClosePollEl.onclick = async () => {
            const ok = await showConfirm('투표 강제 종료', '이 투표를 지금 종료할까요?');
            if (!ok) return;
            try {
                await service.closePoll(poll.id);
                await refresh();
                selectedPollId = poll.id;
                renderPollList();
                await renderSelectedPoll();
            } catch (error) {
                showAlert('종료 실패', error.message || '종료에 실패했습니다.');
            }
        };

        if (!['CLOSED', 'SETTLED'].includes(phase)) {
            summaryTotalEl.textContent = '-';
            summarySubmittedEl.textContent = '-';
            summaryPendingEl.textContent = '-';
            resultWrapEl.className = 'empty-box';
            resultWrapEl.textContent = phase === 'READY'
                ? '아직 투표 시작 전입니다. 공개 후 기간이 되면 자동으로 열립니다.'
                : '투표가 진행 중입니다. 결과는 종료 후 관리자만 확인할 수 있습니다.';
            return;
        }

        const result = await service.getAdminResults(poll.id);
        summaryTotalEl.textContent = Number(result?.total_voters || 0).toLocaleString('ko-KR');
        summarySubmittedEl.textContent = Number(result?.submitted_members || 0).toLocaleString('ko-KR');
        summaryPendingEl.textContent = Number(result?.pending_members || 0).toLocaleString('ko-KR');

        const rows = Array.isArray(result?.results) ? result.results : [];
        if (rows.length === 0) {
            resultWrapEl.className = 'empty-box';
            resultWrapEl.textContent = '표시할 결과가 없습니다.';
            return;
        }

        resultWrapEl.className = '';
        resultWrapEl.innerHTML = `
            <table class="result-table">
                <thead>
                    <tr>
                        <th>옵션</th>
                        <th style="width:120px;">득표</th>
                        <th style="width:220px;">비율</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows.map((row) => {
                        const count = Number(row.vote_count || 0);
                        const percent = Number(row.vote_percent || 0);
                        return `
                            <tr>
                                <td>${escapeHtml(row.label || '-')}</td>
                                <td>${count.toLocaleString('ko-KR')}표</td>
                                <td>
                                    <div class="bar"><span style="width:${Math.max(0, Math.min(percent, 100))}%;"></span></div>
                                    <div class="inline-note" style="margin-top:6px;">${percent.toFixed(1)}%</div>
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
    }

    async function refresh() {
        pollRows = await service.listAdminPolls();
    }

    async function boot() {
        const adminContext = await service.initializeAdminContext();
        if (!adminContext?.user) {
            showAlert('로그인 필요', '로그인 후 다시 시도해주세요.', () => {
                location.href = '../membermanage.html';
            });
            return;
        }
        if (!adminContext.canAdmin) {
            showAlert('접근 권한 없음', '선호도 투표 관리자만 접근할 수 있습니다.', () => {
                location.href = '../membermanage.html';
            });
            return;
        }
        await refresh();
        if (pollRows.length > 0) selectedPollId = selectedPollId || String(pollRows[0].id || '');
        renderPollList();
        await renderSelectedPoll();
    }

    boot().catch((error) => {
        console.error('poll_admin boot failed:', error);
        showAlert('화면 준비 실패', error.message || '선호도 투표 관리 화면을 준비하지 못했습니다.');
    });
</script>
</body>
</html>
