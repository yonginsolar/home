<!DOCTYPE html>
<!--
Version: v1.0.0
Change: 2026-05-16 - Add member-facing preference poll voting page.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <title>선호도 투표</title>
    <script>console.log('[Version] v1.0.0 | poll_vote.html');</script>
    <style>
        :root {
            --bg: #f3f6fb;
            --card: #ffffff;
            --line: #d6e1ef;
            --text: #16213e;
            --muted: #5f6b85;
            --primary: #1d4ed8;
            --primary-soft: #e7efff;
            --success: #0f766e;
            --warning: #b45309;
            --danger: #b91c1c;
        }
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: linear-gradient(180deg, #eef4fb 0%, #f8fafc 100%); color: var(--text); }
        .page { max-width: 920px; margin: 0 auto; padding: 24px 18px 64px; }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
        .btn { border:1px solid var(--line); background:#fff; color:var(--text); border-radius:999px; padding:11px 16px; font-weight:800; cursor:pointer; }
        .btn.primary { background: var(--primary); border-color: var(--primary); color:#fff; }
        .btn.success { background: var(--success); border-color: var(--success); color:#fff; }
        .hero { background: radial-gradient(circle at top left, rgba(29,78,216,0.18), transparent 48%), #fff; border:1px solid rgba(29,78,216,0.14); border-radius:24px; padding:26px; box-shadow:0 20px 50px rgba(15,23,42,0.08); margin-bottom:18px; }
        .hero h1 { margin:0 0 10px; font-size: clamp(28px, 4vw, 40px); }
        .hero p { margin:0; color:var(--muted); line-height:1.65; }
        .hero-meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
        .chip { background: var(--primary-soft); color: var(--primary); padding:7px 10px; border-radius:999px; font-size:13px; font-weight:800; }
        .panel { background:#fff; border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:0 12px 30px rgba(15,23,42,0.05); }
        .status-box { margin-bottom:16px; border-radius:18px; padding:16px; border:1px solid #d8e2ef; background:#f8fafc; }
        .status-box strong { display:block; margin-bottom:8px; }
        .option-list { display:grid; gap:12px; }
        .option-card { border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; gap:12px; align-items:flex-start; cursor:pointer; background:#fff; transition:all 0.18s ease; }
        .option-card.selected { border-color: var(--primary); background:#f7fbff; box-shadow: inset 0 0 0 1px rgba(29,78,216,0.18); }
        .option-card input { margin-top: 4px; width: 18px; height: 18px; }
        .option-card strong { display:block; margin-bottom:4px; font-size:17px; }
        .option-card small { color: var(--muted); }
        .helper { color: var(--muted); line-height:1.6; }
        .actions { display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin-top:20px; }
        .empty-box { border:1px dashed #c9d6e6; border-radius:18px; padding:28px; text-align:center; color:var(--muted); }
        @media (max-width: 640px) { .topbar { flex-direction:column; align-items:stretch; } .actions { justify-content:stretch; } .actions .btn { width:100%; } }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <button class="btn" type="button" onclick="location.href='index.html?portal=1'">← 투표 포털</button>
        <button class="btn" type="button" onclick="location.href='../membermanage.html'">조합원 화면</button>
    </div>

    <section class="hero">
        <h1 id="pollTitle">선호도 투표를 불러오는 중...</h1>
        <p id="pollDescription">잠시만 기다려주세요.</p>
        <div class="hero-meta">
            <span class="chip" id="phaseChip">상태 확인 중</span>
            <span class="chip" id="periodChip">기간 확인 중</span>
            <span class="chip" id="choiceChip">선택 규칙 확인 중</span>
        </div>
    </section>

    <section class="panel">
        <div id="statusBox" class="status-box"></div>
        <div id="optionWrap" class="option-list"></div>
        <div class="actions">
            <button class="btn primary" type="button" id="submitButton" disabled>제출하기</button>
        </div>
    </section>
</div>

<script type="module">
    import { PreferencePollService, derivePreferencePollPhase } from './PreferencePollService.js';

    const service = new PreferencePollService();
    const urlParams = new URLSearchParams(window.location.search || '');
    const pollId = String(urlParams.get('id') || '').trim();
    const titleEl = document.getElementById('pollTitle');
    const descEl = document.getElementById('pollDescription');
    const phaseChipEl = document.getElementById('phaseChip');
    const periodChipEl = document.getElementById('periodChip');
    const choiceChipEl = document.getElementById('choiceChip');
    const statusBoxEl = document.getElementById('statusBox');
    const optionWrapEl = document.getElementById('optionWrap');
    const submitButtonEl = document.getElementById('submitButton');

    let currentPayload = null;
    let selectedIds = new Set();

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function formatKst(value) {
        const date = value ? new Date(value) : null;
        if (!date || Number.isNaN(date.getTime())) return '-';
        return date.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
    }

    function setStatusMessage(title, message) {
        statusBoxEl.innerHTML = `<strong>${escapeHtml(title)}</strong><div class="helper">${escapeHtml(message).replace(/\n/g, '<br>')}</div>`;
    }

    function updateSubmitButton() {
        const poll = currentPayload?.poll || {};
        const phase = derivePreferencePollPhase(poll);
        const choiceCount = selectedIds.size;
        const minChoices = Number(poll.min_choices || 1);
        const maxChoices = Number(poll.max_choices || 1);
        const isEditable = phase === 'OPEN';
        const isValid = choiceCount >= minChoices && choiceCount <= maxChoices;
        submitButtonEl.disabled = !(isEditable && isValid);
        submitButtonEl.textContent = currentPayload?.current_revision > 0 ? '선택 수정 제출' : '선택 제출';
    }

    function renderOptions() {
        optionWrapEl.innerHTML = '';
        const poll = currentPayload?.poll || {};
        const phase = derivePreferencePollPhase(poll);
        const editable = phase === 'OPEN';
        const maxChoices = Number(poll.max_choices || 1);
        const options = Array.isArray(currentPayload?.options) ? currentPayload.options : [];

        if (options.length === 0) {
            optionWrapEl.innerHTML = '<div class="empty-box">표시할 옵션이 없습니다.</div>';
            updateSubmitButton();
            return;
        }

        options.forEach((option) => {
            const selected = selectedIds.has(String(option.id));
            const card = document.createElement('label');
            card.className = `option-card ${selected ? 'selected' : ''}`.trim();
            card.innerHTML = `
                <input type="checkbox" ${selected ? 'checked' : ''} ${editable ? '' : 'disabled'}>
                <div>
                    <strong>${escapeHtml(option.label || '-')}</strong>
                    <small>${selected ? '현재 선택됨' : '선택하지 않음'}</small>
                </div>
            `;
            card.addEventListener('click', (event) => {
                if (!editable) return;
                event.preventDefault();
                const optionId = String(option.id || '').trim();
                if (!optionId) return;
                if (selectedIds.has(optionId)) {
                    selectedIds.delete(optionId);
                } else {
                    if (selectedIds.size >= maxChoices) {
                        setStatusMessage('선택 개수 제한', `이 투표에서는 최대 ${maxChoices}개까지만 선택할 수 있습니다.`);
                        return;
                    }
                    selectedIds.add(optionId);
                }
                renderOptions();
            });
            optionWrapEl.appendChild(card);
        });
        updateSubmitButton();
    }

    async function loadPoll() {
        if (!pollId) {
            setStatusMessage('투표 정보 없음', '잘못된 접근입니다. 투표 포털로 돌아가 다시 선택해주세요.');
            optionWrapEl.innerHTML = '<div class="empty-box">투표 정보를 찾을 수 없습니다.</div>';
            return;
        }
        currentPayload = await service.getPortalPoll(pollId);
        const poll = currentPayload?.poll || {};
        const phase = derivePreferencePollPhase(poll);
        titleEl.textContent = poll.title || '무제 선호도 투표';
        descEl.textContent = poll.description || '설명이 없습니다.';
        phaseChipEl.textContent = `상태 ${phase}`;
        periodChipEl.textContent = `${formatKst(poll.start_at)} ~ ${formatKst(poll.end_at)}`;
        choiceChipEl.textContent = `${poll.min_choices || 1}개 이상, ${poll.max_choices || 1}개 이하 선택`;
        selectedIds = new Set((Array.isArray(currentPayload?.selected_option_ids) ? currentPayload.selected_option_ids : []).map((id) => String(id)));

        if (phase === 'READY') {
            setStatusMessage('아직 시작 전입니다', '정해진 시작 시각이 되면 자동으로 열립니다.');
        } else if (phase === 'OPEN') {
            setStatusMessage(
                currentPayload?.current_revision > 0 ? '이미 제출한 내용이 있습니다' : '지금 참여할 수 있습니다',
                currentPayload?.current_revision > 0
                    ? '기간 안에는 다시 선택해서 제출할 수 있습니다. 최종 집계에는 최신 제출만 반영됩니다.'
                    : '원하는 옵션을 고른 뒤 제출해주세요.'
            );
        } else {
            setStatusMessage('투표가 종료되었습니다', currentPayload?.current_revision > 0 ? '내 제출 내역은 저장되어 있습니다. 결과는 관리자만 확인할 수 있습니다.' : '이 투표는 종료되었습니다.');
        }
        renderOptions();
    }

    async function submitVote() {
        const poll = currentPayload?.poll || {};
        const phase = derivePreferencePollPhase(poll);
        if (phase !== 'OPEN') return;
        try {
            submitButtonEl.disabled = true;
            submitButtonEl.textContent = '제출 중...';
            await service.submitPortalBallot({ pollId, optionIds: [...selectedIds] });
            await loadPoll();
            setStatusMessage('제출 완료', '선택 내용을 저장했습니다. 기간 안에는 다시 수정 제출할 수 있습니다.');
        } catch (error) {
            setStatusMessage('제출 실패', error.message || '투표를 제출하지 못했습니다.');
        } finally {
            updateSubmitButton();
        }
    }

    async function boot() {
        const memberContext = await service.initializeMemberContext();
        if (!memberContext?.user) {
            setStatusMessage('로그인 필요', '로그인 후 다시 시도해주세요.');
            optionWrapEl.innerHTML = '<div class="empty-box">로그인이 필요합니다.</div>';
            return;
        }
        submitButtonEl.addEventListener('click', submitVote);
        await loadPoll();
    }

    boot().catch((error) => {
        console.error('poll_vote boot failed:', error);
        setStatusMessage('화면 준비 실패', error.message || '선호도 투표 화면을 불러오지 못했습니다.');
        optionWrapEl.innerHTML = '<div class="empty-box">화면을 준비하지 못했습니다.</div>';
    });
</script>
</body>
</html>
