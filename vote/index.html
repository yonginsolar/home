    }

    function clearLegacyVoteSessionHash() {
      if (!window.location.hash) return;
      const cleanUrl = `${window.location.pathname}${window.location.search}`;
      window.history.replaceState({}, document.title, cleanUrl);
    }

    async function bootVoteIndex() {
      clearLegacyVoteSessionHash();
      window.location.replace(buildVotePortalUrl());
    }

    window.addEventListener('load', bootVoteIndex);
