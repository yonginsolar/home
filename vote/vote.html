   <style>
/* =========================================
   1. 기본 설정 (Variables & Reset)
   ========================================= */
:root {
    --primary-color: #2563eb;
    --primary-hover: #1d4ed8;
    --success-color: #059669;
    --danger-color: #dc2626;
    --bg-light: #f3f4f6;
    --text-dark: #1f2937;
    --text-gray: #6b7280;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius-lg: 0.75rem;
}

* { box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: var(--bg-light);
    color: var(--text-dark);
    line-height: 1.5;
}

header { text-align: center; margin-bottom: 2.5rem; }
h1 { margin: 0 0 0.5rem 0; font-size: 1.8rem; color: var(--text-dark); }
#district-name-box {
    display: inline-block; background: #e0f2fe; color: #0369a1;
    padding: 0.5rem 1.5rem; border-radius: 2rem; font-weight: 600; margin-top: 1rem;
}

/* 컨테이너 */
.container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    padding: 2rem;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    display: none;
}
.container.active { display: block; animation: fadeIn 0.3s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }


/* =========================================
   2. 후보자 리스트 & 카드 디자인
   ========================================= */
.candidate-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.candidate-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    transition: all 0.2s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
}

.candidate-card:hover {
    border-color: var(--primary-color);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
    transform: translateY(-3px);
}

.candidate-card.selected {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
}

.candidate-img {
    width: 100%;
    height: 280px;
    object-fit: contain;
    background-color: #f9fafb;
    border-bottom: 1px solid #e5e7eb;
}

.card-content {
    padding: 1.5rem; text-align: center; flex-grow: 1;
    display: flex; flex-direction: column;
}
.card-content h3 { margin: 0.5rem 0; font-size: 1.3rem; }
.card-content p { color: var(--text-gray); margin-bottom: 1rem; }


/* =========================================
   3. 버튼 스타일 (Buttons)
   ========================================= */
/* 공약 보기 버튼 */
.btn-manifesto {
    margin-top: auto;
    background: #fff;
    border: 1px solid var(--text-gray);
    color: var(--text-dark);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: background 0.2s;
    width: 100%;
    font-weight: 500;
}
.btn-manifesto:hover { background: var(--bg-light); }

/* 찬반 투표 버튼 */
.binary-options { display: flex; gap: 1rem; margin: 2rem 0; }
.btn-binary {
    flex: 1; padding: 1.5rem; font-size: 1.2rem; border: 2px solid #e5e7eb;
    background: #fff; border-radius: var(--radius-lg); cursor: pointer; font-weight: bold; transition: all 0.2s;
    color: var(--text-gray);
}
.btn-binary.btn-yes.selected { background: #ecfdf5; border-color: var(--success-color); color: var(--success-color); }
.btn-binary.btn-no.selected { background: #fef2f2; border-color: var(--danger-color); color: var(--danger-color); }

/* 하단 액션 영역 */
.action-area {
    margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb;
    display: flex; justify-content: center; align-items: center; width: 100%;
}

/* 투표하기 버튼 */
.btn-submit {
    width: 100%; max-width: 100%; margin: 0 auto; display: block;
    background: var(--primary-color); color: white; border: none; padding: 1rem 3rem;
    font-size: 1.1rem; border-radius: 2rem; cursor: pointer; font-weight: bold;
    box-shadow: var(--shadow-md); transition: background 0.2s;
}
.btn-submit:hover { background: var(--primary-hover); }
.btn-submit:disabled { background: #9ca3af; cursor: not-allowed; box-shadow: none; }
.privacy-notice {
    margin-top: 1rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--theme-border, #dbe3ec);
    border-radius: 10px;
    background: var(--theme-surface-alt, #f8fafc);
    color: var(--theme-muted, #475569);
    font-size: 0.88rem;
    line-height: 1.65;
}

/* 무투표 당선 버튼 */
.btn-uncontested {
    background: linear-gradient(135deg, #10b981 0%, #047857 100%);
    color: white; border: none; padding: 1rem 2rem; font-size: 1.1rem;
    border-radius: 50px; cursor: pointer; font-weight: 800;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    transition: all 0.2s ease;
    width: 100%; max-width: 400px; display: block; margin: 0 auto;
}
.btn-uncontested:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); filter: brightness(1.1); }
.btn-uncontested:active { transform: translateY(1px); box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3); }
.manifesto-title {
    font-size: 1.1rem; font-weight: 800; color: #2563eb;
    margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e2e8f0;
    display: flex; align-items: center; gap: 8px;
}

.manifesto-text {
    font-size: 0.95rem; line-height: 1.7; color: #334155;
    white-space: pre-wrap; /* 줄바꿈 유지 */
}

@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

       /* =================================================================
   [제로베이스 리뉴얼] 공약 보기 모달 전용 스타일
   ================================================================= */

/* 1. 모달 배경 (Overlay) */
.modal-overlay {
    display: none; /* JS로 제어 */
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.6); /* 짙은 반투명 */

    z-index: 2000;
    justify-content: center;
    align-items: center;
}

/* 2. 모달 컨텐츠 박스 (뼈대) */
.modal-content {
    background: #fff;
    width: 90%;
    max-width: 600px; /* 공약 보기는 넓게 */
    height: 85vh;     /* 화면 높이의 85% 차지 */
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    display: flex;    /* Flexbox로 상/중/하 분리 */
    flex-direction: column;
    overflow: hidden; /* 둥근 모서리 유지 */
    animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* 3. [상단] 헤더 (고정) */
.modal-header {
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    z-index: 10;
}
.modal-header h3 { margin: 0; font-size: 1.25rem; color: #1f2937; font-weight: 700; }
.btn-close-icon {
    background: none; border: none; font-size: 1.5rem; color: #9ca3af;
    cursor: pointer; transition: color 0.2s; padding: 0; line-height: 1;
}
.btn-close-icon:hover { color: #dc2626; }

/* 4. [중단] 본문 (스크롤 영역) */
.modal-body-scroll {
    flex: 1;              /* 남은 공간 모두 차지 */

}

/* 5. [하단] 푸터 (고정) */
.modal-footer {
    padding: 1rem 1.5rem;

    background-color: #f9fafb;
    text-align: right;
}
.btn-close-modal {
    background-color: #fff;
    border: 1px solid #d1d5db;
    color: #374151;
    padding: 0.6rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-close-modal:hover { background-color: #f3f4f6; border-color: #9ca3af; }


/* =================================================================
   [내부 디자인] 프로필 테이블 & 공약 박스
   ================================================================= */

/* 프로필 테이블 */
.profile-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 2rem;
    font-size: 0.95rem;
}
.profile-table th {
    text-align: left;

/* 공약 박스 (Manifesto Box) */

    padding: 1.5rem;

}

/* 박스 제목 (Badge 스타일) */
.manifesto-badge {

/* 공약 내용 텍스트 */

/* 공약 이미지 */

<script src="../erp/erp_runtime_guard.js"></script>
<script type="module">
function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
}

function safeUrl(value, options = {}) {
    const raw = String(value ?? '').trim();
    if (!raw) return '';
    const allowRelative = options.allowRelative === true;
    try {
        const parsed = new URL(raw, window.location.origin);
        const isRelative = !/^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(raw);
        if (isRelative && !allowRelative) return '';
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return parsed.href;
        return '';
    } catch (_) {
        return '';
    }
}
    import { ElectionService, supabase, DISTRICT_VOTE_STATE } from './ElectionService.js';
    // [신규] 기본 프로필 이미지 상수 (회색 사람 실루엣)
    const DEFAULT_PROFILE_IMG = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzk5OTk5OSI+PHBhdGggZD0iTTEyIDEyYzIuMjEgMCA0LTEuNzkgNC00cy0xLjc5LTQtNC00LTQgMS43OS00IDQgMS43OSA0IDQgNHptMCAyYy0yLjY3IDAtOCAxLjM0LTggNHYyaDE2di0yYzAtMi42Ni01LjMzLTQtOC00eiIvPjwvc3ZnPg==";

    async function resolveCandidatePhotoUrl(photoPath) {
        if (!photoPath) return DEFAULT_PROFILE_IMG;
        const safeDirectUrl = safeUrl(photoPath);
        if (safeDirectUrl) return safeDirectUrl;
        try {
            const { data, error } = await supabase.storage.from('candidate_proofs').createSignedUrl(photoPath, 3600);
            const signedUrl = safeUrl(data?.signedUrl || '');
            if (error || !signedUrl) return DEFAULT_PROFILE_IMG;
            return signedUrl;
        } catch (_) {
            return DEFAULT_PROFILE_IMG;
        }
    }

    async function buildCandidatePhotoUrlMap(candidates) {
        const map = new Map();
        await Promise.all((candidates || []).map(async (cand) => {
            map.set(String(cand.id), await resolveCandidatePhotoUrl(cand.photo_url));
        }));
        return map;
    }

    const service = new ElectionService();

    // 상태 변수
    let currentElection = null;
    let pendingBallots = []; // 아직 투표 안 한 용지 목록
    let currentBallot = null; // 현재 화면에 표시 중인 용지
    let selectedValue = null;

    // DOM 요소 (기존과 동일)
    const loadingScreen = document.getElementById('loading-screen');
    const voteContainer = document.getElementById('vote-container');
    const completeContainer = document.getElementById('complete-container');
    const ballotArea = document.getElementById('ballot-area');
    const voteBtn = document.getElementById('btn-vote');
    const titleElem = document.getElementById('election-title');

    async function initPage() {
        try {
            const user = await service.initialize();
            if (!user) {
                window.location.href = `../membermanage.html?next=${encodeURIComponent(window.location.href)}`;
                return;
            }

            const runtimeCheck = await window.ErpRuntimeGuard.enforce(supabase, {
                moduleKey: 'vote',
                moduleLabel: '선거/투표',
                redirectUrl: `../membermanage.html?next=${encodeURIComponent(window.location.href)}`,
                alertFn: (msg) => showModal('알림', String(msg || '접근할 수 없습니다.'))
            });
            if (!runtimeCheck.ok) return;
            const memberAdminEnabled = runtimeCheck.runtime?.modules?.member_admin !== false;
            if (!memberAdminEnabled) {
                alertAndClose('선거 기능은 조합원 관리 연동이 필요합니다.');
                return;
            }

            document.getElementById('voter-info').innerText = `${user.name} 조합원님 (${user.member_id})`;

            const elections = await service.getActiveElections();
            if (!elections || elections.length === 0) {
                alertAndClose('현재 진행 중인 선거가 없습니다.');
                return;
            }

            loadingScreen.style.display = 'none';
            voteContainer.classList.add('active');

            // 무조건 선거 목록 먼저 보여주기
            renderElectionList(elections);

        } catch (error) {
            alertAndClose('오류: ' + error.message);
        }
    }

    // 선거 목록 렌더링 (기존과 동일)
    function renderElectionList(elections) {
        document.title = '참여할 선거 선택';
        titleElem.innerText = "참여할 선거를 선택해주세요";
        document.getElementById('district-name').style.display = 'none';
        voteBtn.style.display = 'none';
        ballotArea.innerHTML = '';

        const listDiv = document.createElement('div');
        listDiv.style.display = 'flex';
        listDiv.style.flexDirection = 'column';
        listDiv.style.gap = '10px';

        elections.forEach(election => {
            const btn = document.createElement('button');
            btn.className = 'candidate-card';
            btn.style.textAlign = 'left';
            btn.style.cursor = 'pointer';
            const safeElectionTitle = escapeHtml(election.title || '선거');

            // 상태 뱃지
            const statusBadge = election.status === 'NOMINATION'
                ? '<span class="ballot-status nomination" style="color:orange;">[후보등록기간]</span>'
                : '<span class="ballot-status open" style="color:green;">[투표진행중]</span>';

            btn.innerHTML = `
                <h3 style="margin:0;">${safeElectionTitle}</h3>
                <p class="ballot-status-text" style="margin:0.5rem 0 0 0; color:#666;">${statusBadge}</p>
            `;
            btn.onclick = () => loadElection(election);
            listDiv.appendChild(btn);
        });
        ballotArea.appendChild(listDiv);
    }

async function loadElection(election) {
        currentElection = election;
        document.title = String(election?.title || '조합원 투표소').trim() || '조합원 투표소';
        titleElem.innerText = election.title;
        // 로딩 중 표시
        ballotArea.innerHTML = '<div style="text-align:center; padding:2rem;">투표 기록을 확인 중입니다...</div>';

        try {
            // 1. 모든 투표용지 정보 가져오기
            const allBallots = await service.getMyBallotList(election.id);

            // 2. 실제 투표가 필요한 선거구(BINARY/경선) 중 미투표만 필터링
            pendingBallots = allBallots.filter(b => b.requiresVoting && !b.hasVoted);

            // [핵심] 남은 투표가 없다면 즉시 종료 (무투표/후보미등록 포함)
            if (pendingBallots.length === 0) {
                const uncontestedCount = allBallots.filter((b) => b.ballotState === DISTRICT_VOTE_STATE.UNCONTESTED).length;
                const noCandidateCount = allBallots.filter((b) => b.ballotState === DISTRICT_VOTE_STATE.NO_CANDIDATE).length;
                let closeMessage = '이미 모든 투표를 완료하셨습니다.\n투표소를 종료합니다.';
                if (uncontestedCount > 0 && noCandidateCount === 0) {
                    closeMessage = '모든 선거구가 무투표 당선으로 확정되어 투표가 필요하지 않습니다.\n투표소를 종료합니다.';
                } else if (noCandidateCount > 0) {
                    closeMessage = '투표가 필요한 선거구가 없거나 일부 선거구는 후보 미등록 상태입니다.\n투표소를 종료합니다.';
                }
                alertAndClose(closeMessage);
                return;
            }

            // 3. 투표할 게 남아있다면 첫 번째 용지 로드
            await loadNextBallot();

        } catch (error) {
            console.error(error);
            if (error.message.includes('배정되지')) {
                // 권한 없는 경우도 즉시 퇴장
                 alertAndClose(`[${election.title}]에는 투표 권한이 없습니다.`);
            } else {
                alertAndClose('오류 발생: ' + error.message);
            }
        }
    }

    // [신규] 다음 투표용지를 화면에 그리기
async function loadNextBallot() {
        if (pendingBallots.length === 0) {
            showCompleteScreen();
            return;
        }

        currentBallot = pendingBallots[0];
        selectedValue = null;

        document.getElementById('district-name').style.display = 'block';
        document.getElementById('district-name').innerText = currentBallot.district.name;

        voteBtn.style.display = 'block';

        // [디자인 수정] 버튼 스타일 교체 로직
        if (currentBallot.isUncontested) {
            // 무투표 당선: 예쁜 초록색 그라데이션 버튼 적용
            voteBtn.innerText = '확인 (무투표 당선)';
            voteBtn.disabled = false;
            voteBtn.className = 'btn-uncontested'; // CSS에서 만든 클래스 적용
        } else {
            // 일반 투표: 기본 파란색 버튼 적용
            voteBtn.innerText = '투표하기';
            voteBtn.disabled = true;
            voteBtn.className = 'btn-submit'; // 기존 클래스 복구
        }

        // 남은 투표 수 표시
        if (pendingBallots.length > 1) {
             document.title = `${currentElection.title} (${pendingBallots.length}건 남음)`;
             titleElem.innerText = `${currentElection.title} (${pendingBallots.length}건 남음)`;
        } else {
             document.title = String(currentElection.title || '조합원 투표소').trim() || '조합원 투표소';
             titleElem.innerText = currentElection.title;
        }

        await renderBallotContent(currentBallot);
    }

// [수정] 투표용지 그리기 함수 (기본 이미지 및 URL 변환 로직 적용)
    async function renderBallotContent(info) {
        ballotArea.innerHTML = '';

        // 1. 무투표 당선 안내 메시지
        if (info.isUncontested) {
            const noticeDiv = document.createElement('div');
            noticeDiv.className = 'uncontested-notice';
            noticeDiv.style.cssText = 'background:#f0fdf4; padding:1rem; margin-bottom:1rem; border-radius:8px; text-align:center; color:#166534; border:1px solid #bbf7d0;';
            noticeDiv.innerHTML = `<strong style="font-size:1.1rem;">🎉 무투표 당선 안내</strong><br><span class="uncontested-notice-detail" style="font-size:0.9rem; color:#374151;">후보자 수(${info.candidates.length}명)가 선출 인원(${info.district.quota}명) 이내이므로<br>투표 절차 없이 당선이 확정되었습니다.<br>아래 후보자를 확인하시고 <strong>[확인]</strong> 버튼을 눌러주세요.</span>`;
            ballotArea.appendChild(noticeDiv);
        }

        if (info.district.vote_type === 'CANDIDATE') {
            const listDiv = document.createElement('div');
            listDiv.className = 'candidate-list';

            if (!info.candidates || info.candidates.length === 0) {
                ballotArea.innerHTML += '<div class="vote-empty-state" style="text-align:center; padding:3rem; color:#666;">등록된 후보자가 없습니다.</div>';
                return;
            }

            const candidatePhotoMap = await buildCandidatePhotoUrlMap(info.candidates || []);

            info.candidates.forEach(cand => {
                const card = document.createElement('div');
                card.className = 'candidate-card';

                // 무투표일 경우 선택 효과 제거 (보기 전용)
                if (info.isUncontested) {
                    card.classList.add('uncontested-candidate');
                    card.style.cursor = 'default';
                    card.style.borderColor = '#22c55e';
                    card.style.backgroundColor = '#f0fdf4';
                    card.style.boxShadow = 'none';
                }

                // -----------------------------------------------------------
                // [핵심 수정] 사진 URL 처리 로직 (기본 이미지 적용)
                // -----------------------------------------------------------
                let photoSrc = candidatePhotoMap.get(String(cand.id)) || DEFAULT_PROFILE_IMG;
                // -----------------------------------------------------------

                const safeName = escapeHtml(cand.name || '');
                const safeSymbol = escapeHtml(cand.symbol || '-');
                // [카드 HTML 구조] - 공약 보기 버튼 삭제됨
                card.innerHTML = `
                    <img src="${photoSrc}"
                         class="candidate-img"
                         alt="${safeName}"
                         onerror="this.src='${DEFAULT_PROFILE_IMG}'"
                         style="background-color: #f3f4f6;">
                    <div class="card-content">
                        <h3>${safeName}</h3>
                        <p>기호 ${safeSymbol}번</p>
                        </div>
                `;

                // [삭제됨] 아래 공약 보기 버튼 클릭 이벤트 연결 코드도 필요 없으므로 주석 처리하거나 삭제
                /*
                const manifestoBtn = card.querySelector('.btn-manifesto');
                manifestoBtn.onclick = (e) => {
                    e.stopPropagation();
                    showManifesto(cand);
                };
                */

                // 일반 투표일 때만 선택 이벤트 연결
                if (!info.isUncontested) {
                    card.addEventListener('click', (e) => {
                        // if(e.target === manifestoBtn) return; // [삭제] 버튼이 없으니 이 예외처리도 필요 없음
                        document.querySelectorAll('.candidate-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        selectedValue = cand.id;
                        voteBtn.disabled = false;
                        voteBtn.innerText = `'${cand.name}' 선택완료`;
                    });
                }

                listDiv.appendChild(card);
            });
            ballotArea.appendChild(listDiv);

        } else {
            // 찬반 투표 (기존 유지)
             ballotArea.innerHTML = `
                <div class="binary-options">
                    <button type="button" class="btn-binary btn-yes" data-val="AGREE">찬성 (O)</button>
                    <button type="button" class="btn-binary btn-no" data-val="DISAGREE">반대 (X)</button>
                </div>
                <p class="binary-help" style="text-align:center; margin-top:1rem; color:#666;">안건에 대한 찬성/반대를 선택해주세요.</p>
            `;
            ballotArea.querySelectorAll('.btn-binary').forEach(btn => {
                btn.addEventListener('click', () => {
                    ballotArea.querySelectorAll('.btn-binary').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedValue = btn.dataset.val;
                    voteBtn.disabled = false;
                    voteBtn.innerText = (selectedValue === 'AGREE' ? '찬성' : '반대') + ' 선택완료';
                });
            });
        }
    }

// [수정] 투표 버튼 클릭 이벤트 리스너 (전체 교체)
voteBtn.addEventListener('click', () => {

    // 1. 무투표 당선인 경우 (확인 버튼 클릭 시)
    if (currentBallot && currentBallot.isUncontested) {
        // [변경 핵심] 단순히 넘어가지 않고, 서버에 '확인(CONFIRM)' 기록을 남깁니다.
        // 무투표 확인은 별도의 '정말 투표하시겠습니까?' 팝업 없이 진행해도 무방하나,
        // 오클릭 방지를 위해 UI UX 일관성을 고려해 처리 상태를 보여줍니다.

        const confirmMsg = "당선자 정보를 확인하였으며, 이에 동의하십니까?";

        showConfirm(confirmMsg, async () => {
            try {
                voteBtn.innerText = '처리중...';
                voteBtn.disabled = true;

                // 무투표 확인용 페이로드 구성
                const payload = {
                    electionId: currentElection.id,
                    districtId: currentBallot.district_id,
                    round: currentElection.current_round || 1,
                    candidateId: null,      // 후보 선택 아님
                    choice: 'CONFIRM'       // [DB 수정 필요] 새로 추가한 상태값
                };

                // 서버 전송 (이 과정이 있어야 재진입 시 '투표 완료'로 인식됨)
                await service.submitVote(payload);

                // 성공 시 목록에서 제거하고 다음으로 이동
                pendingBallots.shift();
                await loadNextBallot();

            } catch (e) {
                showModal('오류', '처리에 실패했습니다: ' + e.message);
                voteBtn.disabled = false;
                voteBtn.innerText = '확인 (무투표 당선)';
                voteBtn.className = 'btn-uncontested'; // 버튼 스타일 복구
            }
        });

        return; // 일반 투표 로직 실행 방지
    }

    // 2. 일반 투표인 경우 (기존 로직 유지)
    if (!selectedValue) return;

    const isCandidateVote = currentBallot.district.vote_type === 'CANDIDATE';
    const isLastVote = pendingBallots.length === 1;

    const confirmMsg = isLastVote
        ? "정말 투표하시겠습니까? 투표 후에는 수정할 수 없습니다."
        : "이 투표를 제출하고 '다음 투표'로 이동하시겠습니까?";

    showConfirm(confirmMsg, async () => {
        try {
            voteBtn.innerText = '처리중...';
            voteBtn.disabled = true;

            const payload = {
                electionId: currentElection.id,
                districtId: currentBallot.district_id,
                round: currentElection.current_round || 1,
                candidateId: isCandidateVote ? selectedValue : null,
                choice: !isCandidateVote ? selectedValue : null
            };

            // 투표 제출
            await service.submitVote(payload);

            // 성공 시 목록에서 제거하고 다음으로 이동
            pendingBallots.shift();
            await loadNextBallot();

        } catch (e) {
            showModal('오류', e.message);
            voteBtn.disabled = false;
            voteBtn.innerText = '투표하기';
            voteBtn.className = 'btn-submit'; // 버튼 스타일 복구
        }
    });
}); // End of voteBtn Event Listener


        function showCompleteScreen() {

        function showConfirm(msg, onConfirm) {

// [수정]
    function alertAndClose(msg) {
        loadingScreen.style.display = 'none';
        showModal('알림', msg, () => {
            tryCloseWindow(); // window.close() 대신 사용
        });
    }
// [1] 만 나이 계산 함수 (YYMMDD-1... 형식 파싱)
    function getKoreanAge(birthDateStr) {
        if (!birthDateStr || birthDateStr.length < 6) return '-';

        // 1. 생년월일 파싱
        const yy = parseInt(birthDateStr.substring(0, 2));
        const mm = parseInt(birthDateStr.substring(2, 4)) - 1; // 월은 0부터 시작
        const dd = parseInt(birthDateStr.substring(4, 6));

        // 2. 성별코드(7번째 자리)로 1900년대/2000년대 구분
        // (하이픈이 있거나 없거나 대응)
        const genderChar = birthDateStr.includes('-')
            ? birthDateStr.split('-')[1].charAt(0)
            : birthDateStr.charAt(6);

        const century = (genderChar === '1' || genderChar === '2') ? 1900 : 2000;
        const fullYear = century + yy;

        // 3. 만 나이 계산
        const today = new Date();
        let age = today.getFullYear() - fullYear;

        const currentMonth = today.getMonth();
        const currentDate = today.getDate();

        // 생일이 안 지났으면 1살 차감
        if (currentMonth < mm || (currentMonth === mm && currentDate < dd)) {
            age--;
        }

        return `만 ${age}세`;
    }

    // [2] 주소 포맷팅 함수 (읍/면/동/가 까지만 표시)
    function formatAddress(addr) {
        if (!addr) return '정보 없음';

        // 정규식: '무슨동', '무슨읍', '무슨면', '무슨가' 패턴을 찾음
        const match = addr.match(/.*?(읍|면|동|가)(\s|$)/);

        if (match) {
            // 찾았으면 거기까지만 보여줌 (예: 경기 용인시 처인구 포곡읍)
            return match[0].trim();
        }

        // 못 찾았으면(도로명 등) 뒤에 숫자들을 마스킹 처리 (예: 포곡로 123 -> 포곡로 ***)
        return addr.replace(/[0-9]/g, '*');
    }

// [1] 모달 닫기 함수 (Window 전역 등록)
    window.closeManifestoModal = function() {

    // [2] 공약 모달 표시 함수 (리뉴얼 디자인 적용)
    window.showManifesto = function(cand) { // window에 등록하여 안전하게 호출
        const modal = document.getElementById('manifesto-modal');
        const title = document.getElementById('manifesto-title');
        const body = document.getElementById('manifesto-body');

        // 1. 헤더 제목 설정
        title.innerText = `${cand.name} 후보 상세정보`;

        // 2. 데이터 가공
        const age = getKoreanAge(cand.birth_date);
        const shortAddress = formatAddress(cand.address);
        const safeAddress = escapeHtml(shortAddress);
        const safeCareer = escapeHtml(cand.career || '-').replace(/\n/g, '<br>');

        // 3. 내용 구성 (프로필 테이블 + 공약 카드)
        let contentHtml = '';

        // (A) 프로필 섹션
        contentHtml += `
            <table class="profile-table">
                <colgroup>
                    <col style="width: 30%;">
                    <col style="width: 70%;">
                </colgroup>
                <tr>
                    <th>나이</th>
                    <td>${age}</td>
                </tr>
                <tr>
                    <th>주소</th>
                    <td>${safeAddress}</td>
                </tr>
                <tr>
                    <th>주요경력</th>
                    <td>${safeCareer}</td>
                </tr>
            </table>
        `;

        // (B) 공약 섹션 (카드 디자인)
        const manifestoText = cand.manifesto;
        let innerContent = '';

        if (manifestoText && (manifestoText.startsWith('http') || manifestoText.startsWith('/'))) {
             // 이미지인 경우
             const safeManifestoUrl = safeUrl(manifestoText, { allowRelative: true });
             if (safeManifestoUrl) {
                 innerContent = `<img src="${safeManifestoUrl}" class="manifesto-img" alt="공약 이미지">`;
             } else {
                 innerContent = `<div class="manifesto-content-text">등록된 공약 이미지를 불러오지 못했습니다.</div>`;
             }
        } else {
             // 텍스트인 경우
            const safeManifesto = escapeHtml(manifestoText || "등록된 공약 내용이 없습니다.").replace(/\n/g, '<br>');
            innerContent = `<div class="manifesto-content-text">${safeManifesto}</div>`;
        }

        contentHtml += `
            <div class="manifesto-box">
                <div class="manifesto-badge">📢 출마의 변 및 공약</div>
                ${innerContent}
            </div>
        `;

        // 4. 렌더링 및 모달 열기
        body.innerHTML = contentHtml;
        modal.style.display = 'flex';
    };
    // [신규] 강력한 창 닫기 시도 및 실패 시 안내 화면 처리
