    <script type="module">
        import { MinutesService } from './MinutesService.js?v=1.0.48';
        import { SIGNATURE_PREVIEW_BUCKET, getSignaturePreviewPath } from './signature_preview.js?v=1.0.0';
        import { supabase } from '../shared/supabase-client.js';

        const KST_TZ_MINUTES_VIEW = 'Asia/Seoul';
        const formatMinutesViewKstDate = (value) => {
            if (!value) return '-';
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { timeZone: KST_TZ_MINUTES_VIEW });
        };
        const formatMinutesViewKstDateTime = (value) => {
            if (!value) return '시각 미기록';
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return '시각 미기록';
            return d.toLocaleString('ko-KR', {
                timeZone: KST_TZ_MINUTES_VIEW,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        };
        const getDocTypeLabel = (docType) => {
            if (docType === 'NOTICE') return '공지';
            if (docType === 'ASSEMBLY_MATERIAL') return '총회 자료';
            if (docType === 'GENERAL_ASSEMBLY') return '의사록';
            if (docType === 'PAST_MINUTES') return '의사록';
            if (docType === 'MINUTES') return '의사록';
            return '의사록';
        };
        const DOCUMENT_LIST_TABS = [
            { key: 'ALL', label: '전체' },
            { key: 'MINUTES', label: '의사록' },
            { key: 'NOTICE', label: '공문' },
            { key: 'MATERIALS', label: '총회 자료' },
            { key: 'RULES', label: '규정' }
        ];
        const APPROVAL_NOTICE_MEMO_START = '[[APPROVAL_NOTE]]';
        const APPROVAL_NOTICE_MEMO_END = '[[/APPROVAL_NOTE]]';
        let noticeCompanyInfo = null;
        let noticeSealUrl = null;
        let cachedDocumentBoxAccess = null;

        function safeUrl(url) {
            if (!url) return '';
            try { return new URL(url).href; } catch (e) { return ''; }
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sanitizeStyle(styleText) {
            const raw = String(styleText || '');
            if (!raw) return '';
            if (/expression\s*\(/i.test(raw)) return '';
            if (/javascript:/i.test(raw)) return '';
            return raw.replace(/url\s*\(/gi, '');
        }

        function sanitizeHtml(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(String(html || ''), 'text/html');
            const allowedTags = new Set([
                'A','B','BR','BLOCKQUOTE','DIV','EM','H1','H2','H3','H4','H5','H6',
                'HR','I','IMG','LI','OL','P','SPAN','STRONG','TABLE','TBODY','TD',
                'TH','THEAD','TR','U','UL'
            ]);
            const blockedTags = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META']);
            const allowedAttrs = {
                '*': new Set(['class','style']),
                'A': new Set(['href','target','rel','title','class','style']),
                'IMG': new Set(['src','alt','title','width','height','class','style']),
                'TABLE': new Set(['class','style','border','cellpadding','cellspacing']),
                'TD': new Set(['class','style','colspan','rowspan','align']),
                'TH': new Set(['class','style','colspan','rowspan','align'])
            };
            const isSafeUrl = (value, allowDataImage = false) => {
                const raw = String(value || '').trim();
                if (!raw) return null;
                if (/^(mailto:|tel:)/i.test(raw)) return raw;
                if (allowDataImage && /^data:image\//i.test(raw)) return raw;
                try {
                    const u = new URL(raw, window.location.origin);
                    if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
                } catch (e) {}
                return null;
            };

            const nodes = Array.from(doc.body.querySelectorAll('*'));
            nodes.forEach(node => {
                const tag = node.tagName;
                if (!allowedTags.has(tag)) {
                    if (blockedTags.has(tag)) {
                        node.remove();
                        return;
                    }
                    const parent = node.parentNode;
                    if (!parent) return;
                    while (node.firstChild) parent.insertBefore(node.firstChild, node);
                    parent.removeChild(node);
                    return;
                }

                Array.from(node.attributes).forEach(attr => {
                    const name = attr.name.toLowerCase();
                    const value = attr.value;
                    if (name.startsWith('on')) {
                        node.removeAttribute(attr.name);
                        return;
                    }
                    const allowSet = allowedAttrs[tag] || allowedAttrs['*'];
                    if (allowSet && !allowSet.has(name) && !(allowedAttrs['*'] && allowedAttrs['*'].has(name))) {
                        node.removeAttribute(attr.name);
                        return;
                    }
                    if (name === 'href') {
                        const safe = isSafeUrl(value, false);
                        if (!safe) node.removeAttribute('href');
                        else node.setAttribute('href', safe);
                    }
                    if (name === 'src') {
                        const safe = isSafeUrl(value, tag === 'IMG');
                        if (!safe) node.removeAttribute('src');
                        else node.setAttribute('src', safe);
                    }
                    if (name === 'style') {
                        const safeStyle = sanitizeStyle(value);
                        if (safeStyle) node.setAttribute('style', safeStyle);
                        else node.removeAttribute('style');
                    }
                    if (name === 'target' && node.tagName === 'A') {
                        if (node.getAttribute('target') === '_blank') {
                            node.setAttribute('rel', 'noopener noreferrer');
                        }
                    }
                });
            });
            return doc.body.innerHTML;
        }

        function normalizeNoticeContent(rawValue) {
            const raw = String(rawValue || '');
            const trimmed = raw.trim();
            if (!trimmed) return '';
            const hasHtmlTag = /<\s*\/?\s*[a-zA-Z][^>]*>/.test(trimmed);
            if (hasHtmlTag) return trimmed;
            return escapeHtml(trimmed).replace(/\r?\n/g, '<br>');
        }

        function splitNoticeApprovalContent(rawContent) {
            const raw = String(rawContent || '');
            const startIdx = raw.indexOf(APPROVAL_NOTICE_MEMO_START);
            const endIdx = startIdx >= 0 ? raw.indexOf(APPROVAL_NOTICE_MEMO_END, startIdx + APPROVAL_NOTICE_MEMO_START.length) : -1;
            if (startIdx < 0 || endIdx < 0 || endIdx < startIdx) {
                return { publicBody: raw.trim() };
            }
            const head = raw.slice(0, startIdx).trim();
            const tail = raw.slice(endIdx + APPROVAL_NOTICE_MEMO_END.length).trim();
            return { publicBody: [head, tail].filter(Boolean).join('\n\n').trim() };
        }

        function parseNoticeContent(content) {
            const publicBody = splitNoticeApprovalContent(content).publicBody;
            const lines = String(publicBody || '').split(/\r?\n/);
            const meta = { docNo: '', receiver: '', via: '', title: '', bodyLines: [], publicBody };
            lines.forEach(line => {
                const trimmed = line.trim();
                if (!meta.docNo && trimmed.startsWith('문서번호:')) {
                    meta.docNo = trimmed.replace('문서번호:', '').trim();
                    return;
                }
                if (!meta.receiver && trimmed.startsWith('수신:')) {
                    meta.receiver = trimmed.replace('수신:', '').trim();
                    return;
                }
                if (!meta.via && trimmed.startsWith('경유:')) {
                    meta.via = trimmed.replace('경유:', '').trim();
                    return;
                }
                if (!meta.title && trimmed.startsWith('제목:')) {
                    meta.title = trimmed.replace('제목:', '').trim();
                    return;
                }
                meta.bodyLines.push(line);
            });
            return meta;
        }

        function renderNoticeBodyHtml(rawValue) {
            const normalized = normalizeNoticeContent(rawValue);
            if (!normalized) return '';
            return sanitizeHtml(normalized);
        }

        function formatNoticeDateLabel(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return '';
            return new Intl.DateTimeFormat('ko-KR', {
                timeZone: KST_TZ_MINUTES_VIEW,
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }).format(d);
        }

        async function loadNoticeCompanyInfo() {
            if (noticeCompanyInfo) return noticeCompanyInfo;
            const { data } = await MinutesService.getCompanyInfo();
            noticeCompanyInfo = data || {};
            return noticeCompanyInfo;
        }

        async function loadNoticeSealUrl() {
            if (noticeSealUrl !== null) return noticeSealUrl || '';
            const sealUrl = await MinutesService.getOfficialSealUrl();
            noticeSealUrl = sealUrl || '';
            return noticeSealUrl;
        }

        async function buildNoticeTemplateHtml(doc) {
            const parsed = parseNoticeContent(doc?.content || '');
            const docNo = String(doc?.doc_no || parsed.docNo || '').trim();
            const receiver = String(doc?.receiver || parsed.receiver || '-').trim() || '-';
            const via = String(doc?.via || parsed.via || '-').trim() || '-';
            const title = String(doc?.title || parsed.title || '공문').trim() || '공문';

        function normalizeUrls(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.filter(Boolean);
            if (typeof raw === 'string') {
                const trimmed = raw.trim();
                if (!trimmed) return [];
                if (trimmed.startsWith('[')) {
                    try {
                        const parsed = JSON.parse(trimmed);
                        if (Array.isArray(parsed)) return parsed.filter(Boolean);
                    } catch (e) { /* ignore */ }
                }
                return trimmed.split(',').map(s => s.trim()).filter(Boolean);
            }
            return [];
        }

        function uniqueUrls(urls) {
            const seen = new Set();
            return urls.filter(u => {
                const key = String(u || '').trim();
                if (!key || seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function isPreviewableImageAttachment(url, name = '') {
            const raw = `${String(url || '')} ${String(name || '')}`.toLowerCase();
            if (raw.startsWith('data:image/')) return true;
            return /\.(png|jpe?g|gif|webp|svg)(\?|#|$|\s)/i.test(raw);
        }

        function normalizeAttachmentFileName(value) {
            let raw = String(value || '').trim();
            if (!raw) return '';
            try { raw = decodeURIComponent(raw); } catch (e) {}
            try { raw = raw.normalize('NFC'); } catch (e) {}
            return raw;
        }

        function getAttachmentDownloadNameFromReference(rawUrl) {
            const raw = String(rawUrl || '').trim();
            if (!raw) return '';
            try {
                const params = raw.startsWith('http')
                    ? new URL(raw).searchParams
                    : new URLSearchParams((raw.split('?')[1] || '').trim());
                return normalizeAttachmentFileName(params.get('display_name') || params.get('download') || '');
            } catch (e) {
                const query = raw.split('?')[1] || '';
                const params = new URLSearchParams(query);
                return normalizeAttachmentFileName(params.get('display_name') || params.get('download') || '');
            }
        }

        function getCleanAttachmentDisplayName(value) {
            const normalized = normalizeAttachmentFileName(value);
            if (!normalized) return '';
            if (/^https?:\/\//i.test(normalized)) return '';
            if (/[?&](token|download|display_name)=/i.test(normalized)) return '';
            const base = normalized.split(/[\\/]/).pop().trim();
            if (!base || base.length > 120) return '';
            return base;
        }

        async function resolveAttachmentUrl(rawUrl) {
            if (!rawUrl) return null;
            const trimmed = String(rawUrl).trim();
            if (!trimmed) return null;

            if (trimmed.startsWith('http')) {
                const parsed = parseStorageUrl(trimmed);
                if (parsed) {
                    const downloadName = getAttachmentDownloadNameFromReference(trimmed);
                    const opts = downloadName ? { download: downloadName } : undefined;
                    const { data, error } = await supabase.storage.from(parsed.bucket).createSignedUrl(parsed.path, 3600, opts);
                    if (!error && data?.signedUrl) return data.signedUrl;
                    if (parsed.bucket !== 'attachments') {
                        const fallback = await supabase.storage.from('attachments').createSignedUrl(parsed.path, 3600, opts);
                        if (!fallback.error && fallback.data?.signedUrl) return fallback.data.signedUrl;
                    }
                }
                return trimmed;
            }

            const cleaned = trimmed.replace(/^\/+/, '');
            const parts = cleaned.split('?');
            const pathPart = parts[0] || '';
            const sp = new URLSearchParams(parts[1] || '');
            const downloadName = normalizeAttachmentFileName(sp.get('display_name') || sp.get('download') || '');
            const opts = downloadName ? { download: downloadName } : undefined;

            // Support both:
            // - "attachments/minutes/..." style references
            // - "minutes/..." / "signatures/..." (implicit attachments bucket)
            const knownBuckets = new Set(['attachments', 'assets', 'contracts', 'candidates', 'candidate_proofs']);
            const m = pathPart.match(/^([^/]+)\/(.+)$/);
            const bucket = (m && knownBuckets.has(m[1])) ? m[1] : 'attachments';
            const objectPath = (m && knownBuckets.has(m[1])) ? m[2] : pathPart;

            const primary = await supabase.storage.from(bucket).createSignedUrl(objectPath, 3600, opts);
            if (!primary.error && primary.data?.signedUrl) return primary.data.signedUrl;
            if (bucket !== 'attachments') {
                const fallback = await supabase.storage.from('attachments').createSignedUrl(objectPath, 3600, opts);
                if (!fallback.error && fallback.data?.signedUrl) return fallback.data.signedUrl;
            }
            return trimmed;
        }

        function getRequiredSignerIds(doc, officials) {
            if (!doc || !doc.requires_sign || doc.doc_type === 'NOTICE') return [];
            const allOfficials = Array.isArray(officials) ? officials : [];
            if (Array.isArray(doc.signer_ids) && doc.signer_ids.length > 0) {

        function isMinuteSignatureFullyCompleted(doc, officials, signatures) {
            const required = getRequiredSignerIds(doc, officials);
            if (!required.length) return false;

            return required.every((id) => signedSet.has(String(id)));

        function buildCompactOfficialName(value) {
            return String(value || '').replace(/\s+/g, '').trim();
        }

        function escapeRegExp(value) {
            return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function appendMinuteSignaturePreviewToOfficialName(rootNode, official, previewUrl) {
            if (!rootNode || !official?.name) return false;
            const compactName = buildCompactOfficialName(official.name);
            if (!compactName) return false;

            const matcher = new RegExp(compactName.split('').map(ch => escapeRegExp(ch)).join('\\s*'), 'g');
            const walker = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT);
            const candidates = [];
            let currentNode = walker.nextNode();
            while (currentNode) {
                const rawText = String(currentNode.nodeValue || '');
                if (buildCompactOfficialName(rawText).includes(compactName)) {
                    candidates.push(currentNode);
                }
                currentNode = walker.nextNode();
            }
            if (!candidates.length) return false;

            const targetNode = candidates[candidates.length - 1];
            const rawText = String(targetNode.nodeValue || '');
            let match = null;
            for (const found of rawText.matchAll(matcher)) {
                match = found;
            }
            if (!match || typeof match.index !== 'number') return false;

            const before = rawText.slice(0, match.index);
            const matched = rawText.slice(match.index, match.index + match[0].length);
            const after = rawText.slice(match.index + match[0].length);
            const fragment = document.createDocumentFragment();

            if (before) fragment.appendChild(document.createTextNode(before));
            fragment.appendChild(document.createTextNode(matched));

            if (previewUrl) {
                const shell = document.createElement('span');
                shell.className = 'signature-preview-shell inline-signature-shell';
                shell.setAttribute('aria-label', `${official.name} 전자서명 열람본`);
                const image = document.createElement('img');
                image.className = 'inline-signature-img';
                image.src = previewUrl;
                image.alt = `${official.name} 전자서명 열람본`;
                image.draggable = false;
                shell.appendChild(image);
                fragment.appendChild(shell);
            } else {
                const status = document.createElement('span');
                status.className = 'inline-signature-status';
                status.textContent = '전자서명 완료';
                status.setAttribute('aria-label', `${official.name} 전자서명 완료`);
                fragment.appendChild(status);
            }

            if (after) fragment.appendChild(document.createTextNode(after));
            targetNode.parentNode?.replaceChild(fragment, targetNode);
            return true;
        }

        async function injectInlineSignaturePreviews(contentHtml, doc, officials, signatures) {
            if (!doc || !doc.requires_sign || doc.doc_type === 'NOTICE') {
                return { html: String(contentHtml || ''), injected: false };
            }
            const html = String(contentHtml || '');
            if (!html) return { html, injected: false };

            const requiredIds = getRequiredSignerIds(doc, officials);
            if (!requiredIds.length) return { html, injected: false };

            const sigRows = Array.isArray(signatures) ? signatures : [];
            const sigMap = new Map(sigRows.map(row => [String(row.official_id), row]));
            const parser = new DOMParser();
            const parsed = parser.parseFromString(html, 'text/html');
            let injectedCount = 0;

            for (const id of requiredIds) {
                const official = (Array.isArray(officials) ? officials : []).find(o => String(o.id) === String(id));
                if (!official) continue;
                const signature = sigMap.get(String(id));
                if (!signature) continue;
                const previewUrl = await resolveSignaturePreviewUrl(doc, signature);
                if (appendMinuteSignaturePreviewToOfficialName(parsed.body, official, previewUrl)) {
                    injectedCount += 1;
                }
            }

            return {
                html: parsed.body.innerHTML,
                injected: injectedCount > 0
            };
        }

        function sortLibraryDocsByRevisionDesc(a, b) {

        function groupLibraryDocuments(docs) {

            return Array.from(grouped.values()).map((items) => {
                const sortedItems = items.slice().sort(sortLibraryDocsByRevisionDesc);

        function renderLibraryDocContent(rawContent) {
            const rawText = String(rawContent || '');
            if (!rawText.trim()) return '<div style="color:#94a3b8;">내용이 없습니다.</div>';

            const decodeHtmlEntities = (value) => {
                const textarea = document.createElement('textarea');
                textarea.innerHTML = String(value || '');
                return textarea.value;
            };
            const decodeHtmlEntitiesDeep = (value, maxDepth = 3) => {
                let out = String(value || '');
                for (let i = 0; i < maxDepth; i += 1) {
                    const decoded = decodeHtmlEntities(out);
                    if (decoded === out) break;
                    out = decoded;
                }
                return out;
            };

            const hasEncodedTag = /&lt;|&gt;|&amp;lt;|&amp;gt;|&#x3c;|&#60;/i.test(rawText);
            const source = hasEncodedTag ? decodeHtmlEntitiesDeep(rawText) : rawText;
            const renderTextBlock = (textBlock) => {
                const lines = String(textBlock || '').split('\n');
                let out = '';
                let currentTitle = '';
                let buffer = '';

                const chapterPattern = /^제\s*\d+\s*장/;
                const sectionPattern = /^제\s*\d+\s*절/;
                const addendaPattern = /^부\s*칙/;
                const articlePattern = /^제\s*\d+\s*조/;
                const appendixPattern = /^\[\s*별\s*표\s*([0-9]+(?:-[0-9]+)?)\s*\]\s*(.*)$/;

                const flushCard = () => {
                    if (!currentTitle && !buffer) return;
                    const safeTitle = escapeHtml(currentTitle || '');
                    const safeBody = escapeHtml(buffer || '');
                    let formattedBody = safeBody.replace(/\n/g, '<br>');
                    formattedBody = formattedBody.replace(/(①|②|③|④|⑤|⑥|⑦|⑧|⑨|⑩)/g, '<br>$1');
                    if (formattedBody.startsWith('<br>')) formattedBody = formattedBody.substring(4);
                    out += `
                        <div class="article-card">
                            ${safeTitle ? `<span class="article-title">${safeTitle}</span>` : ''}
                            <div class="article-content">${formattedBody}</div>
                        </div>
                    `;
                    currentTitle = '';
                    buffer = '';
                };

                lines.forEach((line) => {
                    const trimmed = String(line || '').trim();
                    if (!trimmed) return;

                    const appendixMatch = trimmed.match(appendixPattern);
                    if (appendixMatch) {
                        flushCard();
                        currentTitle = `[별표 ${appendixMatch[1]}]`;
                        buffer = String(appendixMatch[2] || '').trim();
                        return;
                    }
                    if (chapterPattern.test(trimmed)) {
                        flushCard();
                        out += `<div class="chapter-title">${escapeHtml(trimmed)}</div>`;
                        return;
                    }
                    if (sectionPattern.test(trimmed)) {
                        flushCard();
                        out += `<div class="section-title">${escapeHtml(trimmed)}</div>`;
                        return;
                    }
                    if (addendaPattern.test(trimmed)) {
                        flushCard();
                        out += `<div class="addenda-title">${escapeHtml(trimmed)}</div>`;
                        return;
                    }

                    if (articlePattern.test(trimmed) || (trimmed.startsWith('제') && trimmed.includes('조'))) {
                        flushCard();
                        const parenEnd = trimmed.indexOf(')');
                        const circleMatch = trimmed.search(/①|②|③|④|⑤|⑥|⑦|⑧|⑨|⑩/);
                        if (parenEnd > -1 && parenEnd < trimmed.length - 1) {
                            currentTitle = trimmed.substring(0, parenEnd + 1).trim();
                            buffer = trimmed.substring(parenEnd + 1).trim();
                        } else if (circleMatch > 0) {
                            currentTitle = trimmed.substring(0, circleMatch).trim();
                            buffer = trimmed.substring(circleMatch).trim();
                        } else {
                            currentTitle = trimmed;
                            buffer = '';
                        }
                        return;
                    }

                    buffer += (buffer ? '\n' : '') + trimmed;
                });

                flushCard();
                return out;
            };

            const splitMixedBlocks = (input) => {
                const parser = new DOMParser();
                const mixedDoc = parser.parseFromString(`<div id="__mixed_root">${String(input || '')}</div>`, 'text/html');
                const root = mixedDoc.getElementById('__mixed_root');
                if (!root) return [{ type: 'text', content: String(input || '') }];

                const outBlocks = [];
                let textBuffer = '';
                const blockWrapperTags = new Set(['DIV', 'SECTION', 'ARTICLE', 'MAIN', 'HEADER', 'FOOTER', 'ASIDE', 'P']);
                const inlineTextTags = new Set(['SPAN', 'B', 'STRONG', 'EM', 'I', 'U', 'SMALL', 'SUB', 'SUP', 'MARK', 'CODE', 'A']);

                const flushText = () => {
                    const normalized = textBuffer.replace(/\r\n/g, '\n');
                    if (normalized.trim()) outBlocks.push({ type: 'text', content: normalized });
                    textBuffer = '';
                };
                const appendText = (value) => {
                    if (value === null || value === undefined) return;
                    textBuffer += String(value);
                };
                const walk = (node) => {
                    if (!node) return;
                    if (node.nodeType === Node.TEXT_NODE) {
                        appendText(node.textContent || '');
                        return;
                    }
                    if (node.nodeType !== Node.ELEMENT_NODE) return;

                    const tag = String(node.tagName || '').toUpperCase();
                    if (tag === 'BR') {
                        appendText('\n');
                        return;
                    }
                    if (tag === 'TABLE') {
                        flushText();
                        outBlocks.push({ type: 'table', content: node.outerHTML || '' });
                        return;
                    }
                    if (blockWrapperTags.has(tag)) {
                        appendText('\n');
                        Array.from(node.childNodes || []).forEach(walk);
                        appendText('\n');
                        return;
                    }
                    if (inlineTextTags.has(tag)) {
                        Array.from(node.childNodes || []).forEach(walk);
                        return;
                    }

                    flushText();
                    outBlocks.push({ type: 'html', content: node.outerHTML || '' });
                };

                Array.from(root.childNodes || []).forEach(walk);
                flushText();
                if (outBlocks.length === 0) outBlocks.push({ type: 'text', content: String(input || '') });
                return outBlocks;
            };

            const blocks = splitMixedBlocks(source);

            let html = '';
            blocks.forEach((block) => {
                if (!block || !String(block.content || '').trim()) return;
                if (block.type === 'table' || block.type === 'html') {
                    const sanitizedHtmlBlock = sanitizeHtml(block.content);
                    if (sanitizedHtmlBlock.trim()) {
                        html += `
                            <div class="article-card">
                                <div class="article-content">${sanitizedHtmlBlock}</div>
                            </div>
                        `;
                    }
                    return;
                }
                html += renderTextBlock(String(block.content || ''));
            });

            if (!html.trim()) return `<div style="white-space:pre-wrap;">${escapeHtml(source)}</div>`;
            return html;
        }

        function buildDocumentListHeader() {
            const header = document.createElement('div');
            header.className = 'library-header';
            header.style.display = 'flex';
            header.style.alignItems = 'flex-start';
            header.style.gap = '12px';

            const backBtn = document.createElement('button');
            backBtn.className = 'btn-back';
            backBtn.innerText = '← 뒤로가기';
            backBtn.onclick = () => history.back();
            header.appendChild(backBtn);

            const textWrap = document.createElement('div');
            const title = document.createElement('div');
            title.className = 'library-header-title';
            title.style.fontWeight = '800';
            title.style.fontSize = '1.1rem';
            title.innerText = '문서함';
            const helper = document.createElement('div');
            helper.className = 'library-helper';
            helper.innerText = '공개된 의사록, 공문, 총회 자료, 규정을 한 곳에서 확인할 수 있습니다.';
            textWrap.appendChild(title);
            textWrap.appendChild(helper);
            header.appendChild(textWrap);
            return header;
        }

        function getVisibleDocumentCounts() {
            const visibleMinutes = filterDocumentsByTab(publishedDocsCache, 'MINUTES').filter((doc) => canOpenMinuteDoc(doc)).length;
            const visibleNotices = filterDocumentsByTab(publishedDocsCache, 'NOTICE').filter((doc) => canOpenMinuteDoc(doc)).length;
            const visibleMaterials = filterDocumentsByTab(publishedDocsCache, 'MATERIALS').filter((doc) => canOpenMinuteDoc(doc)).length;
            const visibleRules = getVisibleLibraryRuleGroups().length;
            return {
                ALL: visibleMinutes + visibleNotices + visibleMaterials,
                MINUTES: visibleMinutes,
                NOTICE: visibleNotices,
                MATERIALS: visibleMaterials,
                RULES: visibleRules
            };
        }

        function buildDocumentListSummary() {
            const counts = getVisibleDocumentCounts();
            const summaryWrap = document.createElement('div');
            summaryWrap.className = 'library-summary-grid';
            const cards = [
                { key: 'ALL', label: '전체 문서', desc: '문서함에 등록된 문서' },
                { key: 'MINUTES', label: '의사록', desc: '회의록과 총회 의사록' },
                { key: 'NOTICE', label: '공문', desc: '공개된 공문 문서' },
                { key: 'MATERIALS', label: '총회 자료', desc: '자료집과 참고 PDF' },
                { key: 'RULES', label: '규정', desc: '규정 문서와 정관/규약 바로가기' }
            ];
            summaryWrap.innerHTML = cards.map((card) => `
                <div class="library-summary-card">
                    <div class="label">${card.label}</div>
                    <div class="value">${counts[card.key] || 0}</div>
                    <div class="desc">${card.desc}</div>
                </div>
            `).join('');
            return summaryWrap;
        }

        function buildDocumentListTabs() {
            const counts = getVisibleDocumentCounts();
            const tabsWrap = document.createElement('div');
            tabsWrap.className = 'list-tabs';
            DOCUMENT_LIST_TABS.forEach((tab) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `list-tab-btn${tab.key === currentDocumentListTab ? ' active' : ''}`;
                btn.textContent = `${tab.label} (${counts[tab.key] || 0})`;
                btn.onclick = () => setDocumentListTab(tab.key);
                tabsWrap.appendChild(btn);
            });
            return tabsWrap;
        }

        function filterDocumentsByTab(docs, tabKey) {
            const safeTab = String(tabKey || '').toUpperCase();
            if (safeTab === 'NOTICE') return docs.filter((d) => String(d?.doc_type || '') === 'NOTICE');
            if (safeTab === 'MATERIALS') return docs.filter((d) => String(d?.doc_type || '') === 'ASSEMBLY_MATERIAL');
            if (safeTab === 'MINUTES') {
                return docs.filter((d) => {
                    const type = String(d?.doc_type || '');
                    return type !== 'NOTICE' && type !== 'ASSEMBLY_MATERIAL';
                });
            }
            return docs;
        }

        function renderDocumentListItems() {
            listPanel.innerHTML = '';
            listPanel.appendChild(buildDocumentListHeader());
            listPanel.appendChild(buildDocumentListSummary());
            listPanel.appendChild(buildDocumentListTabs());

            if (currentDocumentListTab === 'RULES') {
                const visibleRuleGroups = getVisibleLibraryRuleGroups();

                const shortcutItem = document.createElement('div');
                shortcutItem.className = 'list-item';
                const shortcutWrap = document.createElement('div');
                const shortcutTitle = document.createElement('div');
                shortcutTitle.className = 'list-title';
                shortcutTitle.textContent = '정관/규약 확인';
                const shortcutSub = document.createElement('div');
                shortcutSub.className = 'list-sub';
                shortcutSub.textContent = '홈페이지 정관/규약 화면으로 이동';
                shortcutWrap.appendChild(shortcutTitle);
                shortcutWrap.appendChild(shortcutSub);
                shortcutItem.appendChild(shortcutWrap);
                shortcutItem.addEventListener('click', () => {
                    window.location.href = '../rules.html';
                });
                listPanel.appendChild(shortcutItem);

                if (!visibleRuleGroups.length) {
                    const emptyEl = document.createElement('div');
                    emptyEl.style.textAlign = 'center';
                    emptyEl.style.color = '#64748b';
                    emptyEl.style.padding = '24px 0';
                    emptyEl.innerText = '열람 가능한 문서가 없습니다.';
                    listPanel.appendChild(emptyEl);
                    return;
                }

                visibleRuleGroups.forEach((group, groupIndex) => {
                    const doc = group.currentDoc;
                    const historyDocs = group.historyDocs || [];
                    const panelId = `revision-history-${groupIndex}-${String(doc?.id || '').replace(/[^a-zA-Z0-9_-]/g, '')}`;
                    const item = document.createElement('div');
                    item.className = 'list-item';

                    const textWrap = document.createElement('div');
                    const titleEl = document.createElement('div');
                    titleEl.className = 'list-title';
                    titleEl.textContent = doc.title || '문서';

                    const subEl = document.createElement('div');
                    subEl.className = 'list-sub';
                    subEl.textContent = getLibraryDocMetaText(doc);

                    textWrap.appendChild(titleEl);
                    textWrap.appendChild(subEl);
                    const summaryText = getLibraryDocRevisionSummary(doc);
                    if (summaryText) {
                        const summaryEl = document.createElement('div');
                        summaryEl.className = 'list-summary';
                        summaryEl.textContent = summaryText;
                        textWrap.appendChild(summaryEl);
                    }

                    item.appendChild(textWrap);
                    if (historyDocs.length > 0) {
                        const toggleBtn = document.createElement('button');
                        toggleBtn.type = 'button';
                        toggleBtn.className = 'revision-history-toggle';
                        toggleBtn.dataset.closedText = `개정 이력 ${historyDocs.length}건`;
                        toggleBtn.textContent = toggleBtn.dataset.closedText;
                        toggleBtn.addEventListener('click', (event) => {
                            event.preventDefault();
                            event.stopPropagation();
                            toggleLibraryRevisionHistory(panelId, toggleBtn);
                        });
                        item.appendChild(toggleBtn);
                    }
                    item.addEventListener('click', () => openLibraryDocumentById(doc.id));
                    listPanel.appendChild(item);

                    if (historyDocs.length > 0) {
                        const historyPanel = document.createElement('div');
                        historyPanel.id = panelId;
                        historyPanel.className = 'revision-history-panel hidden';
                        historyDocs.forEach((historyDoc) => {
                            const historyItem = document.createElement('div');
                            historyItem.className = 'revision-history-item';
                            const historyTitle = document.createElement('div');
                            historyTitle.className = 'list-title';
                            historyTitle.innerHTML = `<span class="revision-history-label">구판</span>${escapeHtml(historyDoc.title || '문서')}`;
                            const historySub = document.createElement('div');
                            historySub.className = 'list-sub';
                            historySub.textContent = getLibraryDocMetaText(historyDoc);
                            historyItem.appendChild(historyTitle);
                            historyItem.appendChild(historySub);

                            const historySummary = getLibraryDocRevisionSummary(historyDoc);
                            if (historySummary) {
                                const historySummaryEl = document.createElement('div');
                                historySummaryEl.className = 'list-summary';
                                historySummaryEl.textContent = historySummary;
                                historyItem.appendChild(historySummaryEl);
                            }
                            historyItem.addEventListener('click', () => openLibraryDocumentById(historyDoc.id));
                            historyPanel.appendChild(historyItem);
                        });
                        listPanel.appendChild(historyPanel);
                    }
                });
                return;
            }

            const filtered = filterDocumentsByTab(publishedDocsCache, currentDocumentListTab)
                .filter((doc) => canOpenMinuteDoc(doc));
            if (!filtered || filtered.length === 0) {
                const emptyEl = document.createElement('div');
                emptyEl.style.textAlign = 'center';
                emptyEl.style.color = '#64748b';
                emptyEl.style.padding = '24px 0';
                emptyEl.innerText = '선택한 탭에 공개된 문서가 없습니다.';
                listPanel.appendChild(emptyEl);
                return;
            }

            filtered.forEach((d) => {
                const item = document.createElement('div');
                item.className = 'list-item';

                const textWrap = document.createElement('div');
                const titleEl = document.createElement('div');
                titleEl.className = 'list-title';
                const label = getDocTypeLabel(d.doc_type);
                titleEl.textContent = d.title ? `${label} · ${d.title}` : label;

                const dateEl = document.createElement('div');
                dateEl.className = 'list-sub';
                dateEl.textContent = formatMinutesViewKstDate(d.created_at);

                textWrap.appendChild(titleEl);
                textWrap.appendChild(dateEl);

                item.appendChild(textWrap);
                item.addEventListener('click', () => openDocumentById(d.id));
                listPanel.appendChild(item);
            });
        }

        function setDocumentListTab(tabKey) {
            const safeKey = String(tabKey || '').toUpperCase();
            const exists = DOCUMENT_LIST_TABS.some((t) => t.key === safeKey);
            currentDocumentListTab = exists ? safeKey : 'ALL';
            renderDocumentListItems();
        }
        window.setDocumentListTab = setDocumentListTab;

        async function openLibraryDocumentById(targetId) {
            if (!targetId) return;
            const summaryDoc = (Array.isArray(libraryDocsCache) ? libraryDocsCache : []).find((item) => String(item?.id) === String(targetId));
            if (!summaryDoc) {
                showMessage('문서를 찾을 수 없거나 권한이 없습니다.');
                return;
            }
            if (!canOpenLibraryDoc(summaryDoc)) {
                const access = getLibraryDocAccess(summaryDoc);
                showMessage(access === 'OFFICIALS'
                    ? '이 문서는 대의원, 이사, 감사만 열람할 수 있습니다.'
                    : '로그인이 필요합니다.');
                return;
            }

            const signaturesPanel = document.getElementById('signatures-panel');
            const signaturesList = document.getElementById('signatures-list');
            if (signaturesPanel) signaturesPanel.style.display = 'none';
            if (signaturesList) signaturesList.innerHTML = '';

            const attachmentsWrap = document.getElementById('doc-attachments');
            const attachmentsList = document.getElementById('ui-attachments');
            if (attachmentsWrap) attachmentsWrap.style.display = 'none';
            if (attachmentsList) attachmentsList.innerHTML = '';

            detailContent.dataset.documentType = 'LIBRARY';
            detailTitle.textContent = summaryDoc.title ? `문서 · ${summaryDoc.title}` : '문서';
            detailMeta.textContent = getLibraryDocDetailMetaText(summaryDoc);
            detailContent.innerHTML = '<div style="color:#64748b;">문서 내용을 불러오는 중입니다...</div>';
            listPanel.style.display = 'none';
            detailPanel.classList.remove('hidden');
            document.body.style.backgroundColor = '#f1f5f9';

            const { data: fullDoc, error } = await MinutesService.getLibraryDocumentById(targetId);
            if (error || !fullDoc) {
                detailContent.innerHTML = '<div style="color:#ef4444;">문서 내용을 불러오지 못했습니다.</div>';
                return;
            }
            const doc = { ...summaryDoc, ...fullDoc };
            if (!canOpenLibraryDoc(doc)) {
                const access = getLibraryDocAccess(doc);
                showMessage(access === 'OFFICIALS'
                    ? '이 문서는 대의원, 이사, 감사만 열람할 수 있습니다.'
                    : '로그인이 필요합니다.');
                return;
            }

            detailTitle.textContent = doc.title ? `문서 · ${doc.title}` : '문서';
            detailMeta.textContent = getLibraryDocDetailMetaText(doc);
            detailContent.innerHTML = renderLibraryDocContent(doc.content) + buildLibraryDocRevisionFooter(doc);
            await renderAttachments(doc);
        }

        async function openDocumentById(targetId) {
            if (!targetId) return;
            const { data: doc, error } = await MinutesService.getMinuteById(targetId);
            if (error || !doc) {
                showMessage('문서를 찾을 수 없거나 권한이 없습니다.');
                return;
            }
            if (!doc.published_at && !cachedIsAdmin) {
                showMessage('아직 공개되지 않은 문서입니다.');
                return;
            }
            if (!canOpenMinuteDoc(doc)) {
                const visibility = String(doc.visibility || 'MEMBERS').toUpperCase();
                showMessage(visibility === 'OFFICIALS'
                    ? '이 문서는 대의원, 이사, 감사만 열람할 수 있습니다.'
                    : '로그인이 필요합니다.');
                return;
            }

            const label = getDocTypeLabel(doc.doc_type);
            detailContent.dataset.documentType = String(doc.doc_type || 'MINUTES').toUpperCase();
            detailTitle.textContent = doc.title ? `${label} · ${doc.title}` : label;
            detailMeta.textContent = `작성일: ${formatMinutesViewKstDate(doc.created_at)} · 공개: ${getMinuteVisibilityLabel(doc)}`;

            if (doc.doc_type === 'NOTICE') {
                detailContent.innerHTML = await buildNoticeTemplateHtml(doc);
            } else if (doc.content) {
                detailContent.innerHTML = sanitizeHtml(doc.content || '');
            } else {
                detailContent.innerHTML = '<div style="color:#94a3b8;">내용이 없습니다.</div>';
            }

            listPanel.style.display = 'none';
            detailPanel.classList.remove('hidden');
            document.body.style.backgroundColor = '#f1f5f9';

            const signaturesTask = (async () => {
                const [{ data: signatures }, officials] = await Promise.all([
                    MinutesService.listSignatureStatusesByMinuteId(targetId),
                    MinutesService.getOfficials()
                ]);
                if (doc.doc_type !== 'NOTICE' && doc.content) {
                    const sanitizedContent = sanitizeHtml(doc.content || '');
                    const inlineResult = await injectInlineSignaturePreviews(sanitizedContent, doc, officials || [], signatures || []);
                    detailContent.innerHTML = inlineResult.html || '<div style="color:#94a3b8;">내용이 없습니다.</div>';
                    await renderSignatures(doc, officials || [], signatures || []);
                } else {
                    await renderSignatures(doc, officials || [], signatures || []);
                }
            })();

            const attachmentsTask = renderAttachments(doc);
            const settled = await Promise.allSettled([signaturesTask, attachmentsTask]);
            settled.forEach((result) => {
                if (result.status === 'rejected') console.warn('document detail side content failed:', result.reason);
            });
        }

        async function renderPublishedList() {
            listPanel.style.display = 'block';
            detailPanel.classList.add('hidden');
            document.body.style.backgroundColor = '#f1f5f9';

            const [{ data: docs }, { data: libraryDocs }] = await Promise.all([
                MinutesService.listPublishedMinutes(),
                MinutesService.listLibraryDocuments()
            ]);

            publishedDocsCache = Array.isArray(docs) ? docs : [];
            libraryDocsCache = Array.isArray(libraryDocs) ? libraryDocs : [];

            if (publishedDocsCache.length === 0 && libraryDocsCache.length === 0) {
                showMessage('문서함에 공개된 문서가 없습니다.');
                return;
            }
            currentDocumentListTab = 'ALL';
            renderDocumentListItems();
        }

        async function init() {
            cachedSession = await MinutesService.getSession();
            if (cachedSession) {
                const runtimeCheck = await window.ErpRuntimeGuard.enforce(supabase, {
                    moduleKey: 'documents',
                    moduleLabel: '문서함',
                    redirectUrl: `../membermanage.html?next=${encodeURIComponent(window.location.href)}`,
                    alertFn: (msg) => showMessage(String(msg || '접근할 수 없습니다.'))
                });
                if (!runtimeCheck.ok) return;
            }
            cachedIsAdmin = cachedSession ? await MinutesService.isAdmin(cachedSession.user.id, cachedSession.user.email) : false;
            cachedDocumentBoxAccess = await MinutesService.getDocumentBoxAccess(cachedSession?.user?.id || null, cachedSession);
            await renderPublishedList();
            if (requestedDocumentId) await openDocumentById(requestedDocumentId);
            // Mark as seen on entry for the active profile (if logged in).
            if (cachedSession || cachedIsAdmin) {
                let activeProfileId = null;
                try {
                    activeProfileId = window.sessionStorage ? window.sessionStorage.getItem('lastActiveProfile') : null;
                } catch (e) {}
                const { error } = await MinutesService.markDocumentBoxSeen(activeProfileId || null);
                if (error) {
                    console.warn('markDocumentBoxSeen failed:', error);
                }
            }
        }

        init();
    </script>
</body>
</html>
