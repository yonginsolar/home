    <script type="module">
        import { MinutesService } from './MinutesService.js?v=1.0.48';
        import { SIGNATURE_PREVIEW_BUCKET, createSignaturePreviewBlob, getSignaturePreviewPath } from './signature_preview.js?v=1.0.0';
        import { supabase } from '../shared/supabase-client.js';

        const KST_TZ_MINUTES_SIGN = 'Asia/Seoul';
        const formatMinutesSignKstDate = (value) => {
            if (!value) return '-';
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('ko-KR', { timeZone: KST_TZ_MINUTES_SIGN });
        };
        const getDocTypeLabel = (docType) => {
            if (docType === 'NOTICE') return '공지';
            if (docType === 'GENERAL_ASSEMBLY') return '총회 의사록';
            if (docType === 'MINUTES') return '이사회 의사록';
            return '의사록';
        };

        function normalizeUrls(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.filter(Boolean);
            if (typeof raw === 'string') {
                const trimmed = raw.trim();
                if (!trimmed) return [];
                if (trimmed.startsWith('[')) {
                    try {
                        const parsed = JSON.parse(trimmed);
                        if (Array.isArray(parsed)) return parsed.filter(Boolean);
                    } catch (e) {}
                }
                return trimmed.split(',').map((value) => value.trim()).filter(Boolean);
            }
            return [];
        }

        function uniqueUrls(urls) {
            const seen = new Set();
            return (urls || []).filter((value) => {
                const safe = String(value || '').trim();
                if (!safe || seen.has(safe)) return false;
                seen.add(safe);
                return true;
            });
        }

        function parseStorageUrl(rawUrl) {
            if (!rawUrl) return null;
            const match = String(rawUrl).match(/\/storage\/v1\/object\/(public|sign)\/([^/]+)\/(.+)$/);
            if (!match) return null;
            return { bucket: match[2], path: String(match[3] || '').split('?')[0] };
        }

        function normalizeAttachmentFileName(value) {
            let raw = String(value || '').trim();
            if (!raw) return '';
            try { raw = decodeURIComponent(raw); } catch (e) {}
            try { raw = raw.normalize('NFC'); } catch (e) {}
            return raw;
        }

        function getAttachmentDownloadNameFromReference(rawUrl) {
            const raw = String(rawUrl || '').trim();
            if (!raw) return '';
            try {
                const params = raw.startsWith('http')
                    ? new URL(raw).searchParams
                    : new URLSearchParams((raw.split('?')[1] || '').trim());
                return normalizeAttachmentFileName(params.get('display_name') || params.get('download') || '');
            } catch (e) {
                const query = raw.split('?')[1] || '';
                const params = new URLSearchParams(query);
                return normalizeAttachmentFileName(params.get('display_name') || params.get('download') || '');
            }
        }

        function getCleanAttachmentDisplayName(value) {
            const normalized = normalizeAttachmentFileName(value);
            if (!normalized) return '';
            if (/^https?:\/\//i.test(normalized)) return '';
            if (/[?&](token|download|display_name)=/i.test(normalized)) return '';
            const base = normalized.split(/[\\/]/).pop().trim();
            if (!base || base.length > 120) return '';
            return base;
        }

        async function resolveAttachmentUrl(rawUrl) {
            if (!rawUrl) return null;
            const trimmed = String(rawUrl).trim();
            if (!trimmed) return null;

            if (trimmed.startsWith('http')) {
                const parsed = parseStorageUrl(trimmed);
                if (parsed) {
                    const downloadName = getAttachmentDownloadNameFromReference(trimmed);
                    const options = downloadName ? { download: downloadName } : undefined;
                    const { data, error } = await supabase.storage.from(parsed.bucket).createSignedUrl(parsed.path, 3600, options);
                    if (!error && data?.signedUrl) return data.signedUrl;
                }
                return trimmed;
            }

            const cleaned = trimmed.replace(/^\/+/, '');
            const parts = cleaned.split('?');
            const pathPart = parts[0] || '';
            const searchParams = new URLSearchParams(parts[1] || '');
            const downloadName = normalizeAttachmentFileName(searchParams.get('display_name') || searchParams.get('download') || '');
            const options = downloadName ? { download: downloadName } : undefined;
            const knownBuckets = new Set(['attachments', 'assets', 'contracts', 'candidates', 'candidate_proofs']);
            const bucketMatch = pathPart.match(/^([^/]+)\/(.+)$/);
            const bucket = (bucketMatch && knownBuckets.has(bucketMatch[1])) ? bucketMatch[1] : 'attachments';
            const objectPath = (bucketMatch && knownBuckets.has(bucketMatch[1])) ? bucketMatch[2] : pathPart;

            const primary = await supabase.storage.from(bucket).createSignedUrl(objectPath, 3600, options);
            if (!primary.error && primary.data?.signedUrl) return primary.data.signedUrl;
            if (bucket !== 'attachments') {
                const fallback = await supabase.storage.from('attachments').createSignedUrl(objectPath, 3600, options);
                if (!fallback.error && fallback.data?.signedUrl) return fallback.data.signedUrl;
            }
            return trimmed;
        }

        let myOfficialId = null;
        let myOfficialRows = [];
        let myOfficialIds = [];
        let myExecutiveOfficialIds = [];
        let myDelegateOfficialIds = [];
        let mySealUrl = null;
        let myName = null;
        let myAuthId = null;
        let isAdminUser = false;
        let confirmResolve = null;
        let currentMinuteId = null;
        let alreadySignedOnce = false;
        let forceSignedOnce = false;
        let signatureCanvas = null;
        let signatureCtx = null;
        let drawing = false;
        let hasDrawn = false;
        let pendingSignAfterPad = false;
        let signatureTelegramConnectUrl = '';
        let signatureTelegramConnectCommand = '';
        let signatureTelegramConnectCode = '';
        let signListFilter = 'all';
        const requestedMinuteId = (() => {
            const params = new URLSearchParams(window.location.search);
            return String(params.get('minuteId') || params.get('id') || '').trim();
        })();
        let autoOpenedRequestedMinute = false;

        function sanitizeStyle(styleText) {
            const raw = String(styleText || '');
            if (!raw) return '';
            if (/expression\s*\(/i.test(raw)) return '';
            if (/javascript:/i.test(raw)) return '';
            return raw.replace(/url\s*\(/gi, '');
        }

        function sanitizeHtml(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(String(html || ''), 'text/html');
            const allowedTags = new Set([
                'A','B','BR','BLOCKQUOTE','DIV','EM','H1','H2','H3','H4','H5','H6',
                'HR','I','IMG','LI','OL','P','SPAN','STRONG','TABLE','TBODY','TD',
                'TH','THEAD','TR','U','UL'
            ]);
            const blockedTags = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META']);
            const allowedAttrs = {
                '*': new Set(['class','style']),
                'A': new Set(['href','target','rel','title','class','style']),
                'IMG': new Set(['src','alt','title','width','height','class','style']),
                'TABLE': new Set(['class','style','border','cellpadding','cellspacing']),
                'TD': new Set(['class','style','colspan','rowspan','align']),
                'TH': new Set(['class','style','colspan','rowspan','align'])
            };
            const isSafeUrl = (value, allowDataImage = false) => {
                const raw = String(value || '').trim();
                if (!raw) return null;
                if (/^(mailto:|tel:)/i.test(raw)) return raw;
                if (allowDataImage && /^data:image\//i.test(raw)) return raw;
                try {
                    const u = new URL(raw, window.location.origin);
                    if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
                } catch (e) {}
                return null;
            };

            const nodes = Array.from(doc.body.querySelectorAll('*'));
            nodes.forEach(node => {
                const tag = node.tagName;
                if (!allowedTags.has(tag)) {
                    if (blockedTags.has(tag)) {
                        node.remove();
                        return;
                    }
                    const parent = node.parentNode;
                    if (!parent) return;
                    while (node.firstChild) parent.insertBefore(node.firstChild, node);
                    parent.removeChild(node);
                    return;
                }

                Array.from(node.attributes).forEach(attr => {
                    const name = attr.name.toLowerCase();
                    const value = attr.value;
                    if (name.startsWith('on')) {
                        node.removeAttribute(attr.name);
                        return;
                    }
                    const allowSet = allowedAttrs[tag] || allowedAttrs['*'];
                    if (allowSet && !allowSet.has(name) && !(allowedAttrs['*'] && allowedAttrs['*'].has(name))) {
                        node.removeAttribute(attr.name);
                        return;
                    }
                    if (name === 'href') {
                        const safe = isSafeUrl(value, false);
                        if (!safe) node.removeAttribute('href');
                        else node.setAttribute('href', safe);
                    }
                    if (name === 'src') {
                        const safe = isSafeUrl(value, tag === 'IMG');
                        if (!safe) node.removeAttribute('src');
                        else node.setAttribute('src', safe);
                    }
                    if (name === 'style') {
                        const safeStyle = sanitizeStyle(value);
                        if (safeStyle) node.setAttribute('style', safeStyle);
                        else node.removeAttribute('style');
                    }
                    if (name === 'target' && node.tagName === 'A') {
                        if (node.getAttribute('target') === '_blank') {
                            node.setAttribute('rel', 'noopener noreferrer');
                        }
                    }
                });
            });
            return doc.body.innerHTML;
        }

        function safeUrl(value) {
            const raw = String(value || '').trim();
            if (!raw) return null;
            try {
                const url = new URL(raw, window.location.origin);
                if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
            } catch (e) {}
            return null;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function renderAttachments(doc) {
            const panel = document.getElementById('attachment-panel');
            const list = document.getElementById('attachment-list');
            if (!panel || !list) return;

            let urls = [];
            urls = urls.concat(normalizeUrls(doc?.file_urls));
            urls = urls.concat(normalizeUrls(doc?.file_links));
            if (doc?.file_url) urls.push(doc.file_url);
            urls = uniqueUrls(urls);

            const names = Array.isArray(doc?.file_names) ? doc.file_names : [];
            if (urls.length === 0) {
                panel.style.display = 'none';
                list.innerHTML = '';
                return;
            }

            const resolved = [];
            for (let i = 0; i < urls.length; i += 1) {
                const resolvedUrl = await resolveAttachmentUrl(urls[i]);
                if (!resolvedUrl) continue;
                resolved.push({
                    url: resolvedUrl,
                    name: getCleanAttachmentDisplayName(names[i]) || getAttachmentDownloadNameFromReference(urls[i]) || `첨부파일 ${i + 1}`
                });
            }

            if (resolved.length === 0) {
                panel.style.display = 'none';
                list.innerHTML = '';
                return;
            }

            panel.style.display = 'block';
            list.innerHTML = resolved.map((item, index) => {
                const safe = safeUrl(item.url);
                if (!safe) return '';
                const displayName = getCleanAttachmentDisplayName(item.name) || `첨부파일 ${index + 1}`;
                return `
                    <div class="attachment-item">
                        <div>
                            <div class="attachment-name">${escapeHtml(displayName)}</div>
                            <div class="attachment-meta">첨부 ${index + 1}</div>
                        </div>
                        <div class="attachment-actions">
                            <a class="btn-outline" href="${safe}" target="_blank" rel="noopener noreferrer">열기</a>
                            <a class="btn-outline" href="${safe}" download>다운로드</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getRoleLabel(off) {
            return (off.role || off.position || off.category || '').trim();
        }

        function isDirectorRole(off) {
            const label = getRoleLabel(off);
            if (!label) return false;
            return label.includes('이사장') || label === '이사';
        }

        function sortDirectorOrder(list) {
            const chairman = list.filter(o => getRoleLabel(o).includes('이사장'));
            const directors = list.filter(o => getRoleLabel(o) === '이사');
            directors.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));
            return [...chairman, ...directors];
        }

        function normalizeOfficialIds(values) {
            return Array.from(new Set((Array.isArray(values) ? values : [])
                .map(value => String(value || '').trim())
                .filter(Boolean)));
        }

        function getRelevantOfficialIdsForDoc(doc) {
            const docType = String(doc?.doc_type || '').toUpperCase();
            if (docType === 'MINUTES') {
                return myExecutiveOfficialIds.length > 0 ? myExecutiveOfficialIds : myOfficialIds;
            }
            if (docType === 'GENERAL_ASSEMBLY') {
                return myDelegateOfficialIds.length > 0 ? myDelegateOfficialIds : myOfficialIds;
            }
            return myOfficialIds;
        }

        function getAllMyOfficialIdsForDocFallback(doc) {
            const relevantIds = getRelevantOfficialIdsForDoc(doc);
            return relevantIds.length > 0 ? relevantIds : myOfficialIds;
        }

        function resolveSignerIdsForDoc(doc, officials) {
            const safeOfficials = Array.isArray(officials) ? officials : [];
            const explicitSignerIds = normalizeOfficialIds(doc?.signer_ids);
            if (explicitSignerIds.length > 0) return explicitSignerIds;

            const docType = String(doc?.doc_type || '').toUpperCase();
            const directors = sortDirectorOrder(safeOfficials.filter(isDirectorRole));
            const delegates = safeOfficials.filter(o => String(o.category || '').toLowerCase() === 'delegate');
            if (docType === 'GENERAL_ASSEMBLY') return normalizeOfficialIds(delegates.map(o => o.id));
            if (docType === 'MINUTES') return normalizeOfficialIds(directors.map(o => o.id));
            return normalizeOfficialIds(safeOfficials.map(o => o.id));
        }

        function resolveSigningOfficialId(doc, officials) {
            const signerIds = resolveSignerIdsForDoc(doc, officials);
            const preferredIds = normalizeOfficialIds(getAllMyOfficialIdsForDocFallback(doc));
            return signerIds.find(id => preferredIds.includes(String(id)))
                || preferredIds[0]
                || null;
        }

        function hasMySignatureForDoc(signatures) {
            if (!Array.isArray(signatures) || myOfficialIds.length === 0) return false;
            return signatures.some(sig => myOfficialIds.includes(String(sig?.official_id || '').trim()));
        }

        function findMySignatureForDoc(signatures, doc) {
            if (!Array.isArray(signatures) || signatures.length === 0) return null;
            const relevantIds = normalizeOfficialIds(getAllMyOfficialIdsForDocFallback(doc));
            const allIds = normalizeOfficialIds(myOfficialIds);
            return signatures.find(sig => relevantIds.includes(String(sig?.official_id || '').trim()))
                || signatures.find(sig => allIds.includes(String(sig?.official_id || '').trim()))
                || null;
        }


        function initSignaturePad() {
            signatureCanvas = document.getElementById('signatureCanvas');
            if (!signatureCanvas) return;
            signatureCtx = signatureCanvas.getContext('2d');
            signatureCtx.lineWidth = 2;
            signatureCtx.lineCap = 'round';
            signatureCtx.strokeStyle = '#111827';

            const getPos = (e) => {
                const rect = signatureCanvas.getBoundingClientRect();
                if (e.touches && e.touches[0]) {
                    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                }
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const startDraw = (e) => {
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                signatureCtx.beginPath();
                signatureCtx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                signatureCtx.lineTo(pos.x, pos.y);
                signatureCtx.stroke();
                hasDrawn = true;
            };

            const endDraw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                drawing = false;
                signatureCtx.closePath();
            };

            signatureCanvas.addEventListener('mousedown', startDraw);
            signatureCanvas.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', endDraw);
            signatureCanvas.addEventListener('touchstart', startDraw, { passive: false });
            signatureCanvas.addEventListener('touchmove', draw, { passive: false });
            signatureCanvas.addEventListener('touchend', endDraw);
        }

        function openSignaturePad() {
            hasDrawn = false;

            modal.classList.add('show');
            if (!signatureCanvas) initSignaturePad();
            if (signatureCtx) {
                signatureCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
            }
        }

        function appendListMessage(container, message, color = '#64748b') {

            msg.style.marginTop = '12px';
            msg.style.color = color;
            msg.innerText = message;
            container.appendChild(msg);
        }
        window.setSignListFilter = function setSignListFilter(nextFilter) {
            signListFilter = ['all', 'pending', 'completed', 'readonly'].includes(String(nextFilter || ''))
                ? String(nextFilter)
                : 'all';
            loadSignList();
        };
        function renderListError(message = '문서를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.') {
            const listPanel = document.getElementById('list-panel');
            if (!listPanel) return;
            listPanel.innerHTML = '';
            listPanel.appendChild(buildListHeader());
            appendListMessage(listPanel, message, '#b91c1c');
        }
        function showConfirm(msg) {
            document.getElementById('confirmText').innerText = msg;
            document.getElementById('confirmModal').classList.add('show');
            return new Promise(resolve => { confirmResolve = resolve; });
        }
        window.closeConfirm = (ok) => {
            document.getElementById('confirmModal').classList.remove('show');
            if (confirmResolve) confirmResolve(ok);
        };

        function showList() {
            document.getElementById('detail-panel').classList.add('hidden');
            document.getElementById('list-panel').style.display = 'block';
            setDetailModePill(false);
        }
        window.showList = showList;

        function setDetailModePill(showWaitingView, label = '서명대기 · 열람중') {
            const pill = document.getElementById('detail-mode-pill');
            if (!pill) return;
            pill.textContent = label;
            pill.classList.toggle('show', !!showWaitingView);
        }

        function getDocumentSignProgress(doc, isSigned) {
            if (isSigned) {
                return { label: '서명 완료', className: 'completed', detailText: '이미 서명 완료된 문서입니다.' };
            }
            if (String(doc?.status || '') === 'OPEN') {
                return { label: '서명 필요', className: 'pending', detailText: '서명 필요 문서입니다. 내용을 확인한 뒤 전자서명을 진행해 주세요.' };
            }
            return { label: '열람 전용', className: 'readonly', detailText: '현재는 열람 전용 문서입니다.' };
        }

        async function applyMinutesSignPageTitle() {
            try {
                const { data } = await MinutesService.getCompanyInfo();
                const orgName = String(data?.orgName || data?.company_name || '').trim();
                document.title = orgName ? `전자서명 - ${orgName}` : '전자서명';
            } catch (_) {
                document.title = '전자서명';
            }
        }

        async function initSession() {
            const session = await MinutesService.getSession();
            if (!session) {
                showToast('로그인이 필요합니다.');
                const loginUrl = `sign_login.html?next=${encodeURIComponent(window.location.href)}`;
                location.href = loginUrl;
                return false;
            }
            myAuthId = session.user.id;
            isAdminUser = await MinutesService.isAdmin(session.user.id, session.user.email);

            const { member, official, officials } = await MinutesService.getMyOfficial(session);
            if (member) myName = member.name;
            myOfficialRows = Array.isArray(officials) ? officials : [];
            myOfficialIds = normalizeOfficialIds(myOfficialRows.map(row => row.id));
            myExecutiveOfficialIds = normalizeOfficialIds(
                myOfficialRows
                    .filter(row => String(row?.category || '').toLowerCase() === 'executive')
                    .map(row => row.id)
            );
            myDelegateOfficialIds = normalizeOfficialIds(
                myOfficialRows
                    .filter(row => String(row?.category || '').toLowerCase() === 'delegate')
                    .map(row => row.id)
            );
            if (official) {
                myOfficialId = official.id;
                mySealUrl = official.seal_url || (myOfficialRows.find(row => row?.seal_url)?.seal_url || null);
            }
            await loadSignatureTelegramLinkStatus();
            return true;
        }

        async function loadSignList() {
            const listPanel = document.getElementById('list-panel');
            listPanel.innerHTML = '';
            listPanel.appendChild(buildListHeader());

            try {
                if (myOfficialIds.length === 0 && !isAdminUser) {
                    appendListMessage(listPanel, '임원 전용 페이지입니다. 임원 본인 계정으로 로그인하세요.');
                    return;
                }

                const signModeMinutes = (await MinutesService.listSignModeMinutes()).data || [];
                let targets = Array.isArray(signModeMinutes) ? signModeMinutes : [];

                if (myOfficialIds.length > 0) {
                    const officials = await MinutesService.getOfficials();
                    targets = targets.filter(t => {
                        if (t.doc_type === 'MINUTES' || t.doc_type === 'GENERAL_ASSEMBLY') {
                            const signerIds = resolveSignerIdsForDoc(t, officials);
                            const relevantIds = normalizeOfficialIds(getAllMyOfficialIdsForDocFallback(t));
                            return signerIds.some(id => relevantIds.includes(String(id)));
                        }
                        return true;
                    });
                }

                if (targets.length === 0) {
                    if (requestedMinuteId && !autoOpenedRequestedMinute) {
                        autoOpenedRequestedMinute = true;
                        showToast('해당 문서를 찾을 수 없습니다.');
                    }
                    appendListMessage(listPanel, '현재 열람/서명 가능한 문서가 없습니다.');
                    return;
                }

                const minuteIds = targets.map(m => m.id);
                const { data: sigList } = await MinutesService.listSignaturesForMinutes(minuteIds);
                const signedMap = new Map((sigList || []).map(s => [String(s.minute_id) + ':' + String(s.official_id), true]));
                const viewModels = targets.map((m) => {
                    const isSigned = myOfficialIds.length > 0
                        ? (myOfficialIds.some(officialId => signedMap.get(String(m.id) + ':' + String(officialId))) || isLocallySigned(m.id))
                        : false;
                    const signProgress = getDocumentSignProgress(m, isSigned);
                    const modeLabel = m.status === 'OPEN' ? '서명모드' : '열람모드';
                    return {
                        minute: m,
                        isSigned,
                        signProgress,
                        modeLabel,
                        isPending: signProgress.className === 'pending',
                        isCompleted: signProgress.className === 'completed',
                        isReadonly: signProgress.className === 'readonly'
                    };
                }).sort((a, b) => {
                    const priority = (item) => item.isPending ? 0 : item.isCompleted ? 1 : 2;
                    const prioDiff = priority(a) - priority(b);
                    if (prioDiff !== 0) return prioDiff;
                    const aTime = new Date(a.minute?.created_at || 0).getTime();
                    const bTime = new Date(b.minute?.created_at || 0).getTime();
                    return bTime - aTime;
                });

                const summary = {
                    total: viewModels.length,
                    pending: viewModels.filter((item) => item.isPending).length,
                    completed: viewModels.filter((item) => item.isCompleted).length,
                    readonly: viewModels.filter((item) => item.isReadonly).length
                };
                listPanel.appendChild(buildListToolbar(summary));

                const filteredViewModels = viewModels.filter((item) => {
                    if (signListFilter === 'pending') return item.isPending;
                    if (signListFilter === 'completed') return item.isCompleted;
                    if (signListFilter === 'readonly') return item.isReadonly;
                    return true;
                });

                if (filteredViewModels.length === 0) {
                    const emptyMessage = signListFilter === 'pending'
                        ? '현재 바로 서명할 문서가 없습니다.'
                        : signListFilter === 'completed'
                            ? '서명 완료 문서가 없습니다.'
                            : signListFilter === 'readonly'
                                ? '열람 전용 문서가 없습니다.'
                                : '현재 열람/서명 가능한 문서가 없습니다.';
                    appendListMessage(listPanel, emptyMessage);
                    return;
                }

                filteredViewModels.forEach(({ minute: m, signProgress, modeLabel }) => {
                    const item = document.createElement('div');
                    item.className = 'list-item';

                    const textWrap = document.createElement('div');
                    const titleEl = document.createElement('div');
                    titleEl.className = 'list-title';
                    const label = getDocTypeLabel(m.doc_type);
                    titleEl.textContent = m.title ? `${label} · ${m.title}` : label;

                    const dateEl = document.createElement('div');
                    dateEl.className = 'list-sub';
                    dateEl.textContent = `${formatMinutesSignKstDate(m.created_at)} | ${modeLabel} | ${signProgress.label}`;

                    textWrap.appendChild(titleEl);
                    textWrap.appendChild(dateEl);

                    item.appendChild(textWrap);
                    const badgeEl = document.createElement('span');
                    badgeEl.className = `list-status-badge ${signProgress.className}`;
                    badgeEl.textContent = signProgress.label;
                    item.appendChild(badgeEl);
                    item.addEventListener('click', () => openDocumentById(m.id));
                    listPanel.appendChild(item);
                });

                if (requestedMinuteId && !autoOpenedRequestedMinute) {
                    autoOpenedRequestedMinute = true;
                    const matched = targets.find((target) => String(target?.id || '') === requestedMinuteId);
                    if (matched?.id) {
                        await openDocumentById(matched.id);
                    } else {
                        showToast('해당 문서를 찾을 수 없습니다.');
                    }
                }
            } catch (err) {
                console.error('minutes_sign loadSignList error:', err);
                renderListError('서명 문서 목록을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.');
            }
        }

async function openDocumentById(id) {
            try {
                const { data: doc } = await MinutesService.getMinuteById(id);
                if (!doc) {
                    showToast('문서를 찾을 수 없습니다.');
                    return;
                }
                currentMinuteId = id;

                document.getElementById('detail-title').textContent = doc.title
                    ? `${getDocTypeLabel(doc.doc_type)} · ${doc.title}`
                    : getDocTypeLabel(doc.doc_type);
                document.getElementById('detail-meta').textContent = `작성일: ${formatMinutesSignKstDate(doc.created_at)}`;
                document.getElementById('detail-content').innerHTML = sanitizeHtml(doc.content || '');
                await renderAttachments(doc);

                await updateSignStatus(doc);

                document.getElementById('list-panel').style.display = 'none';
                document.getElementById('detail-panel').classList.remove('hidden');
            } catch (err) {
                console.error('minutes_sign openDocumentById error:', err);
                showToast('문서 내용을 불러오지 못했습니다.');
            }
        }

        async function updateSignStatus(doc) {
            const statusEl = document.getElementById('detail-status');
            const btn = document.getElementById('btn-sign');
            const cancelBtn = document.getElementById('btn-cancel-sign');

            setDetailModePill(false);
            btn.disabled = true;
            btn.innerText = '서명하기';
            if (cancelBtn) cancelBtn.style.display = 'none';
            btn.style.display = 'inline-flex';

            if (!doc.requires_sign || doc.doc_type === 'NOTICE') {
                statusEl.innerText = '이 문서는 서명 대상이 아닙니다.';
                btn.innerText = '서명 대상 아님';
                return;
            }

            if (myOfficialIds.length === 0 && isAdminUser) {
                statusEl.innerText = '관리자 권한으로 열람 중입니다. 서명은 임원만 가능합니다.';
                btn.innerText = '임원만 서명 가능';
                return;
            }
            if (myOfficialIds.length === 0) {
                statusEl.innerText = '임원 계정만 서명이 가능합니다.';
                btn.innerText = '임원만 서명 가능';
                return;
            }

            const { data: signatures } = await MinutesService.listSignaturesByMinuteId(currentMinuteId);
            const alreadySigned = forceSignedOnce || isLocallySigned(currentMinuteId) || hasMySignatureForDoc(signatures);
            if (alreadySigned) {
                const mySignature = findMySignatureForDoc(signatures, doc);
                if (mySignature?.official_id) {
                    myOfficialId = Number(mySignature.official_id);
                }
                alreadySignedOnce = true;
                markLocallySigned(currentMinuteId);
                statusEl.innerText = '이미 서명 완료된 문서입니다.';
                btn.disabled = true;
                btn.innerText = '서명 완료됨';
                btn.style.display = 'none';
                setDetailModePill(true, '서명 완료');
                if (cancelBtn && doc.status === 'OPEN') cancelBtn.style.display = 'inline-flex';
                return;
            } else {
                alreadySignedOnce = false;
                forceSignedOnce = false;
                clearLocallySigned(currentMinuteId);
            }

            const officials = await MinutesService.getOfficials();
            const signerIds = resolveSignerIdsForDoc(doc, officials);
            const relevantIds = normalizeOfficialIds(getAllMyOfficialIdsForDocFallback(doc));
            const signingOfficialId = resolveSigningOfficialId(doc, officials);
            if (signingOfficialId) {
                myOfficialId = Number(signingOfficialId);
            }

            if ((doc.doc_type === 'MINUTES' || doc.doc_type === 'GENERAL_ASSEMBLY')
                && !signerIds.some(id => relevantIds.includes(String(id)))) {
                statusEl.innerText = '서명 대상이 아닙니다.';
                btn.innerText = '서명 대상 아님';
                return;
            }

            if (doc.status !== 'OPEN') {
                const signedCount = Array.isArray(signatures) ? signatures.length : 0;
                if (doc.status === 'CLOSED' && signedCount === 0) {
                    statusEl.innerText = '현재 열람모드입니다. 수정이 필요한 내용이 있으면 사무국장에게 연락 바랍니다.';
                    setDetailModePill(true, '서명 마감 · 열람중');
                } else {
                    statusEl.innerText = '서명 마감된 문서입니다.';
                    setDetailModePill(true, '서명 마감');
                }
                btn.disabled = true;
                btn.style.display = 'none';
                if (cancelBtn) cancelBtn.style.display = 'none';
                return;
            }

            if (!mySealUrl) {
                statusEl.innerText = `${myName || ''}님은 도장 이미지가 없어서 터치패드(직접 그리기)로 진행합니다.`;
                btn.disabled = false;
                return;
            }

            statusEl.innerText = '서명 필요 문서입니다. 내용을 확인한 뒤 전자서명을 진행해 주세요.';
            btn.style.display = 'inline-flex';
            btn.disabled = false;
            if (cancelBtn) cancelBtn.style.display = 'none';
        }



        function parseSignatureStorageReference(signatureUrl) {
            const raw = String(signatureUrl || '').trim();
            if (!raw) return null;
            if (raw.startsWith('http')) {
                const match = raw.match(/\/storage\/v1\/object\/(?:public|sign|authenticated)\/([^/]+)\/(.+)$/);
                if (!match) return null;
                let path = String(match[2] || '').split('?')[0];
                try { path = decodeURIComponent(path); } catch (_) {}
                return { bucket: match[1], path };
            }
            const cleaned = raw.replace(/^\/+/, '');
            if (cleaned.startsWith('attachments/')) {
                return { bucket: 'attachments', path: cleaned.slice('attachments/'.length) };
            }
            return { bucket: 'attachments', path: cleaned };
        }

        async function resolveSignaturePreviewSource(signatureUrl) {
            const raw = String(signatureUrl || '').trim();
            if (!raw) return '';
            if (raw.startsWith('data:image/')) return raw;
            const storageRef = parseSignatureStorageReference(raw);
            if (!storageRef) return safeUrl(raw) || '';
            const { data, error } = await MinutesService.createSignedUrl(storageRef.bucket, storageRef.path, 900);
            if (error || !data?.signedUrl) throw new Error(error?.message || '서명 원본을 안전하게 읽지 못했습니다.');
            return data.signedUrl;
        }

        async function removeSignatureFile(signatureUrl) {
            const storageRef = parseSignatureStorageReference(signatureUrl);
            if (!storageRef) return;
            if (storageRef.bucket !== 'attachments' || !storageRef.path.startsWith('signatures/')) return;
            await supabase.storage.from('attachments').remove([storageRef.path]);
        }

        async function removeSignaturePreviewFile(minuteId, officialId, signatureId) {
            const previewPath = getSignaturePreviewPath(minuteId, officialId, signatureId);
            if (!previewPath) return;
            await supabase.storage.from(SIGNATURE_PREVIEW_BUCKET).remove([previewPath]);
        }

        async function submitSignature(signatureUrl, previewSource = signatureUrl, options = {}) {
            const signingOfficialId = Number(myOfficialId || 0);
            if (!signingOfficialId) {
                showToast('서명 가능한 임원 정보를 찾지 못했습니다.');
                return;
            }
            const signatureId = crypto.randomUUID();
            const previewPath = getSignaturePreviewPath(currentMinuteId, signingOfficialId, signatureId);
            let previewUploaded = false;

            try {
                const sourceUrl = await resolveSignaturePreviewSource(previewSource);
                const previewBlob = await createSignaturePreviewBlob(sourceUrl);
                const { error: previewError } = await supabase.storage
                    .from(SIGNATURE_PREVIEW_BUCKET)
                    .upload(previewPath, previewBlob, {
                        contentType: 'image/png',
                        cacheControl: '3600',
                        upsert: false
                    });
                if (previewError) throw previewError;
                previewUploaded = true;
            } catch (previewError) {
                if (options.removeUploadedRawOnFailure) await removeSignatureFile(signatureUrl);
                showToast('서명 열람본 생성 실패: ' + (previewError?.message || 'Unknown error'));
                return;
            }

            const { error } = await MinutesService.insertSignature({
                id: signatureId,
                minute_id: currentMinuteId,
                official_id: signingOfficialId,
                member_uuid: myAuthId,
                signature_url: signatureUrl
            });

            if (error) {
                if (previewUploaded) await removeSignaturePreviewFile(currentMinuteId, signingOfficialId, signatureId);
                if (options.removeUploadedRawOnFailure) await removeSignatureFile(signatureUrl);
                const msg = (error.message || '').toLowerCase();
                if (error.status === 409 || msg.includes('conflict')) {
                    forceSignedOnce = true;
                    markLocallySigned(currentMinuteId);
                    showToast('이미 서명된 문서입니다.');
                    const { data: doc } = await MinutesService.getMinuteById(currentMinuteId);
                    if (doc) await updateSignStatus(doc);
                    await loadSignList();
                    showList();
                    return;
                }
                showToast('서명 실패: ' + error.message);
            } else {
                await notifySignatureCompletionIfNeeded(currentMinuteId);
                markLocallySigned(currentMinuteId);
                showToast('정상적으로 서명되었습니다.');
                const { data: doc } = await MinutesService.getMinuteById(currentMinuteId);
                if (doc) await updateSignStatus(doc);
                await loadSignList();
                showList();
            }
        } // End of submitSignature

        async function notifySignatureCompletionIfNeeded(minuteId) {
            const safeMinuteId = String(minuteId || '').trim();
            if (!safeMinuteId) return;
            try {
                const { data, error } = await supabase.functions.invoke('signature-telegram-complete-dm', {
                    body: {
                        minuteId: safeMinuteId
                    }
                });
                if (error) {
                    console.warn('[minutes_sign] signature completion notify failed:', error.message || error);
                    return;
                }
                if (data?.ok === false) {
                    console.warn('[minutes_sign] signature completion notify response not ok:', data);
                }
            } catch (invokeError) {
                console.warn('[minutes_sign] signature completion notify exception:', invokeError?.message || invokeError);
            }
        } // End of notifySignatureCompletionIfNeeded

        window.handleSign = async () => {
            if (!currentMinuteId) return;
            if (alreadySignedOnce) {
                showToast('이미 서명 완료된 문서입니다.');
                return;
            }
            if (myOfficialIds.length === 0) return showToast('임원 계정만 서명이 가능합니다.');
            const ok = await showConfirm('이 의사록의 내용을 확인하였으며, 등록된 서명으로 날인하시겠습니까?');
            if (!ok) return;

            if (!mySealUrl) {
                pendingSignAfterPad = true;
                openSignaturePad();
                return;
            }
            await submitSignature(mySealUrl);
        };


        window.cancelSignature = async () => {
            if (!currentMinuteId || myOfficialIds.length === 0) return;
            const ok = await showConfirm('이미 서명한 내역을 취소하시겠습니까?');
            if (!ok) return;
            const { data: currentDoc } = await MinutesService.getMinuteById(currentMinuteId);
            const { data: sigs } = await MinutesService.listSignaturesByMinuteId(currentMinuteId);
            const mySig = findMySignatureForDoc(sigs, currentDoc);
            const cancelOfficialId = Number(mySig?.official_id || myOfficialId || 0);
            if (!cancelOfficialId) {
                showToast('취소할 서명 정보를 찾지 못했습니다.');
                return;
            }
            const { data: deletedRows, error } = await MinutesService.deleteSignature(currentMinuteId, cancelOfficialId);
            const deletedSignatureUrl = Array.isArray(deletedRows) && deletedRows.length > 0
                ? String(deletedRows[0]?.signature_url || '').trim()
                : '';
            const signatureUrlToRemove = deletedSignatureUrl || String(mySig?.signature_url || '').trim();
            if (!error) {
                await removeSignaturePreviewFile(currentMinuteId, cancelOfficialId, mySig?.id);
                if (signatureUrlToRemove) await removeSignatureFile(signatureUrlToRemove);
            }
            if (error) {
                showToast('서명 취소 실패: ' + error.message);
                return;
            }
            alreadySignedOnce = false;
            forceSignedOnce = false;
            clearLocallySigned(currentMinuteId);
            showToast('서명 취소가 완료되었습니다.');
            const { data: doc } = await MinutesService.getMinuteById(currentMinuteId);
            if (doc) await updateSignStatus(doc);
        };

        async function init() {
            try {
                await applyMinutesSignPageTitle();
                const ok = await initSession();
                if (!ok) return;
                const runtimeCheck = await window.ErpRuntimeGuard.enforce(supabase, {
                    moduleKey: 'signature',
                    moduleLabel: '전자서명',
                    redirectUrl: `sign_login.html?next=${encodeURIComponent(window.location.href)}`,
                    alertFn: (msg) => showToast(msg)
                });
                if (!runtimeCheck.ok) return;
                await loadSignList();
            } catch (err) {
                console.error('minutes_sign init error:', err);
                renderListError('전자서명 화면을 초기화하지 못했습니다. 잠시 후 다시 시도해주세요.');
                showToast('전자서명 화면 로딩 실패');
            }
        }

        init();
    </script>
