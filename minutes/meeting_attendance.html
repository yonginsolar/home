<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow,noarchive">
 <meta name="referrer" content="no-referrer">
 <title>회의 출석</title>
 <style>
 :root{color-scheme:light dark;--paper:light-dark(#fff,#16231e);--base:light-dark(#eff5f1,#101a16);--text:light-dark(#193127,#e8f4ed);--line:light-dark(#cedbd3,#51655b);--brand:light-dark(#146442,#59d2a0);--onbrand:light-dark(#fff,#071d13);background:var(--base);color:var(--text);font:16px/1.5 system-ui,sans-serif}
 *{box-sizing:border-box}body{margin:0}main{max-width:38rem;margin:auto;padding:clamp(1rem,4vw,2rem);min-height:100dvh;background:var(--paper)}h1{font-size:1.65rem;line-height:1.3;margin:.25rem 0 .5rem;overflow-wrap:anywhere}
 form{display:grid;gap:.7rem;padding:1rem;border:1px solid var(--line);border-radius:12px}label{display:grid;gap:.25rem}input,button{font:inherit;padding:.6rem .8rem;border-radius:8px}input{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);color:inherit}button{width:max-content;border:1px solid transparent;background:var(--brand);color:var(--onbrand);min-height:44px}button:disabled{opacity:.7}p{overflow-wrap:anywhere}[hidden]{display:none!important}
 </style>
 <script type="module" src="./meeting_attendance_v1.js"></script>
</head>
<body><main>
 <h1 id="meetingTitle">회의 출석</h1>
 <p id="meetingWhen" hidden></p>
 <p id="status" role="status" aria-live="polite">출석 QR을 확인하는 중입니다.</p>
 <button id="retry" type="button" hidden>다시 확인</button>
 <button id="member" type="button" hidden>출석하기</button>
 <p id="director-login" hidden><a id="director-signin" href="./sign_login.html">기존 외부 이사 계정으로 로그인</a></p>
 <form id="guest" hidden>
  <label>이름<input id="guestName" name="guestName" required maxlength="80" autocomplete="name"></label>
  <label>전화번호<input id="guestPhone" name="guestPhone" type="tel" inputmode="tel" required maxlength="32" autocomplete="tel"></label>
  <button type="submit">출석하기</button>
 </form>
</main></body></html>
