  <script>
    function buildTargetUrl() {
      const target = new URL('./admin_minutes.html', window.location.href);
      target.searchParams.set('scope', 'minutes');
      target.searchParams.set('tab', 'minutes');
      return target;
    }

    async function bootstrap() {
      const target = buildTargetUrl();
      window.location.replace(target.href);
    }

    bootstrap();
  </script>
