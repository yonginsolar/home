<!DOCTYPE html>
<!-- Version: v1.0.2 -->
<html lang="ko">
<head>
  <script>console.log('[Version] v1.0.2 | minutes_admin.html');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>의사록 관리</title>
  <script type="module">
    import { supabase } from '../shared/supabase-client.js';

    function buildTargetUrl() {
      const target = new URL('./admin_minutes.html', window.location.href);
      target.searchParams.set('scope', 'minutes');
      target.searchParams.set('tab', 'minutes');
      return target;
    }

    function readTransferredSession() {
      const rawHash = String(window.location.hash || '').replace(/^#/, '');
      if (!rawHash) return null;
      const params = new URLSearchParams(rawHash);
      const accessToken = String(params.get('erp_access_token') || '').trim();
      const refreshToken = String(params.get('erp_refresh_token') || '').trim();
      if (!accessToken || !refreshToken) return null;
      return {
        access_token: accessToken,
        refresh_token: refreshToken
      };
    }

    async function bootstrap() {
      const target = buildTargetUrl();
      const transferredSession = readTransferredSession();

      if (transferredSession) {
        try {
          const { error } = await supabase.auth.setSession(transferredSession);
          if (error) {
            console.error('minutes_admin session transfer failed:', error);
          }
        } catch (error) {
          console.error('minutes_admin session bootstrap failed:', error);
        }
      }

      window.location.replace(target.href);
    }

    bootstrap();
  </script>
</head>
<body></body>
</html>
