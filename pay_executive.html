<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>용인모두의햇빛 출자금 입금</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f2f4f6; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; width: 100%; max-width: 400px; padding: 40px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-radius: 20px; text-align: center; box-sizing: border-box; }
        
        h2 { margin: 0 0 10px 0; color: #191f28; font-size: 24px; font-weight: 700;}
        p.desc { color: #4e5968; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }

        .account-card { background-color: #f9fafb; border-radius: 12px; padding: 24px; margin-bottom: 24px; text-align: left; }
        .bank-name { font-size: 14px; color: #8b95a1; font-weight: 500; display: block; margin-bottom: 6px; }
        .account-num { font-size: 22px; color: #333d4b; font-weight: 700; word-break: break-all; letter-spacing: -0.5px; }
        .amount-area { margin-top: 16px; padding-top: 16px; border-top: 1px dashed #e5e8eb; display: flex; justify-content: space-between; align-items: center; }
        .amount-label { color: #4e5968; font-size: 15px; }
        .amount-val { color: #e65100; font-size: 20px; font-weight: 700; }

        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; margin-bottom: 12px; transition: 0.2s; box-sizing: border-box;}
        
        .btn-toss { background-color: #0064FF; color: white; box-shadow: 0 4px 10px rgba(0, 100, 255, 0.2); }
        .btn-copy { background-color: #f2f4f6; color: #4e5968; }

        .mobile-only-btn { display: none; }

        @media screen and (max-width: 768px) {
            .mobile-only-btn { display: flex !important; }
            .pc-guide { display: none !important; }
        }

        .pc-guide { display: block; }

        #toast { visibility: hidden; min-width: 250px; background-color: rgba(51, 61, 75, 0.9); color: #fff; text-align: center; border-radius: 50px; padding: 14px 24px; position: fixed; z-index: 99; bottom: 40px; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; font-size: 15px; font-weight: 500; }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <h2>출자금 입금 안내</h2>
    
    <p class="desc" id="guideText">
        <span class="pc-guide">스마트폰 뱅킹으로 입금해 주세요.</span>
        <span class="mobile-only-btn" style="display:none; flex-direction:column;">조합원님, 아래 신협 계좌로<br>출자금을 입금해 주세요.</span>
    </p>
    
    <div class="account-card">
        <span class="bank-name">신협</span>
        <div class="account-num">131-022-855509</div>
        <div class="amount-area">
            <span class="amount-label">입금하실 금액</span>
            <span class="amount-val"><span id="displayAmount">0</span>원</span>
        </div>
    </div>

    <a id="linkToss" href="#" class="btn btn-toss mobile-only-btn">
        토스로 10만원 보내기
    </a>

    <button class="btn btn-copy" onclick="copyAccount()">
        계좌번호 복사하기
    </button>
    
    <p style="font-size: 13px; color: #8b95a1; margin-top: 16px;">
        계좌 복사 후 사용하시는 은행 앱에서<br>붙여넣기 하시면 됩니다.
    </p>
</div>

<div id="toast">계좌번호가 복사되었습니다</div>

<script>
    const CONFIG = {
        bankCode: '048', // 신협
        accountNo: '131022855509' // 숫자만
    };

    document.addEventListener('DOMContentLoaded', () => {
        // 1. 모바일 환경 감지 (UserAgent + 화면 너비)
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 768;

        // 2. URL 파라미터 처리 (이름만 가져옴, 금액은 제거)
        const params = new URLSearchParams(window.location.search);
        const userName = params.get('name');

        // 3. [핵심 변경] 금액 하드코딩 (10만원 고정)
        const FIXED_AMOUNT = 100000;

        // 4. 화면 표시 (콤마 적용)
        const displayElement = document.getElementById('displayAmount');
        if (displayElement) {
            displayElement.innerText = FIXED_AMOUNT.toLocaleString();
        }

        // 5. 이름이 있는 경우 멘트 교체 로직
        if (userName) {
            const decodedName = decodeURIComponent(userName);
            const mobileTextSpan = document.querySelector('p.desc .mobile-only-btn');
            if(mobileTextSpan) {
                mobileTextSpan.innerHTML = `<b>${decodedName}</b> 조합원님,<br>아래 신협 계좌로 입금해 주세요.`;
            }
        }

        // 6. 토스 링크 생성 (고정된 금액 적용)
        const cleanAccountNo = CONFIG.accountNo.replace(/[^0-9]/g, '');
        // supertoss 스키마에 amount 파라미터를 고정값으로 전달
        const tossUrl = `supertoss://send?bank=${CONFIG.bankCode}&accountNo=${cleanAccountNo}&amount=${FIXED_AMOUNT}&origin=link`;
        
        const linkElement = document.getElementById('linkToss');
        if (linkElement) {
            linkElement.href = tossUrl;
        }
    // End of DOMContentLoaded
    });

    async function copyAccount() {
        const textToCopy = CONFIG.accountNo; 
        try {
            await navigator.clipboard.writeText(textToCopy);
            showToast("계좌번호가 복사되었습니다!");
        } catch (err) {
            prompt("직접 복사해주세요:", textToCopy);
        }
    // End of copyAccount
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        if (toast) {
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }
    // End of showToast
    }
</script>

</body>
</html>
