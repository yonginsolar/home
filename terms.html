<!DOCTYPE html>
<!--
Version: v1.0.0
Change: Publish a tenant-scoped service terms page only when the cooperative has approved it.
-->
<html lang="ko">
<head>
  <script>console.log('[Version] v1.0.0 | terms.html'); document.documentElement.classList.add('legal-tenant-pending');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="협동조합 홈페이지 서비스 이용약관입니다.">
  <meta name="robots" content="noindex,nofollow">
  <title>서비스 이용약관</title>
  <link rel="icon" type="image/png" href="https://ifdqlwxgqgsvnawmhlfc.supabase.co/storage/v1/object/public/assets/favicon.png">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">
  <script src="shared/theme.js?v=20260802-1"></script>
  <link href="shared/theme.css?v=20260829-1" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"></script>
  <script src="shared/route_guard.js?v=20260421-1"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--theme-bg); color: var(--theme-text); font-family: Pretendard, "Apple SD Gothic Neo", sans-serif; line-height: 1.75; }
    .wrap { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 96px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
    .home { color: var(--theme-text); text-decoration: none; font-weight: 800; }
    .version { color: var(--theme-muted); font-size: .9rem; text-align: right; }
    .hero, section { background: var(--theme-surface); border: 1px solid var(--theme-border); border-radius: 18px; box-shadow: var(--theme-shadow); }
    .hero { padding: clamp(24px, 5vw, 48px); margin-bottom: 24px; }
    .hero h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.25; }
    .hero p { margin: 0; color: var(--theme-muted); }
    section { padding: clamp(22px, 4vw, 36px); margin: 18px 0; }
    .legal-text { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
    .pending { max-width: 760px; margin: 12vh auto 0; text-align: center; }
    .pending p { color: var(--theme-muted); }
    .pending a { display: inline-flex; margin-top: 10px; padding: 10px 16px; border-radius: 10px; background: #166534; color: #fff; font-weight: 800; text-decoration: none; }
    html.legal-tenant-pending body { visibility: hidden; }
    @media (max-width: 640px) { .topbar { align-items: flex-start; } .wrap { width: min(100% - 20px, 960px); padding-top: 18px; } }
    @media print { .site-theme-toggle { display: none !important; } body { background: #fff !important; color: #111 !important; font-size: 11pt; } .wrap { width: 100%; padding: 0; } .hero, section { box-shadow: none; } .legal-text, p, a { font-size: 11pt !important; } }
  </style>
</head>
<body>
  <main class="wrap" id="legal-content"></main>
  <script>
    (async function loadPublishedTerms() {
      const reveal = () => document.documentElement.classList.remove('legal-tenant-pending');
      const main = document.getElementById('legal-content');
      const showPending = (coopName = '협동조합') => {
        const safeName = String(coopName || '협동조합').trim() || '협동조합';
        document.title = `서비스 이용약관 준비 중 - ${safeName}`;
        main.replaceChildren();
        const card = document.createElement('section');
        card.className = 'pending';
        const title = document.createElement('h1');
        title.textContent = '서비스 이용약관을 준비하고 있습니다';
        const message = document.createElement('p');
        message.textContent = `${safeName}에서 확정한 문서만 공개하겠습니다.`;
        const home = document.createElement('a');
        home.href = 'index.html';
        home.textContent = '홈페이지로 돌아가기';
        card.append(title, message, home);
        main.appendChild(card);
        reveal();
      };

      try {
        const client = window.CoopRouteGuard?.createSupabaseClient
          ? window.CoopRouteGuard.createSupabaseClient(
              window.supabase,
              'https://ifdqlwxgqgsvnawmhlfc.supabase.co',
              'sb_publishable_lkVhLJDe8WmOPzsWOMkKdg_pjVwVS-h'
            )
          : window.supabase.createClient(
              'https://ifdqlwxgqgsvnawmhlfc.supabase.co',
              'sb_publishable_lkVhLJDe8WmOPzsWOMkKdg_pjVwVS-h'
            );
        const { data, error } = await client.rpc('get_public_site_legal_document', { p_document_type: 'terms' });
        if (error) throw error;
        const coopName = String(data?.coop_name || '협동조합').trim() || '협동조합';
        const content = String(data?.content || '').trim();
        if (!content) return showPending(coopName);

        document.title = `서비스 이용약관 - ${coopName}`;
        document.querySelector('meta[name="robots"]')?.setAttribute('content', 'index,follow,max-snippet:-1');
        document.querySelector('meta[name="description"]')?.setAttribute('content', `${coopName}의 홈페이지 서비스 이용약관입니다.`);
        const topbar = document.createElement('div');
        topbar.className = 'topbar';
        const home = document.createElement('a');
        home.className = 'home';
        home.href = 'index.html';
        home.textContent = `← ${coopName}`;
        const version = document.createElement('div');
        version.className = 'version';
        version.textContent = data?.effective_date ? `시행 ${data.effective_date}` : '';
        topbar.append(home, version);
        const hero = document.createElement('header');
        hero.className = 'hero';
        const title = document.createElement('h1');
        title.textContent = '서비스 이용약관';
        const summary = document.createElement('p');
        summary.textContent = `${coopName}이 공개한 홈페이지 서비스 이용약관입니다.`;
        hero.append(title, summary);
        const section = document.createElement('section');
        const body = document.createElement('div');
        body.className = 'legal-text';
        body.textContent = content;
        section.appendChild(body);
        main.append(topbar, hero, section);
        reveal();
      } catch (error) {
        console.warn('[terms] published document lookup failed:', error);
        showPending();
      }
    })();
  </script>
</body>
</html>
