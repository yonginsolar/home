<script>
  function escapeHtml(value = '') {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function sanitizeStyle(styleText) {
    const raw = String(styleText || '');
    if (!raw) return '';
    if (/expression\s*\(/i.test(raw)) return '';
    if (/javascript:/i.test(raw)) return '';
    return raw.replace(/url\s*\(/gi, '');
  }

  function sanitizeHtml(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(String(html || ''), 'text/html');
    const allowedTags = new Set([
      'A','B','BR','BLOCKQUOTE','DIV','EM','H1','H2','H3','H4','H5','H6',
      'HR','I','IMG','LI','OL','P','SPAN','STRONG','TABLE','TBODY','TD',
      'TH','THEAD','TR','U','UL'
    ]);
    const blockedTags = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META']);
    const allowedAttrs = {
      '*': new Set(['class','style']),
      'A': new Set(['href','target','rel','title','class','style']),
      'IMG': new Set(['src','alt','title','width','height','class','style']),
      'TABLE': new Set(['class','style','border','cellpadding','cellspacing']),
      'TD': new Set(['class','style','colspan','rowspan','align']),
      'TH': new Set(['class','style','colspan','rowspan','align'])
    };
    const isSafeUrl = (value, allowDataImage = false) => {
      const raw = String(value || '').trim();
      if (!raw) return null;
      if (/^(mailto:|tel:)/i.test(raw)) return raw;
      if (allowDataImage && /^data:image\//i.test(raw)) return raw;
      try {
        const u = new URL(raw, window.location.origin);
        if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
      } catch (e) {}
      return null;
    };

    const nodes = Array.from(doc.body.querySelectorAll('*'));
    nodes.forEach(node => {
      const tag = node.tagName;
      if (!allowedTags.has(tag)) {
        if (blockedTags.has(tag)) {
          node.remove();
          return;
        }
        const parent = node.parentNode;
        if (!parent) return;
        while (node.firstChild) parent.insertBefore(node.firstChild, node);
        parent.removeChild(node);
        return;
      }

      Array.from(node.attributes).forEach(attr => {
        const name = attr.name.toLowerCase();
        const value = attr.value;
        if (name.startsWith('on')) {
          node.removeAttribute(attr.name);
          return;
        }
        const allowSet = allowedAttrs[tag] || allowedAttrs['*'];
        if (allowSet && !allowSet.has(name) && !(allowedAttrs['*'] && allowedAttrs['*'].has(name))) {
          node.removeAttribute(attr.name);
          return;
        }
        if (name === 'href') {
          const safe = isSafeUrl(value, false);
          if (!safe) node.removeAttribute('href');
          else node.setAttribute('href', safe);
        }
        if (name === 'src') {
          const safe = isSafeUrl(value, tag === 'IMG');
          if (!safe) node.removeAttribute('src');
          else node.setAttribute('src', safe);
        }
        if (name === 'style') {
          const safeStyle = sanitizeStyle(value);
          if (safeStyle) node.setAttribute('style', safeStyle);
          else node.removeAttribute('style');
        }
        if (name === 'target' && node.tagName === 'A') {
          if (node.getAttribute('target') === '_blank') {
            node.setAttribute('rel', 'noopener noreferrer');
          }
        }
      });
    });
    return doc.body.innerHTML;
  }

  <script>
    const SUPABASE_URL = 'https://ifdqlwxgqgsvnawmhlfc.supabase.co';

    <script>
    window.onload = async () => {
        // 모바일 메뉴 초기화
        initMobileMenu();

        await loadDocuments('정관', 'articles');
        await loadDocuments('규약', 'bylaws');
        
        document.getElementById('searchInput').addEventListener('input', filterContent);
        
        // URL 해시 체크 (#bylaws)
        if(window.location.hash === '#bylaws') {
            switchRulesTab('bylaws');
        }
    };

    // [기능] 검색창 토글
// [수정] 검색창 토글 및 초기화 기능
function toggleSearch(e) {
    if(e) e.preventDefault();
    const box = document.getElementById('search-overlay');
    const input = document.getElementById('searchInput');

    if (box.style.display === 'block') {
        // 1. 닫을 때
        box.style.display = 'none';
        
        // ★ 핵심: 검색어 지우고 전체 목록 다시 보여주기
        input.value = ''; 
        filterContent(); // 빈 값으로 필터링 -> 전체 보임
    } else {
        // 2. 열 때
        box.style.display = 'block';
        input.focus(); // 바로 입력 가능하게 포커스
    }
}

    // [기능] 탭 전환 (Bootstrap 탭 대신 심플한 JS 구현 - 더 안정적)
    function switchRulesTab(target) {
        // 버튼 스타일 초기화
        const btnA = document.getElementById('btn-articles');
        const btnB = document.getElementById('btn-bylaws');
        
        // 컨텐츠 숨기기/보이기
        if (target === 'articles') {
            document.getElementById('view-articles').style.display = 'block';
            document.getElementById('view-bylaws').style.display = 'none';
            
            // 스타일 적용 (활성: 녹색배경/흰글씨, 비활성: 흰배경/회색글씨)
            btnA.style.backgroundColor = '#009961'; btnA.style.color = '#fff'; btnA.classList.add('active');
            btnB.style.backgroundColor = '#fff'; btnB.style.color = '#666'; btnB.classList.remove('active');
        } else {
            document.getElementById('view-articles').style.display = 'none';
            document.getElementById('view-bylaws').style.display = 'block';
            
            btnB.style.backgroundColor = '#009961'; btnB.style.color = '#fff'; btnB.classList.add('active');
            btnA.style.backgroundColor = '#fff'; btnA.style.color = '#666'; btnA.classList.remove('active');
        }
        window.scrollTo(0,0);
    }

    // [기능] 모바일 메뉴 토글 (index.html 로직 이식)
    function initMobileMenu() {
        window.toggleMobileMenu = function() {
            const navbar = document.querySelector('#navbar');
            navbar.classList.toggle('navbar-mobile');
            const icon = document.querySelector('.mobile-nav-toggle');
            icon.classList.toggle('bi-list');
            icon.classList.toggle('bi-x'); 
        }
    }

    // [2026-03-15] tenant hardening: 규정집은 visible coop 문서만 조회한다.
    let __rulesVisibleCoopId = null;
    async function getRulesVisibleCoopId() {
        if (__rulesVisibleCoopId) return __rulesVisibleCoopId;
        try {
            const { data, error } = await _supabase.rpc('get_visible_coop_id');
            if (error) throw error;
            __rulesVisibleCoopId = String(data || '').trim() || null;
            return __rulesVisibleCoopId;
        } catch (e) {
            console.warn('getRulesVisibleCoopId failed:', e);
            return null;
        }
    }

    function scopeRulesVisibleTenant(query, coopId) {
        const safeCoopId = String(coopId || '').trim();
        return query.eq('coop_id', safeCoopId || '00000000-0000-0000-0000-000000000000');
    }

    // 데이터 로드 및 렌더링 (기존 로직 유지)
    async function loadDocuments(keyword, typeId) {
        const coopId = await getRulesVisibleCoopId();
        const { data } = await scopeRulesVisibleTenant(_supabase.from('site_documents')
            .select('*'), coopId).eq('category', 'doc').ilike('title', `%${keyword}%`).order('event_date', {ascending: false});

        if (!data || data.length === 0) {
            document.getElementById(`${typeId}-container`).innerHTML = '<div class="text-center py-5 text-muted">등록된 문서가 없습니다.</div>';
            return;
        }

        let currentDoc = data.find(d => d.is_current) || data[0];
        let pastDocs = data.filter(d => d.id !== currentDoc.id);

        if (currentDoc) {
            document.getElementById(`${typeId}-version`).innerText = `시행일: ${currentDoc.event_date} | 버전: ${currentDoc.version || 'Original'}`;
            renderCards(currentDoc.content, `${typeId}-container`);
        }

        const archiveBox = document.getElementById(typeId === 'articles' ? 'accordionArticles' : 'accordionBylaws');
        if (pastDocs.length > 0) {
            let html = '';
            pastDocs.forEach((doc, idx) => {
                const safeTitle = escapeHtml(doc.title || '');
                const safeDate = escapeHtml(doc.event_date || '');
                const safeContent = sanitizeHtml(doc.content || '');
                const itemId = `${typeId}Arch${idx}`;
                html += `
                    <div class="accordion-item searchable-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#${itemId}">
                                ${safeTitle} <span class="archive-badge">${safeDate}</span>
                            </button>
                        </h2>
                        <div id="${itemId}" class="accordion-collapse collapse">
                            <div class="accordion-body bg-light">
                                <div class="archive-content" style="white-space: pre-wrap; font-size:0.9rem;">${safeContent}</div>
                            </div>
                        </div>
                    </div>`;
            });
            archiveBox.innerHTML = html;
        } else {
            archiveBox.innerHTML = '<div class="text-center text-muted small py-3">지난 개정 이력이 없습니다.</div>';
        }
    }

function renderCards(text, containerId) {
        const container = document.getElementById(containerId);
        if (!text) return;
        const rawText = String(text);
        const decodeHtmlEntities = (value) => {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = value;
            return textarea.value;
        };
        const decodeHtmlEntitiesDeep = (value, maxDepth = 3) => {
            let out = String(value);
            for (let i = 0; i < maxDepth; i++) {
                const decoded = decodeHtmlEntities(out);
                if (decoded === out) break;
                out = decoded;
            }
            return out;
        };
        const hasEncodedTag = /&lt;|&gt;|&amp;lt;|&amp;gt;|&#x3c;|&#60;/i.test(rawText);
        const htmlSource = hasEncodedTag ? decodeHtmlEntitiesDeep(rawText) : rawText;
        // HTML 태그가 있으면(예: <br>) 안전하게 렌더링만 하고 분해는 하지 않음
        const hasHtml = /<[^>]+>/.test(htmlSource);
        if (hasHtml) {
            const safeHtml = sanitizeHtml(htmlSource);
            container.innerHTML = safeHtml;
            return;
        }
        
        const lines = htmlSource.split('\n');
        let html = '';
        let buffer = ''; 
        let currentTitle = ''; 

        // [수정] 정규식 패턴 정의
        const chapterPattern = /^제\s*\d+\s*장/;  // 제n장
        const sectionPattern = /^제\s*\d+\s*절/;  // [추가] 제n절
        const addendaPattern = /^부\s*칙/;        // 부칙
        
        lines.forEach(line => {
            const trimmed = line.trim();
            if(!trimmed) return;

            // 1. [장] 감지
            if (chapterPattern.test(trimmed)) {
                if (currentTitle || buffer) flushCard(); // 이전 내용 저장
                html += `<div class="chapter-title searchable-item">${trimmed}</div>`;
                return;
            }

            // 2. [추가] [절] 감지 로직
            if (sectionPattern.test(trimmed)) {
                if (currentTitle || buffer) flushCard(); // 이전 내용 저장
                // 절 제목을 위한 div 생성
                html += `<div class="section-title searchable-item">${trimmed}</div>`;
                return;
            }

            // 3. [부칙] 감지
            if (addendaPattern.test(trimmed)) {
                if (currentTitle || buffer) flushCard();
                html += `<div class="addenda-title searchable-item">${trimmed}</div>`;
                return;
            }

            // 4. [조] 감지 (기존 로직 유지)
            if (trimmed.startsWith('제') && trimmed.includes('조')) {
                if (currentTitle || buffer) flushCard();
                
                // 조 제목과 본문 분리 로직
                const splitIndex = trimmed.search(/(\(|\[|①|1\.|가\.)/);
                if (splitIndex > -1) {
                    const parenEnd = trimmed.indexOf(')');
                    if (parenEnd > -1 && parenEnd < trimmed.length - 1) {
                        currentTitle = trimmed.substring(0, parenEnd + 1).trim();
                        buffer = trimmed.substring(parenEnd + 1).trim();
                    } else {
                        currentTitle = trimmed; 
                        buffer = '';
                        const circleMatch = trimmed.search(/①|②|③|④|⑤|⑥|⑦|⑧|⑨|⑩/);
                        if (circleMatch > 0) {
                             currentTitle = trimmed.substring(0, circleMatch).trim();
                             buffer = trimmed.substring(circleMatch).trim();
                        }
                    }
                } else {
                    currentTitle = trimmed;
                    buffer = '';
                }
                return;
            }

            // 5. 일반 텍스트 (본문 누적)
            if (trimmed) {
                buffer += (buffer ? '\n' : '') + trimmed;
            }
        });

        // 마지막 남은 내용 저장
        if (currentTitle || buffer) flushCard();

        function flushCard() {
            // 원문자 줄바꿈 처리
            const safeTitle = escapeHtml(currentTitle || '');
            const safeBody = escapeHtml(buffer || '');
            let formattedBody = safeBody.replace(/\n/g, '<br>');
            formattedBody = formattedBody.replace(/(①|②|③|④|⑤|⑥|⑦|⑧|⑨|⑩)/g, '<br>$1');
            if(formattedBody.startsWith('<br>')) formattedBody = formattedBody.substring(4);

            html += `
            <div class="article-card searchable-item">
                ${safeTitle ? `<span class="article-title">${safeTitle}</span>` : ''}
                <div class="article-content">${formattedBody}</div>
            </div>`;
            
            currentTitle = '';
            buffer = '';
        }

        container.innerHTML = html;
    }

    function filterContent() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const items = document.querySelectorAll('.searchable-item');

        items.forEach(item => {
            const collapseDiv = item.querySelector('.accordion-collapse');
            if (collapseDiv && !collapseDiv.classList.contains('show')) {
                item.style.display = ''; return; 
            }
            if (item.innerText.toLowerCase().includes(keyword)) item.style.display = '';
            else item.style.display = 'none';
        });
    }
  </script>
</body>
</html>
