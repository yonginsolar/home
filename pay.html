<!DOCTYPE html>
<!--
Version: v1.0.2
Change: Replace native clipboard fallback prompt with inline copy-help sheet.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>용인모두의햇빛 출자금 입금</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f2f4f6; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; width: 100%; max-width: 400px; padding: 40px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-radius: 20px; text-align: center; box-sizing: border-box; }
        
        h2 { margin: 0 0 10px 0; color: #191f28; font-size: 24px; font-weight: 700;}
        p.desc { color: #4e5968; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }

        .account-card { background-color: #f9fafb; border-radius: 12px; padding: 24px; margin-bottom: 24px; text-align: left; }
        .bank-name { font-size: 14px; color: #8b95a1; font-weight: 500; display: block; margin-bottom: 6px; }
        .account-num { font-size: 22px; color: #333d4b; font-weight: 700; word-break: break-all; letter-spacing: -0.5px; }
        .amount-area { margin-top: 16px; padding-top: 16px; border-top: 1px dashed #e5e8eb; display: flex; justify-content: space-between; align-items: center; }
        .amount-label { color: #4e5968; font-size: 15px; }
        .amount-val { color: #e65100; font-size: 20px; font-weight: 700; }

        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; margin-bottom: 12px; transition: 0.2s; box-sizing: border-box;}
        
        .btn-toss { background-color: #0064FF; color: white; box-shadow: 0 4px 10px rgba(0, 100, 255, 0.2); }
        .btn-copy { background-color: #f2f4f6; color: #4e5968; }

        /* [핵심 수정] CSS로 제어: 기본은 숨김(none) */
        .mobile-only-btn { display: none; }

        /* 화면 너비가 768px 이하(모바일)이면 무조건 보임(flex) */
        @media screen and (max-width: 768px) {
            .mobile-only-btn { display: flex !important; }
            /* PC 안내 멘트 숨김 */
            .pc-guide { display: none !important; }
        }

        /* PC일 때만 보이는 안내 멘트용 클래스 */
        .pc-guide { display: block; }

        #toast { visibility: hidden; min-width: 250px; background-color: rgba(51, 61, 75, 0.9); color: #fff; text-align: center; border-radius: 50px; padding: 14px 24px; position: fixed; z-index: 99; bottom: 40px; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; font-size: 15px; font-weight: 500; }
        #toast.show { visibility: visible; opacity: 1; }
        .copy-help-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: none; align-items: center; justify-content: center; z-index: 120; padding: 20px; }
        .copy-help-overlay.show { display: flex; }
        .copy-help-sheet { width: 100%; max-width: 360px; background: #fff; border-radius: 18px; box-shadow: 0 18px 48px rgba(15, 23, 42, 0.24); padding: 24px 20px 18px; text-align: left; }
        .copy-help-sheet h3 { margin: 0 0 10px; font-size: 18px; color: #191f28; }
        .copy-help-sheet p { margin: 0 0 14px; font-size: 14px; color: #4e5968; line-height: 1.6; }
        .copy-help-sheet input { width: 100%; border: 1px solid #d1d5db; border-radius: 12px; padding: 12px 14px; font-size: 16px; font-weight: 700; color: #111827; background: #f9fafb; }
        .copy-help-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .copy-help-actions button { border: none; border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .copy-help-actions .btn-secondary { background: #f2f4f6; color: #4e5968; }
        .copy-help-actions .btn-primary { background: #111827; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h2>출자금 입금 안내</h2>
    
    <p class="desc" id="guideText">
        <span class="pc-guide">스마트폰 뱅킹으로 입금해 주세요.</span>
        <span class="mobile-only-btn" style="display:none; flex-direction:column;">조합원님, 아래 신협 계좌로<br>출자금을 입금해 주세요.</span>
    </p>
    
    <div class="account-card">
        <span class="bank-name">신협</span>
        <div class="account-num">131-022-855516</div>
        <div class="amount-area">
            <span class="amount-label">입금하실 금액</span>
            <span class="amount-val"><span id="displayAmount">0</span>원</span>
        </div>
    </div>

    <a id="linkToss" href="#" class="btn btn-toss mobile-only-btn">
        토스로 바로 보내기
    </a>

    <button class="btn btn-copy" onclick="copyAccount()">
        계좌번호 복사하기
    </button>
    
    <p style="font-size: 13px; color: #8b95a1; margin-top: 16px;">
        계좌 복사 후 사용하시는 은행 앱에서<br>붙여넣기 하시면 됩니다.
    </p>
</div>

<div id="toast">계좌번호가 복사되었습니다</div>
<div id="copyHelpOverlay" class="copy-help-overlay" aria-hidden="true">
    <div class="copy-help-sheet" role="dialog" aria-modal="true" aria-labelledby="copyHelpTitle">
        <h3 id="copyHelpTitle">계좌번호 직접 복사</h3>
        <p>브라우저가 자동 복사를 허용하지 않았습니다. 아래 계좌번호를 길게 눌러 복사해 주세요.</p>
        <input type="text" id="copyHelpInput" readonly value="">
        <div class="copy-help-actions">
            <button type="button" class="btn-secondary" onclick="hideCopyHelp()">닫기</button>
            <button type="button" class="btn-primary" onclick="selectCopyHelpText()">텍스트 선택</button>
        </div>
    </div>
</div>

<script>
    function escapeHtml(value = '') {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }


    const CONFIG = {
        bankCode: '048', // 신협
        accountNo: '131022855516' // 숫자만
    };

    document.addEventListener('DOMContentLoaded', () => {

        // URL 파라미터 처리
        const params = new URLSearchParams(window.location.search);
        let amount = params.get('amount');
        const userName = params.get('name');

        const numericAmount = parseInt(String(amount || '').replace(/[^0-9]/g, ''), 10);
        amount = (!numericAmount || Number.isNaN(numericAmount) || numericAmount <= 0) ? 100000 : numericAmount;

        // 화면 표시
        document.getElementById('displayAmount').innerText = amount.toLocaleString();

        // 이름이 있으면 멘트 교체 (모바일용 멘트 태그 찾아서 넣기)
        if (userName) {
            const decodedName = String(userName);
            // 모바일용 멘트 영역 찾기 (.mobile-only-btn 클래스를 가진 span)
            const mobileTextSpan = document.querySelector('p.desc .mobile-only-btn');
            if(mobileTextSpan) {
                const safeName = escapeHtml(decodedName);
                mobileTextSpan.innerHTML = `<b>${safeName}</b> 조합원님,<br>아래 신협 계좌로 입금해 주세요.`;
            }
        }

        // 토스 링크 생성 (모바일 여부와 상관없이 미리 만들어둡니다. 어차피 PC에선 버튼이 안 보이니까요)
        const cleanAccountNo = CONFIG.accountNo.replace(/[^0-9]/g, '');
        const tossUrl = `supertoss://send?bankCode=${CONFIG.bankCode}&accountNo=${cleanAccountNo}&amount=${amount}&origin=link`;
        document.getElementById('linkToss').href = tossUrl;
    });

    async function copyAccount() {
        const textToCopy = CONFIG.accountNo; 
        try {
            await navigator.clipboard.writeText(textToCopy);
            showToast("계좌번호가 복사되었습니다!");
        } catch (err) {
            showCopyHelp(textToCopy);
        }
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    function showCopyHelp(text) {
        const overlay = document.getElementById('copyHelpOverlay');
        const input = document.getElementById('copyHelpInput');
        if (!overlay || !input) return;
        input.value = String(text || '');
        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden', 'false');
        setTimeout(() => {
            input.focus();
            input.select();
        }, 0);
    }

    function hideCopyHelp() {
        const overlay = document.getElementById('copyHelpOverlay');
        if (!overlay) return;
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden', 'true');
    }

    function selectCopyHelpText() {
        const input = document.getElementById('copyHelpInput');
        if (!input) return;
        input.focus();
        input.select();
    }
</script>

</body>
</html>
