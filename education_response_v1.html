<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>교육 사전 신청 · 익명 피드백</title>
  <style>
    :root{color-scheme:light;--paper:#fff;--background:#eff5f1;--text:#193127;--line:#cedbd3;--accent:#146442}
    *{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:1rem/1.55 system-ui,sans-serif}
    main{max-width:38rem;margin:0 auto;padding:clamp(1rem,4vw,2rem);min-height:100dvh;background:var(--paper)}
    h1,h2{line-height:1.25;overflow-wrap:anywhere}h1{font-size:1.65rem;margin:.2em 0 .55em}h2{font-size:1.15rem}
    section{margin:1.25rem 0;padding:1rem;border:1px solid var(--line);border-radius:12px}
    label:not(.agreement){display:block;margin:.7rem 0 .2rem;font-weight:600}
    input:not([type=checkbox]),select,textarea{border:1px solid var(--line);border-radius:7px;width:100%;padding:.6em;font:inherit;color:inherit;background:var(--paper)}
    .agreement{display:flex;align-items:flex-start;gap:.45em;margin:.75rem 0}.agreement input{flex:none;margin-top:.36em}
    button,.button{display:inline-block;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:.65em 1em;font:inherit;text-decoration:none;cursor:pointer}
    button:disabled{opacity:.75;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #187b59;outline-offset:2px}
    #purposeLabel{font-weight:700;color:var(--accent)}#workshopMeta{color:#3f5449}#workshopDetails,#publicStatus{white-space:pre-wrap;overflow-wrap:anywhere}
    #feedbackForm label{overflow-wrap:anywhere}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#16231e;--background:#101a16;--text:#e8f4ed;--line:#51655b;--accent:#59d2a0}button,.button{color:#071d13}#workshopMeta{color:#bdd3c6}}
  </style>
  <script defer src="/shared/route_guard.js?v=20260408-1"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous"></script>
  <script defer src="/shared/education_response_v2.js" integrity="sha384-TrQQ7CGTF2hJa4uZICoeY4Rzdl4vWf5kYjmrLCFp2rOYsVPa0jbAVTdPjr+siT+J" crossorigin="anonymous"></script>
</head>
<body>
  <main>
    <div id="purposeLabel">교육</div>
    <h1 id="workshopTitle">교육 안내</h1>
    <p id="workshopMeta" hidden></p>
    <p id="workshopDetails" hidden></p>
    <p id="publicStatus" role="status" aria-live="polite">QR을 확인하는 중입니다.</p>
    <button type="button" id="retryContext" hidden>다시 확인</button>
    <section id="memberArea" hidden>
      <h2>조합원 사전 신청</h2>
      <button type="button" id="memberSubmit" hidden>조합원으로 신청</button>
      <a class="button" id="memberSignIn" href="/membermanage.html" target="_blank" rel="noopener noreferrer" hidden>조합원 로그인</a>
      <p id="memberSignInHint" hidden>새 탭에서 로그인한 뒤 이 화면으로 돌아오세요.</p>
    </section>
    <form id="guestForm" hidden>
      <section>
        <h2>비조합원 사전 신청</h2>
        <label for="guestName">이름</label>
        <input id="guestName" autocomplete="name" maxlength="100" required>
        <label for="guestPhone">연락처</label>
        <input id="guestPhone" type="tel" autocomplete="tel" inputmode="tel" maxlength="24" required>
        <label class="agreement"><input id="guestAge" type="checkbox" required> 만 14세 이상입니다.</label>
        <label class="agreement"><input id="guestConsent" type="checkbox" required> 교육 신청 확인을 위해 이름과 연락처를 수집합니다. 교육 종료 후 7일이 지나면 신청 명단에서 이름과 연락처를 지웁니다. 이에 동의합니다.</label>
        <button type="submit">비조합원으로 신청</button>
      </section>
    </form>
    <form id="feedbackForm" hidden>
      <section>
        <h2>익명 피드백</h2>
        <label for="feedbackRating" id="feedbackRatingLabel">교육은 어떠셨나요?</label>
        <select id="feedbackRating" required>
          <option value="">선택</option><option value="5">매우 좋았어요 (5)</option><option value="4">좋았어요 (4)</option>
          <option value="3">보통이에요 (3)</option><option value="2">아쉬웠어요 (2)</option><option value="1">많이 아쉬웠어요 (1)</option>
        </select>
        <label for="feedbackComment" id="feedbackCommentLabel">의견 (선택)</label>
        <textarea id="feedbackComment" rows="4" maxlength="1200" placeholder="이름이나 연락처는 쓰지 말아 주세요."></textarea>
        <button type="submit">익명으로 보내기</button>
      </section>
    </form>
  </main>
</body>
</html>
