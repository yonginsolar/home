<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://ifdqlwxgqgsvnawmhlfc.supabase.co; img-src 'self'; form-action 'none'; base-uri 'none'">
  <title>부스 방문 방명록</title>
  <style>
    :root{color-scheme:light;font:100%/1.55 system-ui,-apple-system,sans-serif;color:#172b22;background:#edf4ee}
    *{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));overflow-wrap:anywhere}
    main{max-width:34rem;margin:2rem auto;background:white;border:1px solid #c3d4c7;border-radius:1.15rem;padding:clamp(1rem,5vw,2rem)}
    h1,h2,p{margin:0 0 .55em} h1{font-size:1.6rem;line-height:1.25} h2{font-size:1.12rem}
    .tag{display:inline-block;background:#e4f1e9;color:#174d35;font-weight:700;border-radius:1rem;padding:.2em .7em}
    .meta{color:#395449;margin-bottom:1.3rem} fieldset{margin:0;padding:0;border:0;min-width:0} form p{margin-block:.65rem}
    label:not(.check){display:grid;gap:.15rem;font-weight:650} label small{font-weight:400}
    input:not([type=checkbox]){display:block;width:100%;min-width:0;font:inherit;min-height:2.75rem;border:1px solid #718777;border-radius:.5rem;padding:.38em .65em;background:#fff;color:inherit}
    button{font:inherit;font-weight:700;color:white;background:#165038;border:1px solid #165038;border-radius:.65rem;min-height:2.75rem;padding:.5em .9em;width:100%;margin:.35em 0} button:disabled{opacity:.65}
    :focus-visible{outline:3px solid #154a91;outline-offset:3px} .check{display:flex;align-items:flex-start;gap:.5em;min-height:2rem;margin-top:.65em} .check input{margin-top:.4em;flex:none}
    .consent{padding:.85em;background:#edf5ee;border-radius:.65rem;margin:1.2em 0} ul{margin:0 0 .55em;padding-inline-start:1.2em} a{color:#164f38}
    #guestStatus:not(:empty){padding:.65em;border-radius:.5em;background:#edf5ee;margin:.75em 0}
  </style>
  <script src="/shared/booth_guestbook_public.js?v=1.0.0" integrity="sha384-8+A+COjoUvBSDMSL/hJlZ7AOJEDv1YAXmOSJxDjsirY+jef+gf2GswsJdlvbnV9h" crossorigin="anonymous" defer></script>
</head>
<body>
  <main>
    <p class="tag">부스 방문 방명록</p>
    <h1 id="guestTitle">용인모두의햇빛협동조합</h1>
    <p id="guestMeta" class="meta" hidden></p>
    <p id="guestStatus" role="status" aria-live="polite" tabindex="-1">방명록을 불러오는 중입니다.</p>
    <button id="guestRetry" type="button" hidden>다시 확인</button>
    <form id="guestForm" autocomplete="off" hidden>
      <fieldset id="guestFields">
        <p><label>이름 <input name="name" maxlength="60" required></label></p>
        <p><label>소속 <small>소속이 없으면 ‘없음’이라고 적어 주세요.</small><input name="affiliation" maxlength="100" required></label></p>
        <p><label>직함 <small>직함이 없으면 ‘없음’이라고 적어 주세요.</small><input name="position" maxlength="60" required></label></p>
        <p><label>전화번호 <input name="phone" type="tel" inputmode="tel" maxlength="24" pattern="[0-9\s\-]{9,24}" required></label></p>
        <p><label>이메일 <small>선택</small><input name="email" type="email" inputmode="email" maxlength="150" spellcheck="false" autocapitalize="none"></label></p>
        <input name="website" type="text" tabindex="-1" hidden aria-hidden="true" autocomplete="off">
        <section class="consent" aria-labelledby="guestConsentTitle">
          <h2 id="guestConsentTitle">개인정보 수집·이용</h2>
          <ul id="guestNotice"></ul>
          <label class="check"><input name="age" type="checkbox" required><span>만 14세 이상입니다.</span></label>
          <label class="check"><input name="consent" type="checkbox" required><span>필수 항목 수집·이용에 동의합니다.</span></label>
          <label id="guestEmailConsent" class="check" hidden><input name="emailConsent" type="checkbox"><span>이메일 수집·이용에 동의합니다.</span></label>
        </section>
      </fieldset>
      <button id="guestSubmit" type="submit">방명록 남기기</button>
    </form>
    <noscript>브라우저에서 자바스크립트를 허용한 뒤 다시 열어 주세요.</noscript>
  </main>
</body>
</html>
